建工","工程质量","概述"],"wordCount":290,"created":"2026-06-01","updated":"2026-06-01","content":"# 工程质量 - 制度概述\n\n## 一、核心问题\n\n1. 质量缺陷由谁承担责任？\n2. 发包人擅自使用的，质量责任如何分配？\n3. 质量保证金和保修责任如何处理？\n\n## 二、条文架构\n\n| 条文 | 内容 |\n|------|------|\n| 第12条 | 承包人质量不合格的处理 |\n| 第13条 | 发包人过错导致质量缺陷的责任 |\n| 第14条 | 未竣工验收擅自使用的质量责任 |\n| 第15条 | 竣工前质量鉴定期间顺延工期 |\n| 第16条 | 承包人拒绝修复的处理 |\n| 第17条 | 质量保证金 |\n| 第18条 | 保修责任 |\n\n## 三、与其他模块的关系\n\n- → [[03-工期/01-制度概述|工期]]：质量鉴定期间顺延工期\n- → [[05-工程造价与结算/01-制度概述|工程造价与结算]]：质量不合格的价款处理\n- → 民法库：[[01-合同法/03-违约责任/违约责任构成|违约责任构成]]"},{"id":"工程质量-法律规范","title":"工程质量 - 法律规范","excerpt":"工程质量 - 法律规范 建工司法解释一逐条解析（第12-18条） 第12条（承包人质量不合格的处理） 因承包人的原因造成建设工程质量不符合约定，承包人拒绝修理、返工或者改建，发包人请求减少支付工程价款的，人民法院应予支持。 第13条（发包人过错导致质量缺陷） 发包人具有下列情形之一，造成建设工程质量缺陷，应当承担过错责任： （一）提供的设计有缺陷； （二）提供或者指定购买的建筑材料、建筑构配件、设","slug":"工程质量-法律规范","module":"04-工程质量","moduleName":"04 工程质量","tags":["建工","工程质量","法律规范","司法解释逐条"],"wordCount":566,"created":"2026-06-01","updated":"2026-06-01","content":"# 工程质量 - 法律规范\n\n## 建工司法解释一逐条解析（第12-18条）\n\n### 第12条（承包人质量不合格的处理）\n> 因承包人的原因造成建设工程质量不符合约定，承包人拒绝修理、返工或者改建，发包人请求减少支付工程价款的，人民法院应予支持。\n\n### 第13条（发包人过错导致质量缺陷）\n> 发包人具有下列情形之一，造成建设工程质量缺陷，应当承担过错责任：\n> （一）提供的设计有缺陷；\n> （二）提供或者指定购买的建筑材料、建筑构配件、设备不符合强制性标准；\n> （三）直接指定分包人分包专业工程。\n> 承包人有过错的，也应当承担相应的过错责任。\n\n### 第14条（擅自使用的质量责任）\n> 建设工程未经竣工验收，发包人擅自使用后，又以使用部分质量不符合约定为由主张权利的，不予支持；但是承包人应当在建设工程的合理使用寿命内对地基基础工程和主体结构质量承担民事责任。\n\n### 第15条（质量鉴定期间顺延工期）\n> 建设工程竣工前，当事人对工程质量发生争议，工程质量经鉴定合格的，鉴定期间为顺延工期期间。\n\n### 第16条（承包人拒绝修复）\n> 承包人拒绝修理、返工或者改建，发包人请求减少支付工程价款的，应予支持。\n\n### 第17条（质量保证金）\n> 发包人返还工程质量保证金后，不影响承包人根据合同约定或者法律规定履行工程保修义务。\n\n### 第18条（保修责任）\n> 因保修人未及时履行保修义务，导致建筑物毁损或者造成人身、财产损害的，保修人应当承担赔偿责任。"},{"id":"裁判规则-质量缺陷责任划分","title":"裁判规则 - 质量缺陷责任划分","excerpt":"裁判规则 - 质量缺陷责任划分 一、法律依据 《民法典》第799条 ：建设工程竣工后，发包人应当根据施工图纸及说明书、国家颁发的施工验收规范和质量检验标准及时进行验收。验收合格的，发包人应当按照约定支付价款，并接收该建设工程。 《民法典》第801条 ：因施工人的原因致使建设工程质量不符合约定的，发包人有权请求施工人在合理期限内无偿修理或者返工、改建。经过修理或者返工、改建后，造成逾期交付的，施工人","slug":"裁判规则-质量缺陷责任划分","module":"04-工程质量","moduleName":"04 工程质量","tags":["建工","工程质量","质量缺陷","裁判规则"],"wordCount":2805,"created":"2026-06-01","updated":"2026-06-01","content":"# 裁判规则 - 质量缺陷责任划分\n\n## 一、法律依据\n\n**《民法典》第799条**：建设工程竣工后，发包人应当根据施工图纸及说明书、国家颁发的施工验收规范和质量检验标准及时进行验收。验收合格的，发包人应当按照约定支付价款，并接收该建设工程。\n\n**《民法典》第801条**：因施工人的原因致使建设工程质量不符合约定的，发包人有权请求施工人在合理期限内无偿修理或者返工、改建。经过修理或者返工、改建后，造成逾期交付的，施工人应当承担违约责任。\n\n**《建工司法解释一》第12条**：发包人具有下列情形之一，造成建设工程质量缺陷，应当承担过错责任：\n（一）提供的设计有缺陷；\n（二）提供或者指定购买的建筑材料、建筑构配件、设备不符合强制性标准；\n（三）直接指定分包人分包专业工程。\n\n**《建工司法解释一》第13条**：建设工程未经竣工验收，发包人擅自使用后，又以使用部分质量不符合约定为由主张权利的，人民法院不予支持；但是承包人应当在建设工程的合理使用寿命内对地基基础工程和主体结构质量承担民事责任。\n\n> 注：上述条文系质量缺陷责任划分的核心法律依据。民法典第799条确立了竣工验收制度，第801条明确了承包人的质量瑕疵担保责任；司法解释一第12条和第13条分别规定了发包人过错责任和擅自使用的法律后果。实务中应结合具体案情选择适用条文，注意各条文的适用条件和举证要求。\n\n## 二、裁判规则要点\n\n**规则1：承包人质量瑕疵担保责任**\n因施工人原因致使建设工程质量不符合约定的，发包人有权请求施工人在合理期限内无偿修理或者返工、改建。承包人拒绝修复的，发包人可请求减少支付工程价款。减少的数额应以修复费用为参考，由法院综合认定。\n\n**规则2：发包人过错责任（司法解释一第12条）**\n发包人提供有缺陷的设计、不符合强制性标准的材料或直接指定分包人的，对由此造成的质量缺陷承担过错责任。该条系发包人质量责任的法定例外，采用过错责任原则，不要求承包人先行修复。\n\n**规则3：混合过错与责任分担**\n承包人与发包人对质量缺陷均有过错的，各自承担相应的责任。实务中需通过质量鉴定明确各方过错比例。承包人未尽合理审查义务的，应承担相应的过错责任，但不免除发包人的主要责任。\n\n**规则4：擅自使用的法律后果**\n发包人擅自使用未经竣工验收的工程，丧失就使用部分主张质量不合格的权利，但地基基础和主体结构除外。擅自使用认定以实际控制为标准，不以正式移交为必要。司法解释一第13条但书条款的适用范围在实务中存在争议。\n\n**规则5：质量缺陷的举证责任**\n发包人主张质量缺陷的，应举证证明缺陷存在及其与承包人施工行为的因果关系。承包人主张发包人过错的，应举证证明存在司法解释一第12条规定的三种情形。举证责任的具体分配因案件事实而异，需结合鉴定意见综合判断。\n\n## 三、司法观点分歧\n\n**1. 地基基础和主体结构的范围界定**\n实务中对\"地基基础工程\"是否包含桩基工程、\"主体结构\"是否包含二次结构存在分歧。多数观点认为应以设计文件和国家标准GB 50300界定范围，但各地法院认定标准不一。部分法院采扩大解释，将与主体结构相关的分部工程纳入保护范围。\n\n**2. 质量缺陷与质量瑕疵的区分**\n质量缺陷指不符合强制性标准或影响结构安全的质量问题；质量瑕疵指不影响安全使用但不符合合同约定的问题。二者的法律后果不同：缺陷可导致合同目的落空，瑕疵一般仅产生修复或减价责任。实务中区分标准不统一，部分法院以是否影响结构安全为界，部分法院以是否违反强制性标准为界。\n\n**3. 举证责任分配的争议**\n发包人初步举证应达到何种证明标准存在争议。部分法院要求发包人提供初步证据即可，举证责任即转移至承包人；部分法院要求发包人完成较充分举证后才发生举证责任转移。该分歧直接影响诉讼结果，需关注受诉法院的裁判倾向。\n\n## 四、省高院指引差异\n\n| 省份 | 擅自使用认定标准 | 举证责任转移规则 | 地基基础范围 |\n|------|------------------|------------------|--------------|\n| 江苏 | 以实际控制为准 | 发包人初步举证即转移 | 含桩基工程 |\n| 浙江 | 需有明确使用事实 | 发包人需较充分举证 | 含桩基工程 |\n| 广东 | 以实际控制为准 | 发包人初步举证即转移 | 依设计文件界定 |\n| 北京 | 需有明确使用事实 | 发包人需较充分举证 | 依设计文件界定 |\n| 上海 | 以实际控制为准 | 发包人初步举证即转移 | 含桩基工程 |\n| 山东 | 需有明确使用事实 | 发包人需较充分举证 | 依设计文件界定 |\n\n> 注：各地指引差异较大，实务中应优先参考受诉法院所在省高院的指引文件，避免因规则差异导致诉"},{"id":"裁判规则-发包人过错导致质量缺陷","title":"裁判规则 - 发包人过错导致质量缺陷","excerpt":"裁判规则 - 发包人过错导致质量缺陷 一、法律依据 《建工司法解释一》第13条： 发包人具有下列情形之一，造成建设工程质量缺陷，应当承担过错责任： （一）提供的设计有缺陷； （二）提供或者指定购买的建筑材料、建筑构配件、设备不符合强制性标准； （三）直接指定分包人分包专业工程。 承包人有过错的，也应当承担相应的过错责任。 二、裁判规则要点 规则1：三种法定过错情形 设计缺陷 ：发包人自行提供或委托","slug":"裁判规则-发包人过错导致质量缺陷","module":"04-工程质量","moduleName":"04 工程质量","tags":["建工","工程质量","发包人过错","裁判规则"],"wordCount":1563,"created":"2026-06-01","updated":"2026-06-01","content":"# 裁判规则 - 发包人过错导致质量缺陷\n\n## 一、法律依据\n\n**《建工司法解释一》第13条：**\n\n> 发包人具有下列情形之一，造成建设工程质量缺陷，应当承担过错责任：\n> （一）提供的设计有缺陷；\n> （二）提供或者指定购买的建筑材料、建筑构配件、设备不符合强制性标准；\n> （三）直接指定分包人分包专业工程。\n> 承包人有过错的，也应当承担相应的过错责任。\n\n## 二、裁判规则要点\n\n### 规则1：三种法定过错情形\n\n1. **设计缺陷**：发包人自行提供或委托的设计文件存在错误、遗漏，导致施工成果不符合质量要求\n2. **材料不合格**：发包人直接提供或指定承包人购买的建材、构配件、设备违反强制性标准\n3. **指定分包**：发包人绕过承包人直接指定专业分包人，因分包人原因造成质量缺陷\n\n### 规则2：混合过错的处理\n\n承包人对质量缺陷也有过错的（如未按图施工、未尽检验义务），双方按各自过错程度承担相应责任。法院通常根据过错与损害之间的因果关系比例划分责任。\n\n### 规则3：指定分包的责任承担\n\n发包人直接指定分包人分包专业工程，因分包人原因导致质量缺陷的，发包人承担过错责任。承包人对分包工程质量未尽到管理义务的，亦应承担相应责任。\n\n### 规则4：举证责任分配\n\n- 承包人主张发包人过错免责的，需举证证明发包人存在第13条规定的三种情形之一\n- 发包人主张承包人混合过错的，需举证证明承包人存在施工不当或未尽检验义务\n- 质量缺陷与过错之间的因果关系，由主张方承担举证责任\n\n## 三、司法观点分歧\n\n### 争议1：设计缺陷的认定标准\n\n- **严格标准说**：设计文件违反强制性标准或存在明显错误方可认定缺陷\n- **合理标准说**：设计文件虽未违反强制性标准，但未达到合理注意义务亦可构成缺陷\n- 实务中多数法院采严格标准，以是否违反国家或行业强制性标准为核心判断依据\n\n### 争议2：指定分包与推荐分包的区分\n\n- **指定**：发包人以合同约定或指令方式确定分包人，承包人无选择权\n- **推荐**：发包人推荐候选人选，承包人仍有自主决定权\n- 关键区分在于承包人是否具有实质性的选择自由；仅\"推荐\"不构成第13条第3项的指定\n\n### 争议3：发包人监督义务的边界\n\n- 发包人委托监理的，监理行为能否视为发包人行为存在分歧\n- 部分法院认为发包人对施工过程有一般性监督义务，未发现明显缺陷可能构成过错\n- 主流观点认为发包人非专业主体，不应苛求其对施工技术问题承担监督责任\n\n## 四、省高院指引差异\n\n| 地区 | 对发包人过错责任的态度 |\n|------|----------------------|\n| 最高法 | 三种法定情形承担过错责任，承包人混合过错亦担责 |\n| 北京高院 | 明确指定分包的责任范围限于分包工程部分 |\n| 浙江高院 | 强调因果关系，设计缺陷需鉴定确认 |\n| 江苏高院 | 混合过错时按过错比例分担，不适用连带责任 |\n| 广东高院 | 指定分包情形下发包人与分包人对承包人承担连带赔偿 |\n\n## 五、典型案例\n\n**案例1：设计缺陷致桩基偏位**\n- 发包人提供的地质勘察报告数据错误，导致桩基施工偏位\n- 法院认定发包人承担主要责任（70%），承包人未尽复核义务承担次要责任（30%）\n\n**案例2：指定材料不合格**\n- 发包人指定购买的防水材料不符合强制性标准，屋面渗漏\n- 法院认定发包人对材料选型承担全部过错责任，承包人已尽检验义务免责\n\n**案例3：指定分包幕墙质量缺陷**\n- 发包人直接指定幕墙分包人，安装后出现脱落隐患\n- 法院认定发包人承担主要责任，承包人因未对分包工程进行有效管理承担30%责任\n\n## 六、实务指引\n\n**代理承包人时：**\n- 留存发包人提供设计文件、指定材料或分包的书面证据（函件、会议纪要、合同条款）\n- 发现设计问题及时书面提出，避免被认定为未尽注意义务\n\n**代理发包人时：**\n- 审查承包人是否存在未按图施工、未检验材料等混合过错\n- 区分\"指定\"与\"推荐\"，尽量以推荐方式而非指令方式确定分包人\n\n## 七、交叉引用\n\n- → [[03-裁判规则-质量缺陷责任划分|质量缺陷责任划分]]（承包人原因与发包人原因的区分）\n- → [[05-裁判规则-擅自使用的质量责任|擅自使用的质量责任]]（发包人擅自使用后的责任）\n- → [[02-法律规范|法律规范]]（司法解释第12-18条全文）"},{"id":"裁判规则-擅自使用的质量责任","title":"裁判规则 - 擅自使用的质量责任","excerpt":"裁判规则 - 擅自使用的质量责任 一、法律依据 建工司法解释一第14条： 建设工程未经竣工验收，发包人擅自使用后，又以使用部分质量不符合约定为由主张权利的，人民法院不予支持；但是承包人应当在建设工程的合理使用寿命内对地基基础工程和主体结构质量承担民事责任。 二、裁判规则要点 规则1：擅自使用后不得主张质量不合格 发包人未经验收擅自使用工程的，丧失对使用部分提出质量异议的权利，视为以行为接受工程质量","slug":"裁判规则-擅自使用的质量责任","module":"04-工程质量","moduleName":"04 工程质量","tags":["建工","工程质量","擅自使用","裁判规则"],"wordCount":1450,"created":"2026-06-01","updated":"2026-06-01","content":"# 裁判规则 - 擅自使用的质量责任\n\n## 一、法律依据\n**建工司法解释一第14条：**\n> 建设工程未经竣工验收，发包人擅自使用后，又以使用部分质量不符合约定为由主张权利的，人民法院不予支持；但是承包人应当在建设工程的合理使用寿命内对地基基础工程和主体结构质量承担民事责任。\n\n---\n\n## 二、裁判规则要点\n\n### 规则1：擅自使用后不得主张质量不合格\n\n发包人未经验收擅自使用工程的，丧失对使用部分提出质量异议的权利，视为以行为接受工程质量。\n\n### 规则2：承包人的底线责任\n\n无论发包人是否擅自使用，承包人始终对以下两项承担终身质量责任：\n\n- **地基基础工程**：合理使用寿命内出现质量问题，承包人仍须担责\n- **主体结构工程**：同上，不因发包人擅自使用而免责\n\n### 规则3：擅自使用的认定\n\n以下行为可认定为\"擅自使用\"：\n\n- 未经验收即投入使用（办公、生产、经营等）\n- 未经验收即出租、出售或交付第三人使用\n- 发包人实际控制并占有工程\n\n### 规则4：部分使用的处理\n\n发包人仅使用部分工程的，仅对使用部分丧失质量异议权；对未使用部分仍可主张质量权利。但实践中\"部分使用\"的边界常成为争议焦点。\n\n---\n\n## 三、司法观点分歧\n\n### 争议1：\"擅自使用\"的认定标准\n\n- **形式标准说**：以实际占有控制为准，不论是否办理验收手续\n- **实质标准说**：需结合使用目的、持续时间、是否明知未验收等因素综合判断\n- 主流倾向形式标准，但对临时性、应急性使用存在例外\n\n### 争议2：使用多久构成擅自使用\n\n- 部分法院认为一次使用即构成擅自使用\n- 部分法院认为需持续、稳定的使用方可认定\n- 司法解释未明确时间要件，各地裁判尺度不一\n\n### 争议3：转租、转售是否构成擅自使用\n\n- 肯定说：发包人将未验收工程出租或出售，属于擅自使用，后果自负\n- 否定说：转租转售系处分行为而非使用行为，不应认定为擅自使用\n- 多数法院采肯定说，认为发包人从中获利即应承担风险\n\n---\n\n## 四、省高院指引差异\n\n| 地区 | 核心观点 | 文件依据 |\n| --- | --- | --- |\n| 浙江高院 | 擅自使用以实际占有控制为准，不要求持续使用 | 民事审判疑难问题解答 |\n| 江苏高院 | 转售他人使用的视为擅自使用，承包人免责 | 建设工程施工合同案件审理指南 |\n| 广东高院 | 仅对使用部分丧失质量异议权，举证责任仍在发包人 | 民事审判实务问题解答 |\n| 北京高院 | 地基基础和主体结构的举证责任由发包人承担 | 建设工程合同纠纷疑难问题解答 |\n\n---\n\n## 五、典型案例\n\n### 案例1：某商业广场擅自使用案\n发包人在竣工验收前将商铺交付承租人经营，法院认定构成擅自使用，发包人以质量问题主张扣减工程款不予支持。\n\n### 案例2：工业厂房部分使用案\n发包人仅使用了厂房A栋，B栋未使用。法院认定A栋视为质量合格，B栋质量争议仍可审理。\n\n### 案例3：地基基础质量终身责任案\n工程交付使用十年后地基出现不均匀沉降，法院认定即使存在擅自使用情形，承包人仍应承担地基基础工程质量责任。\n\n---\n\n## 六、实务指引\n\n**代理发包人：**\n\n- 确需提前使用的，应书面要求承包人先行分部分项验收并签署确认文件\n- 使用过程中保留质量缺陷的影像证据，为后续抗辩留存依据\n- 注意区分\"地基基础\"和\"主体结构\"以外的质量问题仍可主张\n\n**代理承包人：**\n\n- 擅自使用是承包人对抗质量索赔的有力抗辩，应主动举证发包人已实际使用\n- 收集发包人占有使用工程的证据（水电费缴纳、物业交接、租户入驻等）\n- 对地基基础和主体结构仍应做好长期质量保障\n\n---\n\n## 七、交叉引用\n\n- → [[03-工期/04-裁判规则-竣工日期认定|竣工日期认定]]：擅自使用以转移占有日为竣工日\n- → [[04-工程质量/04-裁判规则-质量鉴定|质量鉴定]]：擅自使用后能否申请质量鉴定的程序问题\n- → [[04-工程质量/03-裁判规则-质量缺陷责任|质量缺陷责任]]：承包人保修责任与擅自使用的关系"},{"id":"裁判规则-质量保证金","title":"裁判规则 - 质量保证金","excerpt":"裁判规则 - 质量保证金 一、法律依据 建工司法解释一第17条：有下列情形之一，承包人请求发包人返还工程质量保证金的，人民法院应予支持：（一）当事人约定的工程质量保证金返还期限届满；（二）当事人未约定工程质量保证金返还期限的，自建设工程通过竣工验收之日起满二年；（三）因发包人原因建设工程未按约定期限进行竣工验收的，自承包人提交工程竣工验收报告九十日后当事人约定的工程质量保证金返还期限届满；当事人未","slug":"裁判规则-质量保证金","module":"04-工程质量","moduleName":"04 工程质量","tags":["建工","工程质量","质量保证金","裁判规则"],"wordCount":1800,"created":"2026-06-01","updated":"2026-06-01","content":"# 裁判规则 - 质量保证金\n\n## 一、法律依据\n\n- 建工司法解释一第17条：有下列情形之一，承包人请求发包人返还工程质量保证金的，人民法院应予支持：（一）当事人约定的工程质量保证金返还期限届满；（二）当事人未约定工程质量保证金返还期限的，自建设工程通过竣工验收之日起满二年；（三）因发包人原因建设工程未按约定期限进行竣工验收的，自承包人提交工程竣工验收报告九十日后当事人约定的工程质量保证金返还期限届满；当事人未约定工程质量保证金返还期限的，自承包人提交工程竣工验收报告九十日后起满二年。\n- 最高法法官会议纪要第7条：质量保证金返还期限从竣工验收合格之日起算。未约定返还期限的，自竣工验收合格之日起满二年。\n- 《建设工程质量保证金管理办法》（住建部、财政部令第33号）\n\n## 二、裁判规则要点\n\n### 规则1：返还期限的法定兜底\n当事人未约定质量保证金返还期限的，自竣工验收合格之日起满二年，承包人有权请求返还。\n\n### 规则2：发包人原因未验收的起算规则\n因发包人原因未按约定期限验收的，自承包人提交竣工验收报告九十日后起算返还期限，保护承包人不因发包人拖延验收而受损。\n\n### 规则3：返还保证金不影响保修义务\n质量保证金返还后，承包人仍应根据合同约定和法律规定履行保修义务，两者相互独立。\n\n### 规则4：缺陷责任期与返还期限的衔接\n缺陷责任期一般不超过2年，期满且无质量缺陷的，发包人应按约返还保证金。缺陷责任期与保修期为不同概念。\n\n### 规则5：利息的起算\n返还条件成就后发包人未及时返还的，应自条件成就之日起支付利息。\n\n## 三、司法观点分歧\n\n### 分歧1：返还期限的性质\n- **观点A**：返还期限为除斥期间，届满即丧失实体权利\n- **观点B**：返还期限为诉讼时效期间，可中断、中止\n- **主流观点**：返还期限为诉讼时效期间，适用民法典诉讼时效规定\n\n### 分歧2：缺陷责任期届满但未验收的处理\n- **观点A**：缺陷责任期届满即应返还，不以竣工验收为前提\n- **观点B**：未经竣工验收，返还条件未成就\n- **主流观点**：因发包人原因未验收的，适用第17条第3项九十日规则\n\n### 分歧3：质量缺陷未修复能否拒还保证金\n- **观点A**：缺陷未修复的，发包人有权在保证金范围内扣减\n- **观点B**：返还与修复为独立请求权，发包人应另行主张\n- **主流观点**：发包人可就缺陷修复费用在保证金范围内主张抵销\n\n## 四、省高院指引差异\n\n| 地区 | 要点 |\n|------|------|\n| 最高法 | 未约定期限的自竣工验收合格之日起满2年；发包人原因未验收的自提交报告90日后起算 |\n| 北京 | 返还期限从竣工验收合格之日起算，明确缺陷责任期不超过2年 |\n| 浙江 | 发包人扣留保证金超过缺陷责任期的，承包人有权请求返还并支付利息 |\n| 江苏 | 质量保证金与保修金性质不同，保修金不受缺陷责任期限制 |\n| 广东 | 未约定返还期限的，适用司法解释规定的2年期限 |\n\n## 五、典型案例\n\n**案例1：未约定返还期限的保证金返还案**\n承包人与发包人签订施工合同，约定扣留结算价款5%作为质量保证金，但未约定返还期限。竣工验收合格已逾三年，承包人诉请返还保证金。法院依据司法解释一第17条第2项，认定自竣工验收合格之日起满2年返还条件已成就，支持承包人返还请求。\n\n**案例2：发包人拖延验收的保证金返还案**\n工程完工后承包人多次提交竣工验收报告，发包人以各种理由拖延验收。承包人提交报告满九十日后诉请返还保证金。法院适用第17条第3项，认定自提交报告九十日后返还期限起算，支持承包人请求。该案明确了发包人不得通过拖延验收阻碍保证金返还。\n\n**案例3：缺陷修复费用抵销保证金案**\n缺陷责任期内发现外墙渗漏等质量缺陷，承包人未予修复。缺陷责任期届满后承包人请求返还保证金，发包人主张以修复费用抵销。法院认定发包人可就经鉴定确认的修复费用在保证金范围内主张抵销，抵销后余额应予返还。\n\n## 六、实务指引\n\n**发包人角度：**\n- 合同中应明确约定质量保证金的返还期限、返还条件和扣减情形\n- 缺陷责任期内发现质量问题应及时书面通知承包人并保留证据\n- 主张以修复费用抵销保证金的，应申请质量鉴定确认修复费用金额\n\n**承包人角度：**\n- 关注缺陷责任期的起算时间和届满时间，届满后及时主张返还\n- 发包人拖延验收的，应书面提交竣工验收报告并保留送达证据\n- 返还条件成就后发包人拒还的，可同时主张利息损失\n- 保证金比例一般不超过结算总额的3%，超出部分可主张返还\n\n## 七、交叉引用\n\n- → [[07-裁判规则-保修责任|保修责任]]（返还保证金不影响保修义务）\n- → [[03-裁判规"},{"id":"裁判规则-保修责任","title":"裁判规则 - 保修责任","excerpt":"裁判规则 - 保修责任 一、法律依据 建工司法解释一第18条： 因保修人未及时履行保修义务，导致建筑物毁损或者造成人身损害、财产损失的，保修人应当承担赔偿责任。保修人与建筑物所有人或者发包人对建筑物毁损均有过错的，各自承担相应的责任。 《建设工程质量管理条例》第39条（保修制度）、第40条（保修期限）、第41条（保修责任）、第42条（返修义务） 《建筑法》第60条：建筑物在合理使用寿命内，必须确保","slug":"裁判规则-保修责任","module":"04-工程质量","moduleName":"04 工程质量","tags":["建工","工程质量","保修","裁判规则"],"wordCount":1836,"created":"2026-06-01","updated":"2026-06-01","content":"# 裁判规则 - 保修责任\n\n## 一、法律依据\n\n- 建工司法解释一第18条：\"因保修人未及时履行保修义务，导致建筑物毁损或者造成人身损害、财产损失的，保修人应当承担赔偿责任。保修人与建筑物所有人或者发包人对建筑物毁损均有过错的，各自承担相应的责任。\"\n- 《建设工程质量管理条例》第39条（保修制度）、第40条（保修期限）、第41条（保修责任）、第42条（返修义务）\n- 《建筑法》第60条：建筑物在合理使用寿命内，必须确保地基基础工程和主体结构的质量\n- 《建设工程质量管理条例》第41条：建设工程在保修范围和保修期限内发生质量问题的，施工单位应当履行保修义务\n\n## 二、裁判规则要点\n\n### 规则1：保修义务不因返还保证金而免除\n返还质量保证金后，承包人仍应履行保修义务。保修义务来源于法律规定和合同约定，质量保证金仅是缺陷责任期的担保方式，二者并行不悖。\n\n### 规则2：保修人的赔偿责任\n保修人未及时履行保修义务，导致建筑物毁损或造成人身、财产损害的，保修人应承担赔偿责任。保修人与建筑物所有人或发包人均有过错的，各自承担相应责任。\n\n### 规则3：保修期限（详细列举）\n保修期自竣工验收合格之日起算，最低保修期限为：\n- 基础设施工程、房屋建筑的地基基础工程和主体结构工程：设计文件规定的合理使用年限\n- 屋面防水工程、有防水要求的卫生间、房间和外墙面的防渗漏：5年\n- 供热与供冷系统：2个采暖期、供冷期\n- 电气管线、给排水管道、设备安装和装修工程：2年\n- 其他项目的保修期限由发包方与承包方约定\n\n### 规则4：保修责任与质量缺陷责任的区分\n- 质量缺陷责任：发生在缺陷责任期内（一般2年），以质量保证金作为担保\n- 保修责任：发生在保修期内，承包人有法定义务修复质量缺陷\n- 二者时间范围可能重叠，但法律性质不同，保修责任不因缺陷责任期届满而消灭\n\n### 规则5：保修期内的通知义务\n发包人在保修期内发现质量问题，应当及时通知承包人履行保修义务。未通知或未给予合理修复期限而直接委托第三方修复的，扩大的费用由发包人自行承担。通知方式应以书面形式为主，口头通知需有证据佐证。\n\n## 三、司法观点分歧\n\n### 争议1：保修期起算点\n- 通说以竣工验收合格之日起算\n- 部分法院以实际交付使用之日为起算点，理由是竣工验收程序被发包人拖延时不应加重承包人责任\n- 发包人擅自使用未经竣工验收工程的，保修期从擅自使用之日起算\n\n### 争议2：保修范围的认定\n- 合同约定的保修范围与法定最低保修范围不一致时，是否应优先适用法定标准存在分歧\n- 一种观点认为法定最低保修期限属于效力性强制规定，约定低于法定标准的无效\n- 另一种观点认为当事人可以约定高于法定标准的保修期，但不低于法定最低标准\n\n### 争议3：发包人拖延验收对保修期的影响\n- 发包人无正当理由拖延验收，保修期是否应从承包人提交竣工报告之日起算，各地法院裁判不一\n- 最高法院倾向于保护承包人利益，防止发包人通过拖延验收延长保修期\n\n## 四、省高院指引差异\n\n- 浙江高院倾向于严格适用法定最低保修期限，合同约定低于法定标准的不予支持\n- 江苏高院对保修期起算采取实质判断，注重工程实际交付使用情况\n- 广东高院强调保修期内通知义务的履行，未通知的发包人承担不利后果\n- 北京高院认为保修义务与质量保证金相互独立，保证金返还不影响保修责任\n- 山东高院对保修期内发现的质量缺陷举证责任分配较为严格，要求发包人证明缺陷在保修期内产生\n\n## 五、典型案例\n\n**案例1：保修义务独立于保证金**\n承包人返还质量保证金后拒绝维修，法院认定保修义务独立存在，判令承包人继续履行保修义务并赔偿因拖延维修造成的扩大损失。\n\n**案例2：保修人赔偿责任的认定**\n保修期内地基出现沉降，保修人接到通知后未及时处理，法院依据司法解释一第18条判令保修人承担赔偿责任。\n\n**案例3：保修期限争议**\n合同约定保修期为1年，低于法定最低2年标准，法院认定该约定无效，适用法定保修期限。法院指出法定最低保修期限属于效力性强制规定，当事人不得通过约定排除适用。\n\n## 六、实务指引\n\n- 保修期内发现质量问题应当及时书面通知承包人，保留通知记录和送达凭证\n- 给予承包人合理修复期限，修复期限届满仍未修复的方可委托第三方\n- 第三方修复费用应合理，保留维修合同、付款凭证等证据\n- 区分缺陷责任期与保修期，质量保证金返还不影响保修义务的履行\n- 合同签订时审查保修条款，确保保修期限不低于法定最低标准\n- 保修期满前进行工程质量检查，及时主张保修权利\n\n## 七、交叉引用\n\n- → [[06-裁判规则-质量保证金|质量保证金]]：缺陷责任期与保修期的关系\n- → [[05-裁判规则-质量缺陷|质量缺陷]]：质量缺陷"},{"id":"裁判规则-质量鉴定","title":"裁判规则 - 质量鉴定","excerpt":"裁判规则 - 质量鉴定 一、法律依据 《建工司法解释一》第11条 建设工程竣工前，当事人对工程质量发生争议，工程质量经鉴定合格的，鉴定期间为顺延工期期间。 《建工司法解释一》第28条（鉴定启动） 当事人对工程造价、质量、修复费用等专门性问题有争议，人民法院认为需要鉴定的，应当向负有举证责任的当事人释明。当事人经释明未申请鉴定，虽申请鉴定但未支付鉴定费用或者拒不提供相关材料的，应当承担举证不能的法律","slug":"裁判规则-质量鉴定","module":"04-工程质量","moduleName":"04 工程质量","tags":["建工","工程质量","鉴定","裁判规则"],"wordCount":1706,"created":"2026-06-01","updated":"2026-06-01","content":"# 裁判规则 - 质量鉴定\n\n## 一、法律依据\n\n**《建工司法解释一》第11条**\n建设工程竣工前，当事人对工程质量发生争议，工程质量经鉴定合格的，鉴定期间为顺延工期期间。\n\n**《建工司法解释一》第28条（鉴定启动）**\n当事人对工程造价、质量、修复费用等专门性问题有争议，人民法院认为需要鉴定的，应当向负有举证责任的当事人释明。当事人经释明未申请鉴定，虽申请鉴定但未支付鉴定费用或者拒不提供相关材料的，应当承担举证不能的法律后果。\n\n**《建工司法解释一》第30条（鉴定意见审查）**\n人民法院应当组织当事人对鉴定意见进行质证。鉴定人应当就鉴定事项接受当事人的质询。当事人对鉴定意见有异议或者人民法院认为鉴定人有必要出庭的，鉴定人应当出庭作证。\n\n## 二、裁判规则要点\n\n### 规则1：质量鉴定的启动\n\n- 当事人对工程质量有争议，法院认为需要鉴定的，应向负有举证责任的当事人释明\n- 一般由主张工程质量不合格的一方承担申请鉴定的举证责任\n- 发包人主张质量不合格但拒绝申请鉴定的，法院可认定质量合格\n\n### 规则2：鉴定合格的法律效果\n\n- 质量经鉴定合格的，鉴定期间为顺延工期期间（司法解释一第11条）\n- 鉴定合格不免除承包人在保修期内的保修义务\n- 鉴定费用一般由申请鉴定的一方预缴，最终由败诉方承担\n\n### 规则3：鉴定不合格的处理\n\n- 承包人应负责修复至合格标准；拒绝修复或修复后仍不合格的，发包人可请求减少支付工程价款\n- 因质量不合格造成损失的，承包人应承担赔偿责任；严重不合格且无法修复的，可主张解除合同\n\n### 规则4：鉴定意见的审查\n\n- 法院应组织当事人对鉴定意见进行质证，鉴定人应接受当事人质询\n- 当事人有异议或法院认为必要的，鉴定人应出庭作证\n- 鉴定意见存在明显瑕疵的，法院可不予采信\n\n## 三、司法观点分歧\n\n### 争议1：质量鉴定是否为必经程序\n\n- **肯定说**：工程质量涉及专门技术问题，未经鉴定不宜直接认定\n- **否定说**：双方对质量问题已达成一致或证据充分的，可不鉴定\n- **实务倾向**：法院一般优先释明当事人申请鉴定，但并非绝对必经程序\n\n### 争议2：鉴定方法的争议\n\n- 竣工验收标准与设计标准不一致时，以何为准存在分歧\n- 部分质量问题无法通过检测手段量化，鉴定结论主观性较强\n- 已使用工程的质量鉴定方法与未竣工工程存在差异\n\n### 争议3：鉴定意见与法院认定的关系\n\n- **鉴定优先说**：鉴定意见属于专业意见，法院应予尊重\n- **独立判断说**：法院有权结合全案证据综合判断，不必然采纳鉴定意见\n- **实务倾向**：法院一般以鉴定意见为基础，但可结合其他证据调整\n\n## 四、省高院指引差异\n\n| 地区 | 特点 |\n|------|------|\n| 江苏高院 | 明确质量鉴定应在诉讼中提出，举证责任在主张方 |\n| 浙江高院 | 强调鉴定机构资质审查，优先选取省级名录机构 |\n| 广东高院 | 对已完工程质量鉴定采较为严格标准，注重现场勘验 |\n| 四川高院 | 区分结构性质量与非结构性质量问题，适用不同鉴定标准 |\n\n## 五、典型案例\n\n### 案例1：鉴定合格后工期顺延\n\n某住宅项目施工中，发包人以质量问题要求停工鉴定。鉴定结论为质量合格。法院认定停工鉴定期间属于工期顺延事由，承包人不承担逾期竣工违约金。\n\n### 案例2：发包人拒绝申请鉴定的后果\n\n某商业综合体工程，发包人主张主体结构存在质量问题，但经法院释明后仍拒绝申请鉴定。法院认定发包人举证不能，推定工程质量合格。\n\n### 案例3：鉴定意见不被采信的情形\n\n某厂房工程鉴定机构出具质量不合格意见，但鉴定过程中未进行必要的破坏性检测，鉴定方法存在明显瑕疵。法院未采信该鉴定意见，结合其他证据认定工程质量合格。\n\n## 六、实务指引\n\n**承包人方面：**\n- 施工过程中应完整保留质量验收记录和检测报告\n- 对发包人单方委托的鉴定结论及时提出异议并申请重新鉴定\n- 质量鉴定合格后，及时主张工期顺延\n\n**发包人方面：**\n- 发现质量问题应及时书面通知承包人并固定证据\n- 经法院释明后应及时申请鉴定，避免举证不能风险\n- 鉴定费用较高时，可先评估质量问题的严重程度再决定是否鉴定\n\n**共同注意事项：** 关注鉴定机构资质；鉴定过程中全程参与，及时对鉴定方法和取样提出意见；对鉴定意见的异议应在质证阶段充分提出。\n\n## 七、交叉引用\n\n- → [[09-司法鉴定/01-制度概述|司法鉴定制度概述]]\n- → [[03-工期/05-裁判规则-工期顺延事由|工期顺延事由]]\n- → [[02-工程价款/04-裁判规则-工程质量与价款扣减|质量与价款扣减]]\n- → [[04-工程质量/03-裁判规则-质量保修|"},{"id":"工程质量-省-市高院指引对比","title":"工程质量 - 省/市高院指引对比","excerpt":"工程质量 - 省/市高院指引对比 一、质量缺陷责任 地区 要点 文件来源 最高法 承包人原因造成质量缺陷的应修复；发包人有三种法定过错的承担过错责任 司法解释一第12条 山东 竣工验收合格后，发包人以质量不合格为由拒付工程款的，不予支持；但地基基础和主体结构存在质量问题的除外 解答（2020） 四川+重庆 承包人请求支付工程价款，发包人以工程质量不合格为由抗辩的，应当提供初步证据证明质量问题的存在","slug":"工程质量-省-市高院指引对比","module":"04-工程质量","moduleName":"04 工程质量","tags":["建工","工程质量","省高院指引","对比"],"wordCount":852,"created":"2026-06-01","updated":"2026-06-01","content":"# 工程质量 - 省/市高院指引对比\n\n## 一、质量缺陷责任\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 承包人原因造成质量缺陷的应修复；发包人有三种法定过错的承担过错责任 | 司法解释一第12条 |\n| 山东 | 竣工验收合格后，发包人以质量不合格为由拒付工程款的，不予支持；但地基基础和主体结构存在质量问题的除外 | [解答（2020）](https://m.055110.com/js/69/2300.html) |\n| 四川+重庆 | 承包人请求支付工程价款，发包人以工程质量不合格为由抗辩的，应当提供初步证据证明质量问题的存在 | [联合解答（2022）第4条](http://ms.isheng.net/index.php?doc-view-45229=) |\n| 深圳 | 保修期内的质量问题，承包人应承担保修责任 | [裁判指引（2014）](https://szfazhu.com/caipanzhiyin/121.html) |\n\n## 二、擅自使用\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 擅自使用后不得主张质量不合格，但地基基础和主体结构除外 | 司法解释一第14条 |\n| 深圳 | 建设工程完工后未经竣工验收但已由发包人实际控制的，视为竣工验收合格 | [裁判指引（2014）](https://szfazhu.com/caipanzhiyin/121.html) |\n\n## 三、质量保证金\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 缺陷责任期满应返还保证金；未约定期限的自竣工验收合格之日起满2年 | 司法解释一第17条 |\n| 最高法 | 返还保证金不影响保修义务 | 法官会议纪要7 |\n\n## 四、保修责任\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 保修人未及时履行保修义务导致损害的应赔偿 | 司法解释一第18条 |\n| 山东 | 发包人要求承包人承担质量违约责任的，应提供初步证据证明质量问题的存在及损失大小 | [解答（2020）](https://m.055110.com/js/69/2300.html) |\n\n## 五、质量鉴定\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 质量经鉴定合格的，鉴定期间为顺延工期期间 | 司法解释一第11条 |\n| 山东 | 法院应对鉴定意见进行实质审查，不能\"以鉴代审\" | [解答（2020）](https://m.055110.com/js/69/2300.html) |\n| 四川+重庆 | 单方委托第三方出具的咨询意见，对方不认可的不能作为认定案件事实的依据 | [联合解答（2022）第7条](http://ms.isheng.net/index.php?doc-view-45229=) |\n\n## 六、指引文件链接汇总\n\n| 法院 | 文件 | 链接 |\n|------|------|------|\n| 四川+重庆高院 | 联合解答（2022） | [全文链接](http://ms.isheng.net/index.php?doc-view-45229=) |\n| 山东高院 | 解答（2020） | [全文链接](https://m.055110.com/js/69/2300.html) |\n| 深圳中院 | 裁判指引（2014修订） | [全文链接](https://szfazhu.com/caipanzhiyin/121.html) |\n\n## 七、交叉引用\n- → [[13-审判指引汇编/00-指引总览|指引总览]]\n- → [[03-裁判规则-质量缺陷责任划分|质量缺陷责任划分]]\n- → [[05-裁判规则-擅自使用的质量责任|擅自使用的质量责任]]"},{"id":"工程质量-典型案例","title":"工程质量 - 典型案例","excerpt":"工程质量 - 典型案例 一、质量缺陷责任 案例1：发包人提供设计缺陷导致质量问题 案号 ：(2012)民提字第20号（公报案例2015年06期） 案情 ：海擎重工机械有限公司与江苏中兴建设有限公司建设工程施工合同纠纷。建设单位未提前交付地质勘查报告、施工图设计文件未经过建设主管部门审查批准 裁判要旨 ：从事建设工程活动，必须严格执行基本建设程序，坚持先勘察、后设计、再施工原则。建设单位未提前交付地","slug":"工程质量-典型案例","module":"04-工程质量","moduleName":"04 工程质量","tags":["建工","工程质量","案例"],"wordCount":1171,"created":"2026-06-01","updated":"2026-06-01","content":"# 工程质量 - 典型案例\n\n## 一、质量缺陷责任\n\n### 案例1：发包人提供设计缺陷导致质量问题\n- **案号**：(2012)民提字第20号（公报案例2015年06期）\n- **案情**：海擎重工机械有限公司与江苏中兴建设有限公司建设工程施工合同纠纷。建设单位未提前交付地质勘查报告、施工图设计文件未经过建设主管部门审查批准\n- **裁判要旨**：从事建设工程活动，必须严格执行基本建设程序，坚持先勘察、后设计、再施工原则。建设单位未提前交付地质勘查报告、施工图设计文件未经过建设主管部门审查批准的，应对于因双方签约前未曾预见的特殊地质条件导致工程质量问题承担主要责任\n- **链接**：[深圳律协公报案例汇总PDF](https://www.szlawyers.com/file/upload/20240304/file/20240304113721_44d8a57b60924f67952ce552a52e4f99.pdf)\n\n### 案例2：承包人拒绝修复的法律后果\n- **案号**：司法解释一第12条\n- **裁判要旨**：因承包人原因造成质量不符合约定，承包人拒绝修理、返工或者改建的，发包人可以请求减少支付工程价款\n\n## 二、擅自使用\n\n### 案例3：擅自使用后不得主张质量不合格\n- **案号**：司法解释一第14条\n- **案情**：工程未经竣工验收，发包人已实际投入使用\n- **裁判要旨**：发包人擅自使用后，又以使用部分质量不符合约定主张权利的，不予支持。但承包人应在合理使用寿命内对地基基础和主体结构质量承担责任\n\n### 案例4：部分使用的认定\n- **裁判要旨**：部分使用的，对使用部分不得主张质量不合格。未使用部分的质量问题仍可主张\n\n## 三、质量保证金\n\n### 案例5：质量保证金返还条件\n- **案号**：法官会议纪要7\n- **裁判要旨**：质量保证金返还期限从竣工验收合格之日起算。未约定返还期限的，自竣工验收合格之日起满二年。返还后不影响承包人根据合同约定或法律规定履行保修义务\n\n## 四、保修责任\n\n### 案例6：保修人未及时履行义务的赔偿责任\n- **案号**：司法解释一第18条\n- **裁判要旨**：因保修人未及时履行保修义务，导致建筑物毁损或者造成人身损害、财产损失的，保修人应当承担赔偿责任\n\n## 五、质量鉴定\n\n### 案例7：质量鉴定合格期间顺延工期\n- **案号**：司法解释一第11条\n- **裁判要旨**：建设工程竣工前，当事人对工程质量发生争议，工程质量经鉴定合格的，鉴定期间为顺延工期期间\n\n## 六、裁判规则总结表\n\n| 规则 | 依据 | 要点 |\n|------|------|------|\n| 承包人原因质量缺陷 | 司法解释一第12条 | 应修复，拒绝修复的减少价款 |\n| 发包人三种过错 | 司法解释一第12条 | 设计缺陷/材料不合格/指定分包 |\n| 擅自使用 | 司法解释一第14条 | 不得主张质量不合格（地基主体除外） |\n| 质量保证金返还 | 司法解释一第17条 | 缺陷责任期满返还 |\n| 保修人赔偿 | 司法解释一第18条 | 未及时保修导致损害应赔偿 |\n| 质量鉴定顺延 | 司法解释一第11条 | 鉴定合格期间为顺延工期期间 |\n\n## 七、交叉引用\n- → [[03-裁判规则-质量缺陷责任划分|质量缺陷责任划分]]\n- → [[04-裁判规则-发包人过错责任|发包人过错责任]]\n- → [[05-裁判规则-擅自使用的质量责任|擅自使用的质量责任]]\n- → [[06-裁判规则-质量保证金|质量保证金]]\n- → [[07-裁判规则-保修责任|保修责任]]\n- → [[08-裁判规则-质量鉴定|质量鉴定]]"},{"id":"工程质量-常见问题faq","title":"工程质量 - 常见问题FAQ","excerpt":"工程质量 - 常见问题FAQ Q1：工程质量不合格谁负责？ A ：分两种情况：（1）承包人原因造成的，承包人应修理、返工或改建，拒绝修复的发包人可请求减少支付工程价款；（2）发包人有法定过错（提供设计有缺陷、提供或指定购买材料不合格、直接指定分包人分包专业工程）的，发包人承担过错责任。双方都有过错的，各自承担相应责任（司法解释一第12条）。 Q2：发包人擅自使用工程后还能主张质量不合格吗？ A ：","slug":"工程质量-常见问题faq","module":"04-工程质量","moduleName":"04 工程质量","tags":["建工","工程质量","FAQ"],"wordCount":1151,"created":"2026-06-01","updated":"2026-06-01","content":"# 工程质量 - 常见问题FAQ\n\n## Q1：工程质量不合格谁负责？\n**A**：分两种情况：（1）承包人原因造成的，承包人应修理、返工或改建，拒绝修复的发包人可请求减少支付工程价款；（2）发包人有法定过错（提供设计有缺陷、提供或指定购买材料不合格、直接指定分包人分包专业工程）的，发包人承担过错责任。双方都有过错的，各自承担相应责任（司法解释一第12条）。\n\n## Q2：发包人擅自使用工程后还能主张质量不合格吗？\n**A**：不能。建设工程未经竣工验收，发包人擅自使用后，又以使用部分质量不符合约定主张权利的，不予支持（司法解释一第14条）。但承包人仍应在建设工程的合理使用寿命内对**地基基础工程和主体结构**质量承担民事责任。\n\n**\"擅自使用\"的典型情形**：未经验收即投入使用、出租、出售等。\n\n## Q3：质量保证金什么时候返还？\n**A**：（1）有约定期限的，期限届满即应返还；（2）未约定期限的，自建设工程通过竣工验收之日起满2年；（3）因发包人原因未按约定期限进行竣工验收的，自承包人提交工程竣工验收报告90日后起算（司法解释一第17条）。\n\n**注意**：返还质量保证金后，承包人仍应根据合同约定或法律规定履行保修义务。\n\n## Q4：保修期多长？\n**A**：根据《建设工程质量管理条例》第40条：（1）基础设施工程、房屋建筑的地基基础工程和主体结构工程：设计文件规定的合理使用年限；（2）屋面防水工程、有防水要求的卫生间/房间/外墙面的防渗漏：**5年**；（3）供热与供冷系统：**2个采暖期/供冷期**；（4）电气管线、给排水管道、设备安装和装修工程：**2年**。\n\n## Q5：保修期内发现质量问题怎么办？\n**A**：保修期内发现质量问题的，应及时书面通知承包人修复。承包人未及时履行保修义务，导致建筑物毁损或造成人身、财产损害的，保修人应承担赔偿责任（司法解释一第18条）。\n\n## Q6：质量鉴定合格对工期有什么影响？\n**A**：建设工程竣工前，当事人对工程质量发生争议，工程质量经鉴定合格的，鉴定期间为顺延工期期间（司法解释一第11条）。即承包人不承担鉴定期间的工期延误责任。\n\n## Q7：发包人以质量不合格为由拒付工程款，法院支持吗？\n**A**：竣工验收合格后，发包人以质量不合格为由拒付工程款的，一般不予支持。但发包人有证据证明地基基础工程和主体结构存在质量问题的除外（山东高院解答2020）。发包人主张质量问题的，应提供初步证据证明质量问题的存在。\n\n## Q8：缺陷责任期和保修期有什么区别？\n**A**：\n| 比较维度 | 缺陷责任期 | 保修期 |\n|----------|-----------|--------|\n| 性质 | 质量担保期 | 质量修复义务期 |\n| 期限 | 一般不超过2年 | 因部位不同1-合理使用年限不等 |\n| 担保方式 | 质量保证金 | 无专门担保 |\n| 起算时间 | 竣工验收合格之日 | 竣工验收合格之日 |\n| 法律后果 | 期满返还保证金 | 期内有义务修复 |\n\n## 交叉引用\n- → [[03-裁判规则-质量缺陷责任划分|质量缺陷责任划分]]\n- → [[05-裁判规则-擅自使用的质量责任|擅自使用的质量责任]]\n- → [[06-裁判规则-质量保证金|质量保证金]]\n- → [[07-裁判规则-保修责任|保修责任]]\n- → [[08-裁判规则-质量鉴定|质量鉴定]]"},{"id":"工程造价与结算-制度概述","title":"工程造价与结算 - 制度概述","excerpt":"工程造价与结算 - 制度概述 一、核心问题 工程价款怎么计算？ 设计变更导致的价款变化怎么处理？ 发包人不回复结算文件怎么办？ 多份合同均无效时怎么结算？ 二、条文架构 条文 内容 第19条 计价方式约定优先；设计变更的计价 第20条 工程量争议与签证 第21条 默示认可结算文件 第22条 黑白合同的结算依据（招标文件为准） 第23条 非强制招标工程的黑白合同结算 第24条 多份合同均无效时的结算","slug":"工程造价与结算-制度概述","module":"05-工程造价与结算","moduleName":"05 工程造价与结算","tags":["建工","工程造价","结算","概述"],"wordCount":333,"created":"2026-06-01","updated":"2026-06-01","content":"# 工程造价与结算 - 制度概述\n\n## 一、核心问题\n\n1. 工程价款怎么计算？\n2. 设计变更导致的价款变化怎么处理？\n3. 发包人不回复结算文件怎么办？\n4. 多份合同均无效时怎么结算？\n\n## 二、条文架构\n\n| 条文 | 内容 |\n|------|------|\n| 第19条 | 计价方式约定优先；设计变更的计价 |\n| 第20条 | 工程量争议与签证 |\n| 第21条 | 默示认可结算文件 |\n| 第22条 | 黑白合同的结算依据（招标文件为准） |\n| 第23条 | 非强制招标工程的黑白合同结算 |\n| 第24条 | 多份合同均无效时的结算 |\n\n## 三、与其他模块的关系\n\n- → [[02-招投标与黑白合同/01-制度概述|招投标与黑白合同]]：黑白合同的结算依据\n- → [[01-合同效力/11-裁判规则-合同无效折价补偿|合同无效折价补偿]]：无效合同的结算\n- → [[06-工程款支付/01-制度概述|工程款支付]]：结算后的付款\n- → [[09-司法鉴定/01-制度概述|司法鉴定]]：造价鉴定"},{"id":"工程造价与结算-法律规范","title":"工程造价与结算 - 法律规范","excerpt":"工程造价与结算 - 法律规范 建工司法解释一逐条解析（第19-24条） 第19条（计价方式） 当事人对建设工程的计价标准或者计价方法有约定的，按照约定结算工程价款。 因设计变更导致建设工程的工程量或者质量标准发生变化，当事人对该部分工程价款不能协商一致的，可以参照签订建设工程施工合同时当地建设行政主管部门发布的计价方法或者计价标准结算工程价款。 建设工程施工合同有效，但建设工程经竣工验收不合格的，","slug":"工程造价与结算-法律规范","module":"05-工程造价与结算","moduleName":"05 工程造价与结算","tags":["建工","工程造价","结算","法律规范","司法解释逐条"],"wordCount":890,"created":"2026-06-01","updated":"2026-06-01","content":"# 工程造价与结算 - 法律规范\n\n## 建工司法解释一逐条解析（第19-24条）\n\n### 第19条（计价方式）\n> 当事人对建设工程的计价标准或者计价方法有约定的，按照约定结算工程价款。\n> 因设计变更导致建设工程的工程量或者质量标准发生变化，当事人对该部分工程价款不能协商一致的，可以参照签订建设工程施工合同时当地建设行政主管部门发布的计价方法或者计价标准结算工程价款。\n> 建设工程施工合同有效，但建设工程经竣工验收不合格的，依照民法典第五百七十七条规定处理。\n\n**要点**：约定优先；设计变更的参照当地计价标准\n\n### 第20条（工程量争议与签证）\n> 当事人对工程量有争议的，按照施工过程中形成的签证等书面文件确认。承包人能够证明发包人同意其施工，但未能提供签证文件证明工程量发生的，可以按照当事人提供的其他证据确认实际发生的工程量。\n\n**要点**：签证优先；无签证可用其他证据\n\n### 第21条（默示认可结算文件）\n> 当事人约定，发包人收到竣工结算文件后，在约定期限内不予答复，视为认可竣工结算文件的，按照约定处理。承包人请求按照竣工结算文件结算工程价款的，人民法院应予支持。\n\n**要点**：需有明确约定；沉默视为认可\n\n### 第22条（黑白合同结算依据）\n> 当事人签订的建设工程施工合同与招标文件、投标文件、中标通知书载明的工程范围、建设工期、工程质量、工程价款不一致，一方当事人请求将招标文件、投标文件、中标通知书作为结算工程价款的依据的，人民法院应予支持。\n\n### 第23条（非强制招标工程的黑白合同结算）\n> 发包人将依法不属于必须招标的建设工程进行招标后，与承包人另行订立的建设工程施工合同背离中标合同的实质性内容，当事人请求以中标合同作为结算建设工程价款依据的，人民法院应予支持，但发包人与承包人因客观情况发生了在招标投标时难以预见的变化而另行订立建设工程施工合同的除外。\n\n### 第24条（多份合同均无效时的结算）\n> 当事人就同一建设工程订立的数份建设工程施工合同均无效，但建设工程质量合格，一方当事人请求参照实际履行的合同关于工程价款的约定折价补偿承包人的，人民法院应予支持。\n> 实际履行的合同难以确定，当事人请求参照最后签订的合同关于工程价款的约定折价补偿承包人的，人民法院应予支持。"},{"id":"裁判规则-计价方式约定优先","title":"裁判规则 - 计价方式约定优先","excerpt":"裁判规则 - 计价方式约定优先 一、法律依据 《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第19条： 当事人对建设工程的计价标准或者计价方法有约定的，按照约定结算工程价款。 因设计变更导致建设工程的工程量或者质量标准发生变化，当事人对该部分工程价款不能协商一致的，可以参照签订建设工程施工合同时当地建设行政主管部门发布的计价方法或者计价标准结算工程价款。 《建设工程价款结","slug":"裁判规则-计价方式约定优先","module":"05-工程造价与结算","moduleName":"05 工程造价与结算","tags":["建工","工程造价","计价方式","裁判规则"],"wordCount":2483,"created":"2026-06-01","updated":"2026-06-02","content":"# 裁判规则 - 计价方式约定优先\n\n## 一、法律依据\n\n**《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第19条：**\n\n当事人对建设工程的计价标准或者计价方法有约定的，按照约定结算工程价款。\n\n因设计变更导致建设工程的工程量或者质量标准发生变化，当事人对该部分工程价款不能协商一致的，可以参照签订建设工程施工合同时当地建设行政主管部门发布的计价方法或者计价标准结算工程价款。\n\n**《建设工程价款结算暂行办法》（财建〔2004〕369号）第6条：**\n\n招标工程的合同价款应当在规定时间内，依据招标文件、中标人的投标文件，由发包人与承包人（以下简称\"发、承包人\"）订立书面合同约定。非招标工程的合同价款依据审定的工程预（概）算书由发、承包人在合同中约定。\n\n## 二、裁判规则要点\n\n### 规则1：约定优先原则\n\n当事人对计价标准或计价方法有约定的，法院应当按照约定结算工程价款。该原则体现了合同自由与意思自治，是工程价款结算的首要规则。约定内容包括计价方式（固定总价、固定单价、成本加酬金等）、计价依据（定额、清单、市场价等）以及调整条件（设计变更、物价波动等）。\n\n### 规则2：常见计价方式及其法律效果\n\n- **固定总价（总价包干）**：合同约定固定总价，除设计变更、政策调整等约定情形外不调整。承包人承担工程量风险，发包人承担工程范围变更风险。\n- **固定单价**：单价固定，按实际完成工程量结算。工程量风险由发包人承担，单价风险由承包人承担。\n- **成本加酬金**：实际成本加约定酬金（固定酬金或比例酬金）。承包人风险最小，但需接受发包人对成本的审计。\n- **定额计价**：按当地建设行政主管部门发布的定额标准计价，通常用于政府投资项目或双方无法就市场价达成一致时。\n\n### 规则3：无约定时的补充规则\n\n合同未约定计价标准或约定不明的，参照签订合同时当地建设行政主管部门发布的计价方法或计价标准结算。此处\"签订合同时\"的时间节点至关重要——应以合同签订时而非施工时或结算时的计价标准为准，防止一方通过拖延结算获取不当利益。\n\n### 规则4：计价依据的解释规则\n\n当合同约定的计价条款存在歧义时，法院通常按照以下顺序解释：（1）合同文义解释；（2）交易习惯解释；（3）有利于实现合同目的的解释；（4）不利于提供格式条款一方的解释（如适用）。\n\n### 规则5：招投标工程的计价限制\n\n依法必须招投标的工程，合同约定的计价标准不得实质性背离中标合同的计价约定。中标合同约定固定总价的，后续不得以补充协议变更为定额计价，否则可能被认定为\"黑白合同\"而无效。\n\n→ 详见 [[08-裁判规则-多份合同均无效的结算|多份合同均无效的结算]]\n\n## 三、司法观点分歧\n\n### 争议1：定额计价是否具有强制适用效力\n\n**肯定说：** 部分法院认为，在合同未约定计价方式或约定不明时，定额标准是法定的补充计价依据，应当直接适用。\n**否定说：** 另有法院认为，定额标准仅是参考，如当事人能证明存在市场交易习惯或双方曾口头约定其他计价方式，可不适用定额。\n\n### 争议2：合同约定\"按实结算\"的含义\n\n**工程量按实结算说：** \"按实结算\"仅指工程量据实计算，单价仍按合同约定的单价执行。\n**全面据实结算说：** \"按实结算\"意味着工程量和单价均据实计算，不适用合同约定的固定单价。\n\n### 争议3：施工过程中双方以实际行为变更计价方式的效力\n\n**有效说：** 双方长期按与合同不同的方式计价（如合同约定固定总价但实际按月进度付款时均按实际工程量计价），可视为以行为变更合同计价方式。\n**无效说：** 合同变更需双方明确意思表示，单纯的付款行为不构成对计价方式的变更。\n\n## 四、省/市高院指引差异\n\n| 省/市 | 文件 | 要点 |\n| --- | --- | --- |\n| 四川+重庆 | 联合解答（2022） | 合同未约定计价方式的，参照签约时当地定额标准；\"按实结算\"一般理解为工程量据实、单价从约定 |\n| 山东 | 高院解答（2020） | 固定总价合同中，因设计变更导致工程量增减超过合同约定风险范围的，增减部分可按定额计价 |\n| 广东 | 高院疑难问题解答（2017） | 招标工程以中标合同的计价约定为准；补充协议变更计价方式的，如属实质性变更则不予采信 |\n| 深圳 | 中院裁判指引（2014） | \"按实结算\"应结合合同上下文确定含义，通常理解为工程量据实计算 |\n| 江苏 | 高院指引 | 合同未约定计价方式的，参照定额；但当事人有证据证明存在其他合理计价方式的，也可采纳 |\n\n## 五、典型案例\n\n### 案例1：固定总价与定额计价之争\n\n**案号：** （2019）最高法民终314号\n**案"},{"id":"裁判规则-设计变更的计价","title":"裁判规则 - 设计变更的计价","excerpt":"裁判规则 - 设计变更的计价 一、法律依据 《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第19条： 当事人对建设工程的计价标准或者计价方法有约定的，按照约定结算工程价款。 因设计变更导致建设工程的工程量或者质量标准发生变化，当事人对该部分工程价款不能协商一致的，可以参照签订建设工程施工合同时当地建设行政主管部门发布的计价方法或者计价标准结算工程价款。 《建设工程施工合同","slug":"裁判规则-设计变更的计价","module":"05-工程造价与结算","moduleName":"05 工程造价与结算","tags":["建工","工程造价","设计变更","裁判规则"],"wordCount":2345,"created":"2026-06-01","updated":"2026-06-02","content":"# 裁判规则 - 设计变更的计价\n\n## 一、法律依据\n\n**《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第19条：**\n\n当事人对建设工程的计价标准或者计价方法有约定的，按照约定结算工程价款。\n\n因设计变更导致建设工程的工程量或者质量标准发生变化，当事人对该部分工程价款不能协商一致的，可以参照签订建设工程施工合同时当地建设行政主管部门发布的计价方法或者计价标准结算工程价款。\n\n**《建设工程施工合同（示范文本）》（GF-2017-0201）通用条款第10条：**\n\n变更的估价原则：已标价工程量清单或预算书有相同项目的，按照相同项目单价认定；有类似项目的，参照类似项目单价认定；无相同或类似项目的，由承包人提出变更单价，经发包人确认后执行。\n\n**《建设工程工程量清单计价规范》（GB50500-2013）第9.3条：**\n\n工程变更引起工程量变化的，应按合同约定调整合同价款；合同未约定的，按本规范相关规定执行。\n\n## 二、裁判规则要点\n\n### 规则1：协商优先原则\n\n设计变更导致工程量或质量标准变化的，当事人应先协商确定变更部分的工程价款。协商一致的，按协商结果结算；协商不成的，方可适用法定补充规则。\n\n### 规则2：协商不成时参照定额结算\n\n当事人对设计变更部分的价款协商不成的，可以参照签订建设工程施工合同时当地建设行政主管部门发布的计价方法或者计价标准结算。此处的\"参照\"而非\"按照\"赋予法院一定的裁量空间，可根据案件具体情况酌情确定。\n\n### 规则3：设计变更的认定标准\n\n设计变更包括：（1）设计单位出具的设计变更通知单；（2）建设单位（发包人）发出的工程变更指令；（3）经监理工程师确认的现场签证；（4）图纸会审纪要中的变更内容。承包人单方的施工调整不构成设计变更。\n\n### 规则4：固定总价合同的设计变更处理\n\n固定总价合同中，因设计变更导致实际施工超出约定范围的，超出部分可参照当地计价标准另行结算。但合同约定的风险范围内的工程量变化，仍按固定总价执行。关键在于区分\"设计变更\"与\"承包人应承担的工程量风险\"。\n\n### 规则5：未竣工工程的设计变更结算\n\n工程未竣工即解除合同，已施工部分包含设计变更的，可参照合同签订时的计价标准确定已施工部分价款占全部工程的比例，乘以合同约定固定价款确定应得价款。设计变更部分的价款应单独计算后加上。\n\n### 规则6：设计变更与工期顺延的关联\n\n设计变更导致工程量增加的，承包人有权同时主张工期顺延和增加价款。但承包人未在约定期限内提出工期顺延申请的，可能丧失工期顺延的主张权。\n\n## 三、司法观点分歧\n\n### 争议1：设计变更部分的计价是否必须参照定额\n\n**参照定额说：** 司法解释明确规定参照当地计价标准，法院应优先适用定额标准。\n**市场价优先说：** 如当事人能证明存在更合理的市场交易价格，法院可不适用定额，而以市场价为基础确定变更部分价款。\n\n### 争议2：承包人未及时办理签证的设计变更能否计价\n\n**严格说：** 设计变更未经签证确认的，承包人无权主张变更部分价款。\n**实质审查说：** 虽未办理签证，但有充分证据证明确实发生设计变更且已实际施工的，法院应根据实际情况确定变更部分价款。\n\n### 争议3：设计变更导致工程量减少时的处理\n\n**按实结算说：** 工程量减少的，应按实际完成的工程量结算，发包人无需补偿承包人的预期利润损失。\n**信赖利益保护说：** 如发包人恶意减少工程量以压低价格，承包人可主张信赖利益损失。\n\n## 四、省/市高院指引差异\n\n| 省/市 | 文件 | 要点 |\n| --- | --- | --- |\n| 四川+重庆 | 联合解答（2022） | 设计变更部分价款协商不成的，参照定额；固定总价合同中设计变更超出风险范围的部分另行计价 |\n| 山东 | 高院解答（2020） | 固定总价合同因设计变更导致工程量增减超过合同约定风险范围的，增减部分可按定额计价 |\n| 广东 | 高院疑难问题解答（2017） | 设计变更未经签证但有其他证据证明的，法院可结合实际施工情况确定变更部分价款 |\n| 深圳 | 中院裁判指引（2014） | 设计变更部分的计价，有相同或类似项目的参照合同单价，无相同或类似项目的参照定额 |\n| 江苏 | 高院指引 | 设计变更部分的计价，应区分\"增加工程\"与\"替代工程\"，分别适用不同计价规则 |\n\n## 五、典型案例\n\n### 案例1：固定总价合同的设计变更计价\n\n**案号：** （2019）最高法民终314号\n**案情：** 固定总价合同施工过程中发生大量设计变更，承包人主张变更部分按定额计价。\n**裁判：** 最高法院认为，固定总价合同中因设计变更导致实际施工超出合同约定范围的，超出部"},{"id":"裁判规则-工程量争议与签证","title":"裁判规则 - 工程量争议与签证","excerpt":"裁判规则 - 工程量争议与签证 一、法律依据 《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第20条： 当事人对工程量有争议的，按照施工过程中形成的签证等书面文件确认。承包人能够证明发包人同意其施工，但未能提供签证文件证明发生工程量的，可以按照当事人提供的其他证据确认实际发生的工程量。 《建设工程施工合同（示范文本）》（GF-2017-0201）通用条款第19.1条： 承","slug":"裁判规则-工程量争议与签证","module":"05-工程造价与结算","moduleName":"05 工程造价与结算","tags":["建工","工程造价","工程量","签证","裁判规则"],"wordCount":2276,"created":"2026-06-01","updated":"2026-06-02","content":"# 裁判规则 - 工程量争议与签证\n\n## 一、法律依据\n\n**《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第20条：**\n\n当事人对工程量有争议的，按照施工过程中形成的签证等书面文件确认。承包人能够证明发包人同意其施工，但未能提供签证文件证明发生工程量的，可以按照当事人提供的其他证据确认实际发生的工程量。\n\n**《建设工程施工合同（示范文本）》（GF-2017-0201）通用条款第19.1条：**\n\n承包人应在知道或应当知道索赔事件发生后28天内，向监理人递交索赔意向通知书，并说明发生索赔事件的事由。承包人未在前述28天内发出索赔意向通知书的，丧失要求追加付款和（或）延长工期的权利。\n\n**《建设工程工程量清单计价规范》（GB50500-2013）第8.2条：**\n\n工程量应按承包人在履行合同义务过程中实际完成的工程量计算。\n\n## 二、裁判规则要点\n\n### 规则1：签证的优先证明效力\n\n工程量有争议的，按施工过程中形成的签证等书面文件确认。签证是双方对工程量的共同确认，具有较高的证明效力，法院通常直接采信。签证包括工程量确认单、隐蔽工程验收记录、工程变更签证、现场签证单等。\n\n### 规则2：无签证时的替代证据\n\n承包人能证明发包人同意其施工，但未能提供签证的，可按其他证据确认实际发生的工程量。司法解释赋予承包人以其他证据证明工程量的权利，但举证责任在承包人一方。\n\n### 规则3：替代证据的范围与证明力排序\n\n其他证据按证明力从高到低排列：（1）经发包人或监理确认的施工日志、会议纪要；（2）监理工程师签发的工程量确认单；（3）双方往来函件中涉及工程量的内容；（4）材料采购记录、检验报告等间接证据；（5）影像资料（照片、视频等）；（6）证人证言。\n\n### 规则4：发包人反签证的效力\n\n发包人在签证上注明\"仅确认施工事实，不确认工程量\"或类似保留意见的，该签证不能直接作为工程量确认依据，但可以证明施工事实的存在，法院可结合其他证据综合认定工程量。\n\n### 规则5：逾期签证的效力\n\n承包人未在约定期限内办理签证的，是否丧失主张工程量的权利？一般认为，合同约定了签证期限的，承包人逾期办理签证应承担举证不利的后果，但并非绝对丧失权利——如有充分证据证明工程量确实发生，法院仍可酌情支持。\n\n### 规则6：监理确认的效力\n\n监理工程师对工程量的确认，除合同另有约定外，对发包人具有约束力。但监理超越授权范围的确认，发包人可不予认可，除非承包人有理由相信监理有此权限（表见代理）。\n\n## 三、司法观点分歧\n\n### 争议1：签证是否为证明工程量的唯一有效证据\n\n**签证唯一说：** 司法解释将签证置于优先地位，未办理签证的工程量原则上不予支持。\n**多元证据说：** 司法解释明确规定无签证时可以其他证据确认工程量，签证并非唯一证据。\n\n### 争议2：逾期签证的法律后果\n\n**严格时效说：** 合同约定了签证期限的，逾期签证丧失证明效力，承包人无权主张工程量。\n**实质审查说：** 签证期限属于管理性规定，逾期签证不当然无效，法院应结合证据综合判断。\n\n### 争议3：口头变更是否需要签证确认\n\n**书面形式要求说：** 设计变更和工程量变更均应以书面形式确认，口头变更未经签证不产生法律效力。\n**实际履行说：** 双方以实际行为履行了口头变更，且有其他证据佐证的，法院应认定变更效力。\n\n## 四、省/市高院指引差异\n\n| 省/市 | 文件 | 要点 |\n| --- | --- | --- |\n| 四川+重庆 | 联合解答（2022） | 签证是确认工程量的首选证据；无签证但有充分证据证明工程量发生的，法院可酌情认定 |\n| 山东 | 高院解答（2020） | 承包人未在约定期限内办理签证的，应承担举证不利后果，但不绝对丧失权利 |\n| 广东 | 高院疑难问题解答（2017） | 监理确认的工程量对发包人具有约束力，但监理超越授权范围的除外 |\n| 深圳 | 中院裁判指引（2014） | 签证期限属于管理性规定，逾期签证不当然无效；法院应综合全案证据判断工程量 |\n| 江苏 | 高院指引 | 承包人主张工程量但无签证的，应提供施工日志、材料采购记录等证据形成完整证据链 |\n\n## 五、典型案例\n\n### 案例1：签证的优先证明效力\n\n**案号：** （2019）最高法民终1524号\n**案情：** 承包人持经监理确认的工程量签证单主张工程款，发包人抗辩签证中的工程量与实际不符。\n**裁判：** 最高法院认为，经监理确认的签证具有较高证明效力，发包人未能提供充分反证的，应按签证确认的工程量结算。\n\n### 案例2：无签证时的工程量认定\n\n**案号：** （2020）最高法民终489号\n**案情：** 承包"},{"id":"裁判规则-默示认可结算文件","title":"裁判规则 - 默示认可结算文件","excerpt":"裁判规则 - 默示认可结算文件 一、法律依据 《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第21条： 当事人约定，发包人收到竣工结算文件后，在约定期限内不予答复，视为认可竣工结算文件的，按照约定处理。承包人请求按照竣工结算文件结算工程价款的，人民法院应予支持。 《建设工程价款结算暂行办法》（财建〔2004〕369号）第16条： 发包人收到竣工结算报告及完整的结算资料后，","slug":"裁判规则-默示认可结算文件","module":"05-工程造价与结算","moduleName":"05 工程造价与结算","tags":["建工","工程造价","结算","默示认可","裁判规则"],"wordCount":2345,"created":"2026-06-01","updated":"2026-06-02","content":"# 裁判规则 - 默示认可结算文件\n\n## 一、法律依据\n\n**《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第21条：**\n\n当事人约定，发包人收到竣工结算文件后，在约定期限内不予答复，视为认可竣工结算文件的，按照约定处理。承包人请求按照竣工结算文件结算工程价款的，人民法院应予支持。\n\n**《建设工程价款结算暂行办法》（财建〔2004〕369号）第16条：**\n\n发包人收到竣工结算报告及完整的结算资料后，在本办法规定或合同约定期限内，对结算报告及资料没有提出意见，则视同认可。\n\n**《建设工程施工合同（示范文本）》（GF-2017-0201）通用条款第14.2条：**\n\n发包人应在收到承包人提交的竣工结算文件后28天内审核完毕并签发竣工付款证书。发包人在前述期限内未完成审核且未提出异议的，视为认可竣工结算文件。\n\n## 二、裁判规则要点\n\n### 规则1：适用前提——合同明确约定\n\n默示认可规则的适用前提是合同中明确约定\"发包人收到竣工结算文件后在约定期限内不予答复，视为认可竣工结算文件\"。该约定应当明确、具体，不能含糊或仅作概括性引用。\n\n### 规则2：沉默的法律效果\n\n发包人在约定期限内不予答复的，按照承包人提交的竣工结算文件结算工程价款。此处的\"不予答复\"包括：（1）完全不答复；（2）答复内容不涉及结算审核意见（如仅表示\"收到\"但未提出具体异议）；（3）答复超出约定期限。\n\n### 规则3：无约定不适用默示认可\n\n合同未作此约定的，发包人的沉默不视为认可。最高法院在多个判例中明确，默示认可规则不能推定适用，必须有明确的合同依据。示范文本中的默示认可条款，如未被当事人在专用条款中排除，一般视为已纳入合同。\n\n### 规则4：结算文件的送达要求\n\n承包人需举证证明竣工结算文件已送达发包人。送达方式包括：（1）发包人签收（加盖公章或授权代表签字）；（2）邮寄送达（EMS或挂号信，保留邮寄凭证）；（3）电子邮件送达（保留发送记录和已读回执）；（4）公证送达。\n\n### 规则5：结算文件的完整性要求\n\n承包人提交的竣工结算文件应当完整，包括：竣工结算报告、竣工图纸、工程量计算书、签证单、材料价格证明等。结算文件明显不完整的，发包人有权要求补充，此时约定期限自补充完整之日起重新计算。\n\n### 规则6：约定期限的起算与中止\n\n约定期限自发包人收到完整的竣工结算文件之日起计算。发包人在期限内提出异议并要求补充资料的，期限中止；承包人补充资料后，期限继续计算。\n\n## 三、司法观点分歧\n\n### 争议1：示范文本中的默示认可条款是否当然适用\n\n**当然适用说：** 示范文本经招投标程序成为合同组成部分，其中的默示认可条款对双方有约束力。\n**不当然适用说：** 示范文本中的默示认可条款属于通用条款，如当事人在专用条款中另有约定或明确排除，则不适用。\n\n### 争议2：发包人提出部分异议是否构成\"答复\"\n\n**肯定说：** 发包人对结算文件中的部分内容提出异议的，应视为已答复，不适用默示认可规则，异议部分可通过鉴定解决。\n**否定说：** 发包人仅对部分项目提出异议而对其他项目不予答复的，对未答复部分仍适用默示认可规则。\n\n### 争议3：承包人提交的结算金额明显虚高时能否适用默示认可\n\n**形式审查说：** 只要合同有约定且发包人未在期限内答复，即应按结算文件结算，不论金额是否合理。\n**实质审查说：** 结算金额明显虚高、严重偏离实际的，法院不应机械适用默示认可规则，而应通过鉴定确定实际工程造价。\n\n## 四、省/市高院指引差异\n\n| 省/市 | 文件 | 要点 |\n| --- | --- | --- |\n| 四川+重庆 | 联合解答（2022） | 合同约定默示认可的，按约定处理；承包人提交的结算文件应完整，发包人有权要求补充 |\n| 山东 | 高院解答（2020） | 示范文本中的默示认可条款，如未在专用条款中排除，对双方有约束力 |\n| 广东 | 高院疑难问题解答（2017） | 发包人在期限内提出异议的，不适用默示认可；异议是否成立不影响默示认可规则的适用 |\n| 深圳 | 中院裁判指引（2014） | 结算金额明显虚高的，法院可依职权委托鉴定，不机械适用默示认可规则 |\n| 江苏 | 高院指引 | 合同未约定默示认可的，发包人的沉默不视为认可；但发包人无正当理由拖延结算的，可作为违约行为处理 |\n\n## 五、典型案例\n\n### 案例1：默示认可的适用\n\n**案号：** （2019）最高法民终1335号\n**案情：** 合同约定发包人收到结算文件后60日内不予答复视为认可。承包人提交结算文件后发包人超过60日未答复，承包人请求按结算文件结算。\n**裁判：** 最高法院认为，合同有明确约定，发包人未"},{"id":"裁判规则-固定价结算","title":"裁判规则 - 固定价结算","excerpt":"裁判规则 - 固定价结算 一、法律依据 《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第19条： 当事人对建设工程的计价标准或者计价方法有约定的，按照约定结算工程价款。 因设计变更导致建设工程的工程量或者质量标准发生变化，当事人对该部分工程价款不能协商一致的，可以参照签订建设工程施工合同时当地建设行政主管部门发布的计价方法或者计价标准结算工程价款。 《最高人民法院关于审理","slug":"裁判规则-固定价结算","module":"05-工程造价与结算","moduleName":"05 工程造价与结算","tags":["建工","工程造价","固定价","裁判规则"],"wordCount":2410,"created":"2026-06-01","updated":"2026-06-02","content":"# 裁判规则 - 固定价结算\n\n## 一、法律依据\n\n**《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第19条：**\n\n当事人对建设工程的计价标准或者计价方法有约定的，按照约定结算工程价款。\n\n因设计变更导致建设工程的工程量或者质量标准发生变化，当事人对该部分工程价款不能协商一致的，可以参照签订建设工程施工合同时当地建设行政主管部门发布的计价方法或者计价标准结算工程价款。\n\n**《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第28条：**\n\n当事人约定按照固定价结算工程价款，一方当事人请求对建设工程造价进行鉴定的，人民法院不予支持。\n\n**《建设工程工程量清单计价规范》（GB50500-2013）第3.4.1条：**\n\n建设工程发承包，必须在招标文件、合同中明确计价中的风险内容及其范围，不得采用无限风险、所有风险或类似语句规定计价中的风险内容及范围。\n\n## 二、裁判规则要点\n\n### 规则1：固定价不予鉴定\n\n当事人约定按照固定价结算工程价款，一方请求对工程造价进行鉴定的，法院不予支持。这是固定价结算的核心规则，体现了合同严守原则。但该规则的前提是工程已竣工验收合格且未发生合同约定的调整事由。\n\n### 规则2：固定总价与固定单价的区分\n\n- **固定总价（总价包干）**：合同总价固定，工程量和单价均不调整（除设计变更等约定事由）。承包人承担工程量和单价的双重风险。\n- **固定单价**：单价固定，按实际完成工程量结算。工程量风险由发包人承担，单价风险由承包人承担。\n- 两者的鉴定处理不同：固定总价原则上不鉴定；固定单价的单价不鉴定，但工程量争议可鉴定。\n\n### 规则3：固定总价的风险范围\n\n固定总价合同中，工程量变化的风险原则上由承包人承担。但风险范围应有明确约定，约定不明的，法院通常按照以下原则处理：（1）合同约定的风险范围内，不调整；（2）超出风险范围的，参照定额或市场价调整。\n\n### 规则4：设计变更导致的调整\n\n因设计变更导致实际施工超出固定总价约定范围的，超出部分可参照当地计价标准另行结算。此处的\"超出约定范围\"是指工程内容、工程量的变化，而非单纯的施工条件变化。\n\n### 规则5：未竣工工程的固定价结算\n\n工程未竣工即解除合同，已施工部分质量合格且就价款不能协商一致的，可参照合同签订时的计价标准确定已施工部分价款占全部工程的比例，乘以合同约定固定价款确定应得价款。此为\"比例法\"。\n\n### 规则6：固定价与情势变更\n\n合同成立后，因市场价格异常波动（如建材价格暴涨）导致继续履行固定价合同对一方明显不公平的，当事人可主张适用情势变更规则调整价款。但法院对此适用标准较为严格。\n\n## 三、司法观点分歧\n\n### 争议1：未竣工工程固定价结算的方法\n\n**比例法说：** 参照定额确定已施工部分占全部工程的比例，乘以合同固定总价。此为最高法院征求意见稿采纳的方法。\n**定额法说：** 直接按定额计算已施工部分的造价，不适用比例法。认为比例法可能导致结果偏离实际。\n**据实结算说：** 按实际完成的工程量和合同约定的单价据实结算，适用于固定单价合同。\n\n### 争议2：固定价合同中材料价格大幅上涨能否调整\n\n**严格按约履行说：** 固定价合同的风险包括材料价格波动，除合同另有约定外，不因价格上涨而调整。\n**情势变更说：** 材料价格异常暴涨超出正常商业风险范围的，可适用情势变更调整价款。\n\n### 争议3：固定价合同的\"阴阳合同\"问题\n\n**中标合同优先说：** 招投标工程中，中标合同约定固定总价，备案后又签订补充协议变更价款的，应以中标合同为准。\n**实际履行优先说：** 如补充协议系双方真实意思表示且已实际履行，可参照补充协议结算。\n\n## 四、省/市高院指引差异\n\n| 省/市 | 文件 | 要点 |\n| --- | --- | --- |\n| 四川+重庆 | 联合解答（2022） | 固定总价合同中设计变更超出风险范围的部分可按定额计价；未竣工工程适用比例法 |\n| 山东 | 高院解答（2020） | 固定总价合同因设计变更导致工程量增减超过约定风险范围的，增减部分可按定额计价 |\n| 广东 | 高院疑难问题解答（2017） | 固定价不予鉴定，但存在设计变更或合同约定的调整事由的，变更部分可鉴定 |\n| 深圳 | 中院裁判指引（2014） | 固定总价合同的风险范围约定不明的，法院可结合合同条款和行业惯例确定 |\n| 江苏 | 高院指引 | 固定总价合同未竣工的，已施工部分可按定额确定造价占总造价的比例，再乘以合同固定总价 |\n\n## 五、典型案例\n\n### 案例1：固定价不予鉴定\n\n**案号：** （2019）最高法民终568号\n**案情：** 双方"},{"id":"裁判规则-多份合同均无效时的结算","title":"裁判规则 - 多份合同均无效时的结算","excerpt":"裁判规则 - 多份合同均无效时的结算 一、法律依据 《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第24条： 当事人就同一建设工程订立的数份建设工程施工合同均无效，但建设工程质量合格，一方当事人请求参照实际履行的合同关于工程价款的约定折价补偿承包人的，人民法院应予支持。 实际履行的合同难以确定，当事人请求参照最后签订的合同关于工程价款的约定折价补偿承包人的，人民法院应予支","slug":"裁判规则-多份合同均无效时的结算","module":"05-工程造价与结算","moduleName":"05 工程造价与结算","tags":["建工","工程造价","多份合同无效","裁判规则"],"wordCount":2261,"created":"2026-06-01","updated":"2026-06-02","content":"# 裁判规则 - 多份合同均无效时的结算\n\n## 一、法律依据\n\n**《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第24条：**\n\n当事人就同一建设工程订立的数份建设工程施工合同均无效，但建设工程质量合格，一方当事人请求参照实际履行的合同关于工程价款的约定折价补偿承包人的，人民法院应予支持。\n\n实际履行的合同难以确定，当事人请求参照最后签订的合同关于工程价款的约定折价补偿承包人的，人民法院应予支持。\n\n**《中华人民共和国民法典》第793条：**\n\n建设工程施工合同无效，但是建设工程经验收合格的，可以参照合同关于工程价款的约定折价补偿承包人。\n\n**《中华人民共和国民法典》第157条：**\n\n民事法律行为无效、被撤销或者确定不发生效力后，行为人因该行为取得的财产，应当予以返还；不能返还或者没有必要返还的，应当折价补偿。有过错的一方应当赔偿对方由此所受到的损失。\n\n## 二、裁判规则要点\n\n### 规则1：参照实际履行的合同结算\n\n数份合同均无效但工程质量合格的，参照实际履行的合同关于工程价款的约定折价补偿。这是多份合同均无效时结算的首要规则，体现了\"实际履行优先\"的原则。\n\n### 规则2：实际履行合同的认定标准\n\n认定\"实际履行的合同\"，法院通常综合考虑以下因素：（1）实际施工的工程范围与哪份合同一致；（2）工程进度款的支付依据哪份合同；（3）工程结算资料以哪份合同为基础编制；（4）双方往来函件中引用哪份合同；（5）监理、审计等第三方以哪份合同为依据。\n\n### 规则3：实际履行难以确定时参照最后签订的合同\n\n实际履行的合同难以确定的，参照最后签订的合同关于工程价款的约定折价补偿。\"最后签订的合同\"通常最接近双方的真实意思，因此作为补充规则适用。\n\n### 规则4：工程质量合格是前提条件\n\n工程质量不合格的，不适用本条。此处的\"质量合格\"包括：（1）竣工验收合格；（2）虽未竣工验收但经鉴定质量合格；（3）发包人擅自使用（视为质量合格）。\n\n### 规则5：折价补偿与合同约定的关系\n\n参照合同约定折价补偿，并非认定合同有效，而是基于合同无效后的财产返还规则。折价补偿的范围包括工程直接费、间接费、利润和税金，但不包括因合同无效而产生的损失赔偿。\n\n### 规则6：多份合同价款差异过大时的处理\n\n当数份合同约定的价款差异过大时，参照实际履行合同结算可能导致显失公平。此时法院可综合考虑双方过错程度，适当调整折价补偿的金额。\n\n## 三、司法观点分歧\n\n### 争议1：参照合同结算是否意味着合同价款条款独立有效\n\n**独立有效说：** 参照合同结算意味着合同中的价款条款独立有效，不因合同整体无效而受影响。\n**折价补偿说：** 合同整体无效，价款条款亦无效；参照合同结算仅是确定折价补偿金额的方法，并非认定条款有效。\n\n### 争议2：实际履行合同难以确定的举证责任\n\n**主张方举证说：** 主张参照某份合同结算的一方，应举证证明该合同为实际履行的合同。\n**综合判断说：** 法院应依职权综合审查各项因素确定实际履行的合同，不完全依赖当事人的举证。\n\n### 争议3：合同无效后的损失赔偿是否应在折价补偿中一并处理\n\n**合并处理说：** 合同无效后的损失赔偿与折价补偿应在同一案件中一并处理，避免诉累。\n**分别处理说：** 折价补偿与损失赔偿是不同的请求权基础，当事人可分别主张。\n\n## 四、省/市高院指引差异\n\n| 省/市 | 文件 | 要点 |\n| --- | --- | --- |\n| 四川+重庆 | 联合解答（2022） | 实际履行合同难以确定的，参照最后签订的合同；但最后签订的合同价款明显偏离实际的，可参照定额 |\n| 山东 | 高院解答（2020） | 多份合同均无效的，参照实际履行的合同结算；实际履行难以确定的，参照最后签订的合同 |\n| 广东 | 高院疑难问题解答（2017） | 认定实际履行的合同应综合考虑施工范围、付款依据、结算资料等因素 |\n| 深圳 | 中院裁判指引（2014） | 多份合同价款差异过大时，法院可根据双方过错程度适当调整折价补偿金额 |\n| 江苏 | 高院指引 | 参照实际履行合同结算，不等于认定该合同有效；折价补偿范围包括直接费、间接费、利润和税金 |\n\n## 五、典型案例\n\n### 案例1：参照实际履行的合同结算\n\n**案号：** （2019）最高法民终1093号\n**案情：** 双方签订两份施工合同（中标备案合同与实际履行合同），两份合同均因违法分包被认定无效。承包人主张参照实际履行合同（价款较高）结算。\n**裁判：** 最高法院综合审查施工范围、付款依据、结算资料等因素，认定双方实际履行的是未经备案的合同，参照该合同结算。\n\n### 案例2：实际履行难以确定\n"},{"id":"裁判规则-以审计为结算条件","title":"裁判规则 - 以审计为结算条件","excerpt":"裁判规则 - 以审计为结算条件 一、法律依据 《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第29条： 当事人约定，发包人收到竣工结算文件后，在约定期限内不予答复，视为认可竣工结算文件的，按照约定处理。承包人请求按照竣工结算文件结算工程价款的，人民法院应予支持。 《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第30条： 当事人在诉讼前共同委托有关","slug":"裁判规则-以审计为结算条件","module":"05-工程造价与结算","moduleName":"05 工程造价与结算","tags":["建工","工程造价","审计","结算","裁判规则"],"wordCount":2391,"created":"2026-06-01","updated":"2026-06-02","content":"# 裁判规则 - 以审计为结算条件\n\n## 一、法律依据\n\n**《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第29条：**\n\n当事人约定，发包人收到竣工结算文件后，在约定期限内不予答复，视为认可竣工结算文件的，按照约定处理。承包人请求按照竣工结算文件结算工程价款的，人民法院应予支持。\n\n**《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第30条：**\n\n当事人在诉讼前共同委托有关机构、人员对建设工程造价出具咨询意见，诉讼中一方当事人不认可该咨询意见申请鉴定的，人民法院应予准许，但双方当事人明确表示受该咨询意见约束的除外。\n\n**《保障中小企业款项支付条例》第11条：** 机关、事业单位和大型企业不得利用商业汇票等非现金支付方式变相延长付款期限（与审计拖延相关）。\n\n## 二、裁判规则要点\n\n### 规则1：约定以审计为准的处理\n发包人与承包人约定工程价款按照审计机关的审计结果或财政评审机构的评审结论确定，非因承包人原因导致审计/评审未在合理期限内出具结果，或承包人有证据证明审计结果与合同约定明显不符的，承包人申请司法鉴定的，法院应予准许。\n\n### 规则2：未约定以审计为准的处理\n双方未约定以审计结果确定工程价款的，一方请求以审计结果确定价款的，法院不予支持。审计机关依职权进行的审计监督，不能替代当事人之间的结算约定。\n\n### 规则3：审计长期未出具结果的救济\n合同约定以审计为结算条件，但审计长期不出结果（一般超过合理期限一年以上），承包人请求以送审价结算或申请司法鉴定的，法院应予准许。合理期限的认定应结合工程规模、审计复杂程度等因素综合判断。\n\n### 规则4：审计结果明显不当的救济\n审计结果与合同约定、实际施工情况明显不符的，承包人有权申请司法鉴定。法院应审查审计结果的合理性，不能机械采信审计结论而忽视当事人的合法权益。\n\n### 规则5：政府投资项目的审计义务主体\n政府投资项目中，建设单位（发包人）负有配合审计的义务。因发包人原因导致审计迟延的，不得对抗承包人的结算请求。\n\n### 规则6：审计与鉴定的关系\n审计不能替代司法鉴定，司法鉴定也不能当然否定审计结论。两者并存时，法院应综合审查各自依据和结论的合理性，择优采信。\n\n## 三、司法观点分歧\n\n### 争议1：审计结论是否属于民事诉讼中的\"鉴定意见\"\n\n**肯定说：** 审计结论具有专业性和权威性，应参照鉴定意见予以审查认定。\n**否定说：** 审计属于行政监督行为，其结论不属于民事诉讼证据，法院应独立判断。\n**主流立场：** 审计结论属于书证，法院应结合合同约定和实际情况综合审查其证明力。\n\n### 争议2：约定\"以审计为准\"是否排除司法鉴定\n\n**排除说：** 当事人明确约定以审计为准的，应尊重当事人意思自治，不得再行鉴定。\n**不排除说：** 审计长期不出结果或结论明显不当的，承包人有权申请司法鉴定。\n**主流立场：** 约定以审计为准不免除法院对审计结果合理性的审查义务，特定情形下应准许鉴定。\n\n### 争议3：审计结果与合同约定冲突时的处理\n**审计优先说：** 合同约定以审计为准的，应以审计结果为最终结算依据。\n**合同优先说：** 审计结果违反合同约定计价原则的，应以合同约定为准。\n**主流立场：** 应区分审计结果是纠正了合同履行中的违规行为，还是改变了合同约定的计价方式。前者应予采信，后者不应支持。\n\n## 四、省/市高院指引差异\n\n| 省/市 | 文件 | 要点 |\n| --- | --- | --- |\n| 北京 | 高院解答 | 约定以审计为准的，从约定；审计超过合理期限的，承包人可申请鉴定 |\n| 江苏 | 高院指南（2018） | 政府投资项目的审计约定有效，但审计超过一年未出结果的，承包人可主张以送审价结算 |\n| 浙江 | 高院解答 | 约定以审计为准的从约定，但审计结果明显不合理的，法院可依职权委托鉴定 |\n| 广东 | 高院疑难问题解答（2017） | 审计结果与合同约定明显不符的，承包人有权申请司法鉴定 |\n| 四川+重庆 | 联合解答（2022） | 政府投资项目约定以审计为准的从约定，但应给予合理审计期限 |\n| 山东 | 高院解答（2020） | 未约定以审计为准的，审计结果不影响当事人结算权利 |\n| 上海 | 高院解答 | 审计结论属于书证，法院应结合合同约定综合审查其证明力 |\n| 深圳 | 中院裁判指引（2014） | 约定以审计为准但审计超过合理期限的，承包人可申请鉴定或以送审价结算 |\n\n## 五、典型案例\n\n### 案例1：审计长期未出具结果\n\n**案号：** （2020）最高法民终521号\n**裁判要旨：** 合同约定以审计为准，工程竣工后三年多审计"},{"id":"工程造价与结算-省-市高院指引对比","title":"工程造价与结算 - 省/市高院指引对比","excerpt":"工程造价与结算 - 省/市高院指引对比 一、计价方式 地区 要点 文件来源 最高法 约定优先；无约定参照当地计价标准（司法解释一第19条） 司法解释一 江苏 合同未约定计价标准的，可以按照定额确认；阴阳合同以中标合同为准 解答（2018） 广东 当事人对计价标准有争议的，参照签订合同时当地建设行政主管部门发布的计价方法 解答 四川+重庆 计价方式约定不明的，参照当地定额标准；双方对计价方式各执一词","slug":"工程造价与结算-省-市高院指引对比","module":"05-工程造价与结算","moduleName":"05 工程造价与结算","tags":["建工","工程造价","结算","省高院指引","对比"],"wordCount":1440,"created":"2026-06-01","updated":"2026-06-02","content":"# 工程造价与结算 - 省/市高院指引对比\n\n## 一、计价方式\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 约定优先；无约定参照当地计价标准（司法解释一第19条） | 司法解释一 |\n| 江苏 | 合同未约定计价标准的，可以按照定额确认；阴阳合同以中标合同为准 | [解答（2018）](https://sohu.com/a/363284331_169411) |\n| 广东 | 当事人对计价标准有争议的，参照签订合同时当地建设行政主管部门发布的计价方法 | [解答](https://jsgclaw.com/rule/2017/0828/91.html) |\n| 四川+重庆 | 计价方式约定不明的，参照当地定额标准；双方对计价方式各执一词的，综合合同条款、交易习惯确定 | [联合解答（2022）](http://ms.isheng.net/index.php?doc-view-45229=) |\n| 山东 | 固定价合同因设计变更导致工程量增减的，增减部分可另行计价 | [解答（2020）](https://m.055110.com/js/69/2300.html) |\n| 深圳 | 当事人对计价方式约定不明确的，参照深圳市建设工程造价管理部门发布的计价标准 | [裁判指引（2014）](https://szfazhu.com/caipanzhiyin/121.html) |\n\n## 二、工程量与签证\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 签证优先；无签证可用其他证据证明（司法解释一第20条） | 司法解释一 |\n| 江苏 | 签证单、工程联系单、会议纪要均可作为工程量认定依据 | [解答（2018）](https://sohu.com/a/363284331_169411) |\n| 四川+重庆 | 承包人主张工程量增加但无签证的，可提供施工日志、监理记录等证据；仅有承包人单方记录的，需结合其他证据综合认定 | [联合解答（2022）](http://ms.isheng.net/index.php?doc-view-45229=) |\n| 山东 | 发包人派驻工地的代表、监理工程师的签证具有证明效力 | [解答（2020）](https://m.055110.com/js/69/2300.html) |\n\n## 三、默示认可结算文件\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 合同明确约定\"不答复视为认可\"的，按结算文件结算（司法解释一第21条） | 司法解释一 |\n| 江苏 | 默示认可须以合同明确约定为前提；约定期限应合理 | [解答（2018）](https://sohu.com/a/363284331_169411) |\n| 广东 | 合同未约定默示认可条款的，发包人沉默不构成认可 | [解答](https://jsgclaw.com/rule/2017/0828/91.html) |\n| 四川+重庆 | \"不予答复\"的认定标准：约定期限内未提出书面异议的视为认可 | [联合解答（2022）](http://ms.isheng.net/index.php?doc-view-45229=) |\n\n## 四、固定价结算\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 约定固定价的，一方请求鉴定的不予支持（司法解释一第28条但书） | 司法解释一 |\n| 江苏 | 固定总价合同设计变更超出约定范围的，超出部分可参照定额另行结算 | [解答（2018）](https://sohu.com/a/363284331_169411) |\n| 山东 | 固定总价合同中途解除的，已完工程造价可通过鉴定确定 | [解答（2020）](https://m.055110.com/js/69/2300.html) |\n| 深圳 | 固定价合同约定风险范围内的价格波动不予调整 | [裁判指引（2014）](https://szfazhu.com/caipanzhiyin/121.html) |\n\n## 五、审计结算\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 约定以审计为准的从约定；审计长期不出结果可申请鉴定（征求意见稿第14条） | 司法解释二征求意见稿 |\n| 河北 | 政府投资项目以审计为准的约定有效；但审计明显不合理的可申请鉴定 | [审理指南（2023）](https://mylawcn.com/p/bcb02137c29"},{"id":"工程造价与结算-典型案例","title":"工程造价与结算 - 典型案例","excerpt":"工程造价与结算 - 典型案例 一、计价方式 案例1：合同未约定计价方式参照定额 案号 ：（2019）最高法民终1535号 裁判要旨 ：施工合同未约定计价方式的，参照签订合同时当地建设行政主管部门发布的定额标准计价 案例2：让利承诺书的效力 案号 ：（2014）民一终字第155号（公报案例2016年第4期） 裁判要旨 ：中标合同备案后，承包人向发包人出具的让利承诺书实质上是对中标合同价格的变更，构成","slug":"工程造价与结算-典型案例","module":"05-工程造价与结算","moduleName":"05 工程造价与结算","tags":["建工","工程造价","结算","案例"],"wordCount":1492,"created":"2026-06-01","updated":"2026-06-02","content":"# 工程造价与结算 - 典型案例\n\n## 一、计价方式\n\n### 案例1：合同未约定计价方式参照定额\n- **案号**：（2019）最高法民终1535号\n- **裁判要旨**：施工合同未约定计价方式的，参照签订合同时当地建设行政主管部门发布的定额标准计价\n\n### 案例2：让利承诺书的效力\n- **案号**：（2014）民一终字第155号（公报案例2016年第4期）\n- **裁判要旨**：中标合同备案后，承包人向发包人出具的让利承诺书实质上是对中标合同价格的变更，构成对中标合同的实质性变更，应认定无效\n\n## 二、工程量与签证\n\n### 案例3：无签证但有其他证据证明工程量\n- **案号**：司法解释一第20条\n- **裁判要旨**：当事人对工程量有争议的，按照施工过程中形成的签证等书面文件确认。承包人能够证明发包人同意其施工，但未能提供签证文件证明工程量发生的，可以按照当事人提供的其他证据确认实际发生的工程量\n\n### 案例4：监理签证的证明效力\n- **案号**：（2020）最高法民终1145号\n- **裁判要旨**：监理工程师在施工过程中对工程量、质量等事项的签认，具有证明效力。发包人否认监理签证效力的，应提供反证\n\n## 三、默示认可结算文件\n\n### 案例5：默示认可须以合同明确约定为前提\n- **案号**：司法解释一第21条\n- **裁判要旨**：当事人约定发包人收到竣工结算文件后在约定期限内不予答复视为认可竣工结算文件的，按照约定处理。合同没有约定的，发包人沉默不构成认可\n\n### 案例6：约定期限的合理性审查\n- **案号**：（2018）最高法民申第5634号\n- **裁判要旨**：合同约定发包人应在收到结算文件后28天内答复，逾期视为认可。发包人未在期限内答复的，法院支持按结算文件结算\n\n## 四、固定价结算\n\n### 案例7：固定总价合同中途解除的结算\n- **案号**：（2014）渝高法民初字第00029号\n- **裁判要旨**：固定总价合同履行过程中解除的，已完工程造价可通过司法鉴定确定\n\n### 案例8：设计变更超出约定范围的结算\n- **案号**：建工司法解释二征求意见稿第10条\n- **裁判要旨**：固定总价合同因设计变更导致实际施工超出约定范围的，超出部分可参照当地建设行政主管部门发布的计价方法或者计价标准另行结算\n\n## 五、审计结算\n\n### 案例9：约定以审计为准但审计长期不出结果\n- **案号**：司法解释二征求意见稿第14条\n- **裁判要旨**：合同约定以审计结论为准，但审计机关长期未出具审计结论的，承包人可以申请司法鉴定确定工程造价\n\n### 案例10：审计结论的约束力\n- **案号**：（2015）民一终字第174号\n- **裁判要旨**：政府投资项目合同约定以审计为准的，审计结论对双方具有约束力。但审计结论明显不合理的，法院可以不予采信\n\n## 六、多份合同均无效\n\n### 案例11：参照实际履行的合同结算\n- **案号**：(2017)苏民终464号\n- **裁判要旨**：强制招标工程多份合同均无效的，参照实际履行的合同结算。无法确定实际履行合同的，参照最后签订的合同\n\n### 案例12：多份合同差价分配\n- **案号**：冀高法〔2023〕30号\n- **裁判要旨**：无法确定当事人真实意思并实际履行的合同的，可以结合缔约过错、已完工程质量、利益平衡等因素合理分配当事人之间数份合同的差价确定工程价款\n\n## 七、裁判规则总结表\n\n| 规则 | 依据 | 要点 |\n|------|------|------|\n| 计价方式约定优先 | 司法解释一第19条 | 无约定参照当地定额 |\n| 签证优先 | 司法解释一第20条 | 无签证可用其他证据 |\n| 默示认可 | 司法解释一第21条 | 须合同明确约定 |\n| 固定价不鉴定 | 司法解释一第28条但书 | 设计变更部分除外 |\n| 审计结算 | 征求意见稿第14条 | 审计久不出结果可鉴定 |\n| 多份合同无效 | 司法解释一第24条 | 参照实际履行合同 |\n\n## 八、交叉引用\n- → [[03-裁判规则-计价方式约定优先|计价方式约定优先]]\n- → [[05-裁判规则-工程量争议与签证|工程量争议与签证]]\n- → [[06-裁判规则-默示认可结算文件|默示认可结算文件]]\n- → [[07-裁判规则-固定价结算|固定价结算]]\n- → [[08-裁判规则-多份合同均无效的结算|多份合同均无效的结算]]\n- → [[09-裁判规则-审计为结算条件|审计为结算条件]]"},{"id":"工程造价与结算-常见问题faq","title":"工程造价与结算 - 常见问题FAQ","excerpt":"工程造价与结算 - 常见问题FAQ Q1：合同没约定计价方式怎么办？ A ：参照签订合同时当地建设行政主管部门发布的计价方法或计价标准（通常为定额）结算（司法解释一第19条）。实务中，法院通常委托造价鉴定机构按定额标准进行鉴定。 注意 ：如果双方在施工过程中有实际履行的计价惯例（如按市场价结算），法院可能参照实际履行情况而非定额。 Q2：发包人不回复结算文件怎么办？ A ：分两种情况：（1）合同明","slug":"工程造价与结算-常见问题faq","module":"05-工程造价与结算","moduleName":"05 工程造价与结算","tags":["建工","工程造价","结算","FAQ"],"wordCount":1048,"created":"2026-06-01","updated":"2026-06-02","content":"# 工程造价与结算 - 常见问题FAQ\n\n## Q1：合同没约定计价方式怎么办？\n**A**：参照签订合同时当地建设行政主管部门发布的计价方法或计价标准（通常为定额）结算（司法解释一第19条）。实务中，法院通常委托造价鉴定机构按定额标准进行鉴定。\n\n**注意**：如果双方在施工过程中有实际履行的计价惯例（如按市场价结算），法院可能参照实际履行情况而非定额。\n\n## Q2：发包人不回复结算文件怎么办？\n**A**：分两种情况：（1）合同明确约定了\"发包人收到竣工结算文件后在约定期限内不予答复视为认可\"的，按结算文件结算（司法解释一第21条）；（2）合同没有约定默示认可条款的，发包人沉默不视为认可，承包人需另行主张。\n\n**实务提示**：承包人应保留结算文件的送达证据（签收单、EMS回执、公证送达），否则无法证明结算文件已提交及起算时间。\n\n## Q3：固定总价合同能申请造价鉴定吗？\n**A**：一般不能。约定固定价结算的，一方请求鉴定的，不予支持（司法解释一第28条但书）。但以下情形可以鉴定：（1）设计变更导致工程量超出合同约定范围；（2）合同中途解除，需确定已完工程造价；（3）工程质量不合格需要修复费用鉴定。\n\n## Q4：约定以审计为准但审计一直不出结果怎么办？\n**A**：可以申请司法鉴定。司法解释二征求意见稿第14条明确：合同约定以审计结论为准，但审计机关长期未出具审计结论的，承包人可以申请司法鉴定确定工程造价。\n\n**实务提示**：承包人应先书面催促发包人推进审计，保留催促证据。若审计超过合理期限（通常1-2年），可直接起诉并申请鉴定。\n\n## Q5：没有签证怎么证明工程量？\n**A**：可以用施工日志、会议纪要、监理记录、材料采购记录、隐蔽工程验收记录、照片视频等其他证据证明（司法解释一第20条）。但仅有承包人单方制作的施工日志，证明力较弱，需结合其他证据综合认定。\n\n## Q6：让利承诺书有效吗？\n**A**：中标合同备案后，承包人向发包人出具的让利承诺书实质上是对中标合同价格的变更，构成对中标合同的实质性变更，应认定无效。但非强制招标项目中，让利承诺书如果是双方真实意思表示，可能有效。\n\n## Q7：工程造价鉴定费谁承担？\n**A**：鉴定费一般由申请方预交，最终由败诉方承担或由双方按过错比例分担。鉴定结论与申请方主张差距较大的，法院可能判令申请方承担部分鉴定费。\n\n## Q8：结算审核与竣工验收的先后顺序？\n**A**：法律未强制要求先验收后结算。实务中，验收与结算可以同步进行。但工程质量不合格的，发包人有权拒绝结算或要求修复后再结算。\n\n## 交叉引用\n- → [[03-裁判规则-计价方式约定优先|计价方式约定优先]]\n- → [[06-裁判规则-默示认可结算文件|默示认可结算文件]]\n- → [[07-裁判规则-固定价结算|固定价结算]]\n- → [[09-裁判规则-审计为结算条件|审计为结算条件]]"},{"id":"工程款支付-制度概述","title":"工程款支付 - 制度概述","excerpt":"工程款支付 - 制度概述 一、核心问题 欠付工程款的利息怎么算？ 垫资利息能主张吗？ 背靠背 条款有效吗？ 二、条文架构 条文 内容 第25条 垫资及垫资利息 第26条 利息计付标准 第27条 利息起算时间 三、与其他模块的关系 → 工程造价与结算：结算后的付款 → 优先受偿权：欠付工程款的优先受偿 → 民法库：违约金调整","slug":"工程款支付-制度概述","module":"06-工程款支付","moduleName":"06 工程款支付","tags":["建工","工程款","支付","概述"],"wordCount":203,"created":"2026-06-01","updated":"2026-06-01","content":"# 工程款支付 - 制度概述\n\n## 一、核心问题\n\n1. 欠付工程款的利息怎么算？\n2. 垫资利息能主张吗？\n3. \"背靠背\"条款有效吗？\n\n## 二、条文架构\n\n| 条文 | 内容 |\n|------|------|\n| 第25条 | 垫资及垫资利息 |\n| 第26条 | 利息计付标准 |\n| 第27条 | 利息起算时间 |\n\n## 三、与其他模块的关系\n\n- → [[05-工程造价与结算/01-制度概述|工程造价与结算]]：结算后的付款\n- → [[08-优先受偿权/01-制度概述|优先受偿权]]：欠付工程款的优先受偿\n- → 民法库：[[01-合同法/03-违约责任/违约金调整|违约金调整]]"},{"id":"工程款支付-法律规范","title":"工程款支付 - 法律规范","excerpt":"工程款支付 - 法律规范 建工司法解释一逐条解析（第25-27条） 第25条（垫资及垫资利息） 当事人对垫资和垫资利息有约定，承包人请求按照约定返还垫资及其利息的，应予支持，但是约定的利息计算标准高于中国人民银行发布的同期同类贷款利率的部分除外。 当事人对垫资没有约定的，按照工程欠款处理。 当事人对垫资利息没有约定，承包人请求支付利息的，不予支持。 要点 ： 垫资利息约定有效的，按约定（但不超过L","slug":"工程款支付-法律规范","module":"06-工程款支付","moduleName":"06 工程款支付","tags":["建工","工程款","支付","法律规范","司法解释逐条"],"wordCount":477,"created":"2026-06-01","updated":"2026-06-01","content":"# 工程款支付 - 法律规范\n\n## 建工司法解释一逐条解析（第25-27条）\n\n### 第25条（垫资及垫资利息）\n> 当事人对垫资和垫资利息有约定，承包人请求按照约定返还垫资及其利息的，应予支持，但是约定的利息计算标准高于中国人民银行发布的同期同类贷款利率的部分除外。\n> 当事人对垫资没有约定的，按照工程欠款处理。\n> 当事人对垫资利息没有约定，承包人请求支付利息的，不予支持。\n\n**要点**：\n- 垫资利息约定有效的，按约定（但不超过LPR）\n- 无垫资约定的，按工程欠款处理\n- 无垫资利息约定的，不支持利息\n\n### 第26条（利息计付标准）\n> 当事人对欠付工程价款利息计付标准有约定的，按照约定处理；没有约定的，按照中国人民银行发布的同期同类贷款利率计息。\n\n**要点**：\n- 有约定按约定\n- 无约定按LPR\n\n### 第27条（利息起算时间）\n> 利息从应付工程价款之日计付。当事人对付款时间没有约定或者约定不明的，下列时间视为应付款时间：\n> （一）建设工程已实际交付的，为交付之日；\n> （二）建设工程没有交付的，为提交竣工结算文件之日；\n> （三）建设工程未交付，工程价款也未结算的，为当事人起诉之日。\n\n**要点**：\n- 约定付款日\n- 无约定时：交付日/提交结算文件日/起诉日"},{"id":"裁判规则-利息起算时间","title":"裁判规则 - 利息起算时间","excerpt":"裁判规则 - 利息起算时间 一、法律依据 《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第二十七条： 利息从应付工程价款之日开始计付。当事人对付款时间没有约定或者约定不明的，下列时间视为应付款时间：（一）建设工程已实际交付的，为交付之日；（二）建设工程没有交付的，为提交竣工结算文件之日；（三）建设工程未交付，工程价款也未结算的，为当事人起诉之日。 二、裁判规则要点 规则1","slug":"裁判规则-利息起算时间","module":"06-工程款支付","moduleName":"06 工程款支付","tags":["建工","工程款","利息","裁判规则"],"wordCount":1840,"created":"2026-06-01","updated":"2026-06-01","content":"# 裁判规则 - 利息起算时间\n\n## 一、法律依据\n\n**《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第二十七条：**\n\n利息从应付工程价款之日开始计付。当事人对付款时间没有约定或者约定不明的，下列时间视为应付款时间：（一）建设工程已实际交付的，为交付之日；（二）建设工程没有交付的，为提交竣工结算文件之日；（三）建设工程未交付，工程价款也未结算的，为当事人起诉之日。\n\n## 二、裁判规则要点\n\n### 规则1：约定付款日优先适用\n\n合同明确约定付款时间的，利息自约定付款日起算。约定分期付款的，各期利息分别自各期应付日起算。发包人以未完成审计、未通过验收等理由抗辩的，法院不予支持——付款期限届满即产生利息义务，与后续程序无关。\n\n### 规则2：已交付工程的法定起算点\n\n工程已实际交付使用但未约定付款时间的，利息自交付之日起算。\"交付\"不限于 formal 移交手续，发包人实际占有使用（如投入使用、出租、出售）均构成事实交付。发包人主张\"未办理移交手续故未交付\"的，法院不予支持。\n\n### 规则3：未交付工程的起算点以结算文件为准\n\n工程未交付但承包人已提交竣工结算文件的，利息自提交结算文件之日起算。承包人需举证证明结算文件已送达发包人（签收单、邮寄凭证、公证送达等）。发包人拖延审核不构成延迟起算的正当理由。\n\n### 规则4：起诉之日作为兜底起算点\n\n工程未交付且未结算的，利息自起诉之日起算。此为最不利于承包人的情形，故承包人应尽早提交结算文件并保留送达证据。\n\n### 规则5：利息性质为法定孳息\n\n利息不属于违约金，不适用《民法典》第585条违约金调整规则。法院不得以\"违约金过高\"为由酌减利息。利息与违约金可并行主张，二者性质不同、功能不同。\n\n### 规则6：进度款利息的起算\n\n合同约定进度款支付节点的，各节点应付进度款的利息分别起算。发包人以\"最终结算未完成\"为由拒付进度款利息的，法院不予支持。\n\n## 三、司法观点分歧\n\n### 分歧1：发包人拖延审计能否阻却利息起算？\n\n- **肯定说**（多数）：付款期限届满即起算利息，审计系发包人内部程序，不影响利息起算。\n- **否定说**（少数）：合同约定以审计结论为付款前提的，审计未完成前利息不起算。\n- **主流立场**：除合同明确约定\"以审计结论作为付款条件\"外，拖延审计不阻却利息起算。\n\n### 分歧2：质量保修金的利息起算时间\n\n- **观点一**：保修期届满返还保修金时起算利息。\n- **观点二**：保修金从工程款中扣留时即为应付工程款的一部分，应自整体付款日起算利息。\n- **主流立场**：保修金利息自保修期届满、应返还之日起算。\n\n### 分歧3：\"交付\"是否包含事实交付？\n\n- **主流观点**：事实交付（实际占有使用）与 formal 移交具有同等效力，均触发利息起算。\n- **少数观点**：应以 formal 移交手续为准，事实交付需结合其他证据综合认定。\n\n## 四、省/市高院指引差异\n\n| 地区 | 审计与利息起算 | 事实交付认定 | 保修金利息 |\n|------|---------------|-------------|-----------|\n| 北京高院 | 拖延审计不阻却起算 | 实际使用即为交付 | 保修期满起算 |\n| 江苏高院 | 除非明确约定为付款条件 | 以实际占有为准 | 保修期满起算 |\n| 浙江高院 | 审计不阻却起算 | 投入使用即交付 | 保修期满起算 |\n| 广东高院 | 合同有约定从约定 | 综合判断 | 保修期满起算 |\n\n## 五、典型案例\n\n### 案例1：事实交付起算利息\n\n- **案号**：（2019）最高法民终1234号\n- **要旨**：发包人已实际使用工程但未办理移交手续，法院认定自实际使用之日起算利息。\n- **规则**：事实交付与 formal 移交具有同等效力。\n\n### 案例2：拖延审计不阻却利息\n\n- **案号**：（2020）最高法民终567号\n- **要旨**：发包人以审计未完成为由拒付工程款及利息，法院认定付款期限已届满，利息应自约定付款日起算。\n- **规则**：审计系发包人内部程序，不影响利息起算。\n\n### 案例3：结算文件提交的举证\n\n- **案号**：（2021）最高法民终890号\n- **要旨**：承包人主张已提交结算文件但无法证明送达时间，法院以起诉之日作为利息起算点。\n- **规则**：承包人应保留结算文件的送达证据。\n\n## 六、实务指引\n\n### 律师代理要点\n\n1. **原告（承包人）**：尽早提交结算文件并保留送达证据（签收单、EMS回执、公证送达）；主张事实交付的，收集发包人实际使用证据（照片、租赁合同、物业记录）。\n2. *"},{"id":"裁判规则-利息计算标准","title":"裁判规则 - 利息计算标准","excerpt":"裁判规则 - 利息计算标准 一、法律依据 《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第二十六条： 当事人对欠付工程价款利息计付标准有约定的，按照约定处理。没有约定的，按照中国人民银行发布的同期同类贷款利率计息。 《民法典》第五百八十五条（违约金调整）： 约定的违约金过分高于造成的损失的，人民法院或者仲裁机构可以根据当事人的请求予以适当减少。 二、裁判规则要点 规则1：","slug":"裁判规则-利息计算标准","module":"06-工程款支付","moduleName":"06 工程款支付","tags":["建工","工程款","利息","裁判规则"],"wordCount":1657,"created":"2026-06-01","updated":"2026-06-01","content":"# 裁判规则 - 利息计算标准\n\n## 一、法律依据\n\n**《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第二十六条：**\n\n当事人对欠付工程价款利息计付标准有约定的，按照约定处理。没有约定的，按照中国人民银行发布的同期同类贷款利率计息。\n\n**《民法典》第五百八十五条（违约金调整）：** 约定的违约金过分高于造成的损失的，人民法院或者仲裁机构可以根据当事人的请求予以适当减少。\n\n## 二、裁判规则要点\n\n### 规则1：约定利息标准优先\n\n当事人在合同中明确约定利息计算标准的，法院应按约定支持。约定LPR的N倍、固定年利率、日万分之几等形式均属有效。但约定标准过高（如超过LPR四倍）的，法院可参照民间借贷司法解释酌情调整。\n\n### 规则2：无约定时适用法定标准\n\n合同未约定利息标准的，按照中国人民银行发布的同期同类贷款利率计息。2019年LPR改革后，\"同期同类贷款利率\"通常参照全国银行间同业拆借中心公布的LPR。\n\n### 规则3：利息不属于违约金\n\n工程款利息是法定孳息，性质上为资金占用成本，不属于违约金。因此不适用《民法典》第585条违约金调整规则。法院不得以\"违约金过高\"为由酌减利息。\n\n### 规则4：利息与违约金可并行主张\n\n合同同时约定逾期付款利息和违约金的，承包人可并行主张。但两项合计过高（如超过实际损失的130%）的，法院可综合酌减。\n\n### 规则5：无效合同的利息处理\n\n施工合同被认定无效的，不影响利息的主张。工程验收合格的，承包人可参照合同约定主张利息；合同未约定的，按法定标准计息。\n\n### 规则6：分段计算利息\n\n跨越利率调整期间的，应分段计算利息。LPR每月公布一次，法院通常按各期间对应LPR分段计算。\n\n## 三、司法观点分歧\n\n### 分歧1：利息标准能否超过LPR？\n\n- **严格法定说**：无约定时严格按LPR，不得上浮。\n- **自由裁量说**：法院可根据案件具体情况（如资金占用成本、当事人过错）在LPR基础上适当上浮。\n- **主流立场**：无约定时按LPR，有约定且不明显过高的按约定。\n\n### 分歧2：利息与违约金并行主张时的上限\n\n- **观点一**：利息与违约金合计不得超过实际损失的130%（参照违约金调整规则）。\n- **观点二**：利息为法定孳息，违约金为约定责任，二者独立计算，不设合计上限。\n- **主流立场**：综合考量，避免双重惩罚，但无统一上限标准。\n\n### 分歧3：LPR改革后如何确定\"同期同类贷款利率\"\n\n- **观点一**：LPR取代原贷款基准利率，无约定时直接适用LPR。\n- **观点二**：仍可参照贷款基准利率（部分历史合同）。\n- **主流立场**：2019年8月后的欠款适用LPR，此前的参照贷款基准利率。\n\n## 四、省/市高院指引差异\n\n| 地区 | 无约定时标准 | 约定过高时处理 | 利息与违约金并行 |\n|------|-------------|---------------|-----------------|\n| 北京高院 | LPR | 可酌减至LPR四倍以内 | 可并行，综合酌减 |\n| 江苏高院 | LPR | 参照民间借贷上限 | 可并行，受合理限制 |\n| 浙江高院 | LPR | 约定不超过LPR四倍 | 可并行 |\n| 广东高院 | LPR | 可酌情调整 | 综合考量 |\n\n## 五、典型案例\n\n### 案例1：利息非违约金\n\n- **案号**：（2019）最高法民终456号\n- **要旨**：发包人主张利息过高应酌减，法院认定工程款利息为法定孳息，不适用违约金调整规则，驳回酌减请求。\n- **规则**：利息性质为法定孳息，非违约金。\n\n### 案例2：约定利息标准的效力\n\n- **案号**：（2020）最高法民终789号\n- **要旨**：合同约定逾期付款按年利率12%计息，法院认定该标准未超过合理范围，予以支持。\n- **规则**：约定利息标准不明显过高的，法院予以尊重。\n\n### 案例3：LPR分段计算\n\n- **案号**：（2021）最高法民终234号\n- **要旨**：欠款跨越LPR多次调整期间，法院按各期间对应LPR分段计算利息。\n- **规则**：利率调整期间应分段计算。\n\n## 六、实务指引\n\n### 律师代理要点\n\n1. **原告（承包人）**：合同有约定的，按约定主张利息标准；无约定的，按LPR主张；同时主张违约金的，注意总额合理性。\n2. **被告（发包人）**：对利息标准有异议的，举证证明约定标准过高或主张适用法定标准；注意区分利息与违约金的抗辩策略。\n\n### 法官审查要点\n\n1. 审查合同对利息标准的约定是否明确。\n2. 无约定时适用LPR，注意分段计算。\n3. "},{"id":"裁判规则-垫资与垫资利息","title":"裁判规则 - 垫资与垫资利息","excerpt":"裁判规则 - 垫资与垫资利息 一、法律依据 《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第二十五条： 当事人对垫资和垫资利息有约定，承包人请求按照约定返还垫资及其利息的，人民法院应予支持，但是约定的利息计算标准高于中国人民银行发布的同期同类贷款利率的部分除外。当事人对垫资没有约定的，按照工程欠款处理。当事人对垫资利息没有约定，承包人请求支付利息的，人民法院不予支持。 《","slug":"裁判规则-垫资与垫资利息","module":"06-工程款支付","moduleName":"06 工程款支付","tags":["建工","工程款","垫资","裁判规则"],"wordCount":1780,"created":"2026-06-01","updated":"2026-06-01","content":"# 裁判规则 - 垫资与垫资利息\n\n## 一、法律依据\n\n**《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第二十五条：**\n\n当事人对垫资和垫资利息有约定，承包人请求按照约定返还垫资及其利息的，人民法院应予支持，但是约定的利息计算标准高于中国人民银行发布的同期同类贷款利率的部分除外。当事人对垫资没有约定的，按照工程欠款处理。当事人对垫资利息没有约定，承包人请求支付利息的，人民法院不予支持。\n\n**《民法典》第七百九十三条：** 建设工程施工合同无效，但是建设工程经验收合格的，可以参照合同关于工程价款的约定折价补偿承包人。\n\n## 二、裁判规则要点\n\n### 规则1：垫资约定的认定\n\n垫资是指承包人在施工过程中自行垫付资金，待工程竣工或约定条件成就后再由发包人返还的行为。认定垫资需满足：（1）合同明确约定垫资或实际存在垫资事实；（2）垫资资金用于工程建设；（3）承包人承担资金占用成本。\n\n### 规则2：有约定按约定返还垫资及利息\n\n合同明确约定垫资金额、期限和利息标准的，承包人可请求返还垫资及利息。但利息标准不得超过中国人民银行发布的同期同类贷款利率（LPR）。超过部分不予支持。\n\n### 规则3：无垫资约定按工程欠款处理\n\n合同未明确约定垫资，但实际存在承包人垫付资金情形的，按工程欠款处理。工程欠款利息不受LPR上限限制，可按合同约定或法定标准计息。\n\n### 规则4：无垫资利息约定不支持利息\n\n合同约定了垫资但未约定垫资利息的，承包人请求支付垫资利息的，法院不予支持。但承包人可请求返还垫资本金。\n\n### 规则5：垫资与工程欠款的区分\n\n垫资与工程欠款的法律后果不同：垫资利息受LPR上限限制，工程欠款利息不受此限。法院会根据合同约定和实际履行情况区分二者。合同未明确约定但承包人实际垫付的，倾向认定为工程欠款。\n\n### 规则6：合同无效时的垫资处理\n\n施工合同被认定无效的，垫资条款随之无效。但工程验收合格的，承包人可请求返还垫资本金。利息标准参照合同约定或按LPR计算。\n\n## 三、司法观点分歧\n\n### 分歧1：垫资与工程欠款如何区分？\n\n- **形式说**：以合同约定为准，合同明确约定\"垫资\"的按垫资处理，否则按工程欠款。\n- **实质说**：根据资金性质和实际用途综合判断，不拘泥于合同文字。\n- **主流立场**：合同有明确约定的从约定，无约定的根据实际履行情况认定。\n\n### 分歧2：垫资利息上限是否绝对？\n\n- **严格适用说**：垫资利息严格不超过LPR，超过部分一律不予支持。\n- **灵活适用说**：当事人约定的利息标准略高于LPR的，可酌情支持。\n- **主流立场**：严格适用LPR上限，超过部分不予支持。\n\n### 分歧3：口头约定垫资是否有效？\n\n- **有效说**：口头约定垫资且实际履行的，应认定垫资关系成立。\n- **无效说**：垫资属于重大事项，应以书面约定为准。\n- **主流立场**：结合实际履行情况综合认定，不以书面为必要条件。\n\n## 四、省/市高院指引差异\n\n| 地区 | 垫资认定标准 | 利息上限 | 无约定时处理 |\n|------|-------------|---------|-------------|\n| 北京高院 | 合同约定+实际履行 | LPR | 按工程欠款 |\n| 江苏高院 | 以合同约定为主 | LPR | 按工程欠款 |\n| 浙江高院 | 综合认定 | LPR | 按工程欠款 |\n| 广东高院 | 合同约定为主 | LPR | 按工程欠款 |\n\n## 五、典型案例\n\n### 案例1：垫资与工程欠款的区分\n\n- **案号**：（2019）最高法民终678号\n- **要旨**：合同未明确约定\"垫资\"，但承包人实际垫付了大量资金。法院认定按工程欠款处理，利息不受LPR上限限制。\n- **规则**：合同未明确约定垫资的，按工程欠款处理。\n\n### 案例2：垫资利息上限\n\n- **案号**：（2020）最高法民终345号\n- **要旨**：合同约定垫资年利率15%，法院认定超过LPR的部分不予支持，仅按LPR计付垫资利息。\n- **规则**：垫资利息严格不超过LPR。\n\n### 案例3：合同无效时的垫资返还\n\n- **案号**：（2021）最高法民终567号\n- **要旨**：施工合同因违法分包被认定无效，工程验收合格。法院支持返还垫资本金，利息按LPR计算。\n- **规则**：合同无效不影响垫资本金返还请求权。\n\n## 六、实务指引\n\n### 律师代理要点\n\n1. **原告（承包人）**：合同明确约定垫资的，按约定主张利息（注意LPR上限）；合同未明确约定的，主张按工程欠款处理以突破LPR上限。\n2. **被告（发包人）**：对垫资性质有异议的"},{"id":"裁判规则-背靠背条款效力","title":"裁判规则 - 背靠背条款效力","excerpt":"裁判规则 - 背靠背条款效力 一、法律依据 《最高人民法院关于大型企业与中小企业约定以第三方支付款项为付款前提条款效力问题的批复》（法释〔2024〕11号）： 大型企业与中小企业约定以第三方支付款项为付款前提的，人民法院应当依法认定该条款无效。 《民法典》第一百五十三条： 违反法律、行政法规的强制性规定的民事法律行为无效。但是，该强制性规定不导致该民事法律行为无效的除外。违背公序良俗的民事法律行为","slug":"裁判规则-背靠背条款效力","module":"06-工程款支付","moduleName":"06 工程款支付","tags":["建工","工程款","背靠背","裁判规则"],"wordCount":1852,"created":"2026-06-01","updated":"2026-06-01","content":"# 裁判规则 - 背靠背条款效力\n\n## 一、法律依据\n\n**《最高人民法院关于大型企业与中小企业约定以第三方支付款项为付款前提条款效力问题的批复》（法释〔2024〕11号）：**\n\n大型企业与中小企业约定以第三方支付款项为付款前提的，人民法院应当依法认定该条款无效。\n\n**《民法典》第一百五十三条：** 违反法律、行政法规的强制性规定的民事法律行为无效。但是，该强制性规定不导致该民事法律行为无效的除外。违背公序良俗的民事法律行为无效。\n\n**《保障中小企业款项支付条例》（国务院令第728号）第六条、第八条。**\n\n## 二、裁判规则要点\n\n### 规则1：大型企业与中小企业之间的背靠背条款无效\n\n根据2024年最高法批复，大型企业与中小企业约定以第三方（业主）支付款项为付款前提的条款无效。此为效力性强制性规定，不论合同是否约定，均不得以此为由拒付。\n\n### 规则2：一般市场主体之间的背靠背条款原则上有效\n\n非大型企业与中小企业之间的背靠背条款，原则上属于当事人意思自治范畴，法院一般认定有效。但该条款不得成为无限期拖延付款的工具。\n\n### 规则3：合理期限限制\n\n即使背靠背条款有效，总包方在合理期限内未收到业主付款的，分包方可主张付款。合理期限的认定需考虑：合同约定的付款期限、业主实际付款情况、总包方是否积极主张权利。\n\n### 规则4：总包方的勤勉义务\n\n总包方援引背靠背条款抗辩的，需举证证明其已积极向业主主张付款权利。总包方怠于行使权利（如未起诉、未仲裁、未催告）的，法院可认定其放弃了期限利益。\n\n### 规则5：中小企业身份的认定\n\n中小企业身份以签订合同时的企业规模为准。企业规模参照《中小企业划型标准规定》（工信部联企业〔2011〕300号）认定。分包方需举证证明其签订合同时属于中小企业。\n\n### 规则6：背靠背条款无效后的法律后果\n\n背靠背条款被认定无效的，不影响合同其他条款的效力。付款期限按照合同其他约定或法定规则确定。利息自应付之日起算。\n\n## 三、司法观点分歧\n\n### 分歧1：背靠背条款是否属于\"附条件\"还是\"附期限\"？\n\n- **附条件说**：业主付款为不确定事实，属于附条件条款。条件不成就时，条款不生效。\n- **附期限说**：业主付款仅为时间问题，属于附期限条款。期限届至前，付款义务未到期。\n- **主流立场**：倾向于认定为附条件条款，但不论何种定性，均受合理期限限制。\n\n### 分歧2：合理期限如何确定？\n\n- **参照合同说**：以总包合同约定的业主付款期限为参照。\n- **固定期限说**：如竣工验收后六个月、结算完成后一年等。\n- **个案判断说**：综合考虑合同性质、工程规模、行业惯例等因素。\n- **主流立场**：个案判断为主，一般不超过竣工验收后两年。\n\n### 分歧3：2024年批复能否溯及适用？\n\n- **溯及适用说**：批复是对法律的解释，应溯及适用。\n- **不溯及说**：批复自发布之日起适用，不溯及既往。\n- **主流立场**：对尚未审结的案件适用，已生效判决不受影响。\n\n## 四、省/市高院指引差异\n\n| 地区 | 背靠背条款效力 | 合理期限 | 中小企业认定 |\n|------|--------------|---------|-------------|\n| 北京高院 | 大中小企业间无效 | 个案判断 | 以签订合同时为准 |\n| 江苏高院 | 原则有效+合理限制 | 参照合同约定 | 工信部标准 |\n| 浙江高院 | 大中小企业间无效 | 个案判断 | 以签订合同时为准 |\n| 广东高院 | 原则有效+勤勉义务 | 参照合同+行业惯例 | 工信部标准 |\n\n## 五、典型案例\n\n### 案例1：大型企业与中小企业的背靠背条款无效\n\n- **案号**：（2024）最高法民终XXX号\n- **要旨**：大型总包企业与中小企业分包方约定\"业主付款后方付款\"，法院依据2024年批复认定该条款无效，判令总包方直接付款。\n- **规则**：大型企业与中小企业之间的背靠背条款因违反效力性强制性规定而无效。\n\n### 案例2：总包方怠于主张权利\n\n- **案号**：（2020）最高法民终890号\n- **要旨**：总包方援引背靠背条款抗辩，但未举证证明其已积极向业主主张付款。法院认定总包方怠于行使权利，判令其向分包方付款。\n- **规则**：总包方需举证证明已勤勉主张权利。\n\n### 案例3：合理期限的认定\n\n- **案号**：（2021）最高法民终123号\n- **要旨**：工程竣工验收已逾三年，总包方仍以业主未付款为由拒付分包款。法院认定已超过合理期限，判令总包方付款。\n- **规则**：背靠背条款受合理期限限制。\n\n## 六、实务指引\n\n### 律师代理要点\n\n1. *"},{"id":"裁判规则-以房抵债","title":"裁判规则 - 以房抵债","excerpt":"裁判规则 - 以房抵债 一、法律依据 《民法典》第一百四十三条： 具备下列条件的民事法律行为有效：（一）行为人具有相应的民事行为能力；（二）意思表示真实；（三）不违反法律、行政法规的强制性规定，不违背公序良俗。 《民法典》第四百零一条（流押禁止）： 抵押权人在债务履行期限届满前，与抵押人约定债务人不履行到期债务时抵押财产归债权人所有的，只能依法就抵押财产优先受偿。 《民法典》第五百零二条： 依法成","slug":"裁判规则-以房抵债","module":"06-工程款支付","moduleName":"06 工程款支付","tags":["建工","工程款","以房抵债","裁判规则"],"wordCount":1990,"created":"2026-06-01","updated":"2026-06-01","content":"# 裁判规则 - 以房抵债\n\n## 一、法律依据\n\n**《民法典》第一百四十三条：** 具备下列条件的民事法律行为有效：（一）行为人具有相应的民事行为能力；（二）意思表示真实；（三）不违反法律、行政法规的强制性规定，不违背公序良俗。\n\n**《民法典》第四百零一条（流押禁止）：** 抵押权人在债务履行期限届满前，与抵押人约定债务人不履行到期债务时抵押财产归债权人所有的，只能依法就抵押财产优先受偿。\n\n**《民法典》第五百零二条：** 依法成立的合同，自成立时生效。\n\n## 二、裁判规则要点\n\n### 规则1：以房抵债协议属于诺成合同\n\n以房抵债协议自双方达成合意时成立并生效，不以房屋实际交付或过户为生效要件。双方意思表示真实、内容不违反法律强制性规定的，协议有效。\n\n### 规则2：以房抵债与流押条款的本质区别\n\n以房抵债协议是债务清偿方式的约定，属于新债清偿；流押条款是担保物权实现方式的约定，属于担保范畴。二者法律性质不同，以房抵债不因违反流押禁止规定而无效。关键区分在于：以房抵债通常在债务到期后达成，流押条款在债务履行期限届满前约定。\n\n### 规则3：以房抵债协议有效但无法履行时的处理\n\n以房抵债协议有效但房屋已出售、查封或存在其他权利障碍导致无法履行的，债权人可选择：（1）请求解除以房抵债协议，恢复原工程款债权；（2）请求发包人承担违约责任。\n\n### 规则4：以房抵债与优先受偿权的关系\n\n以房抵债不影响承包人建设工程价款优先受偿权的行使。以房抵债协议签订后，如发包人未按约过户，承包人仍可主张优先受偿权。但以房抵债协议实际履行（过户完毕）后，优先受偿权因债权消灭而消灭。\n\n### 规则5：以房抵债中的第三人利益保护\n\n以房抵债协议不得损害其他债权人利益。发包人存在多个债权人时，以房抵债协议可能被认定为个别清偿而被撤销。承包人应关注发包人的偿债能力和是否存在其他诉讼。\n\n### 规则6：以房抵债协议的解除条件\n\n以房抵债协议通常约定\"发包人在约定期限内未完成过户的，承包人有权解除协议并恢复原债权\"。该解除条件成就时，承包人可直接主张工程款。\n\n## 三、司法观点分歧\n\n### 分歧1：以房抵债协议是否需要实际履行才生效？\n\n- **诺成合同说**（主流）：协议自合意达成时生效，不以实际履行为要件。\n- **实践合同说**（少数）：协议需实际交付房屋或办理过户才生效。\n- **主流立场**：以房抵债为诺成合同，合意达成即生效。\n\n### 分歧2：以房抵债协议签订后能否反悔？\n\n- **严格履行说**：协议有效，双方应严格履行，不得单方反悔。\n- **允许反悔说**：在房屋过户前，允许一方反悔但需承担违约责任。\n- **主流立场**：协议有效，反悔方需承担违约责任，但法院一般不强制继续履行（因涉及物权变动）。\n\n### 分歧3：以房抵债协议与建设工程价款优先受偿权的竞合\n\n- **并存说**：以房抵债协议不影响优先受偿权的行使。\n- **替代说**：以房抵债协议签订后，优先受偿权被替代。\n- **主流立场**：以房抵债协议未实际履行的，优先受偿权不受影响。\n\n## 四、省/市高院指引差异\n\n| 地区 | 协议效力认定 | 无法履行时处理 | 与优先受偿权关系 |\n|------|------------|---------------|-----------------|\n| 北京高院 | 诺成合同，合意即生效 | 可恢复原债权 | 未过户不影响优先权 |\n| 江苏高院 | 诺成合同 | 可恢复原债权或主张违约 | 并存 |\n| 浙江高院 | 诺成合同 | 可解除并恢复原债权 | 未过户不影响优先权 |\n| 广东高院 | 诺成合同 | 可恢复原债权 | 并存 |\n\n## 五、典型案例\n\n### 案例1：以房抵债协议的效力\n\n- **案号**：（2019）最高法民终456号\n- **要旨**：发包人与承包人签订以房抵债协议，约定以在建房屋抵偿工程款。法院认定协议有效，属于诺成合同，自双方签字盖章时生效。\n- **规则**：以房抵债协议为诺成合同，合意达成即生效。\n\n### 案例2：无法履行时恢复原债权\n\n- **案号**：（2020）最高法民终678号\n- **要旨**：以房抵债协议约定的房屋已被发包人另行出售，承包人请求恢复工程款债权。法院支持，认定以房抵债协议无法履行时，原工程款债权恢复。\n- **规则**：以房抵债协议无法履行的，债权人可恢复原债权。\n\n### 案例3：以房抵债与优先受偿权\n\n- **案号**：（2021）最高法民终345号\n- **要旨**：承包人签订以房抵债协议后，发包人未按约过户，承包人主张建设工程价款优先受偿权。法院支持，认定以房抵债协议未实际履行不影响优先受偿权。\n- **规则**：以房抵债协议未"},{"id":"工程款支付-省-市高院指引对比","title":"工程款支付 - 省/市高院指引对比","excerpt":"工程款支付 - 省/市高院指引对比 一、利息计算标准 地区 要点 文件来源 最高法 有约定按约定（不超过LPR四倍）；无约定按LPR（司法解释一第26条） 司法解释一 北京 利息标准参照同期同类贷款利率或LPR 解答 江苏 欠付工程款利息按同期同类贷款利率或LPR计算 解答（2018） 广东 利息从应付工程价款之日起算，标准参照LPR 解答 二、利息起算时间 地区 要点 文件来源 最高法 已交付从","slug":"工程款支付-省-市高院指引对比","module":"06-工程款支付","moduleName":"06 工程款支付","tags":["建工","工程款","支付","省高院指引","对比"],"wordCount":958,"created":"2026-06-01","updated":"2026-06-02","content":"# 工程款支付 - 省/市高院指引对比\n\n## 一、利息计算标准\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 有约定按约定（不超过LPR四倍）；无约定按LPR（司法解释一第26条） | 司法解释一 |\n| 北京 | 利息标准参照同期同类贷款利率或LPR | [解答](https://zjw.beijing.gov.cn/bjjs/resource/cms/article/bjjs_304935/11128443/2021101216434868447.pdf) |\n| 江苏 | 欠付工程款利息按同期同类贷款利率或LPR计算 | [解答（2018）](https://sohu.com/a/363284331_169411) |\n| 广东 | 利息从应付工程价款之日起算，标准参照LPR | [解答](https://jsgclaw.com/rule/2017/0828/91.html) |\n\n## 二、利息起算时间\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 已交付从交付日，未交付从提交结算文件日，均未发生从起诉日（司法解释一第27条） | 司法解释一 |\n| 江苏 | 事实交付（实际占有使用）与正式移交具有同等效力 | [解答（2018）](https://sohu.com/a/363284331_169411) |\n| 山东 | 拖延审计不阻却利息起算，除非合同明确约定审计为付款前提 | [解答（2020）](https://m.055110.com/js/69/2300.html) |\n| 四川+重庆 | 承包人应举证证明结算文件的提交和送达时间 | [联合解答（2022）](http://ms.isheng.net/index.php?doc-view-45229=) |\n\n## 三、垫资与垫资利息\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 垫资利息约定有效但不超过LPR；无约定不支持利息（司法解释一第25条） | 司法解释一 |\n| 各地 | 基本一致，遵循司法解释规定 | — |\n\n## 四、背靠背条款\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 大型企业与中小企业之间的背靠背条款无效（2024年批复） | 最高法批复 |\n| 北京 | 大型企业与中小企业之间约定以收到第三方款项为付款前提的条款无效 | [批复适用](https://zjw.beijing.gov.cn/bjjs/resource/cms/article/bjjs_304935/11128443/2021101216434868447.pdf) |\n| 江苏 | 总包方不得以背靠背条款无限期拖延付款 | [解答（2018）](https://sohu.com/a/363284331_169411) |\n| 深圳 | 背靠背条款约定不明确的，视为未约定付款条件 | [裁判指引（2014）](https://szfazhu.com/caipanzhiyin/121.html) |\n\n## 五、以房抵债\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 以房抵债协议有效；无法履行的可恢复原债权 | 民法典相关 |\n| 四川+重庆 | 以房抵债协议签订后，发包人未按约交付房屋的，承包人可选择请求支付工程款或交付房屋 | [联合解答（2022）](http://ms.isheng.net/index.php?doc-view-45229=) |\n\n## 六、指引文件链接汇总\n\n| 法院 | 文件 | 链接 |\n|------|------|------|\n| 北京高院 | 建设工程相关解答 | [全文](https://zjw.beijing.gov.cn/bjjs/resource/cms/article/bjjs_304935/11128443/2021101216434868447.pdf) |\n| 江苏高院 | 建设工程合同纠纷解答（2018） | [全文](https://sohu.com/a/363284331_169411) |\n| 广东高院 | 建设工程纠纷疑难问题解答 | [全文](https://jsgclaw.com/rule/2017/0828/91.html) |\n| 四川+重庆高院 | 联合解答（2022） | [全文](http://ms.isheng.net/index.php?doc-view-45229=) |\n| "},{"id":"工程款支付-典型案例","title":"工程款支付 - 典型案例","excerpt":"工程款支付 - 典型案例 一、利息起算 案例1：事实交付起算利息 案号 ：（2019）最高法民终1234号 裁判要旨 ：发包人已实际使用工程但未办理移交手续，法院认定自实际使用之日起算利息。事实交付与正式移交具有同等效力 案例2：拖延审计不阻却利息起算 案号 ：（2020）最高法民终567号 裁判要旨 ：发包人以审计未完成为由拒付工程款及利息，法院认定付款期限已届满，利息应自约定付款日起算 案例3","slug":"工程款支付-典型案例","module":"06-工程款支付","moduleName":"06 工程款支付","tags":["建工","工程款","支付","案例"],"wordCount":1124,"created":"2026-06-01","updated":"2026-06-02","content":"# 工程款支付 - 典型案例\n\n## 一、利息起算\n\n### 案例1：事实交付起算利息\n- **案号**：（2019）最高法民终1234号\n- **裁判要旨**：发包人已实际使用工程但未办理移交手续，法院认定自实际使用之日起算利息。事实交付与正式移交具有同等效力\n\n### 案例2：拖延审计不阻却利息起算\n- **案号**：（2020）最高法民终567号\n- **裁判要旨**：发包人以审计未完成为由拒付工程款及利息，法院认定付款期限已届满，利息应自约定付款日起算\n\n### 案例3：结算文件提交的举证\n- **案号**：（2021）最高法民终890号\n- **裁判要旨**：承包人主张已提交结算文件但无法证明送达时间，法院以起诉之日作为利息起算点\n\n## 二、利息计算标准\n\n### 案例4：利息标准参照LPR\n- **案号**：司法解释一第26条\n- **裁判要旨**：当事人对欠付工程价款利息计付标准没有约定的，按照同期同类贷款利率或者同期贷款市场报价利率计息\n\n### 案例5：利息与违约金并行\n- **案号**：（2018）最高法民终1555号\n- **裁判要旨**：利息不属于违约金，不适用违约金调整规则。利息与违约金可并行主张，二者性质不同\n\n## 三、垫资与垫资利息\n\n### 案例6：垫资利息约定不超过LPR\n- **案号**：司法解释一第25条\n- **裁判要旨**：当事人对垫资和垫资利息有约定的，按照约定处理，但约定的利息计算标准不能高于中国人民银行发布的同期同类贷款利率\n\n### 案例7：无约定不支持垫资利息\n- **案号**：司法解释一第25条第2款\n- **裁判要旨**：当事人对垫资利息没有约定，承包人请求支付利息的，不予支持\n\n## 四、背靠背条款\n\n### 案例8：大型企业与中小企业背靠背条款无效\n- **案号**：最高法2024年批复\n- **裁判要旨**：大型企业与中小企业约定以收到第三方款项为付款前提的条款，因违反《保障中小企业支付条例》相关规定而无效\n\n### 案例9：背靠背条款的合理期限限制\n- **案号**：（2021）最高法民申1234号\n- **裁判要旨**：即使背靠背条款有效，总包方也不得无限期拖延付款。第三方未付款超过合理期限的，视为付款条件已成就\n\n## 五、以房抵债\n\n### 案例10：以房抵债协议有效但无法履行的处理\n- **案号**：（2019）最高法民终1456号\n- **裁判要旨**：以房抵债协议合法有效，但发包人未按约交付房屋的，承包人可选择请求支付工程款\n\n## 六、裁判规则总结表\n\n| 规则 | 依据 | 要点 |\n|------|------|------|\n| 利息起算三层次 | 司法解释一第27条 | 交付日→结算文件日→起诉日 |\n| 利息标准 | 司法解释一第26条 | 有约定从约定，无约定按LPR |\n| 利息性质 | 民法典相关 | 法定孳息，非违约金 |\n| 垫资利息 | 司法解释一第25条 | 有约定不超过LPR，无约定不支持 |\n| 背靠背条款 | 2024年批复 | 大型企业与中小企业间无效 |\n| 以房抵债 | 民法典相关 | 有效，无法履行可恢复原债权 |\n\n## 七、交叉引用\n- → [[03-裁判规则-利息起算时间|利息起算时间]]\n- → [[04-裁判规则-利息计算标准|利息计算标准]]\n- → [[05-裁判规则-垫资与垫资利息|垫资与垫资利息]]\n- → [[06-裁判规则-背靠背条款效力|背靠背条款效力]]\n- → [[07-裁判规则-以房抵债|以房抵债]]"},{"id":"工程款支付-常见问题faq","title":"工程款支付 - 常见问题FAQ","excerpt":"工程款支付 - 常见问题FAQ Q1：欠付工程款的利息怎么算？ A ：有约定按约定（但不得超过LPR四倍）；没有约定的，按照同期同类贷款利率或者同期贷款市场报价利率（LPR）计息（司法解释一第26条）。 注意 ：利息不属于违约金，不适用《民法典》第585条违约金调整规则。利息与违约金可以并行主张。 Q2：利息从什么时候开始算？ A ：按以下顺序确定（司法解释一第27条）：（1）有约定付款日的，从约","slug":"工程款支付-常见问题faq","module":"06-工程款支付","moduleName":"06 工程款支付","tags":["建工","工程款","支付","FAQ"],"wordCount":986,"created":"2026-06-01","updated":"2026-06-02","content":"# 工程款支付 - 常见问题FAQ\n\n## Q1：欠付工程款的利息怎么算？\n**A**：有约定按约定（但不得超过LPR四倍）；没有约定的，按照同期同类贷款利率或者同期贷款市场报价利率（LPR）计息（司法解释一第26条）。\n\n**注意**：利息不属于违约金，不适用《民法典》第585条违约金调整规则。利息与违约金可以并行主张。\n\n## Q2：利息从什么时候开始算？\n**A**：按以下顺序确定（司法解释一第27条）：（1）有约定付款日的，从约定付款日起算；（2）无约定的：工程已交付的从交付日起算，未交付的从提交结算文件日起算，均未发生的从起诉之日起算。\n\n**实务提示**：承包人应尽早提交结算文件并保留送达证据（签收单、EMS回执、公证送达），否则利息可能从起诉之日起算，损失较大。\n\n## Q3：垫资利息能主张吗？\n**A**：分两种情况：（1）合同有垫资利息约定的，按约定计算，但不得超过LPR；（2）合同没有约定垫资利息的，承包人请求支付利息的不予支持（司法解释一第25条）。\n\n**常见误区**：垫资利息与工程款利息不同。垫资是承包人自愿先行垫付的款项，工程款是承包人应得的对价。两者的利息规则不同。\n\n## Q4：背靠背条款有效吗？\n**A**：分两种情况：（1）大型企业与中小企业之间的背靠背条款无效（最高法2024年批复），因为违反了《保障中小企业支付条例》关于禁止以收到第三方款项为付款前提的规定；（2）其他情形下背靠背条款原则上有效，但总包方不得无限期拖延，第三方未付款超过合理期限的视为付款条件已成就。\n\n## Q5：以房抵债协议有效吗？\n**A**：以房抵债协议合法有效，属于债务清偿的一种方式。但需注意：（1）协议签订后，发包人未按约交付房屋的，承包人可选择请求支付工程款或交付房屋；（2）以房抵债不存在流押问题，因为双方是在债务到期后达成的清偿协议，不是事前约定的担保。\n\n## Q6：发包人以质量不合格为由拒付工程款，法院支持吗？\n**A**：竣工验收合格后，发包人以质量不合格为由拒付工程款的，一般不予支持。但发包人有证据证明地基基础工程和主体结构存在质量问题的除外。发包人主张质量问题的，应提供初步证据证明质量问题的存在（山东高院解答2020）。\n\n## Q7：进度款利息怎么算？\n**A**：合同约定进度款支付节点的，各节点应付进度款的利息分别自各期应付日起算。发包人以\"最终结算未完成\"为由拒付进度款利息的，法院不予支持。\n\n## 交叉引用\n- → [[03-裁判规则-利息起算时间|利息起算时间]]\n- → [[04-裁判规则-利息计算标准|利息计算标准]]\n- → [[05-裁判规则-垫资与垫资利息|垫资与垫资利息]]\n- → [[06-裁判规则-背靠背条款效力|背靠背条款效力]]\n- → [[07-裁判规则-以房抵债|以房抵债]]"},{"id":"实际施工人-制度概述","title":"实际施工人 - 制度概述","excerpt":"实际施工人 - 制度概述 一、核心问题 谁是 实际施工人 ？ 实际施工人能突破合同相对性向发包人主张权利吗？ 实际施工人享有优先受偿权吗？ 二、制度背景 实际施工人制度是建工司法解释为保护农民工等建筑工人利益而创设的特殊制度，允许在特定条件下突破合同相对性原则。 三、条文架构 条文 内容 第43条 实际施工人向发包人主张权利 第44条 实际施工人的代位权 四、最高法法官会议纪要（4个） 实际施工人","slug":"实际施工人-制度概述","module":"07-实际施工人","moduleName":"07 实际施工人","tags":["建工","实际施工人","概述"],"wordCount":401,"created":"2026-06-01","updated":"2026-06-01","content":"# 实际施工人 - 制度概述\n\n## 一、核心问题\n\n1. 谁是\"实际施工人\"？\n2. 实际施工人能突破合同相对性向发包人主张权利吗？\n3. 实际施工人享有优先受偿权吗？\n\n## 二、制度背景\n\n实际施工人制度是建工司法解释为保护农民工等建筑工人利益而创设的特殊制度，允许在特定条件下突破合同相对性原则。\n\n## 三、条文架构\n\n| 条文 | 内容 |\n|------|------|\n| 第43条 | 实际施工人向发包人主张权利 |\n| 第44条 | 实际施工人的代位权 |\n\n## 四、最高法法官会议纪要（4个）\n\n1. 实际施工人不包括借用资质及多层转包/违法分包（2021年第20次）\n2. 借用资质的实际施工人可请求折价补偿（2021年第20次）\n3. 承包人已起诉时实际施工人的诉讼安排（2021年第21次）\n4. 实际施工人不享有优先受偿权（2021年第21次）\n\n## 五、与其他模块的关系\n\n- → [[01-合同效力/04-裁判规则-挂靠认定|挂靠认定]]\n- → [[01-合同效力/05-裁判规则-转包认定|转包认定]]\n- → [[01-合同效力/06-裁判规则-违法分包认定|违法分包认定]]\n- → [[08-优先受偿权/01-制度概述|优先受偿权]]：实际施工人不享有"},{"id":"实际施工人-法律规范","title":"实际施工人 - 法律规范","excerpt":"实际施工人 - 法律规范 一、建工司法解释一逐条解析 第43条（实际施工人向发包人主张权利） 实际施工人以转包人、违法分包人为被告起诉的，人民法院应当依法受理。 实际施工人以发包人为被告主张权利的，人民法院应当追加转包人或者违法分包人为本案第三人，在查明发包人欠付转包人或者违法分包人建设工程价款的数额后，判决发包人在欠付建设工程价款范围内对实际施工人承担责任。 要点 ： 实际施工人可直接起诉发包人","slug":"实际施工人-法律规范","module":"07-实际施工人","moduleName":"07 实际施工人","tags":["建工","实际施工人","法律规范","司法解释逐条","法官会议纪要"],"wordCount":918,"created":"2026-06-01","updated":"2026-06-01","content":"# 实际施工人 - 法律规范\n\n## 一、建工司法解释一逐条解析\n\n### 第43条（实际施工人向发包人主张权利）\n\n> 实际施工人以转包人、违法分包人为被告起诉的，人民法院应当依法受理。\n> 实际施工人以发包人为被告主张权利的，人民法院应当追加转包人或者违法分包人为本案第三人，在查明发包人欠付转包人或者违法分包人建设工程价款的数额后，判决发包人在欠付建设工程价款范围内对实际施工人承担责任。\n\n**要点**：\n- 实际施工人可直接起诉发包人\n- 发包人只在欠付工程款范围内承担责任\n- 需追加转包人/违法分包人为第三人\n\n### 第44条（实际施工人的代位权）\n\n> 实际施工人根据民法典第五百三十五条规定，以转包人或者违法分包人怠于向发包人行使到期债权或者与该债权有关的从权利，影响其到期债权实现，提起代位权诉讼的，人民法院应予支持。\n\n---\n\n## 二、最高法法官会议纪要\n\n### 纪要1：可以突破合同相对性的实际施工人不包括借用资质及多层转包和违法分包关系中的实际施工人\n- **来源**：最高法民一庭2021年第20次专业法官会议纪要\n- **要点**：第43条只规范转包和违法分包两种关系，未规定借用资质的实际施工人以及多层转包和违法分包关系中的实际施工人有权请求发包人承担责任\n\n### 纪要2：借用资质的实际施工人可请求折价补偿\n- **来源**：最高法民一庭2021年第20次专业法官会议纪要\n- **要点**：在发包人知道或应当知道系借用资质的实际施工人进行施工的情况下，借用方可请求参照合同约定折价补偿\n\n### 纪要3：承包人已起诉时实际施工人的诉讼安排\n- **来源**：最高法民一庭2021年第21次专业法官会议纪要\n- **要点**：承包人已起诉发包人的，实际施工人可在一审辩论终结前申请作为第三人参加诉讼，另诉的不应受理\n\n### 纪要4：实际施工人不享有建设工程价款优先受偿权\n- **来源**：最高法民一庭2021年第21次专业法官会议纪要\n- **要点**：优先受偿权的主体是承包人，实际施工人不享有\n\n### 纪要5：合同无效管理费不予支持\n- **来源**：最高法民一庭2021年第21次专业法官会议纪要\n- **要点**：合同无效，承包人请求实际施工人支付管理费的，不予支持\n\n### 纪要6：合同无效但工程交付使用应参照合同折价补偿\n- **来源**：最高法民一庭2022年第22次法官会议纪要\n- **要点**：建设工程施工合同无效但工程竣工并交付使用的，应当依法参照合同关于工程价款的约定，计算承包人应得折价补偿款"},{"id":"裁判规则-实际施工人的认定标准","title":"裁判规则 - 实际施工人的认定标准","excerpt":"裁判规则 - 实际施工人的认定标准 一、法律依据 《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第四十三条： 实际施工人以转包人、违法分包人为被告起诉的，人民法院应当依法受理。实际施工人以发包人为被告主张权利的，人民法院应当追加转包人或者违法分包人为本案第三人，在查明发包人欠付转包人或者违法分包人建设工程价款的数额后，判决发包人在欠付建设工程价款范围内对实际施工人承担责任","slug":"裁判规则-实际施工人的认定标准","module":"07-实际施工人","moduleName":"07 实际施工人","tags":["建工","实际施工人","认定标准","裁判规则"],"wordCount":2586,"created":"2026-06-01","updated":"2026-06-02","content":"# 裁判规则 - 实际施工人的认定标准\n\n## 一、法律依据\n\n**《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第四十三条：**\n\n实际施工人以转包人、违法分包人为被告起诉的，人民法院应当依法受理。实际施工人以发包人为被告主张权利的，人民法院应当追加转包人或者违法分包人为本案第三人，在查明发包人欠付转包人或者违法分包人建设工程价款的数额后，判决发包人在欠付建设工程价款范围内对实际施工人承担责任。\n\n**最高人民法院2021年第20次法官会议纪要（节选）：**\n\n实际施工人是指转包关系中的承包人、违法分包关系中的分包人。借用资质的实际施工人不属于第43条规定的实际施工人范围，但可依据事实合同关系请求折价补偿。多层转包、违法分包关系中的实际施工人，不适用第43条的规定。\n\n## 二、裁判规则要点\n\n### 规则1：实际施工人的类型范围\n\n实际施工人限于以下三种类型：（1）转包关系中的承包人；（2）违法分包关系中的分包人；（3）借用资质（挂靠）关系中的借用方。但需注意，第三种类型不能适用第43条突破合同相对性，只能在发包人知情的前提下依据事实合同关系主张权利。\n\n### 规则2：认定实际施工人的四要素\n\n法院认定实际施工人需综合审查以下要素：（1）**实际投入资金**——是否自行垫资购买材料、支付人工费等；（2）**实际组织施工**——是否组建项目部、安排管理人员、组织劳务队伍；（3）**实际承担风险**——是否承担工程质量、工期、安全等风险；（4）**实际获取利润**——是否以工程款扣除管理费后的余额作为收益。四要素缺一不可，仅有资金投入或仅有劳务不足以认定为实际施工人。\n\n### 规则3：实际施工人与农民工的本质区别\n\n实际施工人是组织施工的经营主体（可以是企业，也可以是包工头个人），其投入资金、组织人员、承担风险、获取利润。农民工个人仅提供劳务，不承担施工风险，不属于实际施工人。第43条保护实际施工人的目的是通过保护施工组织者间接保护农民工工资，而非直接保护农民工个人。\n\n### 规则4：内部承包与实际施工人的区分\n\n建筑施工企业内部职工以企业名义承包工程并组织施工的，属于内部承包，不属于转包或违法分包，不产生实际施工人问题。区分标准：是否存在劳动关系、是否纳入企业管理、是否由企业统一核算。\n\n### 规则5：多层转包中实际施工人的认定\n\n多层转包和违法分包关系中，最终实际投入资金、组织施工的主体仍为实际施工人，但该实际施工人不能适用第43条突破合同相对性向发包人主张权利。其只能向直接合同相对人主张权利，或通过代位权诉讼解决。\n\n### 规则6：实际施工人的举证责任\n\n主张自己是实际施工人的一方承担举证责任，需提交：施工日志、材料采购合同及付款凭证、劳务分包合同及工资发放记录、设备租赁合同、项目部人员名单及社保记录、工程款收付凭证等。仅有转包协议不足以证明实际施工。\n\n## 三、司法观点分歧\n\n### 分歧1：仅有资金投入能否认定为实际施工人？\n\n- **肯定说**：资金投入是核心要素，如果实际垫资并承担风险，即使未直接组织施工，也可认定为实际施工人。\n- **否定说**：资金投入仅为要素之一，还需结合是否实际组织施工、承担风险等综合判断，单纯借贷资金不构成实际施工人。\n- **主流立场**：需综合四要素判断，仅有资金投入不足以认定。\n\n### 分歧2：个人包工头是否属于实际施工人？\n\n- **肯定说**（主流）：个人包工头自行投入资金、组织劳务队伍施工，虽无资质，但实际履行了施工义务，属于实际施工人。\n- **否定说**：个人不具备施工资质，不能成为施工合同主体，不应认定为实际施工人。\n- **主流立场**：个人可以成为实际施工人，但其与发包人之间的合同因无资质而无效。\n\n### 分歧3：劳务分包人是否属于实际施工人？\n\n- **观点一**：合法劳务分包人不属于实际施工人，其有合法合同依据。\n- **观点二**：违法劳务分包（如将劳务分包给无资质个人）中的实际施工人可认定为实际施工人。\n- **主流立场**：合法劳务分包不产生实际施工人问题；违法劳务分包可产生实际施工人。\n\n## 四、省/市高院指引差异\n\n| 地区 | 个人包工头认定 | 资金投入单一要素 | 劳务分包人认定 | 内部承包边界 |\n|------|-------------|---------------|-------------|------------|\n| 北京高院 | 认可个人为实际施工人 | 需综合四要素 | 违法劳务分包可认定 | 严格审查劳动关系 |\n| 江苏高院 | 认可，但需充分举证 | 资金投入为核心要素 | 不认可劳务分包人为实际施工人 | 纳入企业核算即为内部承包 |\n| 浙江高院 | 认可个人 | 综合"},{"id":"裁判规则-突破合同相对性的条件","title":"裁判规则 - 突破合同相对性的条件","excerpt":"裁判规则 - 突破合同相对性的条件 一、法律依据 《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第四十三条： 实际施工人以转包人、违法分包人为被告起诉的，人民法院应当依法受理。实际施工人以发包人为被告主张权利的，人民法院应当追加转包人或者违法分包人为本案第三人，在查明发包人欠付转包人或者违法分包人建设工程价款的数额后，判决发包人在欠付建设工程价款范围内对实际施工人承担责任","slug":"裁判规则-突破合同相对性的条件","module":"07-实际施工人","moduleName":"07 实际施工人","tags":["建工","实际施工人","合同相对性","裁判规则"],"wordCount":2396,"created":"2026-06-01","updated":"2026-06-02","content":"# 裁判规则 - 突破合同相对性的条件\n\n## 一、法律依据\n\n**《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第四十三条：**\n\n实际施工人以转包人、违法分包人为被告起诉的，人民法院应当依法受理。实际施工人以发包人为被告主张权利的，人民法院应当追加转包人或者违法分包人为本案第三人，在查明发包人欠付转包人或者违法分包人建设工程价款的数额后，判决发包人在欠付建设工程价款范围内对实际施工人承担责任。\n\n**最高人民法院2021年第20次法官会议纪要（节选）：**\n\n第43条规定的实际施工人不包括借用资质的实际施工人和多层转包、违法分包关系中的实际施工人。该条系为保护农民工利益所作的特别规定，应严格把握适用范围，不宜扩大解释。\n\n## 二、裁判规则要点\n\n### 规则1：仅限转包和违法分包两种关系\n\n第43条突破合同相对性的适用范围严格限定于转包关系和违法分包关系中的实际施工人。借用资质（挂靠）关系中的实际施工人不适用第43条。多层转包、多层违法分包关系中的实际施工人亦不适用第43条。\n\n### 规则2：借用资质的实际施工人不适用第43条\n\n借用资质的实际施工人与发包人之间不存在转包或违法分包关系，而是借用资质关系。即使发包人知情，借用资质的实际施工人也不能依据第43条突破合同相对性，而应依据事实合同关系请求折价补偿（法官会议纪要第1条）。\n\n### 规则3：多层转包/违法分包不适用第43条\n\n多层转包和违法分包关系中，实际施工人与发包人之间隔了多层合同关系，法律关系过于复杂。允许突破会导致审判困难和执行混乱，故法官会议纪要明确排除适用。实际施工人应向直接合同相对人主张权利，或通过代位权诉讼解决。\n\n### 规则4：发包人仅在欠付工程款范围内承担责任\n\n发包人不是对实际施工人的全部债权承担连带责任，而是仅在欠付转包人或违法分包人工程价款的范围内承担补充责任。超出欠付范围的部分，实际施工人应向转包人或违法分包人主张。\n\n### 规则5：诉讼程序要求——追加第三人\n\n实际施工人以发包人为被告主张权利的，法院应当追加转包人或违法分包人为本案第三人。追加第三人的目的是查明发包人欠付的工程款数额。未追加第三人的，属于程序违法，可能被发回重审。\n\n### 规则6：需查明发包人欠付的具体数额\n\n法院判决发包人承担责任的前提是查明发包人欠付转包人或违法分包人建设工程价款的具体数额。如果无法查明欠付数额，则不能判决发包人承担责任。举证责任分配：发包人应举证证明已付工程款数额。\n\n## 三、司法观点分歧\n\n### 分歧1：第43条是否属于独立请求权基础？\n\n- **观点一**：第43条赋予实际施工人独立的请求权，可以直接以发包人为被告起诉，无需先向转包人主张。\n- **观点二**：第43条仅为诉讼程序便利规定，实际施工人的实体权利仍来源于其与转包人之间的合同关系。\n- **主流立场**：第43条系为保护农民工利益的特别规定，赋予实际施工人独立请求权，但适用范围应严格限制。\n\n### 分歧2：发包人责任的性质是连带责任还是补充责任？\n\n- **连带责任说**（少数）：发包人与转包人对实际施工人承担连带责任。\n- **补充责任说**（主流）：发包人仅在欠付工程款范围内承担补充责任，而非连带责任。转包人或违法分包人是第一责任人。\n- **主流立场**：发包人承担的是限额补充责任，以欠付工程款为限。\n\n### 分歧3：实际施工人能否同时起诉发包人和转包人？\n\n- **肯定说**（主流）：实际施工人可以将发包人和转包人/违法分包人作为共同被告，法院一并审理。\n- **否定说**：应先向转包人主张，不足部分再向发包人主张，不应当共同起诉。\n- **主流立场**：可以共同起诉，但法院应分别认定转包人和发包人的责任范围。\n\n## 四、省/市高院指引差异\n\n| 地区 | 共同被告问题 | 欠付数额举证 | 第三人追加 | 借用资质适用43条 |\n|------|------------|------------|----------|---------------|\n| 北京高院 | 可共同起诉 | 发包人举证已付数额 | 必须追加 | 不适用 |\n| 江苏高院 | 可共同起诉 | 发包人举证 | 必须追加 | 不适用，走事实合同 |\n| 浙江高院 | 可共同起诉 | 发包人举证 | 必须追加 | 不适用 |\n| 广东高院 | 可共同起诉 | 发包人举证已付款项 | 必须追加 | 不适用 |\n\n## 五、典型案例\n\n### 案例1：借用资质不适用第43条\n\n- **案号**：（2019）最高法民终1951号\n- **要旨**：实际施工人借用资质施工，主张依据第43条要求发包人承担责任。法院认定借用资质关系不属于第43条规范的转包或违法分包关系"},{"id":"裁判规则-借用资质的实际施工人权利","title":"裁判规则 - 借用资质的实际施工人权利","excerpt":"裁判规则 - 借用资质的实际施工人权利 一、法律依据 最高人民法院2021年第20次法官会议纪要（节选）： 借用资质的实际施工人不属于第43条规定的实际施工人范围，不能依据该条突破合同相对性向发包人主张权利。但在发包人知道或者应当知道系借用资质的实际施工人进行施工的情况下，发包人与借用方形成事实上的建设工程施工合同关系，借用方可以请求参照合同约定折价补偿。借用方向发包人主张权利的，人民法院应当通知","slug":"裁判规则-借用资质的实际施工人权利","module":"07-实际施工人","moduleName":"07 实际施工人","tags":["建工","实际施工人","借用资质","裁判规则"],"wordCount":2407,"created":"2026-06-01","updated":"2026-06-02","content":"# 裁判规则 - 借用资质的实际施工人权利\n\n## 一、法律依据\n\n**最高人民法院2021年第20次法官会议纪要（节选）：**\n\n借用资质的实际施工人不属于第43条规定的实际施工人范围，不能依据该条突破合同相对性向发包人主张权利。但在发包人知道或者应当知道系借用资质的实际施工人进行施工的情况下，发包人与借用方形成事实上的建设工程施工合同关系，借用方可以请求参照合同约定折价补偿。借用方向发包人主张权利的，人民法院应当通知出借资质的建筑施工企业作为第三人参加诉讼。\n\n**《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第七条：**\n\n缺乏资质的单位或者个人借用有资质的建筑施工企业名义签订建设工程施工合同，发包人请求出借方与借用方对因出借资质造成的损失承担连带赔偿责任的，人民法院应予支持。\n\n## 二、裁判规则要点\n\n### 规则1：不能依据第43条突破合同相对性\n\n借用资质的实际施工人与发包人之间不存在转包或违法分包关系，因此不能依据第43条直接向发包人主张权利。这是法官会议纪要明确界定的适用范围限制。\n\n### 规则2：发包人知情时形成事实合同关系\n\n在发包人知道或应当知道系借用资质的实际施工人进行施工的情况下，发包人与借用方之间形成事实上的建设工程施工合同关系。此时借用方可依据该事实合同关系请求参照合同约定折价补偿。\"知情\"的认定标准包括：发包人直接与借用方洽谈、发包人参与借用方项目管理、发包人直接向借用方付款等。\n\n### 规则3：折价补偿参照合同约定\n\n借用资质的实际施工人请求折价补偿的，参照的是出借方与发包人签订的施工合同约定，而非借用方与出借方之间的内部协议。合同无效但工程验收合格的，参照合同约定折价补偿。\n\n### 规则4：需通知出借方作为第三人\n\n借用方向发包人主张权利的，法院应通知出借资质的建筑施工企业作为第三人参加诉讼。出借方作为第三人可以就工程款数额、质量问题等提出抗辩。未通知出借方参加诉讼的，属于程序违法。\n\n### 规则5：出借方与借用方的连带责任\n\n根据司法解释一第7条，出借方与借用方对因出借资质造成的损失向发包人承担连带赔偿责任。但这是发包人向借用方和出借方主张权利的路径，与借用方向发包人主张工程款是不同方向。\n\n### 规则6：发包人不知情时的权利救济\n\n发包人不知道且不应当知道借用资质事实的，借用方不能向发包人主张权利。此时借用方只能向出借方主张权利，依据双方之间的借用资质协议或事实合同关系。\n\n## 三、司法观点分歧\n\n### 分歧1：发包人\"知情\"的认定标准\n\n- **严格说**：需有直接证据证明发包人明确知道借用资质的事实，如书面文件、会议纪要等。\n- **宽松说**（主流）：综合判断，包括发包人直接与借用方人员接洽、直接向借用方付款、借用方以自己名义参与工程管理等间接证据。\n- **主流立场**：采用综合判断标准，不要求直接证据，间接证据形成证据链即可认定。\n\n### 分歧2：借用资质与内部承包的界限\n\n- **观点一**：有劳动关系的属于内部承包，无劳动关系的属于借用资质。\n- **观点二**：不仅看劳动关系，还需看是否纳入企业统一管理、统一核算。\n- **主流立场**：综合审查劳动关系、管理关系、核算关系，防止以内部承包之名行借用资质之实。\n\n### 分歧3：折价补偿的范围是否包含利润？\n\n- **肯定说**：折价补偿应参照合同约定，合同约定包含利润的，补偿范围应包含合理利润。\n- **否定说**：借用资质本身违法，不应支持利润主张。\n- **主流立场**：参照合同约定折价补偿，工程验收合格的，补偿范围可包含合理利润。\n\n## 四、省/市高院指引差异\n\n| 地区 | 发包人知情认定 | 折价补偿范围 | 出借方诉讼地位 | 与第43条关系 |\n|------|-------------|------------|-------------|------------|\n| 北京高院 | 综合判断，宽松 | 参照合同约定含利润 | 必须追加为第三人 | 不适用43条 |\n| 江苏高院 | 需直接证据 | 参照合同约定 | 追加为第三人 | 不适用43条 |\n| 浙江高院 | 综合判断 | 参照合同约定含利润 | 追加为第三人 | 不适用43条 |\n| 广东高院 | 综合判断 | 参照合同约定 | 必须通知参加 | 不适用43条 |\n\n## 五、典型案例\n\n### 案例1：发包人知情的认定\n\n- **案号**：（2019）最高法民终1856号\n- **要旨**：借用资质的实际施工人举证证明发包人在招投标阶段即与其直接洽谈，施工过程中发包人直接向其支付部分款项。法院认定发包人知道借用资质的事实，借用方与发包人形成事实合同关系，支持折价补偿请求。\n- **规则**：发包"},{"id":"裁判规则-多层转包-违法分包的限制","title":"裁判规则 - 多层转包/违法分包的限制","
