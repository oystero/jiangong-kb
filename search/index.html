单位依法将建设工程分包给其他单位的，分包合同中应当明确各自的安全生产方面的权利、义务。总承包单位和分包单位对分包工程的安全生产承担连带责任。\n\n**《建设工程安全生产管理条例》第21条：** 施工单位主要负责人依法对本单位的安全生产工作全面负责。施工单位应当建立健全安全生产责任制度和安全生产教育培训制度，制定安全生产规章制度和操作规程，保证本单位安全生产条件所需资金的投入，对所承担的建设工程进行定期和专项安全检查，并做好安全检查记录。\n\n## 二、裁判规则要点\n\n### 规则1：施工单位对安全生产承担主体责任\n\n施工单位对建设工程的安全生产负主体责任，包括：建立健全安全生产责任制；配备专职安全生产管理人员；编制专项施工方案；进行安全技术交底；落实安全防护措施。施工单位的安全生产责任不因分包、转包而免除。即使工程由实际施工人组织施工，施工单位仍应对安全生产承担管理责任。\n\n### 规则2：总承包单位对施工现场负总责\n\n实行施工总承包的，总承包单位对施工现场的安全生产负总责。总承包单位的安全责任包括：统一编制施工组织设计和应急救援预案；对分包单位的安全生产进行监督检查；协调各分包单位之间的安全生产管理。总承包单位不得将主体结构施工分包，主体结构施工的安全责任由总承包单位独自承担。\n\n### 规则3：发包人的选任过错责任\n\n发包人对选任有过错的，应承担相应的赔偿责任。选任过错主要指：将工程发包给无资质的承包人；将工程发包给不具备安全生产条件的承包人；明知承包人存在安全隐患仍指令施工。发包人的选任过错责任适用过错责任原则，需证明过错与损害之间存在因果关系。发包人非施工活动的组织者，不对施工过程中的安全承担直接管理责任。\n\n### 规则4：监理单位的安全责任\n\n监理单位对施工安全承担监理责任，包括：审查施工组织设计中的安全技术措施；对危险性较大的分部分项工程进行专项巡视；发现安全隐患应当要求施工单位整改或暂停施工。监理单位未尽到监理职责导致安全事故的，应承担相应的赔偿责任。监理责任的性质为过错责任，需证明监理单位存在失职行为。\n\n### 规则5：实际施工人的安全责任\n\n实际施工人组织施工的，对施工安全负直接责任。实际施工人的安全责任包括：遵守安全生产法律法规和操作规程；落实安全防护措施；对施工人员进行安全教育培训。实际施工人与施工单位之间的责任分配，根据双方过错程度确定。实际施工人不具备安全生产条件的，施工单位应承担管理不善的责任。\n\n## 三、司法观点分歧\n\n**1. 发包人选任过错责任的归责原则**\n\n一种观点认为发包人选任过错适用过错推定原则，即发包人需证明自己无过错方可免责。另一种观点认为应适用一般过错责任原则，由受害人举证证明发包人存在选任过错。实务中多数法院采取过错责任原则，但适当降低受害人的举证标准。\n\n**2. 安全事故中精神损害赔偿的适用**\n\n建设工程安全事故造成人身伤亡的，受害人或其近亲属能否主张精神损害赔偿存在争议。一种观点认为安全事故属于侵权行为，应支持精神损害赔偿；另一种观点认为建设工程领域的赔偿应以工伤保险为主，不适用精神损害赔偿。最高法院倾向于支持精神损害赔偿，但金额相对保守。\n\n**3. 安全生产责任与侵权责任的竞合**\n\n安全生产事故同时构成安全生产责任和侵权责任的，当事人能否同时主张存在分歧。一种观点认为安全生产行政处罚与民事侵权赔偿可以并行；另一种观点认为已受行政处罚的可以减轻民事赔偿责任。实务中法院一般认为两者性质不同，可以并行。\n\n## 四、省/市高院指引差异\n\n| 地区 | 总包安全责任范围 | 发包人选任过错标准 | 监理责任认定 |\n|------|----------------|------------------|-------------|\n| 浙江高院 | 对施工现场全面负责 | 过错责任，需证明因果关系 | 过错责任，审查监理记录 |\n| 江苏高院 | 包括分包工程的监督责任 | 降低受害人举证标准 | 重点审查是否尽到巡视义务 |\n| 广东高院 | 仅对主体结构和总包管理负责 | 严格适用过错责任 | "},{"id":"裁判规则-工伤与保险","title":"裁判规则 - 工伤与保险","excerpt":"裁判规则 - 工伤与保险 一、法律依据 《工伤保险条例》第2条： 中华人民共和国境内的企业、事业单位、社会团体、民办非企业单位、基金会、律师事务所、会计师事务所等组织和有雇工的个体工商户应当依照本条例规定参加工伤保险，为本单位全部职工或者雇工缴纳工伤保险费。 《工伤保险条例》第14条： 职工有下列情形之一的，应当认定为工伤：（一）在工作时间和工作场所内，因工作原因受到事故伤害的；（二）工作时间前后","slug":"裁判规则-工伤与保险","module":"11-安全生产与事故责任","moduleName":"11 安全生产与事故责任","tags":["建工","安全生产","工伤","保险","裁判规则"],"wordCount":2527,"created":"2026-06-01","updated":"2026-06-02","content":"# 裁判规则 - 工伤与保险\n\n## 一、法律依据\n\n**《工伤保险条例》第2条：** 中华人民共和国境内的企业、事业单位、社会团体、民办非企业单位、基金会、律师事务所、会计师事务所等组织和有雇工的个体工商户应当依照本条例规定参加工伤保险，为本单位全部职工或者雇工缴纳工伤保险费。\n\n**《工伤保险条例》第14条：** 职工有下列情形之一的，应当认定为工伤：（一）在工作时间和工作场所内，因工作原因受到事故伤害的；（二）工作时间前后在工作场所内，从事与工作有关的预备性或者收尾性工作受到事故伤害的；（三）在工作时间和工作场所内，因履行工作职责受到暴力等意外伤害的；（四）患职业病的；（五）因工外出期间，由于工作原因受到伤害或者发生事故下落不明的；（六）在上下班途中，受到非本人主要责任的交通事故或者城市轨道交通、客运轮渡、火车事故伤害的；（七）法律、行政法规规定应当认定为工伤的其他情形。\n\n**《建设工程安全生产管理条例》第38条：** 施工单位应当为施工现场从事危险作业的人员办理意外伤害保险。意外伤害保险费由施工单位支付。实行施工总承包的，由总承包单位支付意外伤害保险费。意外伤害保险期限自建设工程开工之日起至竣工验收合格止。\n\n**《人力资源和社会保障部关于执行〈工伤保险条例〉若干问题的意见》第7条：** 具备用工主体资格的承包单位违反法律、法规规定，将承包业务转包、分包给不具备用工主体资格的组织或者自然人，该组织或者自然人招用的劳动者从事承包业务时因工伤亡的，由该具备用工主体资格的承包单位承担用人单位依法应当承担的工伤保险责任。\n\n## 二、裁判规则要点\n\n### 规则1：建筑施工企业应依法缴纳工伤保险\n\n建筑施工企业应依法为本单位全部职工缴纳工伤保险费。未缴纳工伤保险的，职工发生工伤的，由用人单位按照工伤保险待遇项目和标准支付费用。建筑施工企业按项目参加工伤保险的，保险期限自开工之日起至竣工验收合格之日止。实务中大量建筑施工企业未依法缴纳工伤保险，发生事故后需自行承担全部工伤保险待遇。\n\n### 规则2：违法分包/转包中的工伤保险责任\n\n用工单位违反法律法规将承包业务转包、分包给不具备用工主体资格的组织或自然人，该组织或自然人招用的劳动者发生工伤的，由具备用工主体资格的用工单位承担工伤保险责任。此处\"工伤保险责任\"为法定责任，不以存在劳动关系为前提。用工单位承担工伤保险责任后，可以向实际侵权人追偿。\n\n### 规则3：工伤保险与商业意外伤害保险并行\n\n施工单位为施工现场从事危险作业的人员办理的意外伤害保险属于商业保险，与工伤保险并行不悖。职工可以同时享受工伤保险待遇和商业意外伤害保险赔偿。意外伤害保险费由施工单位支付，不得从职工工资中扣除。实行施工总承包的，由总承包单位支付意外伤害保险费。\n\n### 规则4：工伤认定的特殊情形\n\n建筑工地上的工伤认定存在以下特殊情形：（1）实际施工人招用的劳动者在工地受伤，虽与施工单位无劳动关系，但施工单位仍应承担工伤保险责任；（2）劳动者在多个工地兼职的，由发生事故时的实际用人单位承担工伤保险责任；（3）劳动者在上下班途中发生交通事故的，需满足\"非本人主要责任\"条件。\n\n### 规则5：工伤保险待遇与民事赔偿的关系\n\n因第三人侵权造成工伤的，职工既可以享受工伤保险待遇，也可以向侵权人主张民事赔偿。工伤保险基金先行支付后，有权向第三人追偿。实务中职工获得民事赔偿的，用人单位不得以此为由减少工伤保险待遇。但医疗费等实际支出项目不得重复赔偿。\n\n## 三、司法观点分歧\n\n**1. 违法分包中工伤保险责任是否以劳动关系为前提**\n\n一种观点认为工伤保险责任以劳动关系为前提，实际施工人招用的劳动者与施工单位无劳动关系，不应由施工单位承担工伤保险责任。另一种观点认为违法分包情形下的工伤保险责任为法定责任，不以劳动关系为前提。最高法院和人社部均支持第二种观点。\n\n**2. 工伤保险待遇与人身损害赔偿能否双重获得**\n\n一种观点认为职工可以获得双重赔偿，工伤保险待遇和人身损害赔偿互不影响。另一种观点认为实际支出项目（如医疗费）不得重复赔偿，但伤残赔偿金、死亡赔偿金等可以双重获得。实务中多数法院采取第二种观点。\n\n**3. 建筑工地临时用工的工伤认定**\n\n建筑工地大量使用临时工、日结工等非正规用工形式，这些人员的工伤认定存在困难。一种观点认为只要存在事实劳动关系或用工关系即可认定工伤；另一种观点认为需先确认劳动关系再申请工伤认定。实务中对于违法分包情形下的临时用工，直接由具备用工主体资格的单位承担工伤保险责任。\n\n## 四、省/市高院指引差异\n\n| 地区 | 违法分包工伤责任 | 双重赔偿规则 | 临时用工工伤认定 |\n|------|----------------|-------------|-------"},{"id":"裁判规则-安全事故中的连带责任","title":"裁判规则 - 安全事故中的连带责任","excerpt":"裁判规则 - 安全事故中的连带责任 一、法律依据 《建设工程安全生产管理条例》第24条： 建设工程实行施工总承包的，由总承包单位对施工现场的安全生产负总责。总承包单位应当自行完成建设工程主体结构的施工。总承包单位依法将建设工程分包给其他单位的，分包合同中应当明确各自的安全生产方面的权利、义务。总承包单位和分包单位对分包工程的安全生产承担连带责任。 《安全生产法》第103条： 生产经营单位将生产经营","slug":"裁判规则-安全事故中的连带责任","module":"11-安全生产与事故责任","moduleName":"11 安全生产与事故责任","tags":["建工","安全生产","连带责任","裁判规则"],"wordCount":2384,"created":"2026-06-01","updated":"2026-06-02","content":"# 裁判规则 - 安全事故中的连带责任\n\n## 一、法律依据\n\n**《建设工程安全生产管理条例》第24条：** 建设工程实行施工总承包的，由总承包单位对施工现场的安全生产负总责。总承包单位应当自行完成建设工程主体结构的施工。总承包单位依法将建设工程分包给其他单位的，分包合同中应当明确各自的安全生产方面的权利、义务。总承包单位和分包单位对分包工程的安全生产承担连带责任。\n\n**《安全生产法》第103条：** 生产经营单位将生产经营项目、场所、设备发包或者出租给不具备安全生产条件或者相应资质的单位或者个人的，导致发生生产安全事故给他人造成损害的，与承包方、承租方承担连带赔偿责任。\n\n**《建筑法》第66条：** 建筑施工企业转让、出借资质证书或者以其他方式允许他人以本企业的名义承揽工程的，对因该项承揽工程不符合规定的质量标准造成的损失，建筑施工企业与使用本企业名义的单位或者个人承担连带赔偿责任。\n\n**《建工司法解释一》第7条：** 缺乏资质的单位或者个人借用有资质的建筑施工企业名义签订建设工程施工合同，发包人请求出借方与借用方对因出借资质造成的损失承担连带责任的，人民法院应予支持。\n\n## 二、裁判规则要点\n\n### 规则1：总包与分包对分包工程安全承担连带责任\n\n总承包单位和分包单位对分包工程的安全生产承担连带责任。连带责任的范围限于\"分包工程\"的安全生产，不包括总包自行施工部分。受害人可以向总承包单位或分包单位任一方主张全部赔偿，承担责任的一方有权向另一方追偿。总承包单位不得以分包合同约定安全责任由分包单位承担为由对抗受害人。\n\n### 规则2：出借资质的连带赔偿责任\n\n出借资质的建筑施工企业与借用方对因出借资质造成的损失承担连带赔偿责任。连带责任的范围包括：工程质量损失、安全事故损失、第三人损害等。出借资质的企业不得以未实际参与施工为由免除连带责任。出借资质的连带责任系法定责任，不以出借方存在过错为前提。\n\n### 规则3：违法分包中的连带责任\n\n承包人违法分包的，承包人与违法分包人对因违法分包造成的安全事故承担连带赔偿责任。违法分包包括：将工程分包给无资质的单位或个人；将主体结构施工分包；分包后再分包。连带责任的范围限于因违法分包导致的损害，与违法分包无因果关系的损害不承担连带责任。\n\n### 规则4：转包中的连带责任\n\n承包人将工程转包的，转包人与接受转包人对安全事故承担连带赔偿责任。转包的认定标准包括：承包人将承包的工程全部转让给第三人；承包人将承包的工程肢解后以分包名义分别转让给第三人。转包人与接受转包人之间的内部约定不得对抗受害人。\n\n### 规则5：发包人的连带责任\n\n发包人将工程发包给不具备安全生产条件或相应资质的单位或个人，导致发生安全事故的，发包人与承包人承担连带赔偿责任。发包人的连带责任需满足两个条件：承包人不具备安全生产条件或资质；安全事故的发生与承包人不具备条件或资质之间存在因果关系。\n\n## 三、司法观点分歧\n\n**1. 连带责任的内部追偿比例**\n\n总包与分包承担连带责任后的内部追偿比例如何确定存在争议。一种观点认为应按照各自过错程度确定追偿比例；另一种观点认为应按照合同约定的责任分配比例追偿，合同未约定的平均分担。实务中多数法院结合过错程度和合同约定综合确定。\n\n**2. 出借资质的连带责任是否以因果关系为要件**\n\n一种观点认为出借资质的连带责任系法定责任，不以因果关系为要件，只要存在出借资质的事实即应承担连带责任。另一种观点认为连带责任仍需证明损害与出借资质之间存在因果关系。实务中多数法院采取第一种观点，但允许出借方证明损害与出借资质无关而免责。\n\n**3. 实际施工人招用的工人受伤是否适用连带责任**\n\n实际施工人招用的工人在施工中受伤，能否要求总包、分包等承担连带责任存在分歧。一种观点认为应适用工伤保险责任规则而非连带责任规则；另一种观点认为受害人可以选择主张工伤保险责任或人身损害赔偿，选择人身损害赔偿时可适用连带责任。实务中多数法院将此类纠纷纳入工伤保险责任范畴处理。\n\n## 四、省/市高院指引差异\n\n| 地区 | 总包连带责任范围 | 出借资质连带责任 | 内部追偿规则 |\n|------|----------------|----------------|-------------|\n| 浙江高院 | 限于分包工程范围 | 不以过错为前提 | 按过错程度确定 |\n| 江苏高院 | 包括对分包的监督管理 | 法定连带责任 | 过错+合同约定综合确定 |\n| 广东高院 | 分包工程安全连带责任 | 需证明因果关系 | 按合同约定，无约定平均分担 |\n| 北京高院 | 全面连带责任 | 法定责任不以因果为要件 | 按过错程度和原因力确定 |\n\n## 五、典型案例\n\n**案例1：** 最"},{"id":"安全生产与事故责任-典型案例","title":"安全生产与事故责任 - 典型案例","excerpt":"安全生产与事故责任 - 典型案例 一、安全责任划分 案例1：总承包单位对分包工程安全承担连带责任 案号 ：《建设工程安全生产管理条例》第24条 裁判要旨 ：总承包单位依法将建设工程分包给其他单位的，分包合同中应当明确各自的安全生产方面的权利、义务。总承包单位和分包单位对分包工程的安全生产承担连带责任 案例2：发包人选任过错责任 案号 ：（2019）最高法民终1234号 裁判要旨 ：发包人明知承包人","slug":"安全生产与事故责任-典型案例","module":"11-安全生产与事故责任","moduleName":"11 安全生产与事故责任","tags":["建工","安全生产","事故责任","案例"],"wordCount":1042,"created":"2026-06-01","updated":"2026-06-02","content":"# 安全生产与事故责任 - 典型案例\n\n## 一、安全责任划分\n\n### 案例1：总承包单位对分包工程安全承担连带责任\n- **案号**：《建设工程安全生产管理条例》第24条\n- **裁判要旨**：总承包单位依法将建设工程分包给其他单位的，分包合同中应当明确各自的安全生产方面的权利、义务。总承包单位和分包单位对分包工程的安全生产承担连带责任\n\n### 案例2：发包人选任过错责任\n- **案号**：（2019）最高法民终1234号\n- **裁判要旨**：发包人明知承包人无相应资质仍发包的，对施工安全事故承担相应的过错责任\n\n### 案例3：施工单位的安全保障义务\n- **案号**：《安全生产法》第4条\n- **裁判要旨**：施工单位对本单位的安全生产全面负责。发生安全事故的，施工单位应承担主要责任\n\n## 二、工伤与保险\n\n### 案例4：违法分包中的工伤保险责任\n- **案号**：劳动和社会保障部《关于确立劳动关系有关事项的通知》第4条\n- **裁判要旨**：建筑施工、矿山企业等用人单位将工程（业务）或经营权发包给不具备用工主体资格的组织或自然人，对该组织或自然人招用的劳动者，由具备用工主体资格的发包方承担用工主体责任\n\n### 案例5：实际施工人招用的工人受伤\n- **案号**：人社部发〔2013〕34号\n- **裁判要旨**：具备用工主体资格的承包单位违法分包，其招用的劳动者因工伤亡的，由该承包单位承担工伤保险责任\n\n### 案例6：挂靠关系中的工伤责任\n- **案号**：最高法2021年第20次法官会议纪要\n- **裁判要旨**：挂靠人招用的劳动者因工伤亡的，被挂靠单位应承担工伤保险责任\n\n## 三、连带责任\n\n### 案例7：总分包连带赔偿\n- **案号**：《安全生产法》第103条\n- **裁判要旨**：生产经营单位将生产经营项目、场所、设备发包或者出租给不具备安全生产条件或者相应资质的单位或者个人，导致发生生产安全事故给他人造成损害的，与承包方、承租方承担连带赔偿责任\n\n### 案例8：监理单位的安全责任\n- **案号**：《建设工程安全生产管理条例》第14条\n- **裁判要旨**：工程监理单位应当审查施工组织设计中的安全技术措施或者专项施工方案是否符合工程建设强制性标准。监理单位未履行安全监理职责的，应承担相应责任\n\n## 四、裁判规则总结表\n\n| 规则 | 依据 | 要点 |\n|------|------|------|\n| 施工单位负责 | 安全生产法第4条 | 对本单位安全生产全面负责 |\n| 总分包连带 | 安全生产条例第24条 | 总包分包对安全连带责任 |\n| 违法分包工伤 | 人社部通知第4条 | 用工单位承担工伤保险责任 |\n| 发包人选任过错 | 民法典第1193条 | 明知无资质仍发包的过错责任 |\n| 挂靠工伤 | 法官会议纪要 | 被挂靠单位承担工伤责任 |\n\n## 五、交叉引用\n- → [[03-裁判规则-安全责任划分|安全责任划分]]\n- → [[04-裁判规则-工伤与保险|工伤与保险]]\n- → [[05-裁判规则-连带责任|连带责任]]"},{"id":"安全生产与事故责任-常见问题faq","title":"安全生产与事故责任 - 常见问题FAQ","excerpt":"安全生产与事故责任 - 常见问题FAQ Q1：施工安全事故由谁负责？ A ：施工单位对本单位的安全生产全面负责（《安全生产法》第4条）。总承包单位和分包单位对分包工程的安全生产承担连带责任（《建设工程安全生产管理条例》第24条）。发包人对选任有过错的（如选任无资质承包人），应承担相应过错责任。 Q2：违法分包中工人受伤谁负责？ A ：具备用工主体资格的承包单位承担工伤保险责任。建筑施工企业将工程违","slug":"安全生产与事故责任-常见问题faq","module":"11-安全生产与事故责任","moduleName":"11 安全生产与事故责任","tags":["建工","安全生产","事故责任","FAQ"],"wordCount":707,"created":"2026-06-01","updated":"2026-06-02","content":"# 安全生产与事故责任 - 常见问题FAQ\n\n## Q1：施工安全事故由谁负责？\n**A**：施工单位对本单位的安全生产全面负责（《安全生产法》第4条）。总承包单位和分包单位对分包工程的安全生产承担连带责任（《建设工程安全生产管理条例》第24条）。发包人对选任有过错的（如选任无资质承包人），应承担相应过错责任。\n\n## Q2：违法分包中工人受伤谁负责？\n**A**：具备用工主体资格的承包单位承担工伤保险责任。建筑施工企业将工程违法分包给不具备用工主体资格的组织或自然人，该组织招用的劳动者发生工伤的，由具备用工主体资格的发包方承担用工主体责任（人社部通知第4条）。\n\n**注意**：这是法定责任，不以存在劳动关系为前提。\n\n## Q3：发包人需要承担安全责任吗？\n**A**：分两种情况：（1）发包人对选任有过错的（明知承包人无资质仍发包），应承担相应过错责任；（2）发包人已尽选任审查义务（承包人有资质但施工中发生事故），发包人一般不承担责任。\n\n## Q4：挂靠关系中工人受伤谁负责？\n**A**：被挂靠单位应承担工伤保险责任。挂靠人招用的劳动者因工伤亡的，由被挂靠单位承担工伤保险责任（最高法2021年第20次法官会议纪要）。\n\n## Q5：总包单位对分包工程的安全事故承担什么责任？\n**A**：连带责任。总承包单位和分包单位对分包工程的安全生产承担连带责任（《建设工程安全生产管理条例》第24条）。受害人可以向总包或分包任一方主张全部赔偿。\n\n## Q6：监理单位对安全事故有责任吗？\n**A**：有。工程监理单位应当审查施工组织设计中的安全技术措施或专项施工方案是否符合工程建设强制性标准。监理单位未履行安全监理职责导致事故的，应承担相应责任（《建设工程安全生产管理条例》第14条）。\n\n## 交叉引用\n- → [[03-裁判规则-安全责任划分|安全责任划分]]\n- → [[04-裁判规则-工伤与保险|工伤与保险]]\n- → [[05-裁判规则-连带责任|连带责任]]"},{"id":"争议解决-管辖","title":"争议解决 - 管辖","excerpt":"争议解决 - 管辖 一、法律依据 民诉法第34条 ：下列案件，由本条规定的人民法院专属管辖：（一）因不动产纠纷提起的诉讼，由不动产所在地人民法院管辖…… 民诉法司法解释第28条 ：民事诉讼法第三十四条第一项规定的不动产纠纷是指因不动产的权利确认、分割、相邻关系等引起的物权纠纷。农村土地承包经营合同纠纷、房屋租赁合同纠纷、建设工程施工合同纠纷、政策性房屋买卖合同纠纷，按照不动产纠纷确定管辖。 建工司","slug":"争议解决-管辖","module":"12-争议解决实务","moduleName":"12 争议解决实务","tags":["建工","争议解决","管辖","裁判规则"],"wordCount":1945,"created":"2026-06-01","updated":"2026-06-02","content":"# 争议解决 - 管辖\n\n## 一、法律依据\n\n- **民诉法第34条**：下列案件，由本条规定的人民法院专属管辖：（一）因不动产纠纷提起的诉讼，由不动产所在地人民法院管辖……\n- **民诉法司法解释第28条**：民事诉讼法第三十四条第一项规定的不动产纠纷是指因不动产的权利确认、分割、相邻关系等引起的物权纠纷。农村土地承包经营合同纠纷、房屋租赁合同纠纷、建设工程施工合同纠纷、政策性房屋买卖合同纠纷，按照不动产纠纷确定管辖。\n- **建工司法解释一第1条**：建设工程施工合同纠纷包括建设工程施工合同纠纷、建设工程价款优先受偿权纠纷、建设工程分包合同纠纷、建设工程监理合同纠纷、装饰装修合同纠纷等。\n\n## 二、裁判规则要点\n\n### 规则1：施工合同纠纷专属管辖\n\n建设工程施工合同纠纷按照不动产纠纷确定管辖，由不动产所在地人民法院专属管辖，不适用合同纠纷一般管辖规则（被告住所地或合同履行地）。该专属管辖具有强制性，当事人不得协议变更。\n\n### 规则2：施工行为地为合同履行地\n\n即便不考虑专属管辖，建设工程施工合同纠纷以施工行为地为合同履行地，与不动产所在地一致。因此无论从哪个角度，不动产所在地法院均有管辖权。\n\n### 规则3：专属管辖的强制性\n\n专属管辖排除当事人协议约定其他法院管辖的效力。当事人在合同中约定由被告住所地或其他法院管辖的条款无效，但不影响仲裁条款的效力。\n\n### 规则4：仲裁条款与专属管辖的关系\n\n当事人约定仲裁的，仲裁优先于专属管辖。仲裁条款有效时，法院不受理案件，即便不动产所在地法院具有专属管辖权。\n\n### 规则5：多项目施工的管辖确定\n\n当事人就多个建设工程项目签订一份施工合同的，各不动产所在地法院均有管辖权。先受理的法院取得管辖权，后受理的法院应移送。\n\n## 三、司法观点分歧\n\n### 分歧1：设计、监理合同是否适用专属管辖\n\n- **肯定说**：建工司法解释一将设计、监理合同纳入建设工程施工合同纠纷范围，应适用专属管辖\n- **否定说**：设计、监理合同不涉及不动产施工行为，不应适用专属管辖\n- **实务现状**：各地法院认识不一，多数法院倾向于设计、监理合同不适用专属管辖\n\n### 分歧2：建设工程施工合同纠纷的范围\n\n- **广义说**：包括与建设工程相关的所有合同纠纷（施工、分包、监理、装饰装修等）\n- **狭义说**：仅指施工合同本身产生的纠纷\n- **主流观点**：参照建工司法解释一第1条确定范围\n\n### 分歧3：施工地点跨越多个行政区域的管辖\n\n- **分别管辖说**：各行政区域法院对本区域内施工部分享有管辖权\n- **主要施工地管辖说**：以主要施工行为所在地确定管辖\n- **实务做法**：多数法院以工程所在地（竣工验收备案地）确定管辖\n\n## 四、省/市高院指引差异\n\n| 地区 | 设计监理合同 | 管辖协议效力 | 多项目管辖 | 仲裁排除 |\n|------|-------------|-------------|-----------|---------|\n| 北京高院 | 不适用专属管辖 | 专属管辖，协议无效 | 先受理法院管辖 | 仲裁优先 |\n| 江苏高院 | 不适用专属管辖 | 专属管辖，协议无效 | 先受理法院管辖 | 仲裁优先 |\n| 浙江高院 | 不适用专属管辖 | 专属管辖，协议无效 | 主要施工地管辖 | 仲裁优先 |\n| 广东高院 | 不适用专属管辖 | 专属管辖，协议无效 | 先受理法院管辖 | 仲裁优先 |\n\n## 五、典型案例\n\n### 案例1：(2019)最高法民辖终153号\n\n**案情**：原告（承包人）在被告住所地法院起诉追讨工程款，被告提出管辖异议，主张应由工程所在地法院管辖。\n**裁判要旨**：建设工程施工合同纠纷属于专属管辖，应由不动产所在地法院管辖。当事人协议约定其他法院管辖的条款无效。本案移送工程所在地法院审理。\n\n### 案例2：(2020)苏民辖终236号\n\n**案情**：原告就设备采购安装合同纠纷向被告住所地法院起诉，被告主张该合同属于建设工程施工合同纠纷，应适用专属管辖。\n**裁判要旨**：设备采购安装合同以设备买卖为主、安装为辅的，不属于建设工程施工合同纠纷，不适用专属管辖。驳回管辖异议。\n\n### 案例3：(2021)浙民辖终89号\n\n**案情**：合同约定由甲方所在地法院管辖，承包人在甲方所在地法院起诉后，发包人提出应由工程所在地法院专属管辖。\n**裁判要旨**：建设工程施工合同纠纷属于专属管辖，协议管辖条款不能排除专属管辖的适用。移送工程所在地法院。\n\n## 六、实务指引\n\n### 律师代理要点\n\n1. **原告选择管辖**：起诉前确认工程所在地行政区域，向该区域法院起诉。如合同约定其他法院管辖，可主张专属管辖优"},{"id":"争议解决-诉讼时效","title":"争议解决 - 诉讼时效","excerpt":"争议解决 - 诉讼时效 一、法律依据 民法典第188条 ：向人民法院请求保护民事权利的诉讼时效期间为三年。法律另有规定的，依照其规定。诉讼时效期间自权利人知道或者应当知道权利受到损害以及义务人之日起计算。法律另有规定的，依照其规定。但是，自权利受到损害之日起超过二十年的，人民法院不予保护，有特殊情况的，人民法院可以根据权利人的申请决定延长。 民法典第195条 ：有下列情形之一的，诉讼时效中断，从中","slug":"争议解决-诉讼时效","module":"12-争议解决实务","moduleName":"12 争议解决实务","tags":["建工","争议解决","诉讼时效","裁判规则"],"wordCount":2241,"created":"2026-06-01","updated":"2026-06-02","content":"# 争议解决 - 诉讼时效\n\n## 一、法律依据\n\n- **民法典第188条**：向人民法院请求保护民事权利的诉讼时效期间为三年。法律另有规定的，依照其规定。诉讼时效期间自权利人知道或者应当知道权利受到损害以及义务人之日起计算。法律另有规定的，依照其规定。但是，自权利受到损害之日起超过二十年的，人民法院不予保护，有特殊情况的，人民法院可以根据权利人的申请决定延长。\n- **民法典第195条**：有下列情形之一的，诉讼时效中断，从中断、有关程序终结时起，诉讼时效期间重新计算：（一）权利人向义务人提出履行请求；（二）义务人同意履行义务；（三）权利人提起诉讼或者申请仲裁；（四）与提起诉讼或者申请仲裁具有同等效力的其他情形。\n- **建工司法解释一第27条**：利息从应付工程价款之日开始计付。当事人对付款时间没有约定或者约定不明的，下列时间视为应付款时间：（一）建设工程已实际交付的，为交付之日；（二）建设工程没有交付的，为提交竣工结算文件之日；（三）建设工程未交付，工程价款也未结算的，为当事人起诉之日。\n- **民法典第807条**：……承包人可以与发包人协议将该工程折价，也可以请求人民法院将该工程依法拍卖。建设工程的价款就该工程折价或者拍卖的价款优先受偿。\n- **建工司法解释一第41条**：承包人应当在合理期限内行使建设工程价款优先受偿权，但最长不得超过十八个月，自发包人应当给付建设工程价款之日起算。\n\n## 二、裁判规则要点\n\n### 规则1：3年普通诉讼时效\n\n建设工程施工合同纠纷适用3年普通诉讼时效。工程价款请求权、工期延误索赔权、质量保修期内的修复请求权等均适用3年时效。\n\n### 规则2：工程价款时效起算\n\n- 有约定付款日的，从约定付款日起算\n- 约定以审计结果为付款条件的，从审计结论出具日起算\n- 未约定付款日的，参照建工司法解释一第27条确定的应付款时间起算\n- 分期付款的，各期分别起算\n\n### 规则3：优先受偿权为除斥期间\n\n优先受偿权的18个月期限为除斥期间，不适用诉讼时效中断、中止、延长的规定。自发包人应当给付工程价款之日起算，超过18个月未行使的，优先受偿权消灭。\n\n### 规则4：质量保修期与诉讼时效\n\n质量保修期与诉讼时效并行。保修期内发现缺陷的，从发现之日起算3年诉讼时效；超过保修期发现的，从发现之日起算，但最长不超过竣工验收合格之日起20年。\n\n### 规则5：工期延误索赔的时效起算\n\n工期延误违约金的诉讼时效从延误事实确定之日起算。若延误系持续性的，从延误结束之日起算。\n\n## 三、司法观点分歧\n\n### 分歧1：以审计为付款条件的时效起算\n\n- **条件成就说**：审计结论出具前，付款条件未成就，诉讼时效不起算\n- **合理期限说**：审计超过合理期限的，视为条件成就，诉讼时效起算\n- **实务趋势**：多地高院倾向于审计应在合理期限内完成，超过合理期限的以提交结算文件之日起算\n\n### 分歧2：利息请求权的时效独立性\n\n- **从属说**：利息作为工程价款的从权利，与主债权适用同一诉讼时效\n- **独立说**：利息作为法定孳息，具有独立性，单独起算诉讼时效\n- **主流观点**：利息从应付之日起算诉讼时效，与本金债权分别计算\n\n### 分歧3：质量保修期与诉讼时效的关系\n\n- **保修期优先说**：保修期内未主张的，视为放弃权利\n- **并行说**：保修期与诉讼时效各自独立计算，保修期届满不影响诉讼时效\n- **主流观点**：保修期是质量保证期限，诉讼时效是权利保护期限，两者并行\n\n## 四、省/市高院指引差异\n\n| 地区 | 审计条件未成就 | 利息时效 | 保修期与时效 | 除斥期间 |\n|------|-------------|---------|-------------|---------|\n| 北京高院 | 合理期限后起算 | 从应付日起算 | 并行计算 | 18个月不变 |\n| 江苏高院 | 合理期限后起算 | 从应付日起算 | 并行计算 | 18个月不变 |\n| 浙江高院 | 合理期限后起算 | 从应付日起算 | 并行计算 | 18个月不变 |\n| 广东高院 | 合理期限后起算 | 从应付日起算 | 并行计算 | 18个月不变 |\n\n## 五、典型案例\n\n### 案例1：(2021)最高法民申5926号\n\n**案情**：承包人于2010年完成施工，2015年发包人出具结算审核报告，承包人2019年起诉追讨工程款。发包人主张已过诉讼时效。\n**裁判要旨**：合同约定以审计结论作为付款条件的，在审计结论出具前，付款条件未成就，诉讼时效不起算。但审计应在合理期限内完成，如发包人怠于审计的，以提交结算文件之日起算诉讼时效。本案审计结论2015年出具，承包人2019年起诉，已超过3年"},{"id":"争议解决-仲裁与诉讼选择","title":"争议解决 - 仲裁与诉讼选择","excerpt":"争议解决 - 仲裁与诉讼选择 一、法律依据 仲裁法第4条 ：当事人采用仲裁方式解决纠纷，应当双方自愿，达成仲裁协议。没有仲裁协议，一方申请仲裁的，仲裁委员会不予受理。 仲裁法第5条 ：当事人达成仲裁协议，一方向人民法院起诉的，人民法院不予受理，但仲裁协议无效的除外。 仲裁法第16条 ：仲裁协议包括合同中订立的仲裁条款和以其他书面方式在纠纷发生前或者纠纷发生后达成的请求仲裁的协议。仲裁协议应当具有下","slug":"争议解决-仲裁与诉讼选择","module":"12-争议解决实务","moduleName":"12 争议解决实务","tags":["建工","争议解决","仲裁","诉讼","裁判规则"],"wordCount":2201,"created":"2026-06-01","updated":"2026-06-02","content":"# 争议解决 - 仲裁与诉讼选择\n\n## 一、法律依据\n\n- **仲裁法第4条**：当事人采用仲裁方式解决纠纷，应当双方自愿，达成仲裁协议。没有仲裁协议，一方申请仲裁的，仲裁委员会不予受理。\n- **仲裁法第5条**：当事人达成仲裁协议，一方向人民法院起诉的，人民法院不予受理，但仲裁协议无效的除外。\n- **仲裁法第16条**：仲裁协议包括合同中订立的仲裁条款和以其他书面方式在纠纷发生前或者纠纷发生后达成的请求仲裁的协议。仲裁协议应当具有下列内容：（一）请求仲裁的意思表示；（二）仲裁事项；（三）选定的仲裁委员会。\n- **仲裁法司法解释第7条**：当事人约定争议可以向仲裁机构申请仲裁也可以向人民法院起诉的，仲裁协议无效。但一方向仲裁机构申请仲裁，另一方未在仲裁法第二十条第二款规定期间内提出异议的除外。\n- **建工司法解释一第43条**：实际施工人以转包人、违法分包人为被告起诉的，人民法院应当依法受理。实际施工人以发包人为被告主张权利的，人民法院应当追加转包人或者违法分包人为本案第三人，在查明发包人欠付转包人或者违法分包人建设工程价款的数额后，判决发包人在欠付建设工程价款范围内对实际施工人承担责任。\n\n## 二、裁判规则要点\n\n### 规则1：仲裁条款的效力要件\n\n仲裁条款有效须同时满足三个要件：（1）双方有明确的仲裁意思表示；（2）仲裁事项明确（约定\"因本合同产生的纠纷\"即为明确）；（3）选定了明确的仲裁委员会。缺少任一要件的，仲裁条款无效。\n\n### 规则2：实际施工人不受仲裁条款约束\n\n实际施工人以发包人为被告主张权利的，不受发包人与承包人之间仲裁条款的约束。仲裁条款仅约束签订仲裁协议的当事人，不能约束合同外的第三人。\n\n### 规则3：或裁或审条款无效\n\n当事人约定\"可以仲裁也可以诉讼\"或\"先仲裁后诉讼\"的，仲裁条款无效，当事人可以向法院起诉。但一方申请仲裁后另一方未在首次开庭前提出异议的，视为接受仲裁管辖。\n\n### 规则4：专属管辖与仲裁的关系\n\n建设工程施工合同纠纷虽属专属管辖，但当事人约定仲裁的，仲裁优先于法院管辖。仲裁条款有效时，法院不受理案件。\n\n### 规则5：仲裁裁决的撤销与不予执行\n\n仲裁裁决存在法定事由的，当事人可以申请撤销或不予执行。在建设工程领域，常见撤销事由包括：仲裁庭组成违法、超出仲裁协议范围、仲裁事项不属于仲裁协议约定范围等。\n\n## 三、司法观点分歧\n\n### 分歧1：实际施工人能否受仲裁条款约束\n\n- **不受约束说**：仲裁条款具有相对性，仅约束签订协议的当事人。实际施工人非仲裁协议当事人，不受约束\n- **受约束说**：实际施工人依据建工司法解释一第43条向发包人主张权利，实质上是代位行使承包人的权利，应受承包人与发包人仲裁条款的约束\n- **主流观点**：最高法院倾向于不受约束说，但各地法院仍有分歧\n\n### 分歧2：仲裁机构约定不明确的效力\n\n- **无效说**：仲裁法第16条要求选定仲裁委员会，约定不明确的应认定无效\n- **可补正说**：当事人可以补充约定，不能达成补充约定的才认定无效\n- **实务做法**：约定\"北京仲裁\"等不明确表述的，多数法院认定可以确定具体仲裁机构（如北京仲裁委员会），仲裁条款有效\n\n### 分歧3：分包合同中的仲裁条款效力\n\n- **独立说**：分包合同中的仲裁条款独立于总包合同，总包合同仲裁条款不影响分包合同\n- **关联说**：分包合同以总包合同为基础，总包合同仲裁条款应约束分包合同\n- **主流观点**：各合同中的仲裁条款独立，分别审查效力\n\n## 四、省/市高院指引差异\n\n| 地区 | 实际施工人与仲裁 | 或裁或审条款 | 约定不明确 | 仲裁优先 |\n|------|----------------|-------------|-----------|---------|\n| 北京高院 | 不受约束 | 无效 | 可确定则有效 | 仲裁优先于专属管辖 |\n| 江苏高院 | 不受约束 | 无效 | 可确定则有效 | 仲裁优先于专属管辖 |\n| 浙江高院 | 不受约束 | 无效 | 可确定则有效 | 仲裁优先于专属管辖 |\n| 广东高院 | 不受约束 | 无效 | 可确定则有效 | 仲裁优先于专属管辖 |\n\n## 五、典型案例\n\n### 案例1：(2019)最高法民特3号\n\n**案情**：发包人与承包人约定仲裁，实际施工人以发包人为被告向法院起诉，发包人提出管辖异议，主张应提交仲裁。\n**裁判要旨**：仲裁条款仅约束签订仲裁协议的当事人。实际施工人非仲裁协议当事人，不受仲裁条款约束，有权向法院起诉。驳回管辖异议。\n\n### 案例2：(2020)京04民特528号\n\n**案情**：合同约定\"发生争议提交北京仲裁委员会或工程所在地法院解决\"，一"},{"id":"诉讼策略-原告视角","title":"诉讼策略 - 原告视角","excerpt":"诉讼策略 - 原告视角 一、法律依据 民诉法第122条 ：起诉必须符合下列条件：（一）原告是与本案有直接利害关系的公民、法人和其他组织；（二）有明确的被告；（三）有具体的诉讼请求和事实、理由；（四）属于人民法院受理民事诉讼的范围和受诉人民法院管辖。 民诉法第104条 ：利害关系人因情况紧急，不立即申请保全将会使其合法权益受到难以弥补的损害的，可以在提起诉讼或者申请仲裁前向被保全财产所在地、被申请人","slug":"诉讼策略-原告视角","module":"12-争议解决实务","moduleName":"12 争议解决实务","tags":["建工","争议解决","诉讼策略","原告"],"wordCount":1928,"created":"2026-06-01","updated":"2026-06-02","content":"# 诉讼策略 - 原告视角\n\n## 一、法律依据\n\n- **民诉法第122条**：起诉必须符合下列条件：（一）原告是与本案有直接利害关系的公民、法人和其他组织；（二）有明确的被告；（三）有具体的诉讼请求和事实、理由；（四）属于人民法院受理民事诉讼的范围和受诉人民法院管辖。\n- **民诉法第104条**：利害关系人因情况紧急，不立即申请保全将会使其合法权益受到难以弥补的损害的，可以在提起诉讼或者申请仲裁前向被保全财产所在地、被申请人住所地或者对案件有管辖权的人民法院申请采取保全措施。申请人应当提供担保，不提供担保的，裁定驳回申请。\n- **建工司法解释一第26条**：当事人对欠付工程价款利息计付标准有约定的，按照约定处理。没有约定的，按照同期同类贷款利率或者同期贷款市场报价利率计息。\n- **建工司法解释一第43条**：实际施工人以转包人、违法分包人为被告起诉的，人民法院应当依法受理。实际施工人以发包人为被告主张权利的，人民法院应当追加转包人或者违法分包人为本案第三人。\n\n## 二、裁判规则要点\n\n### 规则1：诉讼请求设计应全面\n\n承包人起诉追讨工程款时，诉讼请求应包括：工程价款本金、利息、违约金（如有约定）、优先受偿权确认。诉讼请求设计不全面的，可能丧失部分权利。\n\n### 规则2：利息请求应明确计算方式\n\n利息请求应明确起止日期、利率标准、计算基数。未明确的，法院可能按照同期贷款市场报价利率（LPR）计算。\n\n### 规则3：优先受偿权需在诉讼中主张\n\n承包人应在诉讼请求中明确提出确认优先受偿权。未在诉讼中主张的，执行阶段可能无法主张。\n\n### 规则4：工程造价鉴定的申请\n\n当事人对工程价款有争议的，可申请工程造价鉴定。鉴定申请应在举证期限内提出，逾期提出的法院可能不予准许。\n\n### 规则5：财产保全应尽早申请\n\n建设工程案件标的额大、周期长，原告应在起诉时或起诉前申请财产保全，防止被告转移财产。\n\n## 三、司法观点分歧\n\n### 分歧1：利息起算时间\n\n- **约定优先说**：合同有约定的从约定\n- **实际交付说**：未约定的从工程交付之日起算\n- **起诉日说**：未交付且未结算的从起诉之日起算\n- **实务做法**：参照建工司法解释一第27条确定\n\n### 分歧2：鉴定申请时机\n\n- **严格说**：必须在举证期限内提出，逾期不予准许\n- **宽松说**：当事人在庭审中提出的，法院也应准许\n- **实务做法**：多数法院允许当事人在庭审辩论终结前提出鉴定申请\n\n### 分歧3：实际施工人的诉讼请求设计\n\n- **直接请求说**：实际施工人可以直接请求发包人在欠付范围内承担责任\n- **代位请求说**：实际施工人代位行使承包人对发包人的权利\n- **实务做法**：参照建工司法解释一第43条，追加转包人/违法分包人为第三人\n\n## 四、省/市高院指引差异\n\n| 地区 | 利息标准 | 鉴定申请时机 | 举证责任分配 | 财产保全担保 |\n|------|---------|-------------|-------------|-------------|\n| 北京高院 | LPR | 庭审辩论终结前 | 谁主张谁举证 | 等额担保 |\n| 江苏高院 | LPR | 庭审辩论终结前 | 谁主张谁举证 | 等额担保 |\n| 浙江高院 | LPR | 举证期限内 | 谁主张谁举证 | 等额担保 |\n| 广东高院 | LPR | 庭审辩论终结前 | 谁主张谁举证 | 等额担保 |\n\n## 五、典型案例\n\n### 案例1：(2021)最高法民终1305号\n\n**案情**：承包人起诉追讨工程款，诉讼请求仅列\"工程款xxx元\"，未主张利息和优先受偿权。一审判决后，承包人上诉增加利息和优先受偿权请求。\n**裁判要旨**：诉讼请求应在一审中明确提出。二审中增加诉讼请求的，法院不予审理，当事人可另行起诉。承包人丧失了在一审中主张利息和优先受偿权的机会。\n\n### 案例2：(2020)苏民终1832号\n\n**案情**：承包人起诉主张工程款，申请工程造价鉴定。发包人对鉴定结论提出异议，申请重新鉴定。\n**裁判要旨**：鉴定机构具有相应资质、鉴定程序合法、鉴定结论依据充分的，法院应予采信。发包人仅以鉴定结论不符合其预期为由申请重新鉴定的，不予准许。\n\n### 案例3：(2022)浙民终1205号\n\n**案情**：实际施工人以发包人为被告起诉，未追加转包人为第三人。发包人主张程序违法。\n**裁判要旨**：实际施工人以发包人为被告的，法院应依职权追加转包人或违法分包人为第三人。未追加的，属于程序违法，应发回重审。\n\n## 六、实务指引\n\n### 律师代理要点\n\n1. **起诉前准备**：全面收集证据，核实诉讼时效，设计完整的诉讼请求\n2."},{"id":"诉讼策略-被告视角","title":"诉讼策略 - 被告视角","excerpt":"诉讼策略 - 被告视角 一、法律依据 民法典第525条 ：当事人互负债务，没有先后履行顺序的，应当同时履行。一方在对方履行之前有权拒绝其履行请求。一方在对方履行债务不符合约定时，有权拒绝其相应的履行请求。 民法典第526条 ：当事人互负债务，有先后履行顺序，应当先履行债务一方未履行的，后履行一方有权拒绝其履行请求。先履行一方履行债务不符合约定的，后履行一方有权拒绝其相应的履行请求。 民诉法第143","slug":"诉讼策略-被告视角","module":"12-争议解决实务","moduleName":"12 争议解决实务","tags":["建工","争议解决","诉讼策略","被告"],"wordCount":2074,"created":"2026-06-01","updated":"2026-06-02","content":"# 诉讼策略 - 被告视角\n\n## 一、法律依据\n\n- **民法典第525条**：当事人互负债务，没有先后履行顺序的，应当同时履行。一方在对方履行之前有权拒绝其履行请求。一方在对方履行债务不符合约定时，有权拒绝其相应的履行请求。\n- **民法典第526条**：当事人互负债务，有先后履行顺序，应当先履行债务一方未履行的，后履行一方有权拒绝其履行请求。先履行一方履行债务不符合约定的，后履行一方有权拒绝其相应的履行请求。\n- **民诉法第143条**：原告增加诉讼请求，被告提出反诉，第三人提出与本案有关的诉讼请求，可以合并审理。\n- **建工司法解释一第12条**：因承包人的原因造成建设工程质量不符合约定，承包人拒绝修理、返工或者改建，发包人请求减少支付工程价款的，人民法院应予支持。\n- **建工司法解释一第14条**：建设工程未经竣工验收，发包人擅自使用后，又以使用部分质量不符合约定为由主张权利的，人民法院不予支持。\n\n## 二、裁判规则要点\n\n### 规则1：质量抗辩与反诉的选择\n\n发包人就工程质量问题可以提出抗辩（减少工程价款）或反诉（要求修复或赔偿损失）。抗辩无需缴纳诉讼费，反诉需缴纳诉讼费但可获得独立的给付判决。\n\n### 规则2：工期延误抗辩的举证责任\n\n发包人主张工期延误违约金的，应举证证明：（1）存在延误事实；（2）延误系承包人原因造成；（3）实际损失或约定违约金的计算依据。\n\n### 规则3：付款条件未成就的抗辩\n\n合同约定以审计、验收等作为付款条件的，发包人可以付款条件未成就为由抗辩。但发包人怠于促成条件成就的（如拒绝审计、拒绝验收），视为条件已成就。\n\n### 规则4：抵销权的行使\n\n发包人对承包人享有到期债权（如工期延误违约金、质量修复费用）的，可以在诉讼中主张抵销，减少应付工程款数额。\n\n### 规则5：反诉时机\n\n反诉应在举证期限届满前提出。逾期提出的，法院不予受理，当事人可另行起诉。\n\n## 三、司法观点分歧\n\n### 分歧1：质量抗辩与反诉的界限\n\n- **抗辩说**：发包人可以质量问题为由请求减少工程价款，无需反诉\n- **反诉说**：质量问题超出减少价款范围的（如要求赔偿损失），应提起反诉\n- **实务做法**：减少价款属于抗辩，赔偿损失属于反诉，两者可以并用\n\n### 分歧2：工期延误抗辩的举证标准\n\n- **严格说**：发包人应举证证明延误天数、延误原因、损失金额\n- **宽松说**：合同约定工期且实际超期的，推定承包人违约，由承包人举证延误系非其原因造成\n- **实务做法**：多数法院要求发包人举证延误事实，承包人举证延误原因\n\n### 分歧3：审计未完成能否抗辩付款\n\n- **肯定说**：合同约定以审计为付款条件的，审计未完成即付款条件未成就\n- **否定说**：审计应在合理期限内完成，超过合理期限的视为条件成就\n- **实务趋势**：多地高院倾向于审计应在合理期限内完成\n\n## 四、省/市高院指引差异\n\n| 地区 | 质量抗辩与反诉 | 工期延误举证 | 审计条件 | 反诉时机 |\n|------|-------------|-------------|---------|---------|\n| 北京高院 | 减价为抗辩，赔偿为反诉 | 发包人举证延误事实 | 合理期限 | 举证期限届满前 |\n| 江苏高院 | 减价为抗辩，赔偿为反诉 | 发包人举证延误事实 | 合理期限 | 举证期限届满前 |\n| 浙江高院 | 减价为抗辩，赔偿为反诉 | 发包人举证延误事实 | 合理期限 | 举证期限届满前 |\n| 广东高院 | 减价为抗辩，赔偿为反诉 | 发包人举证延误事实 | 合理期限 | 举证期限届满前 |\n\n## 五、典型案例\n\n### 案例1：(2021)最高法民终1985号\n\n**案情**：承包人起诉追讨工程款，发包人以工程质量问题抗辩，请求减少工程价款500万元。承包人主张质量问题应提起反诉，不应以抗辩方式提出。\n**裁判要旨**：发包人以工程质量问题请求减少工程价款的，属于抗辩，无需提起反诉。发包人举证证明存在质量缺陷且修复费用明确的，法院可以支持减少工程价款的请求。\n\n### 案例2：(2020)苏民终1508号\n\n**案情**：发包人反诉承包人工期延误违约金800万元，但未举证证明延误天数及延误原因。\n**裁判要旨**：发包人主张工期延误违约金的，应举证证明延误事实及延误原因。发包人仅提交工期对比表，未举证延误系承包人原因造成的，反诉请求不予支持。\n\n### 案例3：(2022)浙民终1052号\n\n**案情**：合同约定以审计结论为付款条件。工程竣工3年后审计仍未完成，承包人起诉追讨工程款。发包人以审计未完成抗辩。\n**裁判要旨**：审计应在合理期限内完成。工程竣工3年仍未完成审"},{"id":"争议解决-保全与执行","title":"争议解决 - 保全与执行","excerpt":"争议解决 - 保全与执行 一、法律依据 《中华人民共和国民事诉讼法》第104条： 利害关系人因情况紧急，不立即申请保全将会使其合法权益受到难以弥补的损害的，可以在提起诉讼或者申请仲裁前向被保全财产所在地、被申请人住所地或者对案件有管辖权的人民法院申请采取保全措施。申请人应当提供担保，不提供担保的，裁定驳回申请。人民法院接受申请后，必须在四十八小时内作出裁定；裁定采取保全措施的，应当立即开始执行。申","slug":"争议解决-保全与执行","module":"12-争议解决实务","moduleName":"12 争议解决实务","tags":["建工","争议解决","保全","执行","裁判规则"],"wordCount":2527,"created":"2026-06-01","updated":"2026-06-02","content":"# 争议解决 - 保全与执行\n\n## 一、法律依据\n\n**《中华人民共和国民事诉讼法》第104条：** 利害关系人因情况紧急，不立即申请保全将会使其合法权益受到难以弥补的损害的，可以在提起诉讼或者申请仲裁前向被保全财产所在地、被申请人住所地或者对案件有管辖权的人民法院申请采取保全措施。申请人应当提供担保，不提供担保的，裁定驳回申请。人民法院接受申请后，必须在四十八小时内作出裁定；裁定采取保全措施的，应当立即开始执行。申请人在人民法院采取保全措施后三十日内不依法提起诉讼或者申请仲裁的，人民法院应当解除保全。\n\n**《中华人民共和国民事诉讼法》第247条：** 发生法律效力的民事判决、裁定，当事人必须履行。一方拒绝履行的，对方当事人可以向人民法院申请执行，也可以由审判员移送执行员执行。\n\n**《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第35条：** 与发包人订立建设工程施工合同的承包人，依据民法典第八百零七条的规定请求其承建工程的价款就工程折价或者拍卖的价款优先受偿的，人民法院应予支持。\n\n## 二、裁判规则要点\n\n### 规则1：财产保全的申请时机与担保要求\n诉前保全：起诉前30日内申请，必须提供担保，法院48小时内裁定。诉中保全：诉讼过程中申请，法院可责令提供担保。建设工程案件标的额大，法院通常要求等额或高额担保。\n\n### 规则2：建设工程领域常见保全对象\n发包人银行账户、名下房产（含在建工程）、对外投资股权、对第三人的到期债权均可作为保全对象。在建工程保全的，不影响承包人优先受偿权的行使。\n\n### 规则3：优先受偿权在执行中的主张\n承包人主张建设工程价款优先受偿权的，应在执行程序中主动申报并提供证据。优先受偿权优先于抵押权和其他普通债权，但不得对抗已支付大部分购房款的消费者。\n\n### 规则4：实际施工人的执行路径\n生效判决确定发包人在欠付工程款范围内承担责任的，实际施工人可直接申请执行发包人财产，金额以欠付工程款为限。\n\n### 规则5：到期债权的执行\n发包人对第三人享有到期债权的，法院可依申请向第三人发出履行通知。第三人15日内不提出异议又不履行的，法院可裁定对其强制执行。\n\n### 规则6：保全错误的损害赔偿\n申请人申请保全错误造成被申请人损失的，应承担赔偿责任。认定标准包括：诉讼请求被全部驳回、保全金额明显超出诉讼请求、恶意保全等。\n\n## 三、司法观点分歧\n\n### 争议1：优先受偿权能否在执行程序中首次主张\n\n**肯定说：** 优先受偿权属于法定权利，承包人可在执行程序中首次主张，无需在诉讼中提出。\n**否定说：** 优先受偿权应通过诉讼确认，执行程序中仅能就已确认的权利进行分配。\n**主流立场：** 承包人应在诉讼中主张优先受偿权。如诉讼中未主张，执行阶段一般不予支持，但可另行起诉确认。\n\n### 争议2：在建工程保全是否影响承包人优先受偿权\n\n**影响说：** 保全措施限制了工程的处分，应暂停施工或解除保全。\n**不影响说：** 承包人优先受偿权为法定权利，保全措施不能对抗，承包人可继续施工并主张优先受偿。\n**主流立场：** 在建工程保全不影响承包人优先受偿权的行使，但保全法院应通知承包人，保障其知情权和异议权。\n\n### 争议3：多个承包人优先受偿权竞合时的处理\n\n**按比例分配说：** 多个承包人对同一工程享有优先受偿权的，按债权比例分配。\n**先到先得说：** 先行主张的承包人优先受偿。\n**主流立场：** 各承包人就其承建部分分别享有优先受偿权，互不冲突；对同一部分的，按债权比例分配。\n\n## 四、省/市高院指引差异\n\n| 省/市 | 文件 | 保全担保要求 | 优先受偿权执行 | 到期债权执行 |\n| --- | --- | --- | --- | --- |\n| 北京 | 高院解答 | 等额担保，可接受保函 | 诉讼中主张，执行中申报 | 第三人15日内可异议 |\n| 江苏 | 高院指南（2018） | 等额担保，特殊情况可降低 | 诉讼中主张，执行中审查 | 第三人15日内可异议 |\n| 浙江 | 高院解答 | 等额担保 | 诉讼中主张，执行中优先分配 | 第三人15日内可异议 |\n| 广东 | 高院疑难问题解答（2017） | 等额担保，可接受保函 | 诉讼中主张，执行中确认 | 第三人15日内可异议 |\n| 四川+重庆 | 联合解答（2022） | 等额担保 | 诉讼中主张，执行中优先 | 第三人15日内可异议 |\n| 山东 | 高院解答（2020） | 等额担保 | 诉讼中主张，执行中申报 | 第三人15日内可异议 |\n| 上海 | 高院解答 | 等额担保，可接受保函 | 诉讼中主张，执行中审查 | 第三人15日内可异议 |\n| 深圳 | 中院裁判指引（"},{"id":"争议解决实务-常见问题faq","title":"争议解决实务 - 常见问题FAQ","excerpt":"争议解决实务 - 常见问题FAQ 管辖 Q1：建设工程施工合同纠纷由哪个法院管辖？ A ：由不动产所在地人民法院专属管辖，即工程所在地法院（民事诉讼法第34条）。当事人不能协议约定其他法院管辖，但可以约定仲裁。 注意 ：专属管辖不适用协议管辖。即使合同约定 由甲方所在地法院管辖 ，该条款也因违反专属管辖而无效。 Q2：约定仲裁的，能否向法院起诉？ A ：不能。仲裁协议有效的，法院不予受理；但仲裁协","slug":"争议解决实务-常见问题faq","module":"12-争议解决实务","moduleName":"12 争议解决实务","tags":["建工","争议解决","FAQ"],"wordCount":1222,"created":"2026-06-01","updated":"2026-06-02","content":"# 争议解决实务 - 常见问题FAQ\n\n## 管辖\n\n### Q1：建设工程施工合同纠纷由哪个法院管辖？\n**A**：由不动产所在地人民法院专属管辖，即工程所在地法院（民事诉讼法第34条）。当事人不能协议约定其他法院管辖，但可以约定仲裁。\n\n**注意**：专属管辖不适用协议管辖。即使合同约定\"由甲方所在地法院管辖\"，该条款也因违反专属管辖而无效。\n\n### Q2：约定仲裁的，能否向法院起诉？\n**A**：不能。仲裁协议有效的，法院不予受理；但仲裁协议无效的除外。仲裁协议无效的情形：约定的仲裁机构不存在、仲裁事项超出范围、无民事行为能力人签订等。\n\n## 诉讼时效\n\n### Q3：工程款的诉讼时效从何时起算？\n**A**：有约定付款日的，从约定付款日起算3年；未约定的，一般从工程交付日或提交结算文件日起算。利息债权随主债权适用同一时效。\n\n**实务提示**：承包人应注意诉讼时效管理，定期发送催款函（保留送达证据）以中断时效。\n\n### Q4：优先受偿权的行使期限是多久？\n**A**：18个月，自发包人应当给付工程价款之日起算（司法解释一第41条）。注意：这是除斥期间，不适用中止、中断规定。超过18个月的优先受偿权消灭。\n\n## 仲裁\n\n### Q5：实际施工人能否依据发包人与承包人的仲裁协议申请仲裁？\n**A**：存在争议。实际施工人并非仲裁协议当事人，发包人提出管辖异议的，仲裁裁决可能被撤销。但部分仲裁机构认可实际施工人依据代位权提起仲裁。\n\n### Q6：仲裁裁决被撤销后怎么办？\n**A**：仲裁裁决被撤销的，当事人可以重新达成仲裁协议申请仲裁，也可以向有管辖权的法院起诉。\n\n## 诉讼策略\n\n### Q7：承包人起诉追讨工程款，诉讼请求应如何设计？\n**A**：一般包括：（1）工程价款（或折价补偿款）；（2）利息（明确起止日期和利率标准）；（3）优先受偿权声明（如适用）；（4）违约金（如适用）；（5）诉讼费、保全费由被告承担。\n\n**实务提示**：诉讼请求应具体明确，利息计算应写明基数、利率、起止日期。\n\n### Q8：发包人收到工程款诉讼后，可以提起哪些反诉？\n**A**：常见反诉包括：（1）工期延误违约金；（2）质量修复费用；（3）超付工程款返还；（4）因承包人原因造成的其他损失。\n\n### Q9：如何选择诉讼还是仲裁？\n**A**：诉讼优势：专属管辖确定性强、上诉权保障、执行力度大。仲裁优势：一裁终局效率高、保密性强、可选择专业仲裁员。建议根据案件复杂程度和保密需求选择。\n\n## 保全与执行\n\n### Q10：起诉前能否申请财产保全？\n**A**：可以。诉前保全需在起诉前30日内申请，并提供担保（民事诉讼法第104条）。保全对象包括发包人银行账户、不动产、应收账款等。\n\n**实务提示**：诉前保全对追讨工程款非常有效，建议在起诉前即申请保全。\n\n### Q11：优先受偿权在执行中如何主张？\n**A**：承包人应在执行程序中主动申报优先受偿权，法院审查后在分配方案中优先安排。优先受偿权优于抵押权和其他债权（司法解释一第36条）。\n\n### Q12：发包人无财产可供执行怎么办？\n**A**：可以追加以下主体：（1）发包人的股东（未实缴出资的）；（2）发包人的关联公司（人格混同的）；（3）到期债务的次债务人（代位权）。\n\n## 交叉引用\n- → [[01-管辖|管辖]]\n- → [[02-诉讼时效|诉讼时效]]\n- → [[03-仲裁与诉讼选择|仲裁与诉讼选择]]\n- → [[04-诉讼策略-原告视角|原告策略]]\n- → [[05-诉讼策略-被告视角|被告策略]]\n- → [[06-保全与执行|保全与执行]]"},{"id":"审判指引汇编-总览","title":"审判指引汇编 - 总览","excerpt":"审判指引汇编 - 总览 一、最高人民法院 文件 发布日期 链接 状态 建工司法解释一（法释〔2020〕25号） 2021-01-01 全文 现行有效 建工司法解释二（征求意见稿） 2025-11-24 全文 征求意见中 法官会议纪要8则 2021-2022 全文 现行有效 二、省高院指引 省份 文件名称 发布日期 链接 来源类型 江苏 建设工程施工合同纠纷案件诉讼指引 2019-12 全文 媒体转","slug":"审判指引汇编-总览","module":"13-审判指引汇编","moduleName":"13 审判指引汇编","tags":["建工","审判指引","省高院","中院","总览"],"wordCount":1127,"created":"2026-06-01","updated":"2026-06-01","content":"# 审判指引汇编 - 总览\n\n## 一、最高人民法院\n\n| 文件 | 发布日期 | 链接 | 状态 |\n|------|---------|------|------|\n| 建工司法解释一（法释〔2020〕25号） | 2021-01-01 | [全文](01-最高院-司法解释一全文.md) | 现行有效 |\n| 建工司法解释二（征求意见稿） | 2025-11-24 | [全文](02-最高院-司法解释二征求意见稿全文.md) | 征求意见中 |\n| 法官会议纪要8则 | 2021-2022 | [全文](03-最高院-法官会议纪要8则.md) | 现行有效 |\n\n## 二、省高院指引\n\n| 省份 | 文件名称 | 发布日期 | 链接 | 来源类型 |\n|------|---------|---------|------|---------|\n| 江苏 | 建设工程施工合同纠纷案件诉讼指引 | 2019-12 | [全文](04-江苏高院指引全文.md) | 媒体转载 |\n| 浙江 | 关于审理建设工程施工合同纠纷案件若干疑难问题的解答 | 2012 | [全文](05-浙江高院指引全文.md) | 法律平台 |\n| 广东 | 关于审理建设工程合同纠纷案件疑难问题的解答 | 2017 | [全文](06-广东高院指引全文 2020年12月29日\n**施行日期**：2021年1月1日\n**来源链接**：[最高人民法院公报](http://gongbao.court.gov.cn/Details/4c3533fb2e2d4096b4e0f5bb31c2a721.html)\n\n---\n\n为正确审理建设工程施工合同纠纷案件，依法保护当事人合法权益，维护建筑市场秩序，促进建筑市场健康发展，根据《中华人民共和国民法典》《中华人民共和国建筑法》《中华人民共和国招标投标法》《中华人民共和国民事诉讼法》等相关法律规定，结合审判实践，制定本解释。\n\n**第一条** 建设工程施工合同具有下列情形之一的，应当依据民法典第一百五十三条第一款的规定，认定无效：\n\n（一）承包人未取得建筑业企业资质或者超越资质等级的；\n\n（二）没有资质的实际施工人借用有资质的建筑施工企业名义的；\n\n（三）建设工程必须进行招标而未招标或者中标无效的。\n\n承包人因转包、违法分包建设工程与他人签订的建设工程施工合同，应当依据民法典第一百五十三条第一款及第七百九十一条第二款、第三款的规定，认定无效。\n\n**第二条** 招标人和中标人另行签订的工程范围、建设工期、工程质量、工程价款等实质性内容，与中标合同不一致，一方当事人请求按照中标合同确定权利义务的，人民法院应予支持。\n\n招标人和中标人在中标合同之外就明显高于市场价格购买承建房产、无偿建设住房配套设施、让利、向建设单位捐赠财物等另行签订合同，变相降低工程价款，一方当事人以该合同背离中标合同实质性内容为由请求确认无效的，人民法院应予支持。\n\n**第三条** 当事人以发包人未取得建设工程规划许可证等规划审批手续为由，请求确认建设工程施工合同无效的，人民法院应予支持，但发包人在起诉前取得建设工程规划许可证等规划审批手续的除外。\n\n发包人能够办理审批手续而未办理，并以未办理审批手续为由请求确认建设工程施工合同无效的，人民法院不予支持。\n\n**第四条** 承包人超越资质等级许可的业务范围签订建设工程施工合同，在建设工程竣工前取得相应资质等级，当事人请求按照无效合同处理的，人民法院不予支持。\n\n**第五条** 具有劳务作业法定资质的承包人与总承包人、分包人签订的劳务分包合同，当事人请求确认无效的，人民法院不予支持。\n\n**第六条** 建设工程施工合同无效，一方当事人请求对方赔偿损失的，人民法院应当就对方是否有过错、损失大小、过错与损失之间的因果关系以及当事人是否采取适当措施防止损失扩大等问题进行审查。当事人有过错的，应当各自承担相应的责任。\n\n损失大小无法确定，一方当事人请求参照合同约定的质量标准、建设工期、工程价款支付时间等内容确定损失大小的，人民法院可以结合双方过错程度、过错与损失之间的因果关系等因素作出裁判。\n\n**第七条** 缺乏资质的单位或者个人借用有资质的建筑施工企业名义签订建设工程施工合同，发包人请求出借方与借用方对建设工程质量不合格等因出借资质造成的损失承担连带赔偿责任的，人民法院应予支持。\n\n**第八条** 当事人对建设工程开工日期有争议的，人民法院应当分别按照以下情形予以认定：\n\n（一）开工日期为发包人或者监理人发出的开工通知载明的开工日期；开工通知发出后，尚不具备开工条件的，以开工条件具备的时间为开工日期；因承包人原因导致开工时间推迟的，以开工通知载明的时间为开工日期。\n\n（二）承包人经发包人同意已经实际进场施工的，以实际进场施工时间为开工日期。\n\n（三）发包人或者监理人未发出开工通知，亦无相关证据证明实际开工日期的，应当综合考虑开工报告、合同、施工许可证、竣工验收报告或者竣工验收备案表等载明的时间，并结合是否具备开工条件的事实，认定开工日期。\n\n**第九条** 当事人对建设工程实际竣工日期有争议的，人民法院应当分别按照以下情形予以认定：\n\n（一）建设工程经竣工验收合格的，以竣工验收合格之日为竣工日期；\n\n（二）承包人已经提交竣工验收报告，发包人拖延验收的，以承包人提交验收报告之日为竣工日期；\n\n（三）建设工程未经竣工验收，发包人擅自使用的，以转移占有建设工程之日为竣工日期。\n\n**第十条** 当事人约定顺延工期应当经发包人或者监理人签证等方式确认，承包人虽未取得工期顺延的确认，但能够证明在合同约定的期限内向发包人或者监理人申请过工期顺延且顺延事由符合合同约定，承包人以此为由主张工期顺延的，人民法院应予支持。\n\n当事人约定承包人未在约定期限内提出工期顺延申请视为工期不顺延的，按照约定处理，但发包人在约定期限后同意工期顺延或者承包人提出合理抗辩的除外。\n\n**第十一条** 建设工程竣工前，当事人对工程质量发"},{"id":"建工司法解释二征求意见稿全文","title":"建工司法解释二征求意见稿全文","excerpt":"最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（二）（征求意见稿） 发布日期 ：2025年11月24日 来源链接 ： 最高人民法院 为正确审理建设工程施工合同纠纷案件，依法保护当事人合法权益，根据《中华人民共和国民法典》《中华人民共和国建筑法》《中华人民共和国招标投标法》《中华人民共和国民事诉讼法》等相关法律规定，结合审判实践，制定本解释。 第一条 建设工程施工合同订立时属于必须招","slug":"建工司法解释二征求意见稿全文","module":"13-审判指引汇编","moduleName":"13 审判指引汇编","tags":["建工","司法解释","最高院","征求意见稿","全文"],"wordCount":3101,"created":"2026-06-01","updated":"2026-06-01","content":"# 最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（二）（征求意见稿）\n\n**发布日期**：2025年11月24日\n**来源链接**：[最高人民法院](https://www.court.gov.cn/hudong/xiangqing/482211.html)\n\n---\n\n为正确审理建设工程施工合同纠纷案件，依法保护当事人合法权益，根据《中华人民共和国民法典》《中华人民共和国建筑法》《中华人民共和国招标投标法》《中华人民共和国民事诉讼法》等相关法律规定，结合审判实践，制定本解释。\n\n**第一条** 建设工程施工合同订立时属于必须招标的工程项目，当事人未进行招标投标而订立合同，起诉时该工程项目不属于必须进行招标的，人民法院不应以未进行招标认定合同无效。\n\n**第二条** 在确定中标人前，招标人、投标人以意向书、会议纪要或者补充协议等形式就工程价款等实质性内容进行谈判并且参与谈判的投标人中标，或者发包人与承包人经协商订立施工合同后又通过招标投标程序与承包人订立建设工程施工合同，当事人以中标合同违反招标投标法第三十二条、第四十三条、第五十三条、第五十五条规定为由主张无效的，人民法院应予支持。\n\n**第三条** 具有下列情形之一，当事人以承包人未取得建筑业企业资质为由主张建设工程施工合同无效的，人民法院不予支持：\n\n（一）承包人签订合同时具备相应资质等级，但因经营不善等非合同原因导致资质等级降低的；\n\n（二）承包人在诉讼前补正资质的。\n\n**第四条** 建设工程依法必须进行招标但中标无效，当事人以中标合同为依据请求折价补偿的，人民法院应当结合当事人过错、工程质量等情况，参照中标合同关于工程价款的约定确定折价补偿的数额。\n\n**第五条** 建设工程施工合同具有下列情形之一，当事人请求确认无效的，人民法院不予支持：\n\n（一）承包人未取得建筑业企业资质，但工程所在地省级住房城乡建设主管部门许可承接该工程的；\n\n（二）超越资质等级许可的业务范围承接工程，但该资质等级许可的业务范围不包括该工程的。\n\n**第六条** 发包人未取得建设工程规划许可证等规划审批手续，承包人请求确认建设工程施工合同无效的，人民法院应予支持，但发包人在一审法庭辩论终结前取得建设工程规划许可证等规划审批手续的除外。\n\n**第七条** 当事人以发包人未办理施工许可证为由主张建设工程施工合同无效的，人民法院不予支持。\n\n**第八条** 承包人具有下列情形之一，发包人请求解除建设工程施工合同的，人民法院应予支持：\n\n（一）明确表示或者以行为表明不履行合同主要义务的；\n\n（二）合同约定的期限内未完工，且在发包人催告的合理期限内仍未完工的；\n\n（三）已经完成的建设工程质量不合格，并拒绝修复的；\n\n（四）将承包的建设工程转包、违法分包的。\n\n**第九条** 发包人具有下列情形之一，致使承包人无法施工，且在催告的合理期限内仍未履行相应义务，承包人请求解除建设工程施工合同的，人民法院应予支持：\n\n（一）未按约定支付工程价款的；\n\n（二）提供的主要建筑材料、建筑构配件和设备不符合强制性标准的；\n\n（三）不履行合同约定的协助义务的。\n\n**第十条** 建设工程施工合同约定按照固定总价结算工程价款，因设计变更等非承包人原因导致实际施工工程超出约定的施工范围，建设工程经验收合格，建设工程施工合同没有约定且不能协商一致，当事人请求参照合同订立时建设工程所在地建设行政主管部门发布的计价方法或者计价标准结算超出部分工程价款的，人民法院应予支持。\n\n**第十一条** 建设工程施工合同约定按照固定总价结算工程价款，工程未竣工即解除合同，已施工部分质量合格且当事人就价款不能协商一致的，当事人请求参照合同签订时建设工程所在地建设行政主管部门发布的计价方法或者计价标准及建设施工领域相关规范确定承包人已施工部分工程价款占全部工程的价款比例，并以该比例乘以合同约定固定价款确定承包人应得工程价款的，人民法院应予支持。\n\n**第十二条** 民法典第七百九十三条第一款中\"参照合同关于工程价款的约定\"，包括参照建设工程施工合同约定的工程价款总金额、计价方式、工程价款的支付时间、工程价款调整。\n\n**第十三条** 建设工程施工合同无效，发包人和承包人就承包人应得折价补偿款达成协议，一方当事人主张按照该协议确定双方权利义务的，人民法院依法予以支持。\n\n发包人、承包人与接受转包或者违法分包的单位或者个人就折价补偿款达成的协议，参照前款规定处理。\n\n**第十四条** 发包人与承包人约定工程价款按照审计机关的审计结果或者财政评审机构的评审结论确定，非因承包人的原因导致审计机关或者财政评审机构未在合理期限内出具审计结果或者评审结论，或者承包人有证据证明审计结果或者评审结论与合同约定或者当事人履行情况明显不符，承包人申请"},{"id":"最高院法官会议纪要-建设工程相关8则","title":"最高院法官会议纪要 - 建设工程相关8则","excerpt":"最高人民法院民事审判第一庭法官会议纪要（建设工程相关8则） 发布机构 ：最高人民法院民事审判第一庭 发布时间 ：2021-2022年 说明 ：法官会议纪要虽非司法解释，但对全国法院审理建设工程案件具有重要指导意义 纪要1（2021年第20次）：借用资质的实际施工人权利 问题 ：借用资质的实际施工人能否向发包人主张工程款？ 意见 ：在发包人知道或应当知道系借用资质的实际施工人进行施工的情况下，发包人","slug":"最高院法官会议纪要-建设工程相关8则","module":"13-审判指引汇编","moduleName":"13 审判指引汇编","tags":["建工","法官会议纪要","最高院","全文"],"wordCount":1334,"created":"22026-06-01","updated":"2026-06-01","content":"# 最高人民法院民事审判第一庭法官会议纪要（建设工程相关8则）\n\n**发布机构**：最高人民法院民事审判第一庭\n**发布时间**：2021-2022年\n**说明**：法官会议纪要虽非司法解释，但对全国法院审理建设工程案件具有重要指导意义\n\n---\n\n## 纪要1（2021年第20次）：借用资质的实际施工人权利\n\n**问题**：借用资质的实际施工人能否向发包人主张工程款？\n\n**意见**：在发包人知道或应当知道系借用资质的实际施工人进行施工的情况下，发包人与借用资质的实际施工人之间形成事实上的建设工程施工合同关系，借用方可请求参照合同约定折价补偿。\n\n**要点**：\n- 借用资质的实际施工人不能直接适用司法解释一第43条\n- 但发包人知情的，形成事实合同关系\n- 借用方可直接向发包人主张折价补偿\n\n## 纪要2（2021年第21次）：管理费条款效力\n\n**问题**：转包、违法分包合同中的管理费条款是否有效？\n\n**意见**：转包合同、违法分包合同及借用资质合同均无效，其中关于管理费的约定亦无效。承包人或者出借资质的建筑企业请求实际施工人按照合同约定支付管理费的，不予支持。\n\n**要点**：\n- 管理费条款因合同无效而不受保护\n- 管理费实质是违法套利，属于违法收益\n- 已收取的管理费不予返还，但也不支持继续支付\n\n## 纪要3：实际施工人突破合同相对性\n\n**问题**：多层转包、违法分包关系中的实际施工人能否突破合同相对性？\n\n**意见**：基于多次分包或者转包而实际施工的人，向与其无合同关系的人主张因施工而产生折价补偿款没有法律依据。突破合同相对性原则请求发包人在欠付工程款范围内承担责任的实际施工人不包括借用资质及多层转包和违法分包关系中的实际施工人。\n\n**要点**：\n- 实际施工人仅限于与转包人/违法分包人有直接合同关系的施工人\n- 多层转包中的下游施工人不能直接向发包人主张\n- 借用资质的实际施工人不适用第43条\n\n## 纪要4：优先受偿权的行使方式\n\n**问题**：承包人如何行使建设工程价款优先受偿权？\n\n**意见**：承包人行使优先受偿权的方式包括与发包人协商折价和申请法院拍卖。在执行程序中，承包人向执行法院主张优先受偿权的，视为行使了优先受偿权。\n\n## 纪要5：优先受偿权与放弃\n\n**问题**：承包人放弃优先受偿权的约定是否有效？\n\n**意见**：发包人与承包人约定放弃或者限制建设工程价款优先受偿权，损害建筑工人利益的，放弃行为无效。不损害工人利益的，放弃有效但仅对该抵押权人产生清偿顺位劣后的效果。\n\n## 纪要6：工期顺延的认定\n\n**问题**：承包人未在约定期限内申请工期顺延，是否丧失顺延权利？\n\n**意见**：当事人约定承包人未在约定期限内提出工期顺延申请视为工期不顺延的，按约定处理。但发包人在约定期限后同意工期顺延或者承包人提出合理抗辩的除外。\n\n## 纪要7：质量保证金返还\n\n**问题**：质量保证金的返还条件和时间？\n\n**意见**：质量保证金返还期限从竣工验收合格之日起算。未约定返还期限的，自竣工验收合格之日起满二年。发包人返还质量保证金后，不影响承包人根据合同约定或法律规定履行保修义务。\n\n## 纪要8：实际施工人的代位权\n\n**问题**：实际施工人能否行使代位权？\n\n**意见**：实际施工人依据民法典第538条规定，以转包人或者违法分包人怠于向发包人行使到期债权或者与该债权有关的从权利，影响其到期债权实现，提起代位权诉讼的，人民法院应予支持。\n\n---\n\n## 交叉引用\n- → [[00-指引总览|指引总览]]\n- → [[07-实际施工人/02-法律规范|实际施工人法律规范]]\n- → [[08-优先受偿权/02-法律规范|优先受偿权法律规范]]"},{"id":"江苏高院-建设工程施工合同纠纷案件诉讼指引","title":"江苏高院 - 建设工程施工合同纠纷案件诉讼指引","excerpt":"江苏省高级人民法院建设工程施工合同纠纷案件诉讼指引 发布机构 ：江苏省高级人民法院民事审判第六庭 发布日期 ：2019年12月24日 来源链接 ： 搜狐转载 文件类型 ：诉讼指引（第一版） 一、管辖问题的确定 建设工程施工合同纠纷适用不动产专属管辖，由建设工程所在地人民法院管辖。当事人约定管辖的，不得违反专属管辖的规定。 二、举证不能的风险 举证不能的诉讼风险包括败诉。即便事实客观存在，无充分证据","slug":"江苏高院-建设工程施工合同纠纷案件诉讼指引","module":"13-审判指引汇编","moduleName":"13 审判指引汇编","tags":["建工","审判指引","江苏高院","全文"],"wordCount":658,"created":"2026-06-01","updated":"2026-06-01","content":"# 江苏省高级人民法院建设工程施工合同纠纷案件诉讼指引\n\n**发布机构**：江苏省高级人民法院民事审判第六庭\n**发布日期**：2019年12月24日\n**来源链接**：[搜狐转载](https://sohu.com/a/363284331_169411)\n**文件类型**：诉讼指引（第一版）\n\n---\n\n## 一、管辖问题的确定\n\n建设工程施工合同纠纷适用不动产专属管辖，由建设工程所在地人民法院管辖。当事人约定管辖的，不得违反专属管辖的规定。\n\n## 二、举证不能的风险\n\n举证不能的诉讼风险包括败诉。即便事实客观存在，无充分证据则主张不被支持。当事人应在举证期限内提交证据材料。\n\n## 三、诉讼准备的事项\n\n1. 明确诉讼请求（工程价款、利息、违约金、优先受偿权等）\n2. 收集并整理证据材料\n3. 确定被告及第三人\n4. 申请财产保全（如需要）\n\n## 四、证据编排指引\n\n- 施工合同及补充协议\n- 签证、变更通知\n- 竣工验收报告\n- 结算文件及送达凭证\n- 付款记录\n- 施工日志、监理日志\n\n## 五、质证程序的参与\n\n当事人应积极参与质证程序，对对方提交的证据发表质证意见。\n\n## 六、司法鉴定的适用\n\n- 鉴定申请应在举证期限届满前或法院指定期限内提出书面申请\n- 逾期提出鉴定申请对案件基本事实有重大影响的可予准许，但应依法予以训诫、罚款\n- 拒不缴纳鉴定费致使鉴定不能的，承担举证不能的不利后果\n\n## 七、专家辅助人的提出\n\n当事人可在举证期限届满前申请1-2名专家辅助人出庭，就鉴定意见或者专业问题提出意见。\n\n---\n\n## 江苏高院其他相关文件\n\n- 《江苏省高级人民法院关于审理建设工程施工合同纠纷案件若干问题的意见》（2008年）\n- 《江苏省高级人民法院建设工程施工合同案件审理指南》（2010年）\n\n## 交叉引用\n- → [[00-指引总览|指引总览]]\n- → [[01-合同效力/16-省高院指引对比|合同效力-省高院指引对比]]"},{"id":"浙江高院-建设工程疑难问题解答","title":"浙江高院 - 建设工程疑难问题解答","excerpt":"浙江省高级人民法院 - 建设工程疑难问题解答 发布机构 ：浙江省高级人民法院 说明 ：浙江高院关于建设工程施工合同纠纷的疑难问题解答，涉及合同效力、工程价款、优先受偿权等多个方面 主要内容摘要 一、合同效力 非强制招标项目自愿招标的，也应受招标投标法约束 无论中标合同是否备案，都应以中标合同作为结算依据 二、工程价款结算 固定价合同因设计变更导致工程量增减的，增减部分可参照合同约定的计价方式结算 ","slug":"浙江高院-建设工程疑难问题解答","module":"13-审判指引汇编","moduleName":"13 审判指引汇编","tags":["建工","审判指引","浙江高院","全文"],"wordCount":420,"created":"2026-06-01","updated":"2026-06-01","content":"# 浙江省高级人民法院 - 建设工程疑难问题解答\n\n**发布机构**：浙江省高级人民法院\n**说明**：浙江高院关于建设工程施工合同纠纷的疑难问题解答，涉及合同效力、工程价款、优先受偿权等多个方面\n\n---\n\n## 主要内容摘要\n\n### 一、合同效力\n- 非强制招标项目自愿招标的，也应受招标投标法约束\n- 无论中标合同是否备案，都应以中标合同作为结算依据\n\n### 二、工程价款结算\n- 固定价合同因设计变更导致工程量增减的，增减部分可参照合同约定的计价方式结算\n- 实际履行的合同难以确定的，参照最后签订的合同结算\n\n### 三、优先受偿权\n- 涉及优先受偿权执行的相关解答\n\n### 四、项目部相关\n- 涉项目部解答（2020）：明确了项目部对外签约的责任承担规则\n\n---\n\n## 相关文件\n- 《浙江省高级人民法院民事审判第一庭关于审理建设工程施工合同纠纷案件疑难问题的解答》\n- 《浙江省高级人民法院民事审判第一庭关于审理建设工程施工合同纠纷案件若干问题的解答（涉项目部）》（2020）\n\n## 交叉引用\n- → [[00-指引总览|指引总览]]\n- → [[01-合同效力/16-省高院指引对比|合同效力-省高院指引对比]]"},{"id":"广东高院-关于审理建设工程合同纠纷案件疑难问题的解答","title":"广东高院 - 关于审理建设工程合同纠纷案件疑难问题的解答","excerpt":"广东省高级人民法院关于审理建设工程合同纠纷案件疑难问题的解答 发布机构 ：广东省高级人民法院 发布日期 ：2017年 来源链接 ： 法律平台转载 主要内容概要 一、合同效力 合作建设工程的诉讼主体 ：合作建设工程各方应列为共同原被告 挂靠与合同效力 ：发包人知道或应当知道承包人挂靠仍签订合同的，对无效合同承担相应过错责任 超越资质等级 ：超越资质等级签订合同，竣工前取得资质的，合同有效 二、工程价","slug":"广东高院-关于审理建设工程合同纠纷案件疑难问题的解答","module":"13-审判指引汇编","moduleName":"13 审判指引汇编","tags":["建工","审判指引","广东高院","全文"],"wordCount":563,"created":"2026-06-01","updated":"2026-06-01","content":"# 广东省高级人民法院关于审理建设工程合同纠纷案件疑难问题的解答\n\n**发布机构**：广东省高级人民法院\n**发布日期**：2017年\n**来源链接**：[法律平台转载](https://jsgclaw.com/rule/2017/0828/91.html)\n\n---\n\n## 主要内容概要\n\n### 一、合同效力\n\n1. **合作建设工程的诉讼主体**：合作建设工程各方应列为共同原被告\n2. **挂靠与合同效力**：发包人知道或应当知道承包人挂靠仍签订合同的，对无效合同承担相应过错责任\n3. **超越资质等级**：超越资质等级签订合同，竣工前取得资质的，合同有效\n\n### 二、工程价款结算\n\n4. **审计结论作为结算依据**：需合同明确约定，不能通过解释推定\n5. **黑白合同**：以中标合同为准，非强制招标工程自愿招标的参照适用\n6. **结算协议**：结算协议独立于施工合同，不因合同无效而无效\n\n### 三、工程质量\n\n7. **竣工验收合格后的质量抗辩**：竣工验收合格后发包人以质量不合格拒付工程款不予支持\n8. **擅自使用**：发包人擅自使用未验收工程，免除承包人质量缺陷责任但不免除保修责任\n\n### 四、优先受偿权\n\n9. **优先受偿权的行使**：承包人享有建设工程价款优先受偿权，优先于抵押权\n10. **优先受偿权的范围**：不包括利息、违约金、损害赔偿金\n\n### 五、实际施工人\n\n11. **实际施工人的权利**：实际施工人可请求发包人在欠付工程款范围内承担责任\n12. **借用资质的实际施工人**：发包人知情的，借用方可直接向发包人主张\n\n---\n\n## 交叉引用\n- → [[00-指引总览|指引总览]]\n- → [[01-合同效力/16-省高院指引对比|合同效力-省高院指引对比]]"},{"id":"山东高院-关于审理建设工程施工合同纠纷案件若干问题的解答","title":"山东高院 - 关于审理建设工程施工合同纠纷案件若干问题的解答","excerpt":"山东省高级人民法院关于审理建设工程施工合同纠纷案件若干问题的解答 发布机构 ：山东省高级人民法院 发布日期 ：2020年11月4日 来源链接 ： 转载 一、实际施工人的认定 实际施工人是指无效施工合同中实际完成工程建设的施工主体，包括转承包人、违法分包的承包人。不包括农民工个人。 二、诉前结算协议的审查处理 诉前结算协议经审查有效的，应作为结算依据。一方主张结算协议无效或可撤销的，需举证证明存在法","slug":"山东高院-关于审理建设工程施工合同纠纷案件若干问题的解答","module":"13-审判指引汇编","moduleName":"13 审判指引汇编","tags":["建工","审判指引","山东高院","全文"],"wordCount":763,"created":"2026-06-01","updated":"2026-06-01","content":"# 山东省高级人民法院关于审理建设工程施工合同纠纷案件若干问题的解答\n\n**发布机构**：山东省高级人民法院\n**发布日期**：2020年11月4日\n**来源链接**：[转载](https://m.055110.com/js/69/2300.html)\n\n---\n\n## 一、实际施工人的认定\n\n实际施工人是指无效施工合同中实际完成工程建设的施工主体，包括转承包人、违法分包的承包人。不包括农民工个人。\n\n## 二、诉前结算协议的审查处理\n\n诉前结算协议经审查有效的，应作为结算依据。一方主张结算协议无效或可撤销的，需举证证明存在法定事由。\n\n## 三、政府投资建设项目审计作为结算依据\n\n政府投资项目约定以行政审计、财政评审作为结算依据的，按约定处理。但发包人故意迟延提交审计超过3个月的，当事人申请司法鉴定应予准许。\n\n## 四、固定总价结算工程量增减的处理\n\n固定总价未超出约定施工范围的，适用固定价结算。因设计变更等非承包人原因导致工程量增减的，增减部分可参照合同约定的计价方式结算。\n\n## 五、工程造价、工期及停窝工损失、质量鉴定的审查\n\n法院应对鉴定意见进行实质审查，不能\"以鉴代审\"。鉴定机构的选择应经双方当事人协商一致或由法院指定。\n\n## 六、承包人主张工程款，发包人以质量不合格抗辩\n\n竣工验收合格后，发包人以质量不合格为由拒付工程款的，不予支持。但发包人有证据证明地基基础工程和主体结构存在质量问题的除外。\n\n## 七、发包人要求承包人承担质量违约责任\n\n发包人要求承包人承担质量违约责任的，应提供初步证据证明质量问题的存在及损失大小。\n\n## 八、发包人以未开具发票为由抗辩\n\n支付工程款义务和开具发票义务不具有对等关系，发包人以承包人未开具发票为由拒付工程款的，一般不予支持。但合同明确约定先票后款的除外。\n\n## 九、因承包人原因工期延误的违约责任\n\n因承包人原因导致工期延误的，承包人应承担违约责任。但违约金过高的，法院可酌情调整。\n\n---\n\n## 交叉引用\n- → [[00-指引总览|指引总览]]\n- → [[01-合同效力/16-省高院指引对比|合同效力-省高院指引对比]]"},{"id":"四川-重庆高院-关于审理建设工程施工合同纠纷案件若干问题的解答","title":"四川+重庆高院 - 关于审理建设工程施工合同纠纷案件若干问题的解答","excerpt":"重庆市高级人民法院、四川省高级人民法院关于审理建设工程施工合同纠纷案件若干问题的解答 发布机构 ：重庆市高级人民法院、四川省高级人民法院 发文字号 ：渝高法〔2022〕156号 发布日期 ：2022年12月28日 来源链接 ： 法律平台转载 第一条 必须招标的工程项目的认定 建设工程施工合同订立时属于必须招标的工程项目，当事人未进行招标投标而订立合同，起诉时该工程项目不属于必须进行招标的，可以认定","slug":"四川-重庆高院-关于审理建设工程施工合同纠纷案件若干问题的解答","module":"13-审判指引汇编","moduleName":"13 审判指引汇编","tags":["建工","审判指引","四川高院","重庆高院","联合解答","全文"],"wordCount":1497,"created":"2026-06-01","updated":"2026-06-01","content":"# 重庆市高级人民法院、四川省高级人民法院关于审理建设工程施工合同纠纷案件若干问题的解答\n\n**发布机构**：重庆市高级人民法院、四川省高级人民法院\n**发文字号**：渝高法〔2022〕156号\n**发布日期**：2022年12月28日\n**来源链接**：[法律平台转载](http://ms.isheng.net/index.php?doc-view-45229=)\n\n---\n\n## 第一条 必须招标的工程项目的认定\n\n建设工程施工合同订立时属于必须招标的工程项目，当事人未进行招标投标而订立合同，起诉时该工程项目不属于必须进行招标的，可以认定为非必须招标工程项目。\n\n## 第二条 装饰装修合同承包人资质与合同效力\n\n家庭居室装饰装修工程的承包人不具备相应建筑业企业资质的，不影响合同效力，但涉及变动建筑主体和承重结构的除外。\n\n## 第三条 农民自建建筑物施工合同承包人资质\n\n农民自建低层住宅（重庆地区为四层以下，四川地区为两层以下）的施工合同，承包人不具备资质不影响合同效力。\n\n## 第四条 承包人请求工程价款，发包人主张质量问题的处理\n\n承包人请求支付工程价款，发包人以工程质量不合格为由抗辩的，应当提供初步证据证明质量问题的存在。经审查确有质量问题的，应告知发包人提起反诉或另行起诉。\n\n## 第五条 审计单位审计意见作为工程造价依据的处理\n\n合同约定以审计意见作为结算依据的，按约定处理。但审计意见与合同约定明显不符或审计程序违法的，当事人申请司法鉴定应予准许。\n\n## 第六条 无效合同中管理费的处理\n\n建设工程施工合同无效，承包人已收取的管理费不予返还。实际施工人请求在工程款中扣除管理费的，不予支持。\n\n## 第七条 单方委托第三方咨询意见的效力\n\n一方当事人单方委托第三方出具的咨询意见，对方当事人不认可的，不能作为认定案件事实的依据，但对方当事人明确表示认可的除外。\n\n## 第八条 内部承包合同关系及效力认定\n\n建筑施工企业将其承包的全部或部分工程交由其下属分支机构或在册职工施工，企业对工程施工过程及质量进行管理，并在资金、技术、设备、人力等方面给予支持的，属于内部承包。内部承包合同有效。\n\n## 第九条 实际施工人范围确定\n\n实际施工人是指转包、违法分包合同的承包人，以及借用资质的实际施工人。不包括农民工个人。\n\n## 第十条 实际施工人起诉转包人、违法分包人和发包人的处理\n\n实际施工人以转包人或违法分包人为被告起诉的，应予受理。实际施工人以发包人为被告主张权利的，应追加转包人或违法分包人为第三人。\n\n## 第十一条 中标通知书发出后拒绝签约的处理\n\n中标通知书发出后，招标人或中标人拒绝签订合同的，对方当事人请求赔偿损失的，应予支持。\n\n## 第十二条 非必须招标项目招标前实质性谈判的合同效力\n\n非必须招标项目，发包人在招标前与承包人进行实质性谈判的，不影响合同效力。\n\n## 第十三条 固定价结算因设计变更的工程价款调整\n\n固定价结算合同因设计变更导致工程量增减的，增减部分按约定的计价方式结算；无约定的参照签订合同时当地建设行政主管部门发布的计价方法结算。\n\n## 第十四条 固定价结算因材料价格重大变化的调整\n\n固定价结算合同因材料价格异常波动（超出正常商业风险范围），继续按固定价结算显失公平的，可参照情势变更原则处理。\n\n## 第十五条 固定总价未完成施工终止履行的结算\n\n固定总价合同未完工即解除的，已施工部分质量合格的，可参照合同约定的计价方式和已完工程量占全部工程量的比例确定工程价款。\n\n## 第十六条 建设工程价款优先受偿权起算时间\n\n优先受偿权的行使期限自发包人应当给付工程价款之日起算。合同约定付款时间的，从约定；未约定的，从工程交付日或竣工验收合格日起算。\n\n## 第十七条 建设工程价款债权转让后优先受偿权\n\n建设工程价款债权转让后，受让人不享有优先受偿权。\n\n---\n\n## 补充文件\n\n**重庆高院关于准确适用解答第三问的通知**（渝高法〔2023〕94号，2023年10月31日）\n\n## 交叉引用\n- → [[00-指引总览|指引总览]]\n- → [[01-合同效力/1 施工合同纠纷案件的裁判指引","excerpt":"深圳市中级人民法院关于建设工程施工合同纠纷案件的裁判指引（2014年修订） 发布机构 ：深圳市中级人民法院 发布日期 ：2014年修订 来源链接 ： 法律平台 主要内容（36条） 一、诉讼主体 合作建房各方 ：对建设工程享有共同权益，应列为共同原被告（突破合同相对性） 代建合同 ：委托人与受托人共同对建设工程合同履行承担连带责任 二、合同效力 必须招标工程低于成本价中标 ：合同无效 超越资质等级 ","slug":"深圳中院-关于建设工程施工合同纠纷案件的裁判指引","module":"13-审判指引汇编","moduleName":"13 审判指引汇编","tags":["建工","审判指引","深圳中院","全文"],"wordCount":583,"created":"2026-06-01","updated":"2026-06-01","content":"# 深圳市中级人民法院关于建设工程施工合同纠纷案件的裁判指引（2014年修订）\n\n**发布机构**：深圳市中级人民法院\n**发布日期**：2014年修订\n**来源链接**：[法律平台](https://szfazhu.com/caipanzhiyin/121.html)\n\n---\n\n## 主要内容（36条）\n\n### 一、诉讼主体\n\n1. **合作建房各方**：对建设工程享有共同权益，应列为共同原被告（突破合同相对性）\n2. **代建合同**：委托人与受托人共同对建设工程合同履行承担连带责任\n\n### 二、合同效力\n\n3. **必须招标工程低于成本价中标**：合同无效\n4. **超越资质等级**：竣工前取得资质的，合同有效\n5. **未取得规划许可**：合同无效，但起诉前取得的除外\n\n### 三、工程价款结算\n\n6. **默示认可**：发包人收到竣工结算文件约定期限内不予答复的，视为认可\n7. **审计结论**：合同约定以审计结论为准的，按约定处理\n8. **黑白合同**：以中标合同为准\n\n### 四、工程质量\n\n9. **擅自使用**：建设工程完工后未经竣工验收但已由发包人实际控制的，视为竣工验收合格\n10. **质量保修**：保修期内的质量问题，承包人应承担保修责任\n\n### 五、优先受偿权\n\n11. **行使期限**：六个月（注：2021年司法解释一已修改为18个月）\n12. **起算时间**：已竣工的自竣工之日起算；未竣工的自约定竣工之日起算\n\n### 六、诉讼时效\n\n13. **普通时效**：3年\n14. **起算时间**：从知道或应当知道权利受到损害之日起算\n\n---\n\n## 深圳中院其他相关文件\n\n- 《深圳市中级人民法院关于建设工程合同若干问题的指导意见》（2010年修订，27条）\n\n## 交叉引用\n- → [[00-指引总览|指引总览]]\n- → [[01-合同效力/16-省高院指引对比|合同效力-省高院指引对比]]"},{"id":"湖南高院-建设工程解答","title":"湖南高院 - 建设工程解答","excerpt":"湖南省高级人民法院 - 建设工程解答 发布机构 ：湖南省高级人民法院 发布日期 ：2022年 说明 ：湖南高院关于建设工程施工合同纠纷的解答 主要内容摘要 一、合同效力 建设工程施工合同无效的认定 合同无效后的折价补偿 二、工程价款 计价方式的确定 结算争议的处理 三、工期与质量 工期延误的责任 质量缺陷的处理 四、优先受偿权 行使条件 期限计算 相关文件 《湖南省高级人民法院关于审理建设工程施工","slug":"湖南高院-建设工程解答","module":"13-审判指引汇编","moduleName":"13 审判指引汇编","tags":["建工","审判指引","湖南高院","全文"],"wordCount":251,"created":"2026-06-01","updated":"2026-06-01","content":"# 湖南省高级人民法院 - 建设工程解答\n\n**发布机构**：湖南省高级人民法院\n**发布日期**：2022年\n**说明**：湖南高院关于建设工程施工合同纠纷的解答\n\n---\n\n## 主要内容摘要\n\n### 一、合同效力\n- 建设工程施工合同无效的认定\n- 合同无效后的折价补偿\n\n### 二、工程价款\n- 计价方式的确定\n- 结算争议的处理\n\n### 三、工期与质量\n- 工期延误的责任\n- 质量缺陷的处理\n\n### 四、优先受偿权\n- 行使条件\n- 期限计算\n\n---\n\n## 相关文 e.js@7.0.0/dist/fuse.min.js"></script> <script>(function(){const base = "/jiangong-kb/";

    (function() {
      var dataEl = document.getElementById('search-data');
      if (!dataEl) return;
      var articlesData = JSON.parse(dataEl.textContent);
      var fuse = new Fuse(articlesData, {
        keys: [
          { name: 'title', weight: 0.4 },
          { name: 'tags', weight: 0.2 },
          { name: 'excerpt', weight: 0.2 },
          { name: 'content', weight: 0.2 },
        ],
        threshold: 0.4,
        includeScore: true,
        ignoreLocation: true,
        minMatchCharLength: 2,
      });

      var searchInput = document.getElementById('search-input');
      var resultsContainer = document.getElementById('search-results');
      var resultsCount = document.getElementById('results-count');
      var countNum = document.getElementById('count-num');
      var initialState = document.getElementById('initial-state');
      var tagButtons = document.querySelectorAll('.tag-btn');
      var activeTag = '';

      function formatWC(count) {
        return count >= 10000 ? (count / 10000).toFixed(1) + '万字' : count + '字';
      }

      function formatDateStr(d) {
        if (!d) return '';
        try { return new Date(d).toLocaleDateString('zh-CN'); } catch(e) { return d; }
      }

      function renderResults(results) {
        if (results.length === 0) {
          resultsContainer.innerHTML = '<div class="text-center py-12"><p class="text-4xl mb-4">😕</p><p class="text-gray-500 dark:text-gray-400">未找到匹配的文章</p></div>';
          return;
        }
        var base = window.__BASE_URL || '/';
        resultsContainer.innerHTML = results.map(function(r) {
          return '<a href="' + base + 'articles/' + r.slug + '/" class="group flex items-start gap-4 bg-white dark:bg-primary-900 rounded-xl p-4 border border-gray-200 dark:border-primary-800 shadow-sm hover:shadow-md hover:border-accent-300 dark:hover:border-accent-600 transition-all duration-200">' +
          '<div class="flex-1 min-w-0">' +
          '<div class="flex items-center gap-2 mb-1 flex-wrap">' +
          '<span class="text-xs px-2 py-0.5 rounded-full bg-accent-100 dark:bg-accent-900/30 text-accent-700 dark:text-accent-300">' + r.moduleName + '</span>' +
          r.tags.slice(0, 3).map(function(t) { return '<span class="text-xs px-2 py-0.5 rounded-full bg-gray-100 dark:bg-primary-800 text-gray-500 dark:text-gray-400">' + t + '</span>'; }).join('') +
          '</div>' +
          '<h3 class="font-semibold text-gray-800 dark:text-gray-200 group-hover:text-accent-600 dark:group-hover:text-accent-400 transition-colors">' + r.title + '</h3>' +
          (r.excerpt ? '<p class="text-sm text-gray-500 dark:text-gray-400 mt-1 line-clamp-2">' + r.excerpt + '</p>' : '') +
          '<div class="flex items-center gap-4 mt-2 text-xs text-gray-400 dark:text-gray-500">' +
          '<span>' + formatDateStr(r.updated || r.created) + '</span>' +
          '<span>' + formatWC(r.wordCount) + '</span>' +
          '</div></div>' +
          '<svg class="w-5 h-5 text-gray-300 dark:text-gray-600 group-hover:text-accent-500 transition-colors flex-shrink-0 mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>' +
          '</a>';
        }).join('');
      }

      function performSearch(query) {
        var results;
        if (query.length > 0) {
          results = fuse.search(query).map(function(r) { return r.item; });
        } else {
          results = articlesData;
        }
        if (activeTag) {
          results = results.filter(function(r) { return r.tags.indexOf(activeTag) !== -1; });
        }
        initialState.classList.add('hidden');
        resultsCount.classList.remove('hidden');
        countNum.textContent = results.length;
        renderResults(results);
      }

      var urlParams = new URLSearchParams(window.location.search);
      var queryParam = urlParams.get('q');
      var tagParam = urlParams.get('tag');
      if (queryParam) {
        searchInput.value = queryParam;
        performSearch(queryParam);
      }
      if (tagParam) {
        activeTag = tagParam;
        var tagBtn = document.querySelector('[data-tag="' + tagParam + '"]');
        if (tagBtn) tagBtn.classList.add('bg-accent-100', 'dark:bg-accent-900/30', 'border-accent-300', 'dark:border-accent-600', 'text-accent-700', 'dark:text-accent-300');
        performSearch(searchInput.value);
      }

      searchInput.addEventListener('input', function(e) {
        var q = e.target.value.trim();
        if (q.length === 0 && !activeTag) {
          resultsContainer.innerHTML = '';
          resultsCount.classList.add('hidden');
          initialState.classList.remove('hidden');
          return;
        }
        performSearch(q);
      });

      tagButtons.forEach(function(btn) {
        btn.addEventListener('click', function() {
          var tag = btn.dataset.tag;
          if (activeTag === tag) {
            activeTag = '';
            btn.classList.remove('bg-accent-100', 'dark:bg-accent-900/30', 'border-accent-300', 'dark:border-accent-600', 'text-accent-700', 'dark:text-accent-300');
          } else {
            tagButtons.forEach(function(b) { b.classList.remove('bg-accent-100', 'dark:bg-accent-900/30', 'border-accent-300', 'dark:border-accent-600', 'text-accent-700', 'dark:text-accent-300'); });
            activeTag = tag;
            btn.classList.add('bg-accent-100', 'dark:bg-accent-900/30', 'border-accent-300', 'dark:border-accent-600', 'text-accent-700', 'dark:text-accent-300');
          }
          performSearch(searchInput.value.trim());
        });
