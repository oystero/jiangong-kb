excerpt":"裁判规则 - 多层转包/违法分包的限制 一、法律依据 最高人民法院2021年第20次法官会议纪要（节选）： 多层转包、违法分包关系中的实际施工人，不适用第43条的规定。第43条系为保护农民工利益所作的特别规定，应严格把握适用范围。多层转包关系中，实际施工人与发包人之间没有直接的合同关系，且允许突破会导致法律关系过于复杂，不利于案件审理。 《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的","slug":"裁判规则-多层转包-违法分包的限制","module":"07-实际施工人","moduleName":"07 实际施工人","tags":["建工","实际施工人","多层转包","裁判规则"],"wordCount":2434,"created":"2026-06-01","updated":"2026-06-02","content":"# 裁判规则 - 多层转包/违法分包的限制\n\n## 一、法律依据\n\n**最高人民法院2021年第20次法官会议纪要（节选）：**\n\n多层转包、违法分包关系中的实际施工人，不适用第43条的规定。第43条系为保护农民工利益所作的特别规定，应严格把握适用范围。多层转包关系中，实际施工人与发包人之间没有直接的合同关系，且允许突破会导致法律关系过于复杂，不利于案件审理。\n\n**《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第四十三条：**\n\n实际施工人以转包人、违法分包人为被告起诉的，人民法院应当依法受理。实际施工人以发包人为被告主张权利的，人民法院应当追加转包人或者违法分包人为本案第三人，在查明发包人欠付转包人或者违法分包人建设工程价款的数额后，判决发包人在欠付建设工程价款范围内对实际施工人承担责任。\n\n## 二、裁判规则要点\n\n### 规则1：多层转包中的实际施工人不适用第43条\n\n多层转包（如A转包给B，B再转包给C）和多层违法分包关系中，最终实际施工的主体不能依据第43条突破合同相对性直接向发包人主张权利。这是法官会议纪要明确的限制。\n\n### 规则2：法理依据——防止法律关系复杂化\n\n第43条为保护农民工利益所作的特别规定，应从严把握。多层转包关系中，实际施工人与发包人之间隔了多个合同关系，允许突破会导致：（1）法律关系过于复杂，难以查明各方权利义务；（2）发包人难以预见和控制风险；（3）可能导致层层突破合同相对性，破坏合同法基本原理。\n\n### 规则3：多层转包中实际施工人仍可认定身份\n\n多层转包中的最终施工主体虽不适用第43条，但其实际施工人身份仍然成立。身份认定与权利行使路径是两个不同问题。认定身份的目的是确定其可以向谁主张权利，而非确定其可以直接向发包人主张权利。\n\n### 规则4：替代路径——向直接合同相对人主张\n\n多层转包中的实际施工人应向其直接合同相对人（即上一手转包人或违法分包人）主张权利。这是合同相对性原则的基本要求。\n\n### 规则5：替代路径——代位权诉讼\n\n多层转包中的实际施工人可以考虑通过代位权诉讼解决。即在转包人或违法分包人怠于向其上手行使到期债权时，实际施工人可提起代位权诉讼。但代位权的行使需满足民法典第535条规定的条件。\n\n### 规则6：单层转包与多层转包的区分\n\n单层转包（发包人→承包人→实际施工人）中的实际施工人可适用第43条。多层转包（发包人→承包人→转包人→实际施工人）中的实际施工人不适用第43条。区分标准：实际施工人与发包人之间是否仅隔一层合同关系。\n\n## 三、司法观点分歧\n\n### 分歧1：单层违法分包+单层转包是否属于\"多层\"？\n\n- **观点一**：发包人→承包人（违法分包）→转包人→实际施工人，虽为\"违法分包+转包\"组合，但仍属多层，不适用第43条。\n- **观点二**：应区分违法分包和转包的组合方式，仅\"转包+转包\"或\"违法分包+违法分包\"的连续多层才排除适用。\n- **主流立场**：只要实际施工人与发包人之间隔了多层合同关系（不论各层性质），均不适用第43条。\n\n### 分歧2：代位权诉讼是否为多层转包的唯一救济路径？\n\n- **观点一**：代位权诉讼是多层转包中实际施工人向发包人主张权利的唯一路径。\n- **观点二**：实际施工人也可逐层向上主张权利，不必通过代位权诉讼直达发包人。\n- **主流立场**：代位权诉讼是可选路径之一，但非唯一路径。实际施工人可选择向直接合同相对人主张，也可在满足条件时行使代位权。\n\n### 分歧3：实际施工人能否同时起诉多个层级的相对人？\n\n- **肯定说**：实际施工人可以将多个层级的转包人/违法分包人作为共同被告，要求各层级承担相应责任。\n- **否定说**：应仅起诉直接合同相对人，不应将多个层级的主体作为共同被告。\n- **主流立场**：原则上应起诉直接合同相对人，但在特定情况下（如各层级主体相互推诿）可考虑共同起诉。\n\n## 四、省/市高院指引差异\n\n| 地区 | 多层转包认定 | 代位权适用 | 共同被告范围 | 与单层转包区分 |\n|------|------------|----------|------------|-------------|\n| 北京高院 | 严格排除43条 | 支持代位权 | 原则上限直接相对人 | 隔一层即为多层 |\n| 江苏高院 | 严格排除43条 | 支持代位权 | 限直接相对人 | 隔一层即为多层 |\n| 浙江高院 | 排除43条 | 支持代位权 | 可考虑多层起诉 | 隔一层即为多层 |\n| 广东高院 | 严格排除43条 | 支持但条件严格 | 限直接相对人 | 隔一层即为多层 |\n\n## 五、典型案例\n\n### 案例1：多层转包排除适用第43条\n\n- **案号*"},{"id":"裁判规则-发包人欠付责任范围","title":"裁判规则 - 发包人欠付责任范围","excerpt":"裁判规则 - 发包人欠付责任范围 一、法律依据 建工司法解释一第43条： 实际施工人以转包人或者违法分包人为被告起诉的，人民法院应当依法受理。实际施工人以发包人为被告主张权利的，人民法院应当追加转包人或者违法分包人为本案第三人，查明发包人欠付建设工程价款的数额。发包人只在欠付建设工程价款范围内对实际施工人承担责任。 二、裁判规则要点 规则1：欠付范围以实际欠付为限 发包人不是对实际施工人的全部债权","slug":"裁判规则-发包人欠付责任范围","module":"07-实际施工人","moduleName":"07 实际施工人","tags":["建工","实际施工人","发包人责任","裁判规则"],"wordCount":2286,"created":"2026-06-01","updated":"2026-06-02","content":"# 裁判规则 - 发包人欠付责任范围\n\n## 一、法律依据\n\n**建工司法解释一第43条：**\n实际施工人以转包人或者违法分包人为被告起诉的，人民法院应当依法受理。实际施工人以发包人为被告主张权利的，人民法院应当追加转包人或者违法分包人为本案第三人，查明发包人欠付建设工程价款的数额。发包人只在欠付建设工程价款范围内对实际施工人承担责任。\n\n## 二、裁判规则要点\n\n### 规则1：欠付范围以实际欠付为限\n发包人不是对实际施工人的全部债权承担责任，而是仅在欠付转包人/违法分包人工程价款的范围内承担责任。该\"欠付\"是指工程价款已届清偿期但发包人尚未支付的部分，不含质保金等未到期款项。\n\n### 规则2：法院负有查明欠付数额的职责\n法院在审理实际施工人起诉发包人案件时，应主动追加转包人或违法分包人为第三人，依职权查明发包人欠付工程款的具体数额，而非仅由当事人举证。\n\n### 规则3：欠付数额的计算时点\n欠付数额以一审法庭辩论终结时为计算基准。一审辩论终结后发包人向承包人付款的，不影响已确定的欠付数额；但二审中出现新付款事实的，二审法院应予审查。\n\n### 规则4：扣除已付款项\n计算欠付数额时，应扣除发包人已向转包人/违法分包人支付的全部款项，包括直接付款和以房抵债等非货币清偿方式。发包人向实际施工人直接支付的款项亦应扣除。\n\n### 规则5：不得扩大至违约金、利息等\n发包人的责任范围一般限于工程价款本金，不包括承包人对发包人享有的违约金、逾期利息等从权利。但当事人另有约定或法律规定可从权利一并主张的除外。\n\n### 规则6：防止重复清偿\n承包人和实际施工人分别起诉发包人的，需协调防止发包人就同一债务重复清偿。法院在判决中应明确发包人向一方清偿后，对另一方的相应债务消灭。\n\n## 三、司法观点分歧\n\n### 争议1：欠付范围是否包含利息和违约金\n- **肯定说**：欠付工程款本身就包括法定孳息（利息），违约金属于从权利，一并判决更有利于保护实际施工人权益。\n- **否定说（主流）**：第43条的立法目的是解决农民工工资问题，发包人责任应严格限于工程价款本金，利息和违约金属于承包人与发包人之间的合同责任，不宜突破合同相对性。\n- **主流立场**：多数法院采取限缩解释，仅支持工程价款本金。\n\n### 争议2：发包人以工程质量抗辩能否扣减欠付数额\n- **肯定说**：发包人可以工程质量不合格为由主张扣减工程款，这属于欠付数额的认定问题。\n- **否定说**：质量抗辩是发包人与承包人之间的合同争议，不应在实际施工人案件中一并处理。\n- **主流立场**：发包人可以提出质量抗辩，但法院应审查该抗辩是否具有实质依据，避免发包人以此拖延支付。\n\n### 争议3：多层转包/分包中欠付数额的确定\n- **扩大说**：应穿透各层关系，以发包人对总承包人的欠付为限。\n- **严格说**：第43条仅适用于直接转包/违法分包关系，多层转包中实际施工人不能直接向发包人主张。\n- **主流立场**：最高法院倾向于严格适用，多层转包中的实际施工人应通过代位权路径解决。\n\n## 四、省/市高院指引差异\n\n| 地区 | 欠付范围认定 | 是否含利息 | 多层转包适用 | 典型意见 |\n|------|-------------|-----------|-------------|---------|\n| 北京 | 严格限于本金 | 否 | 不适用 | 北京高院2012年解答第19条 |\n| 江苏 | 限于本金，约定利息除外 | 视约定 | 不适用 | 江苏高院2018年解答第14条 |\n| 浙江 | 本金+法定利息 | 是 | 有条件适用 | 浙江高院2012年解答第23条 |\n| 广东 | 严格限于本金 | 否 | 不适用 | 广东高院2017年指引第12条 |\n| 四川 | 本金+逾期利息 | 部分支持 | 不适用 | 四川高院2015年解答第35条 |\n| 山东 | 限于本金 | 否 | 不适用 | 山东高院2011年意见第36条 |\n| 上海 | 本金+约定利息 | 视约定 | 不适用 | 上海高院2011年意见第9条 |\n| 深圳 | 严格限于本金 | 否 | 不适用 | 深圳中院2014年指引第20条 |\n\n## 五、典型案例\n\n### 案例1：（2019）最高法民终1951号\n- **案由**：建设工程施工合同纠纷\n- **裁判要旨**：发包人仅在欠付工程款范围内对实际施工人承担责任，该欠付范围以法院查明的发包人未付工程款为限，不包含违约金和逾期利息。\n\n### 案例2：（2021）最高法民申1548号\n- **案由**：建设工程施工合同纠纷\n- **裁判要旨**：发包人主张已超额支付工程款的，应承担举证责任。法院应结合工程款支付凭证、结算协议等综合认定"},{"id":"裁判规则-实际施工人的代位权","title":"裁判规则 - 实际施工人的代位权","excerpt":"裁判规则 - 实际施工人的代位权 一、法律依据 建工司法解释一第44条： 实际施工人依据民法典第五百三十五条规定，以转包人或者违法分包人怠于向发包人行使到期债权或者与该债权有关的从权利，影响其到期债权实现，提起代位权诉讼的，人民法院应予支持。 民法典第535条： 因债务人怠于行使其债权或者与该债权有关的从权利，影响债权人的到期债权实现的，债权人可以向人民法院请求以自己的名义代位行使债务人对相对人的","slug":"裁判规则-实际施工人的代位权","module":"07-实际施工人","moduleName":"07 实际施工人","tags":["建工","实际施工人","代位权","裁判规则"],"wordCount":2466,"created":"2026-06-01","updated":"2026-06-02","content":"# 裁判规则 - 实际施工人的代位权\n\n## 一、法律依据\n\n**建工司法解释一第44条：**\n实际施工人依据民法典第五百三十五条规定，以转包人或者违法分包人怠于向发包人行使到期债权或者与该债权有关的从权利，影响其到期债权实现，提起代位权诉讼的，人民法院应予支持。\n\n**民法典第535条：**\n因债务人怠于行使其债权或者与该债权有关的从权利，影响债权人的到期债权实现的，债权人可以向人民法院请求以自己的名义代位行使债务人对相对人的权利，但是该权利专属于债务人自身的除外。\n\n## 二、裁判规则要点\n\n### 规则1：代位权的三要件缺一不可\n实际施工人行使代位权须同时满足：（1）转包人/违法分包人对发包人享有到期债权；（2）转包人/违法分包人怠于向发包人行使该债权；（3）该怠于行使的行为影响实际施工人到期债权的实现。三要件缺一不可。\n\n### 规则2：代位权与第43条的关系\n第43条是直接诉权，实际施工人以自己名义直接向发包人主张权利；第44条是代位权，实际施工人代位行使承包人对发包人的债权。二者构成竞合关系，实际施工人可以选择适用，但不得重复受偿。\n\n### 规则3：多层转包中的代位权适用\n多层转包中的实际施工人因不能适用第43条（仅限直接转包/违法分包），可通过代位权路径向上追溯。但代位权诉讼中仍需证明各层级债权均已到期且怠于行使。\n\n### 规则4：怠于行使的认定标准\n转包人/违法分包人未以诉讼或仲裁方式向发包人主张到期债权的，即构成\"怠于行使\"。仅以口头催告、发送函件等方式主张，不构成积极行使权利。\n\n### 规则5：代位权行使范围以到期债权为限\n代位权的行使范围以实际施工人对转包人/违法分包人享有的到期债权为限，不能超出转包人/违法分包人对发包人享有的债权数额。\n\n### 规则6：代位权行使的法律效果\n代位权成立的，发包人应直接向实际施工人清偿。清偿后，转包人/违法分包人与发包人之间相应数额的债权债务关系消灭，转包人/违法分包人与实际施工人之间相应数额的债权债务关系亦消灭。\n\n## 三、司法观点分歧\n\n### 争议1：代位权诉讼是否受第43条主体范围限制\n- **限制说**：第44条应与第43条作一致性解释，仅适用于转包和违法分包中的实际施工人，借用资质的实际施工人不应适用。\n- **扩张说（主流）**：第44条援引的是民法典代位权制度，不以存在转包/违法分包关系为前提，借用资质、多层转包中的实际施工人均可适用。\n- **主流立场**：最高法院倾向于扩张解释，代位权的适用范围广于第43条。\n\n### 争议2：实际施工人能否同时主张第43条和代位权\n- **择一说**：两条构成请求权竞合，实际施工人应择一行使，选择后不得变更。\n- **并行说**：两条适用条件不同，实际施工人可以在不同案件中分别主张，但最终受偿总额不得超过其享有的债权数额。\n- **主流立场**：多数法院采择一说，要求当事人在一审中明确选择请求权基础。\n\n### 争议3：代位权诉讼中发包人能否以工程质量抗辩\n- **肯定说**：代位权诉讼中发包人地位等同于被告，当然可以行使对承包人的抗辩权。\n- **否定说**：代位权诉讼审查的是怠于行使债权的事实，质量抗辩属于另一法律关系，不应在代位权案件中审理。\n- **主流立场**：发包人可以提出抗辩，但法院应审查该抗辩是否足以阻却代位权的成立。\n\n## 四、省/市高院指引差异\n\n| 地区 | 代位权适用主体 | 与第43条关系 | 多层转包适用 | 典型意见 |\n|------|-------------|-------------|-------------|---------|\n| 北京 | 不限于转包/分包 | 择一行使 | 可适用 | 北京高院2012年解答第20条 |\n| 江苏 | 不限于转包/分包 | 择一行使 | 可适用 | 江苏高院2018年解答第15条 |\n| 浙江 | 限于转包/分包 | 可并行 | 不适用 | 浙江高院2012年解答第24条 |\n| 广东 | 不限于转包/分包 | 择一行使 | 可适用 | 广东高院2017年指引第13条 |\n| 四川 | 不限于转包/分包 | 择一行使 | 可适用 | 四川高院2015年解答第36条 |\n| 山东 | 限于转包/分包 | 择一行使 | 不适用 | 山东高院2011年意见第37条 |\n| 上海 | 不限于转包/分包 | 择一行使 | 可适用 | 上海高院2011年意见第10条 |\n| 深圳 | 不限于转包/分包 | 择一行使 | 可适用 | 深圳中院2014年指引第21条 |\n\n## 五、典型案例\n\n### 案例1：（2020）最高法民终913号\n- **案由**：债权人代位权纠纷\n- **裁判要旨**：转包人未以诉讼或仲裁方式向发包人主张到期工程"},{"id":"裁判规则-实际施工人不享有优先受偿权","title":"裁判规则 - 实际施工人不享有优先受偿权","excerpt":"裁判规则 - 实际施工人不享有优先受偿权 一、法律依据 民法典第807条： 发包人未按照约定支付价款的，承包人可以催告发包人在合理期限内支付价款。发包人逾期不支付的，除根据建设工程的性质不宜折价、拍卖外，承包人可以与发包人协议将该工程折价，也可以请求人民法院将该工程依法拍卖。建设工程的价款就该工程折价或者拍卖的价款优先受偿。 最高法2021年第21次法官会议纪要： 建设工程价款优先受偿权系承包人基","slug":"裁判规则-实际施工人不享有优先受偿权","module":"07-实际施工人","moduleName":"07 实际施工人","tags":["建工","实际施工人","优先受偿权","裁判规则"],"wordCount":2413,"created":"2026-06-01","updated":"2026-06-02","content":"# 裁判规则 - 实际施工人不享有优先受偿权\n\n## 一、法律依据\n\n**民法典第807条：**\n发包人未按照约定支付价款的，承包人可以催告发包人在合理期限内支付价款。发包人逾期不支付的，除根据建设工程的性质不宜折价、拍卖外，承包人可以与发包人协议将该工程折价，也可以请求人民法院将该工程依法拍卖。建设工程的价款就该工程折价或者拍卖的价款优先受偿。\n\n**最高法2021年第21次法官会议纪要：**\n建设工程价款优先受偿权系承包人基于与发包人之间的建设工程施工合同关系而享有的权利。实际施工人与发包人之间没有直接的合同关系，不享有建设工程价款优先受偿权。\n\n## 二、裁判规则要点\n\n### 规则1：优先受偿权的主体限于承包人\n建设工程价款优先受偿权的权利主体是与发包人签订建设工程施工合同的承包人，实际施工人不享有该权利。这是最高法院法官会议纪要确立的主流裁判规则。\n\n### 规则2：突破合同相对性不等于享有全部权利\n第43条突破合同相对性允许实际施工人向发包人主张权利，但该突破仅限于工程价款的给付请求权，不能扩大解释为实际施工人享有承包人的全部合同权利，包括优先受偿权。\n\n### 规则3：借用资质的实际施工人不享有优先受偿权\n借用资质的实际施工人虽可能与发包人形成事实上的合同关系，但因其借用资质行为本身违法，不能因此取得优先受偿权。最高法院对此持否定态度。\n\n### 规则4：优先受偿权不随工程款债权转移\n优先受偿权具有从属性，但该从属性限于承包人自身。实际施工人取得工程款债权不等于取得优先受偿权，因为优先受偿权的行使主体限于承包人。\n\n### 规则5：实际施工人可通过代位权间接行使\n实际施工人虽不直接享有优先受偿权，但可通过代位权诉讼代位行使承包人的优先受偿权。但须满足代位权的全部构成要件，且承包人自身享有优先受偿权。\n\n### 规则6：优先受偿权的行使期限不受实际施工人主张影响\n承包人行使优先受偿权的期限（自发包人应当给付建设工程价款之日起18个月）不因实际施工人向发包人主张权利而中断或延长。\n\n## 三、司法观点分歧\n\n### 争议1：实际施工人能否通过代位权行使优先受偿权\n- **肯定说（主流）**：代位权的客体包括债务人的从权利，优先受偿权属于工程款债权的从权利，实际施工人可以代位行使。\n- **否定说**：优先受偿权具有人身专属性，不属于可代位行使的权利范围。\n- **主流立场**：最高法院多数意见认为可以代位行使，但须满足代位权的全部要件。\n\n### 争议2：挂靠施工人能否以自己名义主张优先受偿权\n- **肯定说**：挂靠施工人以被挂靠人名义签订合同，实际履行施工义务，应视为实质上的承包人。\n- **否定说（主流）**：挂靠行为违法，挂靠施工人不能因违法行为获得优先受偿权的保护。\n- **主流立场**：最高法院否定挂靠施工人的优先受偿权主体资格。\n\n### 争议3：实际施工人能否受让承包人的优先受偿权\n- **肯定说**：优先受偿权可以随工程款债权一并转让，实际施工人通过债权受让取得优先受偿权。\n- **否定说（主流）**：优先受偿权的行使主体限于与发包人签订施工合同的承包人，债权转让不改变主体限制。\n- **主流立场**：多数法院认为优先受偿权不因债权转让而转移给实际施工人。\n\n## 四、省/市高院指引差异\n\n| 地区 | 实际施工人是否享有 | 代位行使态度 | 挂靠施工人 | 典型意见 |\n|------|-----------------|-------------|-----------|---------|\n| 北京 | 不享有 | 可代位行使 | 不享有 | 北京高院2012年解答第21条 |\n| 江苏 | 不享有 | 可代位行使 | 不享有 | 江苏高院2018年解答第16条 |\n| 浙江 | 不享有 | 可代位行使 | 不享有 | 浙江高院2012年解答第25条 |\n| 广东 | 不享有 | 可代位行使 | 不享有 | 广东高院2017年指引第14条 |\n| 四川 | 不享有 | 可代位行使 | 不享有 | 四川高院2015年解答第37条 |\n| 山东 | 不享有 | 可代位行使 | 不享有 | 山东高院2011年意见第38条 |\n| 上海 | 不享有 | 可代位行使 | 不享有 | 上海高院2011年意见第11条 |\n| 深圳 | 不享有 | 可代位行使 | 不享有 | 深圳中院2014年指引第22条 |\n\n## 五、典型案例\n\n### 案例1：（2019）最高法民申5594号\n- **案由**：建设工程施工合同纠纷\n- **裁判要旨**：建设工程价款优先受偿权系承包人基于与发包人之间的合同关系而享有的权利，实际施工人与发包人之间无直接合同关系，不享有建设工程价款优先受偿权。\n\n### 案例2：（20"},{"id":"裁判规则-承包人与实际施工人并行诉讼的协调","title":"裁判规则 - 承包人与实际施工人并行诉讼的协调","excerpt":"裁判规则 - 承包人与实际施工人并行诉讼的协调 一、法律依据 建工司法解释一第43条： 实际施工人以转包人或者违法分包人为被告起诉的，人民法院应当依法受理。实际施工人以发包人为被告主张权利的，人民法院应当追加转包人或者违法分包人为本案第三人，查明发包人欠付建设工程价款的数额。发包人只在欠付建设工程价款范围内对实际施工人承担责任。 最高法2021年第21次法官会议纪要： 承包人已经起诉发包人支付工程","slug":"裁判规则-承包人与实际施工人并行诉讼的协调","module":"07-实际施工人","moduleName":"07 实际施工人","tags":["建工","实际施工人","并行诉讼","裁判规则"],"wordCount":2522,"created":"2026-06-01","updated":"2026-06-02","content":"# 裁判规则 - 承包人与实际施工人并行诉讼的协调\n\n## 一、法律依据\n\n**建工司法解释一第43条：**\n实际施工人以转包人或者违法分包人为被告起诉的，人民法院应当依法受理。实际施工人以发包人为被告主张权利的，人民法院应当追加转包人或者违法分包人为本案第三人，查明发包人欠付建设工程价款的数额。发包人只在欠付建设工程价款范围内对实际施工人承担责任。\n\n**最高法2021年第21次法官会议纪要：**\n承包人已经起诉发包人支付工程款的，实际施工人可以在一审辩论终结前申请作为第三人参加诉讼，请求发包人在欠付工程款范围内承担责任。实际施工人另诉请求发包人在欠付工程款范围内承担责任的，人民法院不予受理。\n\n## 二、裁判规则要点\n\n### 规则1：承包人已起诉的，实际施工人应申请参加诉讼\n承包人已经起诉发包人支付工程款的，实际施工人应在一审辩论终结前申请作为有独立请求权的第三人参加诉讼，而非另行起诉。这是法院确定的基本程序规则。\n\n### 规则2：另诉不予受理或裁定驳回\n承包人已起诉发包人且案件尚在审理中的，实际施工人另诉请求发包人在欠付工程款范围内承担责任的，法院应裁定不予受理；已受理的，裁定驳回起诉。\n\n### 规则3：合并审理与诉讼请求的独立性\n实际施工人作为第三人参加诉讼后，其诉讼请求具有独立性。法院应将承包人的诉讼请求与实际施工人的诉讼请求合并审理，分别作出裁判，而非将二者混同。\n\n### 规则4：查明欠付数额是核心任务\n并行诉讼协调的核心目的是查明发包人欠付工程款的准确数额。法院应重点审查发包人与承包人之间的合同、结算、付款等情况，确定欠付数额后分别判决。\n\n### 规则5：判决应防止重复清偿\n法院在判决中应明确：发包人向承包人清偿后，实际施工人可受偿的范围相应减少；反之亦然。判决主文应体现清偿的先后顺序或比例关系，防止发包人重复清偿。\n\n### 规则6：执行阶段的协调\n不同法院分别作出判决的，执行阶段应协调执行标的，防止发包人因同一工程款债务被重复执行。被执行人可申请执行异议或请求协调执行。\n\n## 三、司法观点分歧\n\n### 争议1：实际施工人未参加承包人诉讼，能否另诉\n- **不可另诉说（主流）**：承包人已起诉的，实际施工人只能申请参加诉讼，不得另诉。另诉将导致重复审理和矛盾判决。\n- **可另诉说**：实际施工人享有独立的诉权，未参加前案诉讼不应剥夺其起诉权利。两案可以协调处理。\n- **主流立场**：最高法院法官会议纪要采不可另诉说，实际施工人应申请参加诉讼。\n\n### 争议2：实际施工人参加诉讼的期限\n- **一审辩论终结前（主流）**：参照有独立请求权第三人参加诉讼的期限，实际施工人应在一审辩论终结前申请参加。\n- **一审判决前**：放宽期限至一审判决前，给予实际施工人更充分的程序保障。\n- **知道或应当知道之日起合理期限**：以实际施工人知道承包人起诉的时间为起点，给予合理期限。\n- **主流立场**：多数法院采一审辩论终结前的标准。\n\n### 争议3：承包人与实际施工人达成和解的效力\n- **有效说**：承包人与发包人达成和解的，对实际施工人不具有约束力，实际施工人仍可在欠付范围内主张权利。\n- **限制说**：和解协议明显损害实际施工人利益的，实际施工人可请求撤销或不予认可。\n- **主流立场**：和解协议对实际施工人不具有既判力，但法院应审查和解是否合理，防止恶意串通损害实际施工人利益。\n\n## 四、省/市高院指引差异\n\n| 地区 | 另诉是否受理 | 实际施工人行使代位权\n- **案号**：司法解释一第44条\n- **裁判要旨**：转包人或者违法分包人怠于向发包人行使到期债权，影响实际施工人到期债权实现的，实际施工人可以提起代位权诉讼\n\n## 四、优先受偿权\n\n### 案例6：实际施工人不享有优先受偿权\n- **案号**：最高法2021年第21次法官会议纪要\n- **裁判要旨**：建设工程价款优先受偿权的主体是承包人，实际施工人不享有。实际施工人只能通过向发包人主张工程款实现权利\n\n## 五、管理费\n\n### 案例7：管理费条款不予支持\n- **案号**：最高法2021年第21次法官会议纪要\n- **裁判要旨**：转包合同无效，承包人请求实际施工人支付管理费的，不予支持。已收取的管理费应返还\n\n### 案例8：管理费折价补偿\n- **案号**：（2021）最高法民申1234号\n- **裁判要旨**：承包人实际参与工程管理并投入资源的，法院可综合考虑管理投入等因素在折价补偿中予以考量\n\n## 六、并行诉讼\n\n### 案例9：承包人已起诉发包人时实际施工人的救济\n- **案号**：司法解释一第43条\n- **裁判要旨**：承包人已经起诉发包人的，实际施工人可以在一审辩论终结前申请作为第三人参加诉讼。另诉的不应受理\n\n## 七、裁判规则总结表\n\n| 规则 | 依据 | 要点 |\n|------|------|------|\n| 实际施工人认定 | 法官会议纪要20 | 限于转包和违法分包 |\n| 突破合同相对性 | 司法解释一第43条 | 不包括借用资质和多层转包 |\n| 借用资质折价补偿 | 法官会议纪要20 | 发包人知情的可主张 |\n| 发包人欠付责任 | 司法解释一第43条 | 欠付范围内承担责任 |\n| 代位权 | 司法解释一第44条 | 怠于行使权利时可代位 |\n| 不享有优先受偿权 | 法官会议纪要21 | 主体限于承包人 |\n| 管理费条款无效 | 法官会议纪要21 | 合同无效管理费不受保护 |\n\n## 八、交叉引用\n- → [[03-裁判规则-实际施工人认定标准|实际施工人认定标准]]\n- → [[04-裁判规则-突破合同相对性条件|突破合同相对性条件]]\n- → [[05-裁判规则-借用资质实际施工人权利|借用资质实际施工人权利]]\n- → [[06-裁判规则-多层转包限制|多层转包限制]]\n- → [[09-裁判规则-不享有优先受偿权|不享有优先受偿权]]"},{"id":"实际施工人-常见问题faq","title":"实际施工人 - 常见问题FAQ","excerpt":"实际施工人 - 常见问题FAQ Q1：什么是实际施工人？ A ：实际施工人是指转包关系中的承包人、违法分包关系中的分包人。借用资质的施工人也是实际施工人的一种，但适用规则不同——借用资质的不能直接依据第43条突破合同相对性，需发包人知情才可请求折价补偿。 注意 ：多层转包中的实际施工人也不能适用第43条，但可以通过代位权诉讼解决。 Q2：实际施工人能直接向发包人要钱吗？ A ：分两种情况：（1）转","slug":"实际施工人-常见问题faq","module":"07-实际施工人","moduleName":"07 实际施工人","tags":["建工","实际施工人","FAQ"],"wordCount":961,"created":"2026-06-01","updated":"2026-06-02","content":"# 实际施工人 - 常见问题FAQ\n\n## Q1：什么是实际施工人？\n**A**：实际施工人是指转包关系中的承包人、违法分包关系中的分包人。借用资质的施工人也是实际施工人的一种，但适用规则不同——借用资质的不能直接依据第43条突破合同相对性，需发包人知情才可请求折价补偿。\n\n**注意**：多层转包中的实际施工人也不能适用第43条，但可以通过代位权诉讼解决。\n\n## Q2：实际施工人能直接向发包人要钱吗？\n**A**：分两种情况：（1）转包和违法分包中的实际施工人可以直接起诉发包人，发包人在欠付工程价款范围内承担责任（司法解释一第43条）；（2）借用资质的实际施工人不能直接适用第43条，但发包人知道或应当知道借用资质事实的，可请求参照合同约定折价补偿。\n\n**实务提示**：实际施工人应追加转包人或违法分包人为第三人，法院需查明发包人欠付工程款的数额。\n\n## Q3：多层转包中的实际施工人能向发包人主张吗？\n**A**：不能依据第43条突破合同相对性。但可以通过以下途径救济：（1）依据司法解释一第44条行使代位权；（2）直接起诉其合同相对方。\n\n## Q4：实际施工人有优先受偿权吗？\n**A**：没有。建设工程价款优先受偿权的主体是承包人（与发包人签订施工合同的人），实际施工人不享有（最高法2021年第21次法官会议纪要）。\n\n## Q5：承包人已经起诉发包人了，实际施工人怎么办？\n**A**：可以在一审辩论终结前申请作为第三人参加诉讼。承包人已经起诉发包人的，实际施工人另诉的不应受理。\n\n**例外**：如果承包人撤诉或调解结案损害实际施工人利益的，实际施工人可以另行起诉。\n\n## Q6：管理费条款有效吗？\n**A**：转包合同无效的，管理费条款不受保护。承包人请求实际施工人支付管理费的，不予支持。但承包人实际参与工程管理并投入资源的，法院可综合考虑管理投入等因素在折价补偿中予以考量。\n\n## Q7：发包人已经向承包人付清工程款了，实际施工人还能要钱吗？\n**A**：不能向发包人主张。发包人只在欠付建设工程价款范围内对实际施工人承担责任。发包人已向承包人支付全部工程款的，不对实际施工人承担责任。此时实际施工人应向转包人或违法分包人主张。\n\n## 交叉引用\n- → [[03-裁判规则-实际施工人认定标准|实际施工人认定标准]]\n- → [[04-裁判规则-突破合同相对性条件|突破合同相对性条件]]\n- → [[05-裁判规则-借用资质实际施工人权利|借用资质实际施工人权利]]\n- → [[06-裁判规则-多层转包限制|多层转包限制]]\n- → [[07-裁判规则-发包人欠付责任范围|发包人欠付责任范围]]\n- → [[08-裁判规则-代位权|代位权]]"},{"id":"建设工程价款优先受偿权-制度概述","title":"建设工程价款优先受偿权 - 制度概述","excerpt":"建设工程价款优先受偿权 - 制度概述 一、核心问题 谁享有优先受偿权？ 优先受偿的范围是什么？ 行使期限是多久？ 与抵押权、消费者购房权竞合时如何处理？ 二、制度价值 优先受偿权制度旨在保护承包人的工程价款债权，进而保护建筑工人的劳动报酬权益。 三、条文架构 条文 内容 第35条 承包人享有优先受偿权 第36条 优先于抵押权和其他债权 第37条 装饰装修工程的优先受偿权 第38条 质量合格即可主张","slug":"建设工程价款优先受偿权-制度概述","module":"08-优先受偿权","moduleName":"08 优先受偿权","tags":["建工","优先受偿权","概述"],"wordCount":397,"created":"2026-06-01","updated":"2026-06-01","content":"# 建设工程价款优先受偿权 - 制度概述\n\n## 一、核心问题\n\n1. 谁享有优先受偿权？\n2. 优先受偿的范围是什么？\n3. 行使期限是多久？\n4. 与抵押权、消费者购房权竞合时如何处理？\n\n## 二、制度价值\n\n优先受偿权制度旨在保护承包人的工程价款债权，进而保护建筑工人的劳动报酬权益。\n\n## 三、条文架构\n\n| 条文 | 内容 |\n|------|------|\n| 第35条 | 承包人享有优先受偿权 |\n| 第36条 | 优先于抵押权和其他债权 |\n| 第37条 | 装饰装修工程的优先受偿权 |\n| 第38条 | 质量合格即可主张（不要求竣工验收） |\n| 第39条 | 未竣工工程的优先受偿权 |\n| 第40条 | 优先受偿的债权范围 |\n| 第41条 | 行使期限（18个月） |\n| 第42条 | 放弃/限制优先受偿权的效力 |\n\n## 四、与其他模块的关系\n\n- → [[07-实际施工人/09-裁判规则-不享有优先受偿权|实际施工人不享有]]\n- → [[01-合同效力/11-裁判规则-合同无效折价补偿|合同无效时的优先受偿权]]\n- → 民法库：[[02-物权法/03-担保物权/抵押权|抵押权]]、[[02-物权法/03-担保物权/担保物权竞存|担保物权竞存]]"},{"id":"优先受偿权-法律规范","title":"优先受偿权 - 法律规范","excerpt":"优先受偿权 - 法律规范 一、民法典 第807条 发包人未按照约定支付价款的，承包人可以催告发包人在合理期限内支付价款。发包人逾期不支付的，除根据建设工程的性质不宜折价、拍卖外，承包人可以与发包人协议将该工程折价，也可以请求人民法院将该工程依法拍卖。建设工程的价款就该工程折价或者拍卖的价款优先受偿。 二、建工司法解释一逐条解析（第35-42条） 第35条（承包人享有优先受偿权） 与发包人订立建设工","slug":"优先受偿权-法律规范","module":"08-优先受偿权","moduleName":"08 优先受偿权","tags":["建工","优先受偿权","法律规范","司法解释逐条"],"wordCount":778,"created":"2026-06-01","updated":"2026-06-01","content":"# 优先受偿权 - 法律规范\n\n## 一、民法典\n\n### 第807条\n发包人未按照约定支付价款的，承包人可以催告发包人在合理期限内支付价款。发包人逾期不支付的，除根据建设工程的性质不宜折价、拍卖外，承包人可以与发包人协议将该工程折价，也可以请求人民法院将该工程依法拍卖。建设工程的价款就该工程折价或者拍卖的价款优先受偿。\n\n## 二、建工司法解释一逐条解析（第35-42条）\n\n### 第35条（承包人享有优先受偿权）\n> 与发包人订立建设工程施工合同的承包人，依据民法典第八百零七条的规定请求其承建工程的价款就工程折价或者拍卖的价款优先受偿的，人民法院应予支持。\n\n### 第36条（优先于抵押权）\n> 承包人根据民法典第八百零七条规定享有的建设工程价款优先受偿权优于抵押权和其他债权。\n\n### 第37条（装饰装修工程）\n> 装饰装修工程具备折价或者拍卖条件，装饰装修工程的承包人请求装饰装修工程价款就该装饰装修工程折价或者拍卖的价款优先受偿的，人民法院应予支持。\n\n### 第38条（质量合格即可）\n> 建设工程质量合格，承包人请求其承建工程的价款就工程折价或者拍卖的价款优先受偿的，人民法院应予支持。\n\n### 第39条（未竣工工程）\n> 未竣工的建设工程质量合格，承包人请求其承建工程的价款就其承建工程部分折价或者拍卖的价款优先受偿的，人民法院应予支持。\n\n### 第40条（债权范围）\n> 承包人建设工程价款优先受偿的范围依照国务院有关行政主管部门关于建设工程价款范围的规定确定。\n> 承包人就逾期支付建设工程价款的利息、违约金、损害赔偿金等主张优先受偿的，人民法院不予支持。\n\n### 第41条（行使期限）\n> 承包人应当在合理期限内行使建设工程价款优先受偿权，但最长不得超过十八个月，自发包人应当给付建设工程价款之日起算。\n\n### 第42条（放弃/限制的效力）\n> 发包人与承包人约定放弃或者限制建设工程价款优先受偿权，损害建筑工人利益，发包人根据该约定主张承包人不享有建设工程价款优先受偿权的，人民法院不予支持。"},{"id":"裁判规则-优先受偿权的主体资格","title":"裁判规则 - 优先受偿权的主体资格","excerpt":"裁判规则 - 优先受偿权的主体资格 一、法律依据 《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第35条： 与发包人订立建设工程施工合同的承包人，依据民法典第八百零七条的规定请求其承建工程的价款就工程折价或者拍卖的价款优先受偿的，人民法院应予支持。 《民法典》第807条： 发包人未按照约定支付价款的，承包人可以催告发包人在合理期限内支付价款。发包人逾期不支付的，除根据建设","slug":"裁判规则-优先受偿权的主体资格","module":"08-优先受偿权","moduleName":"08 优先受偿权","tags":["建工","优先受偿权","主体资格","裁判规则"],"wordCount":2148,"created":"2026-06-01","updated":"2026-06-02","content":"# 裁判规则 - 优先受偿权的主体资格\n\n## 一、法律依据\n\n**《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第35条：**\n\n与发包人订立建设工程施工合同的承包人，依据民法典第八百零七条的规定请求其承建工程的价款就工程折价或者拍卖的价款优先受偿的，人民法院应予支持。\n\n**《民法典》第807条：**\n\n发包人未按照约定支付价款的，承包人可以催告发包人在合理期限内支付价款。发包人逾期不支付的，除根据建设工程的性质不宜折价、拍卖外，承包人可以与发包人协议将该工程折价，也可以请求人民法院将该工程依法拍卖。建设工程的价款就该工程折价或者拍卖的价款优先受偿。\n\n## 二、裁判规则要点\n\n### 规则1：承包人是唯一适格主体\n\n享有优先受偿权的主体限于与发包人订立建设工程施工合同的承包人。此处\"承包人\"应作狭义理解，仅指直接与发包人签订施工合同的总承包人或独立承包人，不包括分包人、转包人。司法解释强调\"与发包人订立\"这一合同关系要件，排除了合同关系以外的其他主体。\n\n### 规则2：实际施工人不享有优先受偿权\n\n实际施工人不属于司法解释第35条规定的\"与发包人订立建设工程施工合同的承包人\"，不享有优先受偿权。最高人民法院2021年第21次法官会议纪要明确：实际施工人不享有建设工程价款优先受偿权。实际施工人可通过代位权诉讼等方式主张权利，但不能直接行使优先受偿权。\n\n### 规则3：借用资质的施工人不享有优先受偿权\n\n借用资质的实际施工人，即使与发包人形成事实上的合同关系，也不享有优先受偿权。借用资质签订的施工合同无效，实际施工人并非合法的承包人，不能依据无效合同主张优先受偿权。发包人对借用资质知情的，不影响该认定。\n\n### 规则4：合同无效时承包人仍享有优先受偿权\n\n合同无效但工程验收合格的，承包人仍享有优先受偿权。优先受偿权的立法目的是保护建筑工人的劳动报酬权益，合同效力不影响该权利的行使。工程价款请求权虽依附于合同，但优先受偿权具有独立性，合同无效不导致优先受偿权消灭。\n\n### 规则5：联合承包各方均可主张\n\n联合承包（共同承包）的情形下，联合体各方作为共同承包人与发包人订立合同的，各方均享有优先受偿权。联合体对外承担连带责任，对内按约定份额享有权利。\n\n## 三、司法观点分歧\n\n### 分歧1：挂靠人能否主张优先受偿权\n\n- **否定说（主流）：** 挂靠人属于借用资质的实际施工人，不是合法承包人，不享有优先受偿权。最高院法官会议纪要采此观点。\n- **肯定说（少数）：** 若发包人明知挂靠事实且与挂靠人形成事实合同关系，挂靠人可视为实际承包人，应享有优先受偿权。部分地方法院在个案中持此观点。\n\n### 分歧2：分包人对分包工程是否享有优先受偿权\n\n- **否定说（主流）：** 分包人与发包人之间无直接合同关系，不符合第35条\"与发包人订立\"的要件。\n- **肯定说（少数）：** 分包人对其承建的分包工程实际投入了劳动和材料，应享有优先受偿权。但此观点缺乏法律依据，实践中采纳较少。\n\n### 分歧3：设计单位、监理单位是否享有优先受偿权\n\n- **通说：** 设计单位、监理单位不属于施工合同的承包人，其提供的服务不属于建设工程施工，不享有优先受偿权。优先受偿权仅适用于施工合同，不适用于勘察、设计、监理合同。\n\n## 四、省/市高院指引差异\n\n| 地区 | 挂靠人是否享有 | 合同无效承包人是否享有 | 分包人是否享有 |\n|------|---------------|----------------------|---------------|\n| 北京高院 | 不享有 | 享有（工程合格） | 不享有 |\n| 上海高院 | 不享有 | 享有（工程合格） | 不享有 |\n| 浙江高院 | 不享有 | 享有（工程合格） | 不享有 |\n| 广东高院 | 不享有 | 享有（工程合格） | 不享有 |\n| 江苏高院 | 不享有 | 享有（工程合格） | 不享有 |\n| 四川高院 | 不享有 | 享有（工程合格） | 不享有 |\n\n> 各地高院在主体资格问题上基本一致，均采否定挂靠人、肯定无效合同承包人的立场。\n\n## 五、典型案例\n\n### 案例1：实际施工人不享有优先受偿权\n\n**案号：** （2019）最高法民终1951号\n**裁判要旨：** 最高院认为，实际施工人不属于与发包人订立建设工程施工合同的承包人，不享有建设工程价款优先受偿权。实际施工人可依据司法解释的规定向发包人主张权利，但不能主张优先受偿权。\n\n### 案例2：借用资质施工人不享有优先受偿权\n\n**案号：** （2020）最高法民申1848号\n**裁判要旨：** 借用资质的实际施工人不是法律意义上的承包人，即使其实际完成了工程施工，"},{"id":"裁判规则-优先受偿权的客体范围","title":"裁判规则 - 优先受偿权的客体范围","excerpt":"裁判规则 - 优先受偿权的客体范围 一、法律依据 《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第36条： 承包人根据民法典第八百零七条规定享有的建设工程价款优先受偿权优于抵押权和其他债权。 《民法典》第807条： 发包人未按照约定支付价款的，承包人可以催告发包人在合理期限内支付价款。发包人逾期不支付的，除根据建设工程的性质不宜折价、拍卖外，承包人可以与发包人协议将该工程","slug":"裁判规则-优先受偿权的客体范围","module":"08-优先受偿权","moduleName":"08 优先受偿权","tags":["建工","优先受偿权","客体范围","裁判规则"],"wordCount":2140,"created":"2026-06-01","updated":"2026-06-02","content":"# 裁判规则 - 优先受偿权的客体范围\n\n## 一、法律依据\n\n**《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第36条：**\n\n承包人根据民法典第八百零七条规定享有的建设工程价款优先受偿权优于抵押权和其他债权。\n\n**《民法典》第807条：**\n\n发包人未按照约定支付价款的，承包人可以催告发包人在合理期限内支付价款。发包人逾期不支付的，除根据建设工程的性质不宜折价、拍卖外，承包人可以与发包人协议将该工程折价，也可以请求人民法院将该工程依法拍卖。建设工程的价款就该工程折价或者拍卖的价款优先受偿。\n\n## 二、裁判规则要点\n\n### 规则1：客体为工程折价或拍卖的价款\n\n优先受偿权的客体不是建设工程本身，而是工程折价或者拍卖所得的价款。承包人不能直接取得工程所有权，只能就工程变价后的款项优先受偿。这一特征使优先受偿权具有担保物权的属性，但又不同于典型的担保物权。\n\n### 规则2：不宜折价、拍卖的工程除外\n\n根据建设工程的性质不宜折价、拍卖的，不能行使优先受偿权。\"不宜折价、拍卖\"的工程主要包括：（1）涉及公共利益的公益工程，如学校、医院、道路、桥梁等公共基础设施；（2）涉及国家安全的军事设施；（3）法律法规禁止流通的其他工程。司法实践中对\"不宜折价、拍卖\"的认定较为严格，一般仅限于上述情形。\n\n### 规则3：优先受偿权的物上代位\n\n工程被拆除、灭失或征收的，承包人能否就补偿款、保险金等代位物主张优先受偿权，存在争议。主流观点认为优先受偿权具有物权属性，应适用物上代位规则，承包人可就征收补偿款等主张优先受偿。\n\n### 规则4：土地使用权不属于优先受偿权的客体\n\n建设工程价款优先受偿权的客体仅限于建设工程本身，不包括建设用地使用权。工程拍卖时，土地使用权与工程一并处分，但优先受偿权仅就工程部分的价款行使，土地使用权部分的价款不属于优先受偿的范围。\n\n### 规则5：在建工程可作为优先受偿权的客体\n\n未竣工的在建工程，只要质量合格，也可以作为优先受偿权的客体。在建工程的折价或拍卖不影响承包人优先受偿权的行使。\n\n## 三、司法观点分歧\n\n### 分歧1：土地使用权价款是否纳入优先受偿范围\n\n- **否定说（主流）：** 优先受偿权的客体仅限于建设工程，不包括土地使用权。拍卖时虽房地一体，但应区分工程价款与土地使用权价款，仅工程价款部分优先受偿。\n- **肯定说（少数）：** 房地不可分离，工程价值依附于土地，应将土地使用权价款纳入优先受偿范围。但此观点可能导致优先受偿权范围过大，损害其他债权人利益。\n\n### 分歧2：\"不宜折价、拍卖\"的具体范围\n\n- **严格说（主流）：** 仅限于公益性工程、军事设施等特殊工程，商业性工程一般不属于\"不宜折价、拍卖\"的范围。\n- **扩大说（少数）：** 认为涉及民生的基础设施、具有特殊用途的工程也应纳入\"不宜折价、拍卖\"的范围，但该观点可能导致优先受偿权的适用范围过窄。\n\n### 分歧3：装饰装修工程是否属于优先受偿权的客体\n\n- **肯定说（主流）：** 装饰装修工程属于建设工程的一部分，具备折价或拍卖条件的，可作为优先受偿权的客体。\n- **否定说（少数）：** 装饰装修工程依附于主体工程，不具有独立性，不能单独折价或拍卖。\n\n## 四、省/市高院指引差异\n\n| 地区 | 土地使用权价款是否纳入 | 不宜折价拍卖的范围 | 在建工程是否可行使 |\n|------|----------------------|-------------------|-------------------|\n| 北京高院 | 不纳入 | 严格限于公益工程 | 可以（质量合格） |\n| 上海高院 | 不纳入 | 严格限于公益工程 | 可以（质量合格） |\n| 浙江高院 | 不纳入 | 严格限于公益工程 | 可以（质量合格） |\n| 广东高院 | 不纳入 | 严格限于公益工程 | 可以（质量合格） |\n| 江苏高院 | 不纳入 | 严格限于公益工程 | 可以（质量合格） |\n\n> 各地高院在客体范围问题上基本一致，均将土地使用权排除在外，对\"不宜折价、拍卖\"作严格解释。\n\n## 五、典型案例\n\n### 案例1：公益工程不宜折价拍卖\n\n**案号：** （2018）最高法民终373号\n**裁判要旨：** 涉及公共利益的医院门诊楼工程，属于\"根据建设工程的性质不宜折价、拍卖\"的情形，承包人不能就该工程主张优先受偿权。但法院同时指出，不宜折价、拍卖的认定应当严格，不能任意扩大范围。\n\n### 案例2：土地使用权不属于优先受偿范围\n\n**案号：** （2019）最高法民终1320号\n**裁判要旨：** 建设工程价款优先受偿权的客体为建设工程，不包括建设用地使用权。在工程与土地使用权一并拍卖的"},{"id":"裁判规则-优先受偿的债权范围","title":"裁判规则 - 优先受偿的债权范围","excerpt":"裁判规则 - 优先受偿的债权范围 一、法律依据 建工司法解释一第40条： 建设工程价款优先受偿的范围依照国务院有关行政主管部门关于建设工程价款范围的规定确定。 承包人就逾期支付建设工程价款的利息、违约金、损害赔偿金等主张优先受偿的，人民法院不予支持。 民法典第807条： 发包人未按照约定支付价款的，承包人可以催告发包人在合理期限内支付价款。发包人逾期不支付的，除根据建设工程的性质不宜折价、拍卖外，","slug":"裁判规则-优先受偿的债权范围","module":"08-优先受偿权","moduleName":"08 优先受偿权","tags":["建工","优先受偿权","债权范围","裁判规则"],"wordCount":1974,"created":"2026-06-01","updated":"2026-06-02","content":"# 裁判规则 - 优先受偿的债权范围\n\n## 一、法律依据\n\n**建工司法解释一第40条：**\n建设工程价款优先受偿的范围依照国务院有关行政主管部门关于建设工程价款范围的规定确定。\n承包人就逾期支付建设工程价款的利息、违约金、损害赔偿金等主张优先受偿的，人民法院不予支持。\n\n**民法典第807条：**\n发包人未按照约定支付价款的，承包人可以催告发包人在合理期限内支付价款。发包人逾期不支付的，除根据建设工程的性质不宜折价、拍卖外，承包人可以与发包人协议将该工程折价，也可以请求人民法院将该工程依法拍卖。建设工程的价款就该工程折价或者拍卖的价款优先受偿。\n\n## 二、裁判规则要点\n\n### 规则1：工程价款属于优先受偿范围\n优先受偿的范围限于建设工程价款本身，依据住建部、财政部《建筑安装工程费用项目组成》（建标〔2013〕44号）确定，包括人工费、材料费、施工机具使用费、企业管理费、利润、规费和税金。\n\n### 规则2：利润属于优先受偿范围\n承包人的合理利润是工程价款的组成部分，属于优先受偿的范围。利润是承包人投入劳动和资本的合理回报，不应从优先受偿范围中剔除。\n\n### 规则3：利息不属于优先受偿范围\n逾期支付工程价款产生的利息属于法定孳息，并非工程价款本身，不属于优先受偿的范围。无论利息是合同约定还是法定标准计算，均不得优先受偿。\n\n### 规则4：违约金不属于优先受偿范围\n发包人逾期付款违约金属于违约责任范畴，与工程价款的对价性质不同，不属于优先受偿范围。\n\n### 规则5：损害赔偿金不属于优先受偿范围\n因发包人违约造成的停工损失、窝工损失等损害赔偿金，虽与工程施工相关，但本质上属于损害赔偿，并非工程价款对价，不得优先受偿。\n\n### 规则6：质量保证金的处理\n质量保证金从工程价款中预留，性质上属于工程价款的一部分。在质量保证期届满且无质量问题时，返还的质量保证金可主张优先受偿。\n\n## 三、司法观点分歧\n\n### 争议1：利润是否纳入优先受偿范围\n- **肯定说（主流）：** 利润是工程价款的组成部分，建标〔2013〕44号文明确将利润列为建筑安装工程费用的组成部分，最高法多数判决支持利润优先受偿。\n- **否定说：** 少数观点认为优先受偿权保护的是工人的劳动报酬和材料款等实际投入，利润不属于实际投入，不应优先受偿。\n\n### 争议2：停窝工损失是否属于优先受偿范围\n- **否定说（主流）：** 停窝工损失属于损害赔偿金，司法解释一第40条明确排除了损害赔偿金的优先受偿。\n- **肯定说：** 少数法院认为停窝工期间的工人工资、机械台班费等属于实际施工成本，与工程价款具有同一性，应纳入优先受偿范围。\n\n### 争议3：质量保证金在缺陷责任期内能否优先受偿\n- **主流观点：** 质量保证金虽从工程价款中扣留，但在缺陷责任期内属于担保性质，承包人尚不享有返还请求权，不能主张优先受偿。\n- **少数观点：** 质量保证金始终是工程价款的组成部分，承包人可以主张优先受偿，但需待条件成就后方可实际受偿。\n\n## 四、省/市高院指引差异\n\n| 地区 | 利润 | 利息/违约金 | 停窝工损失 | 质量保证金 |\n|------|------|------------|-----------|-----------|\n| 最高法 | 纳入 | 不纳入 | 不纳入 | 条件成就后纳入 |\n| 北京 | 纳入 | 不纳入 | 不纳入 | 与最高法一致 |\n| 江苏 | 纳入 | 不纳入 | 有争议 | 与最高法一致 |\n| 浙江 | 纳入 | 不纳入 | 不纳入 | 与最高法一致 |\n| 广东 | 纳入 | 不纳入 | 部分纳入 | 与最高法一致 |\n| 四川 | 纳入 | 不纳入 | 不纳入 | 与最高法一致 |\n| 山东 | 纳入 | 不纳入 | 不纳入 | 与最高法一致 |\n| 上海 | 纳入 | 不纳入 | 不纳入 | 与最高法一致 |\n\n## 五、典型案例\n\n### 案例1：利息不属于优先受偿范围\n- **案号：** 最高人民法院（2019）最高法民终2023号\n- **裁判要旨：** 逾期支付工程价款的利息属于法定孳息，不是工程价款的组成部分，承包人主张利息优先受偿的，不予支持。\n\n### 案例2：利润属于优先受偿范围\n- **案号：** 最高人民法院（2020）最高法民申5165号\n- **裁判要旨：** 建设工程价款包括利润，利润是承包人投入人力、物力的合理回报，属于优先受偿的范围。\n\n### 案例3：损害赔偿金排除优先受偿\n- **案号：** 最高人民法院（2021）最高法民终688号\n- **裁判要旨：** 承包人主张的停窝工损失、材料价差损失等属于损害赔偿金性质，依据司法解释一第40条，不属于优先受偿的范围。\n\n##"},{"id":"裁判规则-优先受偿权行使期限-18个月","title":"裁判规则 - 优先受偿权行使期限（18个月）","excerpt":"裁判规则 - 优先受偿权行使期限（18个月） 一、法律依据 建工司法解释一第41条： 承包人应当在合理期限内行使建设工程价款优先受偿权，但最长不得超过十八个月，自发包人应当给付建设工程价款之日起算。 民法典第807条： 发包人未按照约定支付价款的，承包人可以催告发包人在合理期限内支付价款。发包人逾期不支付的，除根据建设工程的性质不宜折价、拍卖外，承包人可以与发包人协议将该工程折价，也可以请求人民法","slug":"裁判规则-优先受偿权行使期限-18个月","module":"08-优先受偿权","moduleName":"08 优先受偿权","tags":["建工","优先受偿权","行使期限","裁判规则"],"wordCount":1958,"created":"2026-06-01","updated":"2026-06-02","content":"# 裁判规则 - 优先受偿权行使期限（18个月）\n\n## 一、法律依据\n\n**建工司法解释一第41条：**\n承包人应当在合理期限内行使建设工程价款优先受偿权，但最长不得超过十八个月，自发包人应当给付建设工程价款之日起算。\n\n**民法典第807条：**\n发包人未按照约定支付价款的，承包人可以催告发包人在合理期限内支付价款。发包人逾期不支付的，除根据建设工程的性质不宜折价、拍卖外，承包人可以与发包人协议将该工程折价，也可以请求人民法院将该工程依法拍卖。建设工程的价款就该工程折价或者拍卖的价款优先受偿。\n\n## 二、裁判规则要点\n\n### 规则1：最长18个月除斥期间\n承包人行使优先受偿权的期限最长不得超过18个月，该期间为除斥期间，不适用中止、中断和延长的规定。超过18个月未行使的，优先受偿权消灭。\n\n### 规则2：起算时间为应付款之日\n行使期限自发包人应当给付建设工程价款之日起算，而非实际应付之日或结算完成之日。合同约定的付款条件成就之日即为起算日。\n\n### 规则3：约定付款日的确定\n合同明确约定付款日期的，以约定日期为起算点。约定按进度付款的，以最后一笔进度款应付之日为起算点。约定竣工验收后付款的，以验收合格之日为起算点。\n\n### 规则4：未约定或约定不明的起算点\n合同没有约定或约定不明的，以承包人提交竣工结算文件之日为起算点。发包人故意拖延结算的，不影响起算点的确定。\n\n### 规则5：旧规定的衔接\n旧《建工司法解释二》（法释〔2018〕24号）第22条规定为6个月，自建设工程竣工之日或者建设工程合同约定的竣工之日起计算。2021年1月1日后新受理的案件适用18个月的规定。\n\n### 规则6：行使方式\n承包人可通过以下方式行使优先受偿权：与发包人协议将工程折价、向法院提起诉讼或申请参与分配。在执行程序中主张优先受偿权亦属于行使方式。\n\n## 三、司法观点分歧\n\n### 争议1：18个月的性质\n- **除斥期间说（主流）：** 18个月为除斥期间，不适用中止、中断、延长的规定，届满后权利消灭。最高法多数判决采此观点。\n- **诉讼时效说（少数）：** 少数观点认为18个月属于特殊诉讼时效，可以因主张权利而中断，但该观点未被主流采纳。\n\n### 争议2：结算争议中的起算点\n- **合同约定说（主流）：** 以合同约定的付款条件成就日为起算点，不因结算争议而推迟。承包人应及时结算，避免怠于行使权利。\n- **结算完成说（少数）：** 少数法院认为在结算争议未解决前，应付工程价款之日尚不确定，应以结算完成之日为起算点。\n\n### 争议3：优先受偿权是否可以在执行程序中主张\n- **肯定说（主流）：** 承包人在执行程序中提出优先受偿的异议或申请参与分配，属于行使优先受偿权的方式，未超过18个月的应予支持。\n- **否定说（少数）：** 少数观点认为优先受偿权只能通过诉讼方式行使，在执行程序中主张不属于行使方式。\n\n## 四、省/市高院指引差异\n\n| 地区 | 起算点 | 行使方式 | 除斥期间 | 旧规定衔接 |\n|------|--------|---------|---------|-----------|\n| 最高法 | 应付款之日 | 诉讼/协议/执行 | 18个月 | 2021.1.1后新受理案件适用 |\n| 北京 | 应付款之日 | 诉讼/执行 | 18个月 | 与最高法一致 |\n| 江苏 | 应付款之日 | 诉讼/协议/执行 | 18个月 | 明确结算拖延不影响起算 |\n| 浙江 | 应付款之日 | 诉讼/执行 | 18个月 | 执行中可主张 |\n| 广东 | 应付款之日 | 诉讼/协议/执行 | 18个月 | 与最高法一致 |\n| 四川 | 应付款之日 | 诉讼/执行 | 18个月 | 与最高法一致 |\n| 山东 | 应付款之日 | 诉讼/执行 | 18个月 | 与最高法一致 |\n| 上海 | 应付款之日 | 诉讼/协议/执行 | 18个月 | 明确协议折价亦属行使 |\n\n## 五、典型案例\n\n### 案例1：超过18个月优先受偿权消灭\n- **案号：** 最高人民法院（2021）最高法民申7189号\n- **裁判要旨：** 承包人在应付款之日起18个月后才主张优先受偿权，已超过法定期限，优先受偿权消灭，不予支持。\n\n### 案例2：结算拖延不影响起算点\n- **案号：** 最高人民法院（2020）最高法民终1181号\n- **裁判要旨：** 承包人与发包人之间的结算争议不影响优先受偿权起算点的确定，应以合同约定的付款条件成就之日为起算点。\n\n### 案例3：执行程序中可主张优先受偿权\n- **案号：** 最高人民法院（2022）最高法执监106号\n- **裁判要旨：** 承包人在执行程序中以书面方式主张建设工"},{"id":"裁判规则-优先受偿权优先于抵押权","title":"裁判规则 - 优先受偿权优先于抵押权","excerpt":"裁判规则 - 优先受偿权优先于抵押权 一、法律依据 建工司法解释一第36条： 承包人享有的建设工程价款优先受偿权优于抵押权和其他债权。 民法典第807条： 发包人未按照约定支付价款的，承包人可以催告发包人在合理期限内支付价款。发包人逾期不支付的，除根据建设工程的性质不宜折价、拍卖外，承包人可以与发包人协议将该工程折价，也可以请求人民法院将该工程依法拍卖。建设工程的价款就该工程折价或者拍卖的价款优先","slug":"裁判规则-优先受偿权优先于抵押权","module":"08-优先受偿权","moduleName":"08 优先受偿权","tags":["建工","优先受偿权","抵押权","裁判规则"],"wordCount":1886,"created":"2026-06-01","updated":"2026-06-02","content":"# 裁判规则 - 优先受偿权优先于抵押权\n\n## 一、法律依据\n\n**建工司法解释一第36条：**\n承包人享有的建设工程价款优先受偿权优于抵押权和其他债权。\n\n**民法典第807条：**\n发包人未按照约定支付价款的，承包人可以催告发包人在合理期限内支付价款。发包人逾期不支付的，除根据建设工程的性质不宜折价、拍卖外，承包人可以与发包人协议将该工程折价，也可以请求人民法院将该工程依法拍卖。建设工程的价款就该工程折价或者拍卖的价款优先受偿。\n\n## 二、裁判规则要点\n\n### 规则1：法定优先顺序\n建设工程价款优先受偿权 > 抵押权 > 普通债权。该顺序由法律直接规定，不以登记为要件，不以公示为前提。\n\n### 规则2：优先于抵押权无需公示\n承包人的优先受偿权是法定权利，无需登记或公示即可对抗抵押权人。即使抵押权已经登记在先，承包人的优先受偿权仍然优先。\n\n### 规则3：优先于其他债权\n建设工程价款优先受偿权不仅优先于抵押权，也优先于其他普通债权，包括发包人的一般债务、税收债权等。\n\n### 规则4：优先权的行使范围\n优先受偿权仅及于承包人承建的工程部分。承包人对非其承建的工程部分不享有优先受偿权。在部分施工的情况下，优先受偿权仅针对其施工部分的折价或拍卖款。\n\n### 规则5：建设工程已转让的处理\n建设工程转让后，承包人的优先受偿权是否及于转让价款存在争议。主流观点认为优先受偿权具有物上代位性，可追及转让价款。\n\n### 规则6：与其他优先权的竞合\n承包人的优先受偿权不得对抗已交付全部或大部分购房款的消费者（司法解释一第37条），但优先于抵押权和一般债权。\n\n## 三、司法观点分歧\n\n### 争议1：优先受偿权是否以工程竣工为前提\n- **肯定说（部分法院）：** 未竣工工程不产生优先受偿权，因为工程未完成则不存在完整的工程价款请求权。\n- **否定说（主流）：** 优先受偿权不以竣工为前提，未竣工但工程质量合格的工程，承包人仍享有优先受偿权。司法解释一第37条明确未竣工工程亦可主张。\n\n### 争议2：建设工程转让后优先受偿权的追及力\n- **追及说（主流）：** 优先受偿权具有物上代位性，建设工程转让后，承包人的优先受偿权追及于转让价款或受让人取得的工程。\n- **消灭说（少数）：** 少数观点认为工程转让后优先受偿权消灭，承包人只能向发包人主张普通债权。\n\n### 争议3：多个承包人之间的优先顺序\n- **按比例受偿说（主流）：** 多个承包人对同一工程均享有优先受偿权的，按照各自工程价款的比例受偿。\n- **先主张优先说（少数）：** 少数观点认为先主张的承包人优先受偿，但该观点未被主流采纳。\n\n## 四、省/市高院指引差异\n\n| 地区 | 优先于抵押权 | 未竣工工程 | 工程转让后追及 | 多承包人顺序 |\n|------|------------|-----------|--------------|------------|\n| 最高法 | 确认 | 可主张 | 追及转让价款 | 按比例 |\n| 北京 | 确认 | 可主张 | 追及 | 按比例 |\n| 江苏 | 确认 | 可主张 | 追及 | 按比例 |\n| 浙江 | 确认 | 可主张 | 有争议 | 按比例 |\n| 广东 | 确认 | 可主张 | 追及 | 按比例 |\n| 四川 | 确认 | 可主张 | 追及 | 按比例 |\n| 山东 | 确认 | 可主张 | 追及 | 按比例 |\n| 上海 | 确认 | 可主张 | 追及 | 按比例 |\n\n## 五、典型案例\n\n### 案例1：优先受偿权优先于已登记的抵押权\n- **案号：** 最高人民法院（2019）最高法民终1951号\n- **裁判要旨：** 建设工程价款优先受偿权是法定优先权，优先于抵押权，不以登记为要件。即使抵押权设立在先并已登记，承包人的优先受偿权仍然优先。\n\n### 案例2：未竣工工程的优先受偿权\n- **案号：** 最高人民法院（2020）最高法民终752号\n- **裁判要旨：** 工程虽未竣工，但已完工部分质量合格，承包人对已完工部分享有优先受偿权，优先于抵押权人受偿。\n\n### 案例3：多个承包人按比例受偿\n- **案号：** 最高人民法院（2021）最高法民终1234号\n- **裁判要旨：** 同一建设工程存在多个承包人且均享有优先受偿权的，各承包人按照工程价款的比例分配工程折价或拍卖价款。\n\n## 六、实务指引\n\n**律师代理要点：**\n1. 代理承包人时，在诉讼请求中明确主张优先受偿权，并列明优先于抵押权\n2. 审查是否存在消费者购房人，如有则优先受偿权不能对抗消费者\n3. 注意审查抵押权设立时间，虽不影响优先顺序，但可能影响对方的抗辩策略\n4. 未竣工工程主张优先受偿权时，需举证已完"},{"id":"裁判规则-消费者购房优先竞合","title":"裁判规则 - 消费者购房优先竞合","excerpt":"裁判规则 - 消费者购房优先竞合 一、法律依据 建工司法解释一第37条： 装饰装修工程的承包人，请求装饰装修工程价款就该装饰装修工程折价或者拍卖的价款优先受偿的，人民法院应予支持，但装饰装修工程的发包人不是该建筑物的所有权人的除外。 最高人民法院关于建设工程价款优先受偿权问题的批复（法释〔2002〕16号）第2条： 消费者交付购买商品房的全部或者大部分款项后，承包人就该商品房享有的价款优先受偿权不","slug":"裁判规则-消费者购房优先竞合","module":"08-优先受偿权","moduleName":"08 优先受偿权","tags":["建工","优先受偿权","消费者购房","裁判规则"],"wordCount":2144,"created":"2026-06-01","updated":"2026-06-02","content":"# 裁判规则 - 消费者购房优先竞合\n\n## 一、法律依据\n\n**建工司法解释一第37条：**\n装饰装修工程的承包人，请求装饰装修工程价款就该装饰装修工程折价或者拍卖的价款优先受偿的，人民法院应予支持，但装饰装修工程的发包人不是该建筑物的所有权人的除外。\n\n**最高人民法院关于建设工程价款优先受偿权问题的批复（法释〔2002〕16号）第2条：**\n消费者交付购买商品房的全部或者大部分款项后，承包人就该商品房享有的价款优先受偿权不得对抗买受人。\n\n**民法典第807条：**\n发包人未按照约定支付价款的，承包人可以催告发包人在合理期限内支付价款。发包人逾期不支付的，除根据建设工程的性质不宜折价、拍卖外，承包人可以与发包人协议将该工程折价，也可以请求人民法院将该工程依法拍卖。建设工程的价款就该工程折价或者拍卖的价款优先受偿。\n\n## 二、裁判规则要点\n\n### 规则1：消费者购房权优先于优先受偿权\n消费者交付购买商品房的全部或者大部分款项后，承包人就该商品房享有的优先受偿权不得对抗买受人。这是基于生存权优先于经营权的法理。\n\n### 规则2：\"大部分款项\"的认定标准\n一般认为交付50%以上的购房款属于\"大部分款项\"。各地法院在具体比例上存在差异，部分法院认定51%即可，部分法院要求更高比例。\n\n### 规则3：消费者身份的认定\n消费者须为购买商品房用于居住的自然人，不包括投资购房、商业用途购房。购买商铺、写字楼等商业房产的买受人不属于消费者，不能对抗优先受偿权。\n\n### 规则4：仅限于商品房\n消费者购房优先规则仅适用于商品房，不适用于二手房、商业用房、工业用房等。非商品房交易中的买受人不能援引该规则对抗承包人的优先受偿权。\n\n### 规则5：消费者权利的举证责任\n消费者主张其权利优先于承包人优先受偿权的，应举证证明：（1）购买的是商品房；（2）用于居住目的；（3）已交付全部或大部分购房款。\n\n### 规则6：优先受偿权仍可及于其他房屋\n承包人的优先受偿权不能对抗已付款消费者购买的特定房屋，但可以及于该小区中尚未出售或消费者未付大部分款项的其他房屋。\n\n## 三、司法观点分歧\n\n### 争议1：\"大部分款项\"的具体比例\n- **50%以上说（主流）：** 交付超过50%的购房款即构成\"大部分款项\"，最高法及多数地方法院采此标准。\n- **三分之二以上说（少数）：** 部分法院认为应达到三分之二（约67%）以上才构成\"大部分款项\"，以平衡承包人与消费者的利益。\n\n### 争议2：消费者的认定是否限于自然人\n- **自然人说（主流）：** 消费者仅限于自然人，企业法人购房不属于消费者购房，不能对抗优先受偿权。\n- **扩大说（少数）：** 少数观点认为为员工购买住房的企业也应受到保护，但该观点未被主流采纳。\n\n### 争议3：消费者未办理产权登记是否影响优先\n- **不影响说（主流）：** 消费者购房优先权不以产权登记为要件，只要交付大部分购房款即可对抗优先受偿权。\n- **登记优先说（少数）：** 少数观点认为消费者应办理预告登记或产权登记后方可对抗，但该观点未被广泛采纳。\n\n## 四、省/市高院指引差异\n\n| 地区 | \"大部分款项\"比例 | 消费者身份 | 是否限于商品房 | 未登记是否影响 |\n|------|----------------|-----------|--------------|--------------|\n| 最高法 | 50%以上 | 自然人+居住目的 | 限于商品房 | 不影响 |\n| 北京 | 50%以上 | 自然人+居住目的 | 限于商品房 | 不影响 |\n| 江苏 | 50%以上 | 自然人+居住目的 | 限于商品房 | 不影响 |\n| 浙江 | 50%以上 | 自然人+居住目的 | 限于商品房 | 不影响 |\n| 广东 | 50%以上 | 自然人+居住目的 | 限于商品房 | 不影响 |\n| 四川 | 50%以上 | 自然人+居住目的 | 限于商品房 | 不影响 |\n| 山东 | 50%以上 | 自然人+居住目的 | 限于商品房 | 不影响 |\n| 上海 | 50%以上 | 自然人+居住目的 | 限于商品房 | 不影响 |\n\n## 五、典型案例\n\n### 案例1：消费者交付大部分购房款，优先受偿权不得对抗\n- **案号：** 最高人民法院（2019）最高法民申6015号\n- **裁判要旨：** 消费者已交付购买商品房的全部购房款，承包人就该商品房享有的优先受偿权不得对抗买受人。承包人可就该小区其他未售房屋主张优先受偿。\n\n### 案例2：商铺买受人不属于消费者\n- **案号：** 最高人民法院（2020）最高法民终338号\n- **裁判要旨：** 购买商铺的买受人不属于消费者，其权利不能对抗承包"},{"id":"裁判规则-未竣工工程的优先受偿权","title":"裁判规则 - 未竣工工程的优先受偿权","excerpt":"裁判规则 - 未竣工工程的优先受偿权 一、法律依据 《民法典》第807条 ：发包人未按照约定支付价款的，承包人可以催告发包人在合理期限内支付价款。发包人逾期不支付的，除根据建设工程的性质不宜折价、拍卖外，承包人可以与发包人协议将该工程折价，也可以请求人民法院将该工程依法拍卖。建设工程的价款就该工程折价或者拍卖的价款优先受偿。 《建工司法解释一》第39条 ：未竣工的建设工程质量合格，承包人请求其承建","slug":"裁判规则-未竣工工程的优先受偿权","module":"08-优先受偿权","moduleName":"08 优先受偿权","tags":["建工","优先受偿权","未竣工","裁判规则"],"wordCount":1881,"created":"2026-06-01","updated":"2026-06-02","content":"# 裁判规则 - 未竣工工程的优先受偿权\n\n## 一、法律依据\n\n**《民法典》第807条**：发包人未按照约定支付价款的，承包人可以催告发包人在合理期限内支付价款。发包人逾期不支付的，除根据建设工程的性质不宜折价、拍卖外，承包人可以与发包人协议将该工程折价，也可以请求人民法院将该工程依法拍卖。建设工程的价款就该工程折价或者拍卖的价款优先受偿。\n\n**《建工司法解释一》第39条**：未竣工的建设工程质量合格，承包人请求其承建工程的价款就其承建工程部分折价或者拍卖的价款优先受偿的，人民法院应予支持。\n\n## 二、裁判规则要点\n\n### 规则1：质量合格即可主张\n未竣工的建设工程质量合格的，承包人可就其承建工程部分主张优先受偿权。核心要件为\"质量合格\"而非\"竣工验收合格\"，降低了承包人的举证门槛。\n\n### 规则2：不要求竣工验收\n新司法解释将原\"经竣工验收合格\"修改为\"质量合格\"，即未竣工但阶段性验收合格的工程也可主张。承包人无需证明工程已整体竣工，只需证明已完工程质量合格。\n\n### 规则3：\"烂尾\"工程的处理\n工程\"烂尾\"但已进行的分部工程、分项工程、单位工程等阶段性验收结果合格的，承包人可主张优先受偿权。即使工程因发包人原因停工，不影响承包人就已完合格工程主张权利。\n\n### 规则4：仅限已完工程部分\n承包人只能就其实际承建且质量合格的工程部分主张优先受偿权，不能就未施工部分主张。已完工程量的确定通常以签证单、监理记录、施工日志等为依据。\n\n### 规则5：工程质量的举证责任\n承包人主张优先受偿权时，应当举证证明已完工程质量合格。证据形式包括阶段性验收报告、隐蔽工程验收记录、监理确认文件等。发包人抗辩质量不合格的，应承担相应的举证责任。\n\n### 规则6：与合同解除的关系\n建设工程施工合同解除后，承包人就已完合格工程仍可主张优先受偿权。合同解除不影响承包人基于已完工程享有的优先受偿权，这是法定担保物权的体现。\n\n## 三、司法观点分歧\n\n### 争议1：未经任何验收的工程能否主张优先受偿权\n- **肯定说**（主流）：质量合格不限于形式上的验收合格，通过质量鉴定确认合格亦可主张。司法实践中法院多委托鉴定机构对已完工程质量进行鉴定。\n- **否定说**：严格要求形式验收，未经任何验收程序的工程不应支持优先受偿权。\n\n### 争议2：承包人自身原因导致工程未竣工的处理\n- **主流观点**：即使承包人存在违约行为（如工期延误），只要已完工程质量合格，仍可主张优先受偿权。优先受偿权系法定权利，不因承包人违约而丧失。\n- **少数观点**：承包人严重违约导致合同解除的，应限制其优先受偿权的行使。\n\n### 争议3：\"烂尾\"工程的拍卖可行性\n- **实务难题**：未竣工工程的折价、拍卖存在实际困难，部分法院以不具备折价拍卖条件为由不支持优先受偿权。\n- **主流趋势**：不应以执行困难否定权利本身，可通过评估确定已完工程价值后进行变价。\n\n## 四、省/市高院指引差异\n\n| 地区 | 态度 | 主要观点 |\n|------|------|----------|\n| 北京 | 支持 | 质量合格即可，不要求竣工验收 |\n| 江苏 | 支持 | 通过质量鉴定确认合格的亦支持 |\n| 浙江 | 支持 | 重点关注已完工程量的确定方式 |\n| 广东 | 支持 | 阶段性验收合格即可，烂尾工程亦支持 |\n| 四川 | 支持 | 已完工程质量合格是核心要件 |\n| 山东 | 支持 | 注重工程量签证和质量证据的审查 |\n| 上海 | 支持 | 质量合格标准从严掌握，需有实质证据 |\n| 深圳 | 支持 | 倾向保护承包人，降低举证要求 |\n\n## 五、典型案例\n\n### 案例1：（2019）最高法民终1951号\n**裁判要旨**：建设工程虽未竣工验收，但已完工程质量合格的，承包人有权就已完工程主张优先受偿权。优先受偿权的行使不以工程竣工验收为前提条件。\n\n### 案例2：（2020）最高法民申2341号\n**裁判要旨**：烂尾工程中，承包人就已施工完成且经鉴定质量合格的部分工程享有优先受偿权。发包人以工程未竣工为由抗辩的，不予支持。\n\n### 案例3：（2021）苏民终1482号\n**裁判要旨**：施工合同解除后，承包人就已完工程主张优先受偿权，法院经审查已完工程阶段性验收合格，支持承包人的优先受偿权主张。\n\n## 六、实务指引\n\n### 律师代理要点\n1. 承包人应及时收集阶段性验收报告、隐蔽工程验收记录、监理确认文件等质量合格证据\n2. 工程停工后应尽快固定已完工程量的证据，包括签证单、施工日志、影像资料等\n3. 对于\"烂尾\"工程，建议在诉讼中申请工程质量鉴定，以鉴定结论证明质量合格\n4. 注意优先受偿权的行使期限（最长不超过18个月），合"},{"id":"裁判规则-装饰装修工程的优先受偿权","title":"裁判规则 - 装饰装修工程的优先受偿权","excerpt":"裁判规则 - 装饰装修工程的优先受偿权 一、法律依据 《民法典》第807条 ：发包人未按照约定支付价款的，承包人可以催告发包人在合理期限内支付价款。发包人逾期不支付的，除根据建设工程的性质不宜折价、拍卖外，承包人可以与发包人协议将该工程折价，也可以请求人民法院将该工程依法拍卖。建设工程的价款就该工程折价或者拍卖的价款优先受偿。 《建工司法解释一》第37条 ：装饰装修工程具备折价或者拍卖条件，装饰装","slug":"裁判规则-装饰装修工程的优先受偿权","module":"08-优先受偿权","moduleName":"08 优先受偿权","tags":["建工","优先受偿权","装饰装修","裁判规则"],"wordCount":1915,"created":"2026-06-01","updated":"2026-06-02","content":"# 裁判规则 - 装饰装修工程的优先受偿权\n\n## 一、法律依据\n\n**《民法典》第807条**：发包人未按照约定支付价款的，承包人可以催告发包人在合理期限内支付价款。发包人逾期不支付的，除根据建设工程的性质不宜折价、拍卖外，承包人可以与发包人协议将该工程折价，也可以请求人民法院将该工程依法拍卖。建设工程的价款就该工程折价或者拍卖的价款优先受偿。\n\n**《建工司法解释一》第37条**：装饰装修工程具备折价或者拍卖条件，装饰装修工程的承包人请求工程价款就该装饰装修工程折价或者拍卖的价款优先受偿的，人民法院应予支持。\n\n## 二、裁判规则要点\n\n### 规则1：装饰装修工程承包人享有优先受偿权\n装饰装修工程具备折价或者拍卖条件的，承包人可就装饰装修工程价款主张优先受偿权。装饰装修工程属于建设工程的范畴，承包人依法享有优先受偿权。\n\n### 规则2：发包人须为建筑物所有权人\n装饰装修工程的发包人不是该建筑物的所有权人的，承包人不享有优先受偿权。这是装饰装修工程优先受偿权的特殊要件，区别于一般建设工程。\n\n### 规则3：仅限装饰装修工程部分\n承包人只能就其施工的装饰装修工程折价或者拍卖的价款优先受偿，不能就整个建筑物主张优先受偿。优先受偿权的范围限于装饰装修工程本身的增值部分。\n\n### 规则4：需具备折价或拍卖条件\n装饰装修工程必须具备折价或者拍卖的条件，即装饰装修工程能够独立于建筑物主体进行价值评估和变价。与建筑物主体不可分离的装修工程，在实践中可能存在执行困难。\n\n### 规则5：精装修工程的认定\n精装修商品房的装修工程，如果装修合同与土建合同分离，装修承包人可就装修工程部分主张优先受偿权。如果装修已与建筑物形成整体，则需结合具体情况判断。\n\n### 规则6：转包、违法分包情形下的限制\n装饰装修工程存在转包、违法分包情形的，实际施工人主张优先受偿权需满足司法解释关于实际施工人的特殊规定，且仍需满足发包人为建筑物所有权人的要件。\n\n## 三、司法观点分歧\n\n### 争议1：装饰装修工程优先受偿权的范围\n- **限缩说**：仅限于装修工程本身的折价或拍卖价款，不能及于建筑物整体价值。装修工程的优先受偿权应当从建筑物整体价值中剥离出装修增值部分。\n- **扩张说**：装修工程已与建筑物形成附合，应当就建筑物整体价值中装修所占比例主张优先受偿权。\n\n### 争议2：租赁物装修能否主张优先受偿权\n- **否定说**（主流）：承租人委托的装修工程，发包人（承租人）不是建筑物所有权人，不符合司法解释第37条的要件，不享有优先受偿权。\n- **肯定说**：如果出租人同意装修且装修增值归出租人所有，应类推适用优先受偿权的规定。\n\n### 争议3：发包人与所有权人不一致时的处理\n- **严格适用说**：司法解释明确规定发包人须为所有权人，不应扩大解释。\n- **实质审查说**：应审查装修工程的实际受益人，如果所有权人实际受益，应支持优先受偿权。\n\n## 四、省/市高院指引差异\n\n| 地区 | 态度 | 主要观点 |\n|------|------|----------|\n| 北京 | 从严 | 严格要求发包人为建筑物所有权人 |\n| 江苏 | 支持 | 装修承包人享有优先受偿权，范围限于装修部分 |\n| 浙江 | 支持 | 关注装修工程是否具备独立折价拍卖条件 |\n| 广东 | 从严 | 租赁物装修一般不支持优先受偿权 |\n| 四川 | 支持 | 精装修工程承包人可就装修部分主张 |\n| 山东 | 从严 | 装修工程需有独立评估价值方可支持 |\n| 上海 | 支持 | 注重审查发包人与所有权人的关系 |\n| 深圳 | 支持 | 倾向保护装修承包人的合法权益 |\n\n## 五、典型案例\n\n### 案例1：（2018）最高法民申5639号\n**裁判要旨**：装饰装修工程承包人就其施工的装修工程价款享有优先受偿权，但该权利仅限于装修工程折价或拍卖的价款，不能及于建筑物整体。\n\n### 案例2：（2019）最高法民终1336号\n**裁判要旨**：承租人委托承包人进行装修，因发包人（承租人）非建筑物所有权人，承包人不享有优先受偿权。装饰装修工程优先受偿权以发包人为建筑物所有权人为前提。\n\n### 案例3：（2020）苏民终897号\n**裁判要旨**：精装修商品房的装修承包人，在发包人为开发商（建筑物所有权人）的情况下，有权就装修工程价款主张优先受偿权。\n\n## 六、实务指引\n\n### 律师代理要点\n1. 审查发包人是否为建筑物所有权人，这是装饰装修工程优先受偿权的首要条件\n2. 关注装饰装修工程是否具备独立折价或拍卖的条件，必要时申请评估\n3. 对于租赁物装修，应提前告知委托人优先受偿权可能不被支持的风险\n4. 精装修工程应区分装修合同与土建合同，明确主张权利"},{"id":"裁判规则-放弃-限制优先受偿权的效力","title":"裁判规则 - 放弃/限制优先受偿权的效力","excerpt":"裁判规则 - 放弃/限制优先受偿权的效力 一、法律依据 《建工司法解释一》第42条 ：发包人与承包人约定放弃或者限制建设工程价款优先受偿权，损害建筑工人利益，发包人根据该约定主张承包人不享有建设工程价款优先受偿权的，人民法院不予支持。 《民法典》第807条 ：发包人未按照约定支付价款的，承包人可以催告发包人在合理期限内支付价款。发包人逾期不支付的，除根据建设工程的性质不宜折价、拍卖外，承包人可以与","slug":"裁判规则-放弃-限制优先受偿权的效力","module":"08-优先受偿权","moduleName":"08 优先受偿权","tags":["建工","优先受偿权","放弃","裁判规则"],"wordCount":2027,"created":"2026-06-01","updated":"2026-06-02","content":"# 裁判规则 - 放弃/限制优先受偿权的效力\n\n## 一、法律依据\n\n**《建工司法解释一》第42条**：发包人与承包人约定放弃或者限制建设工程价款优先受偿权，损害建筑工人利益，发包人根据该约定主张承包人不享有建设工程价款优先受偿权的，人民法院不予支持。\n\n**《民法典》第807条**：发包人未按照约定支付价款的，承包人可以催告发包人在合理期限内支付价款。发包人逾期不支付的，除根据建设工程的性质不宜折价、拍卖外，承包人可以与发包人协议将该工程折价，也可以请求人民法院将该工程依法拍卖。建设工程的价款就该工程折价或者拍卖的价款优先受偿。\n\n## 二、裁判规则要点\n\n### 规则1：损害建筑工人利益的放弃无效\n发包人与承包人约定放弃或者限制优先受偿权，损害建筑工人利益的，该约定无效。优先受偿权的立法目的之一是保护建筑工人的劳动报酬权益，放弃行为不得损害该公共利益。\n\n### 规则2：不损害工人利益的放弃有效\n如果放弃优先受偿权不损害建筑工人利益，约定有效。承包人自愿放弃优先受偿权且已妥善解决工人工资支付问题的，该放弃行为具有法律效力。\n\n### 规则3：举证责任的分配\n发包人主张承包人已放弃优先受偿权的，应举证证明放弃约定的存在。承包人主张放弃无效的，应举证证明该放弃行为损害了建筑工人利益。\n\n### 规则4：\"损害建筑工人利益\"的认定\n承包人拖欠建筑工人工资、无力支付工人工资、放弃优先受偿权后陷入经营困难无力支付工资等情形，可认定为损害建筑工人利益。司法实践中通常结合承包人的财务状况、工人工资支付情况等综合判断。\n\n### 规则5：限制优先受偿权的效力\n限制优先受偿权（如约定仅对部分工程款享有优先受偿权、约定优先受偿权劣后于抵押权等）同样适用第42条的规定。限制行为损害建筑工人利益的，该限制约定无效。\n\n### 规则6：指导案例250号的裁判要旨\n最高人民法院指导案例250号明确：承包人向发包人的债权人出具承诺书，承诺放弃建设工程价款优先受偿权，如果该放弃行为损害了建筑工人利益，则该承诺无效。\n\n## 三、司法观点分歧\n\n### 争议1：如何判断\"损害建筑工人利益\"\n- **结果论**：以承包人是否实际拖欠工人工资为判断标准。如果承包人在放弃优先受偿权时已经拖欠工人工资或此后无力支付工资，则认定损害工人利益。\n- **风险论**（主流）：不仅看实际结果，还要评估放弃行为对工人利益的潜在风险。如果放弃优先受偿权可能导致承包人丧失优先保障，进而影响工人工资支付，即构成损害。\n\n### 争议2：放弃优先受偿权的时间节点\n- **事前放弃**：在签订施工合同时即约定放弃优先受偿权，效力认定更为严格，法院倾向于认定损害工人利益。\n- **事后放弃**：在工程款结算后、工人工资已支付的情况下放弃，效力认定相对宽松。\n\n### 争议3：银行贷款中的放弃约定\n- **实务现状**：银行等抵押权人通常要求承包人出具放弃优先受偿权的承诺书，以确保抵押权的优先地位。\n- **司法态度**：法院审查该放弃是否损害工人利益，如果承包人已妥善解决工资问题且有充分履约能力，该放弃有效；反之则无效。\n\n## 四、省/市高院指引差异\n\n| 地区 | 态度 | 主要观点 |\n|------|------|----------|\n| 北京 | 从严 | 严格审查是否损害工人利益，倾向认定无效 |\n| 江苏 | 折中 | 区分事前放弃和事后放弃，事后放弃在工资已清偿时有效 |\n| 浙江 | 从严 | 放弃优先受偿权损害工人利益的，应认定无效 |\n| 广东 | 折中 | 关注承包人放弃时的财务状况和工资支付能力 |\n| 四川 | 从严 | 倾向保护建筑工人利益，对放弃约定审查较严 |\n| 山东 | 折中 | 以实际是否拖欠工资为主要判断标准 |\n| 上海 | 宽松 | 尊重当事人意思自治，事后放弃一般认定有效 |\n| 深圳 | 折中 | 综合考虑放弃原因、工人利益保障等因素 |\n\n## 五、典型案例\n\n### 案例1：指导案例250号\n**裁判要旨**：承包人向发包人的债权人出具承诺书放弃建设工程价款优先受偿权，该放弃行为损害了建筑工人利益的，人民法院应当认定该承诺无效。优先受偿权具有保护建筑工人劳动报酬的立法目的，不得通过约定损害该利益。\n\n### 案例2：（2019）最高法民终1970号\n**裁判要旨**：承包人在向银行贷款时承诺放弃优先受偿权，但承包人当时已拖欠大量工人工资，该放弃行为损害了建筑工人利益，应认定无效。\n\n### 案例3：（2021）最高法民申6188号\n**裁判要旨**：承包人在工程款已全部收回、工人工资已全部支付后，自愿放弃优先受偿权的，该放弃行为不损害建筑工人利益，应认定有效。\n\n## 六、实务指引\n\n### 律师代理要点\n1. 代表承包人时，审"},{"id":"裁判规则-债权转让后的优先受偿权","title":"裁判规则 - 债权转让后的优先受偿权","excerpt":"裁判规则 - 债权转让后的优先受偿权 一、法律依据 《民法典》第807条 ：发包人未按照约定支付价款的，承包人可以催告发包人在合理期限内支付价款。发包人逾期不支付的，除根据建设工程的性质不宜折价、拍卖外，承包人可以与发包人协议将该工程折价，也可以请求人民法院将该工程依法拍卖。建设工程的价款就该工程折价或者拍卖的价款优先受偿。 《建工司法解释二征求意见稿》第20条 ：方案一：建设工程价款债权转让后，","slug":"裁判规则-债权转让后的优先受偿权","module":"08-优先受偿权","moduleName":"08 优先受偿权","tags":["建工","优先受偿权","债权转让","裁判规则"],"wordCount":2025,"created":"2026-06-01","updated":"2026-06-02","content":"# 裁判规则 - 债权转让后的优先受偿权\n\n## 一、法律依据\n\n**《民法典》第807条**：发包人未按照约定支付价款的，承包人可以催告发包人在合理期限内支付价款。发包人逾期不支付的，除根据建设工程的性质不宜折价、拍卖外，承包人可以与发包人协议将该工程折价，也可以请求人民法院将该工程依法拍卖。建设工程的价款就该工程折价或者拍卖的价款优先受偿。\n\n**《建工司法解释二征求意见稿》第20条**：方案一：建设工程价款债权转让后，受让人主张就建设工程折价或者拍卖的价款优先受偿的，人民法院应予支持。方案二：建设工程价款债权转让后，受让人主张就建设工程折价或者拍卖的价款优先受偿的，人民法院不予支持。\n\n## 二、裁判规则要点\n\n### 规则1：征求意见稿的两种方案\n建工司法解释二征求意见稿列明了两种截然不同的方案。方案一支持受让人享有优先受偿权，方案二不支持。正式司法解释尚未发布，该问题仍存在重大争议。\n\n### 规则2：肯定说的主要理由\n建设工程价款优先受偿权属于法定担保物权，具有从属性，应当随主债权一并转让。从保护建筑工人利益的角度，债权转让后优先受偿权不消灭，有利于承包人实现债权，间接保障工人工资支付。\n\n### 规则3：否定说的主要理由\n优先受偿权具有人身专属性，系基于承包人的施工行为而取得，不应随债权转让而转移给第三人。受让人并非实际施工人，不应享有优先于抵押权的特殊保护。\n\n### 规则4：司法实践中的主流倾向\n近年来司法实践中，支持优先受偿权随债权转让的裁判逐渐增多，最高人民法院在部分案件中也倾向于肯定说。但各地裁判尺度仍不统一。\n\n### 规则5：债权转让的通知要件\n无论是否支持优先受偿权随同转让，债权转让均须通知发包人，否则对发包人不发生效力。通知的形式和时间对优先受偿权的行使有重要影响。\n\n### 规则6：转让价格与优先受偿权的关系\n债权转让价格低于工程款金额的，受让人仍可就全部工程款金额主张优先受偿权。优先受偿权的范围以原工程款债权金额为准，不因转让价格而缩减。\n\n## 三、司法观点分歧\n\n### 争议1：优先受偿权是否具有从属性\n- **从属性说**（肯定转让）：优先受偿权作为担保物权，具有从属性，随主债权转移而转移，无需当事人另行约定。参照担保物权从属性的一般原理，抵押权随主债权转让而转让，优先受偿权亦应如此。\n- **专属性说**（否定转让）：优先受偿权系基于承包人的施工行为而取得，具有人身专属性，与承包人身份不可分离，不应随债权转让而转移。\n\n### 争议2：保护建筑工人利益的立法目的\n- **肯定说**：允许优先受偿权随债权转让，有利于承包人通过债权转让实现债权，间接保障工人工资支付。如果优先受偿权不随转让，将降低债权的受偿可能性，最终损害工人利益。\n- **否定说**：优先受偿权保护的是实际施工产生的劳动报酬，受让人并非劳动报酬的权利主体，不应享有该特殊保护。\n\n### 争议3：建设工程价款债权的可转让性\n- **肯定说**：建设工程价款债权属于普通金钱债权，可以依法转让，优先受偿权作为从权利应一并转让。\n- **否定说**：建设工程价款债权虽然可以转让，但优先受偿权不应随同转让，两者应当区分处理。\n\n## 四、省/市高院指引差异\n\n| 地区 | 态度 | 主要观点 |\n|------|------|----------|\n| 北京 | 倾向支持 | 优先受偿权具有从属性，可随债权转让 |\n| 江苏 | 支持 | 债权转让后受让人可主张优先受偿权 |\n| 浙江 | 不统一 | 存在支持与否定两种裁判，以个案判断为主 |\n| 广东 | 倾向支持 | 认可优先受偿权的从属性，支持随同转让 |\n| 四川 | 不统一 | 裁判尺度不一，需关注最新司法解释动向 |\n| 山东 | 倾向否定 | 认为优先受偿权具有人身专属性，不随转让 |\n| 上海 | 倾向支持 | 从保护债权人利益角度，支持随同转让 |\n| 深圳 | 不统一 | 裁判分歧较大，以个案审查为主 |\n\n## 五、典型案例\n\n### 案例1：（2019）最高法民申5508号\n**裁判要旨**：建设工程价款优先受偿权系法定优先权，具有从属性，承包人将建设工程价款债权转让给第三人后，受让人可以主张优先受偿权。\n\n### 案例2：（2020）最高法民终1113号\n**裁判要旨**：建设工程价款债权转让后，受让人请求确认其对建设工程享有优先受偿权的，法院予以支持。优先受偿权作为担保物权，随主债权转让而转让。\n\n### 案例3：（2021）川民终1326号\n**裁判要旨**：建设工程价款优先受偿权系基于承包人的施工行为而产生的法定权利，具有人身专属性，债权转让后受让人不当然享有优先受偿权。\n\n## 六、实务指引\n\n### 律师代理要点\n1. 债权转让前评估优先受偿"},{"id":"优先受偿权-省-市高院指引对比","title":"优先受偿权 - 省/市高院指引对比","excerpt":"优先受偿权 - 省/市高院指引对比 一、主体资格 地区 要点 文件来源 最高法 与发包人订立施工合同的承包人享有；实际施工人不享有 2021年第21次法官会议纪要 浙江 与发包人存在直接合同关系的承包人享有优先受偿权 解答 江苏 分包人不享有优先受偿权；实际施工人不享有 解答（2018） 广东 承包人享有；发包人直接发包的各承包人各自享有 解答 二、行使期限 地区 要点 文件来源 最高法 最长18","slug":"优先受偿权-省-市高院指引对比","module":"08-优先受偿权","moduleName":"08 优先受偿权","tags":["建工","优先受偿权","省高院指引","对比"],"wordCount":1223,"created":"2026-06-01","updated":"2026-06-02","content":"# 优先受偿权 - 省/市高院指引对比\n\n## 一、主体资格\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 与发包人订立施工合同的承包人享有；实际施工人不享有 | 2021年第21次法官会议纪要 |\n| 浙江 | 与发包人存在直接合同关系的承包人享有优先受偿权 | [解答](https://jsgclaw.com/rule/2017/0828/91.html) |\n| 江苏 | 分包人不享有优先受偿权；实际施工人不享有 | [解答（2018）](https://sohu.com/a/363284331_169411) |\n| 广东 | 承包人享有；发包人直接发包的各承包人各自享有 | [解答](https://jsgclaw.com/rule/2017/0828/91.html) |\n\n## 二、行使期限\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 最长18个月，自发包人应当给付工程价款之日起算（司法解释一第41条） | 司法解释一 |\n| 浙江 | 执行中承包人主张优先受偿权的，应在18个月期限内提出 | [执行解答](https://jsgclaw.com/rule/2017/0828/91.html) |\n| 江苏 | 18个月为除斥期间，不适用中止、中断、延长 | [解答（2018）](https://sohu.com/a/363284331_169411) |\n| 四川+重庆 | 起算点为应付工程价款之日，非结算完成之日 | [联合解答（2022）](http://ms.isheng.net/index.php?doc-view-45229=) |\n\n## 三、债权范围\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 工程价款（含利润）；不包括利息、违约金、损害赔偿金（司法解释一第40条） | 司法解释一 |\n| 江苏 | 利润属于工程价款组成部分，可以优先受偿 | [解答（2018）](https://sohu.com/a/363284331_169411) |\n| 山东 | 人工费、材料费、机械费等直接费用属于优先受偿范围 | [解答（2020）](https://m.055110.com/js/69/2300.html) |\n\n## 四、优先于抵押权\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 优先受偿权优于抵押权和其他债权（司法解释一第36条） | 司法解释一 |\n| 各地 | 基本一致，无需登记即可对抗抵押权 | — |\n\n## 五、消费者购房人竞合\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 消费者交付购买商品房的大部分款项（50%以上）的，承包人优先受偿权不得对抗买受人 | 最高法批复 |\n| 江苏 | 仅限自然人购买住宅，商业用房不适用 | [解答（2018）](https://sohu.com/a/363284331_169411) |\n| 深圳 | 消费者购房人权利优先于优先受偿权 | [裁判指引（2014）](https://szfazhu.com/caipanzhiyin/121.html) |\n\n## 六、未竣工工程\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 未竣工但质量合格的，承包人可主张优先受偿权（司法解释一第38-39条） | 司法解释一 |\n| 浙江 | 工程停工后承包人主张优先受偿权的，需证明工程质量合格 | [解答](https://jsgclaw.com/rule/2017/0828/91.html) |\n\n## 七、放弃与限制\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 放弃或限制优先受偿权，损害建筑工人利益的无效（司法解释一第42条） | 司法解释一 |\n| 各地 | 指导案例250号确认：不损害工人利益的放弃有效 | 指导案例250号 |\n\n## 八、装饰装修工程\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 装饰装修工程承包人可就其施工部分主张优先受偿权（司法解释一第37条） | 司法解释一 |\n| 各地 | 须具备折价或拍卖条件 | — |\n\n## 九、指引文件链接汇总\n\n| 法院 | 文件 | 链接 |\n|------|------|------|\n| 浙江高院 | 执"},{"id":"优先受偿权-典型案例","title":"优先受偿权 - 典型案例","excerpt":"优先受偿权 - 典型案例 一、主体资格 案例1：实际施工人不享有优先受偿权 案号 ：最高法2021年第21次法官会议纪要 裁判要旨 ：建设工程价款优先受偿权的主体是承包人，实际施工人不享有。实际施工人只能通过向发包人主张工程款实现权利 案例2：装饰装修工程承包人享有优先受偿权 案号 ：司法解释一第37条 裁判要旨 ：装饰装修工程具备折价或者拍卖条件，装饰装修工程的承包人请求工程价款就该装饰装修工程","slug":"优先受偿权-典型案例","module":"08-优先受偿权","moduleName":"08 优先受偿权","tags":["建工","优先受偿权","案例"],"wordCount":1406,"created":"2026-06-01","updated":"2026-06-02","content":"# 优先受偿权 - 典型案例\n\n## 一、主体资格\n\n### 案例1：实际施工人不享有优先受偿权\n- **案号**：最高法2021年第21次法官会议纪要\n- **裁判要旨**：建设工程价款优先受偿权的主体是承包人，实际施工人不享有。实际施工人只能通过向发包人主张工程款实现权利\n\n### 案例2：装饰装修工程承包人享有优先受偿权\n- **案号**：司法解释一第37条\n- **裁判要旨**：装饰装修工程具备折价或者拍卖条件，装饰装修工程的承包人请求工程价款就该装饰装修工程折价或者拍卖的价款优先受偿的，人民法院应予支持\n\n## 二、债权范围\n\n### 案例3：利润属于优先受偿范围\n- **案号**：（2019）最高法民终1951号\n- **裁判要旨**：工程价款中的利润属于建设工程价款的组成部分，可以优先受偿。利息、违约金、损害赔偿金不属于优先受偿范围\n\n### 案例4：利息和违约金不属于优先受偿范围\n- **案号**：司法解释一第40条\n- **裁判要旨**：承包人建设工程价款优先受偿的范围依照国务院有关行政主管部门关于建设工程价款范围的规定确定。不包括逾期支付工程价款的利息、违约金、损害赔偿金\n\n## 三、行使期限\n\n### 案例5：18个月为除斥期间\n- **案号**：（2020）最高法民申2341号\n- **裁判要旨**：优先受偿权的行使期限为除斥期间，不适用中止、中断、延长的规定。超过18个月期限的，优先受偿权消灭\n\n### 案例6：起算点为应付工程价款之日\n- **案号**：司法解释一第41条\n- **裁判要旨**：18个月期限自发包人应当给付建设工程价款之日起算，非结算完成之日或起诉之日\n\n## 四、优先于抵押权\n\n### 案例7：优先受偿权优先于抵押权\n- **案号**：司法解释一第36条\n- **裁判要旨**：承包人享有的建设工程价款优先受偿权优于抵押权和其他债权。无需登记即可对抗抵押权\n\n### 案例8：多个承包人按比例受偿\n- **案号**：（2018）最高法民申5639号\n- **裁判要旨**：同一建设工程存在多个承包人的，各承包人按照各自施工的工程价款比例优先受偿\n\n## 五、消费者购房人竞合\n\n### 案例9：消费者购房人权利优先\n- **案号**：最高法批复\n- **裁判要旨**：消费者交付购买商品房的大部分款项（50%以上）的，承包人的优先受偿权不得对抗买受人。仅限自然人购买住宅\n\n## 六、未竣工工程\n\n### 案例10：未竣工但质量合格可主张\n- **案号**：司法解释一第38-39条\n- **裁判要旨**：建设工程质量合格，承包人请求其承建工程的价款就工程折价或者拍卖的价款优先受偿的，人民法院应予支持\n\n## 七、放弃与限制\n\n### 案例11：放弃优先受偿权损害工人利益无效\n- **案号**：司法解释一第42条\n- **裁判要旨**：发包人与承包人约定放弃或者限制建设工程价款优先受偿权，损害建筑工人利益，发包人根据该约定主张承包人不享有建设工程价款优先受偿权的，人民法院不予支持\n\n### 案例12：不损害工人利益的放弃有效\n- **案号**：指导案例250号\n- **裁判要旨**：承包人放弃优先受偿权不损害建筑工人利益的，该放弃有效\n\n## 八、裁判规则总结表\n\n| 规则 | 依据 | 要点 |\n|------|------|------|\n| 承包人享有 | 司法解释一第35条 | 实际施工人不享有 |\n| 优先于抵押权 | 司法解释一第36条 | 无需登记 |\n| 装饰装修 | 司法解释一第37条 | 须具备折价拍卖条件 |\n| 未竣工工程 | 司法解释一第38-39条 | 质量合格即可 |\n| 债权范围 | 司法解释一第40条 | 不含利息违约金 |\n| 行使期限 | 司法解释一第41条 | 18个月除斥期间 |\n| 放弃限制 | 司法解释一第42条 | 损害工人利益无效 |\n\n## 九、交叉引用\n- → [[03-裁判规则-主体资格|主体资格]]\n- → [[05-裁判规则-债权范围|债权范围]]\n- → [[06-裁判规则-行使期限18个月|行使期限18个月]]\n- → [[07-裁判规则-优先于抵押权|优先于抵押权]]\n- → [[08-裁判规则-消费者购房优先竞合|消费者购房优先竞合]]\n- → [[11-裁判规则-放弃限制效力|放弃限制效力]]"},{"id":"优先受偿权-常见问题faq","title":"优先受偿权 - 常见问题FAQ","excerpt":"优先受偿权 - 常见问题FAQ Q1：谁享有优先受偿权？ A ：与发包人订立建设工程施工合同的承包人享有（司法解释一第35条）。实际施工人不享有（最高法2021年第21次法官会议纪要）。分包人也不享有。装饰装修工程的承包人可以就其施工部分主张。 Q2：优先受偿权优先于抵押权吗？ A ：是的。承包人享有的建设工程价款优先受偿权优于抵押权和其他债权（司法解释一第36条）。无需登记即可对抗抵押权。但如果","slug":"优先受偿权-常见问题faq","module":"08-优先受偿权","moduleName":"08 优先受偿权","tags":["建工","优先受偿权","FAQ"],"wordCount":995,"created":"2026-06-01","updated":"2026-06-02","content":"# 优先受偿权 - 常见问题FAQ\n\n## Q1：谁享有优先受偿权？\n**A**：与发包人订立建设工程施工合同的承包人享有（司法解释一第35条）。实际施工人不享有（最高法2021年第21次法官会议纪要）。分包人也不享有。装饰装修工程的承包人可以就其施工部分主张。\n\n## Q2：优先受偿权优先于抵押权吗？\n**A**：是的。承包人享有的建设工程价款优先受偿权优于抵押权和其他债权（司法解释一第36条）。无需登记即可对抗抵押权。但如果消费者已交付购买商品房大部分款项（50%以上），消费者权利优先于优先受偿权。\n\n## Q3：行使期限是多久？\n**A**：最长18个月，自发包人应当给付建设工程价款之日起算（司法解释一第41条）。18个月为除斥期间，不适用中止、中断、延长。超过期限的优先受偿权消灭。\n\n**注意**：起算点是\"应付工程价款之日\"，不是结算完成之日或起诉之日。\n\n## Q4：利息和违约金能优先受偿吗？\n**A**：不能。只有工程价款可以优先受偿，包括人工费、材料费、机械费、利润等。利息、违约金、损害赔偿金不属于优先受偿范围（司法解释一第40条）。\n\n## Q5：合同无效能主张优先受偿权吗？\n**A**：能。合同无效但工程质量合格的，承包人仍享有优先受偿权。工程质量合格是核心要件，合同效力不影响优先受偿权的行使。\n\n## Q6：放弃优先受偿权有效吗？\n**A**：分两种情况：（1）放弃或限制优先受偿权，损害建筑工人利益的，约定无效（司法解释一第42条）；（2）不损害工人利益的，放弃有效（指导案例250号）。\n\n**实务提示**：银行贷款中常要求承包人放弃优先受偿权，承包人应评估是否损害工人利益。\n\n## Q7：未竣工的工程能主张优先受偿权吗？\n**A**：能。未竣工但质量合格的，承包人可就其承建部分主张优先受偿权（司法解释一第38-39条）。工程质量合格是核心要件，不要求竣工验收。\n\n## Q8：优先受偿权可以转让吗？\n**A**：有争议。司法解释二征求意见稿有两种方案：（1）肯定说——优先受偿权随工程价款债权一并转让；（2）否定说——优先受偿权具有人身专属性，不可转让。目前司法实践中趋势是肯定转让。\n\n## Q9：多个承包人如何分配优先受偿权？\n**A**：同一建设工程存在多个承包人的，各承包人按照各自施工的工程价款比例优先受偿。优先受偿权的客体是整个工程折价或拍卖的价款。\n\n## 交叉引用\n- → [[03-裁判规则-主体资格|主体资格]]\n- → [[05-裁判规则-债权范围|债权范围]]\n- → [[06-裁判规则-行使期限18个月|行使期限18个月]]\n- → [[07-裁判规则-优先于抵押权|优先于抵押权]]\n- → [[08-裁判规则-消费者购房优先竞合|消费者购房优先竞合]]\n- → [[09-裁判规则-未竣工工程|未竣工工程]]\n- → [[11-裁判规则-放弃限制效力|放弃限制效力]]"},{"id":"司法鉴定-制度概述","title":"司法鉴定 - 制度概述","excerpt":"司法鉴定 - 制度概述 一、核心问题 什么情况下需要鉴定？ 鉴定材料需要质证吗？ 鉴定意见怎么审查？ 二、条文架构 条文 内容 第28条 诉前已达成结算协议的不鉴定 第29条 诉前共同委托咨询意见的处理 第30条 固定价不鉴定 第31条 仅对争议事实鉴定 第32条 鉴定的启动与释明 第33条 鉴定材料质证 第34条 鉴定意见质证 三、与其他模块的关系 → 固定价结算 → 工期鉴定 → 质量鉴定","slug":"司法鉴定-制度概述","module":"09-司法鉴定","moduleName":"09 司法鉴定","tags":["建工","司法鉴定","概述"],"wordCount":249,"created":"2026-06-01","updated":"2026-06-01","content":"# 司法鉴定 - 制度概述\n\n## 一、核心问题\n\n1. 什么情况下需要鉴定？\n2. 鉴定材料需要质证吗？\n3. 鉴定意见怎么审查？\n\n## 二、条文架构\n\n| 条文 | 内容 |\n|------|------|\n| 第28条 | 诉前已达成结算协议的不鉴定 |\n| 第29条 | 诉前共同委托咨询意见的处理 |\n| 第30条 | 固定价不鉴定 |\n| 第31条 | 仅对争议事实鉴定 |\n| 第32条 | 鉴定的启动与释明 |\n| 第33条 | 鉴定材料质证 |\n| 第34条 | 鉴定意见质证 |\n\n## 三、与其他模块的关系\n\n- → [[05-工程造价与结算/07-裁判规则-固定价结算|固定价结算]]\n- → [[03-工期/07-裁判规则-工期鉴定|工期鉴定]]\n- → [[04-工程质量/08-裁判规则-质量鉴定|质量鉴定]]"},{"id":"司法鉴定-法律规范","title":"司法鉴定 - 法律规范","excerpt":"司法鉴定 - 法律规范 建工司法解释一逐条解析（第28-34条） 第28条（诉前已达成结算协议的不鉴定） 当事人在诉讼前已经对建设工程价款结算达成协议，诉讼中一方当事人申请对工程造价进行鉴定的，人民法院不予准许。 第29条（诉前共同委托咨询意见的处理） 当事人在诉讼前共同委托有关机构、人员对建设工程造价出具咨询意见，诉讼中一方当事人不认可该咨询意见申请鉴定的，人民法院应予准许，但双方当事人明确表示","slug":"司法鉴定-法律规范","module":"09-司法鉴定","moduleName":"09 司法鉴定","tags":["建工","司法鉴定","法律规范","司法解释逐条"],"wordCount":708,"created":"2026-06-01","updated":"2026-06-01","content":"# 司法鉴定 - 法律规范\n\n## 建工司法解释一逐条解析（第28-34条）\n\n### 第28条（诉前已达成结算协议的不鉴定）\n> 当事人在诉讼前已经对建设工程价款结算达成协议，诉讼中一方当事人申请对工程造价进行鉴定的，人民法院不予准许。\n\n### 第29条（诉前共同委托咨询意见的处理）\n> 当事人在诉讼前共同委托有关机构、人员对建设工程造价出具咨询意见，诉讼中一方当事人不认可该咨询意见申请鉴定的，人民法院应予准许，但双方当事人明确表示受该咨询意见约束的除外。\n\n### 第30条（固定价不鉴定）\n> 当事人在诉讼前共同委托有关机构、人员对建设工程造价出具咨询意见，诉讼中一方当事人不认可该咨询意见申请鉴定的，人民法院应予准许，但双方当事人明确表示受该咨询意见约束的除外。\n\n### 第31条（仅对争议事实鉴定）\n> 当事人对部分案件事实有争议的，仅对有争议的事实进行鉴定，但争议事实范围不能确定，或者双方当事人请求对全部事实鉴定的除外。\n\n### 第32条（鉴定的启动与释明）\n> 当事人对工程造价、质量、修复费用等专门性问题有争议，人民法院认为需要鉴定的，应当向负有举证责任的当事人释明。当事人经释明未申请鉴定，虽申请鉴定但未支付鉴定费用或者拒不提供相关材料的，应当承担举证不能的法律后果。\n\n### 第33条（鉴定材料质证）\n> 人民法院准许当事人的鉴定申请后，应当根据当事人申请及查明案件事实的需要，确定委托鉴定的事项、范围、鉴定期限等，并组织当事人对争议的鉴定材料进行质证。\n\n### 第34条（鉴定意见质证）\n> 人民法院应当组织当事人对鉴定意见进行质证。鉴定人将当事人有争议且未经质证的材料作为鉴定依据的，人民法院应当组织当事人就该部分材料进行质证。经质证认为不能作为鉴定依据的，根据该材料作出的鉴定意见不得作为认定案件事实的依据。"},{"id":"裁判规则-鉴定启动条件","title":"裁判规则 - 鉴定启动条件","excerpt":"裁判规则 - 鉴定启动条件 一、法律依据 《建工司法解释一》第28条： 当事人约定按照固定价结算工程价款，一方当事人请求对建设工程造价进行鉴定的，人民法院不予支持。 《建工司法解释一》第30条： 当事人在诉讼前共同委托有关机构、人员对建设工程造价出具咨询意见，诉讼中一方当事人不认可该咨询意见申请鉴定的，人民法院应予准许，但双方当事人明确表示受该咨询意见约束的除外。 《建工司法解释一》第32条： 当","slug":"裁判规则-鉴定启动条件","module":"09-司法鉴定","moduleName":"09 司法鉴定","tags":["建工","司法鉴定","启动条件","裁判规则"],"wordCount":2189,"created":"2026-06-01","updated":"2026-06-02","content":"# 裁判规则 - 鉴定启动条件\n\n## 一、法律依据\n\n**《建工司法解释一》第28条：** 当事人约定按照固定价结算工程价款，一方当事人请求对建设工程造价进行鉴定的，人民法院不予支持。\n\n**《建工司法解释一》第30条：** 当事人在诉讼前共同委托有关机构、人员对建设工程造价出具咨询意见，诉讼中一方当事人不认可该咨询意见申请鉴定的，人民法院应予准许，但双方当事人明确表示受该咨询意见约束的除外。\n\n**《建工司法解释一》第32条：** 当事人对工程造价、质量、修复费用等专门性问题有争议，人民法院认为需要鉴定的，应当向负有举证责任的当事人释明。当事人经释明未申请鉴定，虽申请鉴定但未支付鉴定费用或者拒不提供相关材料的，应当承担举证不能的法律后果。一审诉讼中负有举证责任的当事人未申请鉴定，虽申请鉴定但未支付鉴定费用或者拒不提供相关材料，二审诉讼中申请鉴定，人民法院认为确有必要的，应当依照民事诉讼法第一百七十条第一款第三项的规定处理。\n\n## 二、裁判规则要点\n\n### 规则1：法院释明义务的触发条件\n\n当事人对工程造价、质量、修复费用等专门性问题存在争议时，法院认为需要鉴定的，应当向负有举证责任的当事人释明。释明义务的前提是\"法院认为需要鉴定\"，而非只要当事人提出争议即触发。实务中法院通常在以下情形启动释明：工程量存在争议且无法通过现有证据确定；工程质量是否合格存在分歧；修复费用无法协商一致。\n\n### 规则2：举证不能的法律后果\n\n经释明未申请鉴定，或虽申请但未支付鉴定费用，或拒不提供相关材料的，承担举证不能的法律后果。此处\"拒不提供\"指故意隐瞒、藏匿鉴定所需材料，而非客观上无法提供。法院在认定\"拒不提供\"时会审查当事人是否存在主观恶意，若确因客观原因无法提供（如材料灭失），不应直接认定举证不能。\n\n### 规则3：二审鉴定的限制条件\n\n一审未申请鉴定，二审申请鉴定的，法院认为\"确有必要的\"应予准许。\"确有必要\"的判断标准包括：一审中因客观原因确实无法申请鉴定；新发现的证据导致需要鉴定；一审释明程序存在瑕疵。若一审中法院已释明但当事人无正当理由拒绝申请，二审中再申请的，法院一般不予准许。\n\n### 规则4：不予鉴定的法定情形\n\n以下情形一方申请鉴定不予支持：（1）诉前已达成结算协议（第28条延伸适用）；（2）约定固定价结算（第28条）；（3）双方明确表示受诉前共同委托的咨询意见约束（第30条）。但需注意，结算协议存在欺诈、胁迫等可撤销情形时，当事人申请鉴定应予准许。\n\n### 规则5：鉴定启动的时间节点\n\n鉴定申请应在举证期限届满前提出。逾期提出的，法院可依据《民事诉讼法》关于举证期限的规定不予准许，但对方当事人同意的除外。实务中部分法院对鉴定申请的时限要求较为宽松，尤其在案件事实难以查明的情况下，倾向于准许鉴定以查清事实。\n\n## 三、司法观点分歧\n\n**1. 释明义务是否为强制性程序规范**\n\n多数观点认为释明义务系法院的强制性义务，未释明即判决的，构成程序违法，可作为发回重审的事由。少数观点认为释明属于法院裁量范畴，未释明不必然导致程序违法，关键在于是否影响实体公正。\n\n**2. 二审中\"确有必要\"的判断标准**\n\n实务中存在宽严两种尺度：严格标准认为一审未申请鉴定系当事人自身原因，二审不应准许；宽松标准认为只要案件基本事实不清，为实现实体公正应准许二审鉴定。最高法院倾向于在涉及重大利益且一审确未充分释明的情况下准许二审鉴定。\n\n**3. 固定价合同中设计变更部分的鉴定启动**\n\n对于固定价合同中因设计变更产生的增量部分，当事人申请鉴定的，法院是否准许存在分歧。一种观点认为应整体鉴定后区分固定部分与变更部分；另一种观点认为仅对变更部分单独鉴定，避免鉴定范围过大。\n\n## 四、省/市高院指引差异\n\n| 地区 | 释明要求 | 二审鉴定态度 | 固定价鉴定 |\n|------|----------|------------|-----------|\n| 浙江高院 | 严格释明，需书面记录 | 从严把握，需说明一审未申请的正当理由 | 设计变更部分可单独鉴定 |\n| 江苏高院 | 释明后应给予合理期限 | 确有必要时准许 | 超出约定范围部分可鉴定 |\n| 广东高院 | 释明义务视为程序性要求 | 一般不予准许，例外情形除外 | 整体不予鉴定，除非存在重大变更 |\n| 北京高院 | 释明应记录在案 | 结合案件具体情况判断 | 固定价范围内不予鉴定 |\n\n## 五、典型案例\n\n**案例1：** 最高人民法院（2019）最高法民终xxx号——一审法院未释明鉴定，二审中承包人申请造价鉴定，最高法院认为一审未履行释明义务属于程序瑕疵，准许二审鉴定并发回重审。\n\n**案例2：** 浙江省高级人民法院（2020）浙民终xxx号——当事人约定"},{"id":"裁判规则-鉴定材料质证","title":"裁判规则 - 鉴定材料质证","excerpt":"裁判规则 - 鉴定材料质证 一、法律依据 《建工司法解释一》第33条： 人民法院准许当事人的鉴定申请的，应当组织双方当事人对争议的鉴定材料进行质证。鉴定人将当事人有争议且未经质证的材料作为鉴定依据的，人民法院应当组织当事人对该部分材料进行质证。经质证不能作为鉴定依据的，鉴定人应当根据人民法院的要求对鉴定意见进行补充或者修正。 《民事诉讼法》第68条： 证据应当在法庭上出示，并由当事人互相质证。对涉","slug":"裁判规则-鉴定材料质证","module":"09-司法鉴定","moduleName":"09 司法鉴定","tags":["建工","司法鉴定","鉴定材料","质证","裁判规则"],"wordCount":2119,"created":"2026-06-01","updated":"2026-06-02","content":"# 裁判规则 - 鉴定材料质证\n\n## 一、法律依据\n\n**《建工司法解释一》第33条：** 人民法院准许当事人的鉴定申请的，应当组织双方当事人对争议的鉴定材料进行质证。鉴定人将当事人有争议且未经质证的材料作为鉴定依据的，人民法院应当组织当事人对该部分材料进行质证。经质证不能作为鉴定依据的，鉴定人应当根据人民法院的要求对鉴定意见进行补充或者修正。\n\n**《民事诉讼法》第68条：** 证据应当在法庭上出示，并由当事人互相质证。对涉及国家秘密、商业秘密和个人隐私的证据应当保密，需要在法庭出示的，不得在公开开庭时出示。\n\n**《最高人民法院关于民事诉讼证据的若干规定》第34条：** 人民法院应当组织当事人对鉴定材料进行质证。未经质证的材料，不得作为鉴定的依据。\n\n## 二、裁判规则要点\n\n### 规则1：鉴定材料质证是法定前置程序\n\n法院准许鉴定申请后，应当组织双方当事人对争议的鉴定材料进行质证，这是鉴定程序启动的法定前置条件。质证的对象是\"争议的鉴定材料\"，而非全部鉴定材料。对于双方无异议的材料，法院可以直接确认。实务中常见的鉴定材料包括：施工合同、签证单、工程联系单、竣工图纸、材料采购单据、隐蔽工程验收记录等。\n\n### 规则2：未经质证材料的法律后果\n\n鉴定人将当事人有争议且未经质证的材料作为鉴定依据的，法院应当组织补充质证。经质证认为不能作为鉴定依据的，鉴定人应当根据法院要求对鉴定意见进行补充或修正。若鉴定人拒绝修正，该鉴定意见不得作为认定案件事实的依据。这一规则的核心在于保障当事人的质权权，防止鉴定意见建立在未经审查的材料之上。\n\n### 规则3：质证的实质审查标准\n\n鉴定材料的质证不仅限于形式审查（是否原件、签名是否真实），还应包括实质审查（内容是否真实、与案件是否关联）。对于单方制作的签证单、工程联系单等，对方不予认可的，法院应结合其他证据综合判断其证明力，而非简单地排除或采纳。\n\n### 规则4：鉴定机构不得自行收集材料\n\n鉴定机构原则上不得自行收集鉴定材料，所有鉴定材料应由法院移交或当事人提交。鉴定机构自行调查取得的材料，未经法院组织质证的，不得作为鉴定依据。但实务中鉴定机构可就专业问题向当事人补充调取材料，前提是需经法院同意并组织质证。\n\n### 规则5：补充鉴定材料的质证程序\n\n鉴定过程中需要补充鉴定材料的，法院应当再次组织质证。补充材料的质证程序与初次质证相同，当事人有权对补充材料的真实性、关联性、合法性提出异议。鉴定意见作出后发现遗漏重要材料需要补充鉴定的，补充鉴定材料同样需要质证。\n\n## 三、司法观点分歧\n\n**1. 一方提交材料对方不认可时的处理**\n\n一种观点认为，对方不认可的材料应直接排除，不得作为鉴定依据。另一种观点认为，应结合其他证据综合判断，若其他证据能够印证该材料的真实性，可以采纳。实务中多数法院采取第二种观点，但会要求提交方补强证据。\n\n**2. 鉴定机构现场勘验取得的资料是否需要质证**\n\n对于鉴定机构现场勘验形成的勘验记录、测量数据等，是否需要质证存在分歧。严格观点认为勘验记录属于鉴定材料，应当质证；宽松观点认为鉴定机构的专业勘验属于鉴定方法范畴，无需单独质证，但勘验结果应纳入鉴定意见一并质证。\n\n**3. 电子数据类鉴定材料的质证标准**\n\n施工过程中形成的电子邮件、微信聊天记录、电子签章文件等电子数据作为鉴定材料时，其质证标准是否应高于纸质材料存在争议。部分法院要求电子数据需经公证或司法鉴定确认真实性后方可作为鉴定依据。\n\n## 四、省/市高院指引差异\n\n| 地区 | 质证范围 | 未经质证材料的处理 | 补充材料质证 |\n|------|----------|------------------|-------------|\n| 浙江高院 | 争议材料须质证，无异议材料可直接确认 | 退回鉴定机构修正，修正后重新质证 | 需再次组织质证 |\n| 江苏高院 | 全部鉴定材料均应质证 | 不得作为鉴定依据 | 补充质证程序从简 |\n| 广东高院 | 以争议材料为核心质证 | 可补充质证，不影响鉴定效力 | 视情况决定是否质证 |\n| 北京高院 | 争议材料质证，无异议材料书面确认 | 要求鉴定机构修正或重新鉴定 | 必须再次质证 |\n\n## 五、典型案例\n\n**案例1：** 最高人民法院（2020）最高法民终xxx号——鉴定机构将发包人单方制作的工程联系单作为鉴定依据，承包人不予认可且未经质证，最高法院认为该鉴定意见依据不足，发回重审并要求补充质证后重新鉴定。\n\n**案例2：** 浙江省高级人民法院（2021）浙民终xxx号——鉴定过程中鉴定机构自行向施工单位调取材料，未经法院组织质证即作为鉴定依据，法院认定该鉴定意见程序违法，不予采信。\n\n**案例3：** 广东省高级人民法院（2"},{"id":"裁判规则-鉴定意见审查","title":"裁判规则 - 鉴定意见审查","excerpt":"裁判规则 - 鉴定意见审查 一、法律依据 《建工司法解释一》第34条： 人民法院应当组织当事人对鉴定意见进行质证。鉴定人应当就鉴定事项接受当事人质询。鉴定人确因特殊原因无法出庭的，经人民法院准许，可以书面答复当事人的质询。 《民事诉讼法》第81条： 当事人对鉴定意见有异议或者人民法院认为鉴定人有必要出庭的，鉴定人应当出庭作证。经人民法院通知，鉴定人拒不出庭作证的，鉴定意见不得作为认定事实的根据；支","slug":"裁判规则-鉴定意见审查","module":"09-司法鉴定","moduleName":"09 司法鉴定","tags":["建工","司法鉴定","鉴定意见","裁判规则"],"wordCount":2293,"created":"2026-06-01","updated":"2026-06-02","content":"# 裁判规则 - 鉴定意见审查\n\n## 一、法律依据\n\n**《建工司法解释一》第34条：** 人民法院应当组织当事人对鉴定意见进行质证。鉴定人应当就鉴定事项接受当事人质询。鉴定人确因特殊原因无法出庭的，经人民法院准许，可以书面答复当事人的质询。\n\n**《民事诉讼法》第81条：** 当事人对鉴定意见有异议或者人民法院认为鉴定人有必要出庭的，鉴定人应当出庭作证。经人民法院通知，鉴定人拒不出庭作证的，鉴定意见不得作为认定事实的根据；支付鉴定费用的当事人可以要求返还鉴定费用。\n\n**《最高人民法院关于民事诉讼证据的若干规定》第37条：** 人民法院收到鉴定书后，应当及时将副本送交当事人。当事人对鉴定书的内容有异议的，应当在人民法院指定期间内以书面方式提出。\n\n## 二、裁判规则要点\n\n### 规则1：鉴定意见必须经质证方可采信\n\n鉴定意见属于法定证据种类之一，必须经过当事人质证方可作为认定案件事实的依据。法院应当将鉴定意见副本及时送达当事人，当事人有权对鉴定意见的鉴定程序、鉴定方法、鉴定结论等提出异议。未经质证的鉴定意见不得作为裁判依据，这是证据裁判原则的基本要求。\n\n### 规则2：鉴定人出庭作证的义务\n\n当事人对鉴定意见有异议或法院认为有必要的，鉴定人应当出庭接受质询。鉴定人出庭的内容包括：说明鉴定方法和鉴定过程；回答当事人对鉴定意见的质疑；对鉴定中采用的取费标准、计算方法等专业问题进行解释。鉴定人拒不出庭的，鉴定意见不得作为认定事实的根据。\n\n### 规则3：法院对鉴定意见的实质审查权\n\n鉴定意见并非当然具有证明力，法院应当结合全案证据综合判断是否采信。法院的审查范围包括：鉴定程序是否合法；鉴定材料是否经过质证；鉴定方法是否科学合理；鉴定结论是否与案件其他证据相矛盾。法院可以依据职权决定是否采信鉴定意见，不受当事人态度的约束。\n\n### 规则4：鉴定意见存在瑕疵的处理\n\n鉴定意见存在瑕疵但可以通过补充鉴定、重新质证等方式补正的，法院应当要求鉴定机构补充或修正。鉴定意见存在严重程序违法（如鉴定人应回避未回避、鉴定材料未经质证）或鉴定结论明显依据不足的，法院应当不予采信，必要时可委托重新鉴定。\n\n### 规则5：多个鉴定意见的采信规则\n\n同一事项存在多个鉴定意见且结论不一致的，法院应当综合审查各鉴定意见的鉴定程序、鉴定资质、鉴定方法等因素，选择采信更具科学性和合理性的鉴定意见。法院也可以根据案件情况决定是否需要补充鉴定或重新鉴定。\n\n## 三、司法观点分歧\n\n**1. 鉴定意见与当事人约定冲突时的采信**\n\n当鉴定意见与合同约定的计价方式、取费标准不一致时，一种观点认为应以鉴定意见为准，因为鉴定意见反映的是工程实际造价；另一种观点认为应以合同约定为优先，鉴定仅是对合同约定的具体化。实务中多数法院以合同约定为基础，鉴定意见仅在合同约定不明时发挥补充作用。\n\n**2. 当事人单方委托鉴定的证据效力**\n\n诉讼前一方当事人自行委托鉴定机构出具的意见，对方当事人不予认可的，其证据效力存在争议。一种观点认为单方委托鉴定不具有鉴定意见的证据效力，仅能作为当事人陈述或书证；另一种观点认为应结合鉴定机构资质、鉴定程序等综合判断其证明力。实务中法院一般不将其作为鉴定意见采信，但可参考其内容。\n\n**3. 鉴定人未出庭时鉴定意见的效力**\n\n鉴定人经通知未出庭时，鉴定意见是否一律不得采信存在分歧。严格观点认为鉴定人未出庭则鉴定意见绝对排除；宽松观点认为若当事人虽有异议但异议明显不成立的，法院可以综合判断是否采信。最高法院倾向于严格适用，但对鉴定人因客观原因无法出庭且已书面答复质询的情形给予例外。\n\n## 四、省/市高院指引差异\n\n| 地区 | 鉴定人出庭要求 | 瑕疵鉴定意见处理 | 多个鉴定意见冲突 |\n|------|--------------|----------------|----------------|\n| 浙江高院 | 有异议即应出庭，书面答复需经准许 | 补充修正优先，严重瑕疵重新鉴定 | 综合比较后采信，必要时重新鉴定 |\n| 江苏高院 | 异议合理的应出庭 | 可补正的优先补正 | 优先采信程序规范的鉴定意见 |\n| 广东高院 | 异议明确且具体的应出庭 | 区分程序瑕疵与实质瑕疵 | 以鉴定资质和方法科学性为标准 |\n| 北京高院 | 严格要求出庭，书面答复例外从严 | 程序违法的一律不予采信 | 综合审查，可要求鉴定人共同说明 |\n\n## 五、典型案例\n\n**案例1：** 最高人民法院（2021）最高法民终xxx号——鉴定意见中取费标准与合同约定不一致，法院认为鉴定机构应依据合同约定的计价方式进行鉴定，鉴定意见偏离合同约定的部分不予采信。\n\n**案例2：** 江苏省高级人民法院（2020）苏民终xxx号——鉴定人经法院通知未"},{"id":"裁判规则-固定价不鉴定","title":"裁判规则 - 固定价不鉴定","excerpt":"裁判规则 - 固定价不鉴定 一、法律依据 《建工司法解释一》第28条： 当事人约定按照固定价结算工程价款，一方当事人请求对建设工程造价进行鉴定的，人民法院不予支持。 《建工司法解释一》第19条： 当事人对建设工程的计价标准或者计价方法有约定的，按照约定结算工程价款。因设计变更导致建设工程的工程量或者质量标准发生变化，当事人对该部分工程价款不能协商一致的，可以参照签订建设工程施工合同时当地建设行政主","slug":"裁判规则-固定价不鉴定","module":"09-司法鉴定","moduleName":"09 司法鉴定","tags":["建工","司法鉴定","固定价","裁判规则"],"wordCount":2225,"created":"2026-06-01","updated":"2026-06-02","content":"# 裁判规则 - 固定价不鉴定\n\n## 一、法律依据\n\n**《建工司法解释一》第28条：** 当事人约定按照固定价结算工程价款，一方当事人请求对建设工程造价进行鉴定的，人民法院不予支持。\n\n**《建工司法解释一》第19条：** 当事人对建设工程的计价标准或者计价方法有约定的，按照约定结算工程价款。因设计变更导致建设工程的工程量或者质量标准发生变化，当事人对该部分工程价款不能协商一致的，可以参照签订建设工程施工合同时当地建设行政主管部门发布的计价方法或者计价标准结算工程价款。\n\n## 二、裁判规则要点\n\n### 规则1：固定价合同排除造价鉴定\n\n当事人约定按照固定价（包括固定总价和固定单价）结算工程价款的，一方请求对工程造价进行鉴定的，法院不予支持。这是因为固定价合同的本质是双方当事人自愿承担价格风险，鉴定将改变双方的风险分配格局。固定总价合同下，总价包干范围内的工程造价无需鉴定；固定单价合同下，工程量已确定的部分无需鉴定。\n\n### 规则2：固定价的认定标准\n\n固定价的认定不以合同中出现\"固定价\"字样为标准，而应从合同条款的整体约定来判断。以下情形应认定为固定价结算：合同约定总价包干且未约定调整机制；合同约定单价固定且工程量以竣工图为准；合同虽未使用\"固定价\"表述，但约定了明确的价款且未设调整条款。以下情形不属于固定价：合同约定\"暂定价\"\"暂估价\"或\"以实际结算为准\"。\n\n### 规则3：设计变更部分的可鉴定性\n\n固定价合同中因设计变更导致超出约定范围的部分，当事人不能协商一致的，可以申请鉴定。但鉴定范围应严格限于设计变更导致的增量部分，不得对固定价范围内的工程进行整体鉴定。实务中如何区分\"固定范围内的工程\"与\"设计变更增量\"是争议焦点，需要结合合同约定、设计变更通知、签证单等综合判断。\n\n### 规则4：固定价合同的风险范围\n\n固定价合同中，双方约定的风险范围内的价格波动不予调整。超出风险范围的，当事人可以请求调整。对于未约定风险范围的固定总价合同，法院通常参照当地建设行政主管部门发布的计价文件确定合理风险范围（一般为3%-5%）。超出合理风险范围的部分，可以申请鉴定确定调整金额。\n\n### 规则5：工程量争议不影响固定价的适用\n\n固定价合同下，当事人对工程量存在争议的，不影响固定价条款的适用。工程量争议属于事实认定问题，法院可以通过其他证据（竣工图、施工记录、隐蔽工程验收记录等）确定工程量，无需通过造价鉴定解决。仅在工程量无法通过其他方式确定且属于设计变更增量时，才可申请鉴定。\n\n## 三、司法观点分歧\n\n**1. \"固定单价\"合同是否适用第28条**\n\n一种观点认为第28条仅排除固定总价合同的造价鉴定，固定单价合同因工程量未确定仍可鉴定。另一种观点认为固定单价合同同样属于\"固定价\"，工程量已确定部分不予鉴定，仅工程量争议部分可通过其他方式解决。最高法院倾向于扩大解释，将固定单价合同纳入适用范围。\n\n**2. 固定价合同中签证单记载的零星变更是否可鉴定**\n\n对于固定价合同中签证单记载的小额变更、零星增加等，是否属于\"设计变更导致超出约定范围\"存在争议。严格观点认为只有正式设计变更通知导致的增量才可鉴定；宽松观点认为签证单记载的工程增量只要超出合同约定范围即可鉴定。\n\n**3. 合同约定固定价但实际施工范围大幅缩减时的处理**\n\n实际施工范围大幅缩减时，承包人主张按实际完成工程量计价，发包人主张按固定价扣减。一种观点认为应按固定价扣减未完成部分的造价；另一种观点认为实际施工范围重大变更已超出固定价的适用前提，应对实际完成工程量进行鉴定。\n\n## 四、省/市高院指引差异\n\n| 地区 | 固定价范围认定 | 设计变更鉴定 | 风险范围标准 |\n|------|--------------|-------------|-------------|\n| 浙江高院 | 从合同整体约定判断 | 限于变更增量部分 | 参照省级计价文件 |\n| 江苏高院 | 以合同明确约定为准 | 变更签证明确的可鉴定 | 约定优先，无约定参照3%-5% |\n| 广东高院 | 严格解释\"固定价\" | 仅正式设计变更可鉴定 | 以合同约定的风险范围为准 |\n| 北京高院 | 扩大解释含固定单价 | 变更超出原设计范围的可鉴定 | 参照北京市造价管理规定 |\n\n## 五、典型案例\n\n**案例1：** 最高人民法院（2019）最高法民终xxx号——合同约定固定总价1.2亿元，承包人主张实际工程量增加申请造价鉴定，法院审查后认为增加部分均在合同约定的暂估工程量范围内，属于固定价包干范围，不予准许鉴定。\n\n**案例2：** 浙江省高级人民法院（2020）浙民终xxx号——固定总价合同施工过程中发生重大设计变更，变更部分造价占合同总价的30%以上，法院准许对设计变更"},{"id":"司法鉴定-省-市高院指引对比","title":"司法鉴定 - 省/市高院指引对比","excerpt":"司法鉴定 - 省/市高院指引对比 一、鉴定启动条件 地区 要点 文件来源 最高法 法院认为需要鉴定的应释明；一方申请鉴定另一方无正当理由拒不配合的可认定申请方主张成立（司法解释一第32条、第33条） 司法解释一 江苏 严格控制鉴定启动；已有结算协议的不予鉴定 委托鉴定工作指南（2020） 四川+重庆 单方委托第三方出具的咨询意见，对方不认可的不能作为认定案件事实的依据 联合解答（2022）第7条 ","slug":"司法鉴定-省-市高院指引对比","module":"09-司法鉴定","moduleName":"09 司法鉴定","tags":["建工","司法鉴定","省高院指引","对比"],"wordCount":1064,"created":"2026-06-01","updated":"2026-06-02","content":"# 司法鉴定 - 省/市高院指引对比\n\n## 一、鉴定启动条件\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 法院认为需要鉴定的应释明；一方申请鉴定另一方无正当理由拒不配合的可认定申请方主张成立（司法解释一第32条、第33条） | 司法解释一 |\n| 江苏 | 严格控制鉴定启动；已有结算协议的不予鉴定 | [委托鉴定工作指南（2020）](https://sohu.com/a/363284331_169411) |\n| 四川+重庆 | 单方委托第三方出具的咨询意见，对方不认可的不能作为认定案件事实的依据 | [联合解答（2022）第7条](http://ms.isheng.net/index.php?doc-view-45229=) |\n| 山东 | 法院应对鉴定意见进行实质审查，不能\"以鉴代审\" | [解答（2020）](https://m.055110.com/js/69/2300.html) |\n| 重庆 | 造价鉴定若干问题的解答（2016） | 专项文件 |\n| 济南 | 工程造价等专门性问题鉴定程序的指导意见（2020） | 专项文件 |\n\n## 二、固定价不鉴定\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 约定固定价结算的，一方请求鉴定的不予支持（司法解释一第28条但书） | 司法解释一 |\n| 江苏 | 设计变更超出约定范围的部分可以鉴定 | [解答（2018）](https://sohu.com/a/363284331_169411) |\n| 山东 | 固定总价合同中途解除的，已完工程造价可鉴定 | [解答（2020）](https://m.055110.com/js/69/2300.html) |\n\n## 三、结算协议不鉴定\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 当事人在诉讼前已经对建设工程价款结算达成协议，诉讼中一方申请鉴定的不予准许（司法解释一第28条） | 司法解释一 |\n| 各地 | 基本一致 | — |\n\n## 四、鉴定材料质证\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 鉴定材料需经当事人质证（司法解释一第33条） | 司法解释一 |\n| 四川+重庆 | 未经质证的鉴定材料不得作为鉴定依据 | [联合解答（2022）](http://ms.isheng.net/index.php?doc-view-45229=) |\n| 山东 | 法院应审查鉴定材料的真实性、合法性、关联性 | [解答（2020）](https://m.055110.com/js/69/2300.html) |\n\n## 五、鉴定意见审查\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 鉴定意见需经质证；法院应审查鉴定程序和方法（司法解释一第34条） | 司法解释一 |\n| 山东 | 法院应对鉴定意见进行实质审查，不能\"以鉴代审\" | [解答（2020）](https://m.055110.com/js/69/2300.html) |\n| 四川+重庆 | 单方委托的咨询意见不等于司法鉴定，对方不认可的不能采信 | [联合解答（2022）](http://ms.isheng.net/index.php?doc-view-45229=) |\n\n## 六、鉴定费承担\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 鉴定费一般由申请方预交，最终由败诉方承担或按过错比例分担 | 诉讼费用交纳办法 |\n| 各地 | 基本一致 | — |\n\n## 七、指引文件链接汇总\n\n| 法院 | 文件 | 链接 |\n|------|------|------|\n| 江苏高院 | 委托鉴定工作指南（2020） | [全文](https://sohu.com/a/363284331_169411) |\n| 四川+重庆高院 | 联合解答（2022） | [全文](http://ms.isheng.net/index.php?doc-view-45229=) |\n| 山东高院 | 建设工程合同纠纷解答（2020） | [全文](https://m.055110.com/js/69/2300.html) |\n| 重庆高院 | 造价鉴定若干问题解答（2016） | [全文](https://chlawyer.net/jagl/show/59471) |\n| 济南中院 | 鉴定程序指导意见（202"},{"id":"司法鉴定-典型案例","title":"司法鉴定 - 典型案例","excerpt":"司法鉴定 - 典型案例 一、鉴定启动 案例1：法院应释明鉴定事项 案号 ：司法解释一第32条 裁判要旨 ：当事人对工程造价、质量、修复费用等专门性问题有争议，人民法院认为需要鉴定的，应当向负有举证责任的当事人释明 案例2：拒不配合鉴定的法律后果 案号 ：司法解释一第33条 裁判要旨 ：一方当事人申请鉴定，另一方当事人无正当理由拒不配合鉴定的，法院可以认定申请鉴定一方当事人主张的鉴定事项成立 二、固","slug":"司法鉴定-典型案例","module":"09-司法鉴定","moduleName":"09 司法鉴定","tags":["建工","司法鉴定","案例"],"wordCount":1071,"created":"2026-06-01","updated":"2026-06-02","content":"# 司法鉴定 - 典型案例\n\n## 一、鉴定启动\n\n### 案例1：法院应释明鉴定事项\n- **案号**：司法解释一第32条\n- **裁判要旨**：当事人对工程造价、质量、修复费用等专门性问题有争议，人民法院认为需要鉴定的，应当向负有举证责任的当事人释明\n\n### 案例2：拒不配合鉴定的法律后果\n- **案号**：司法解释一第33条\n- **裁判要旨**：一方当事人申请鉴定，另一方当事人无正当理由拒不配合鉴定的，法院可以认定申请鉴定一方当事人主张的鉴定事项成立\n\n## 二、固定价不鉴定\n\n### 案例3：固定总价合同不予鉴定\n- **案号**：司法解释一第28条但书\n- **裁判要旨**：当事人约定按照固定价结算工程价款，一方当事人请求对建设工程造价进行鉴定的，人民法院不予支持\n\n### 案例4：设计变更部分可鉴定\n- **案号**：（2019）最高法民终1535号\n- **裁判要旨**：固定总价合同因设计变更导致工程量超出约定范围的，超出部分可以申请鉴定\n\n## 三、结算协议不鉴定\n\n### 案例5：诉前达成结算协议不鉴定\n- **案号**：司法解释一第28条\n- **裁判要旨**：当事人在诉讼前已经对建设工程价款结算达成协议，诉讼中一方当事人申请对工程造价进行鉴定的，人民法院不予准许\n\n## 四、鉴定材料质证\n\n### 案例6：未经质证的鉴定材料不得采信\n- **案号**：司法解释一第33条\n- **裁判要旨**：人民法院应当组织当事人对鉴定材料进行质证。未经质证的鉴定材料不得作为鉴定依据\n\n## 五、鉴定意见审查\n\n### 案例7：法院应实质审查鉴定意见\n- **案号**：山东高院解答（2020）\n- **裁判要旨**：法院应对鉴定意见进行实质审查，不能\"以鉴代审\"。鉴定意见仅是证据的一种，法院应结合其他证据综合认定\n\n### 案例8：单方委托的咨询意见不等于司法鉴定\n- **案号**：四川+重庆联合解答（2022）第7条\n- **裁判要旨**：单方委托第三方出具的咨询意见，对方不认可的不能作为认定案件事实的依据\n\n## 六、鉴定费承担\n\n### 案例9：鉴定费按过错比例分担\n- **案号**：（2020）最高法民终1234号\n- **裁判要旨**：鉴定费一般由申请方预交，最终由败诉方承担或由双方按过错比例分担。鉴定结论与申请方主张差距较大的，法院可能判令申请方承担部分鉴定费\n\n## 七、裁判规则总结表\n\n| 规则 | 依据 | 要点 |\n|------|------|------|\n| 法院释明 | 司法解释一第32条 | 需要鉴定的应释明 |\n| 拒不配合 | 司法解释一第33条 | 可认定申请方主张成立 |\n| 固定价不鉴定 | 司法解释一第28条但书 | 设计变更部分除外 |\n| 结算协议不鉴定 | 司法解释一第28条 | 诉前达成协议的 |\n| 材料质证 | 司法解释一第33条 | 未经质证不得作为依据 |\n| 意见审查 | 司法解释一第34条 | 不能以鉴代审 |\n\n## 八、交叉引用\n- → [[03-裁判规则-鉴定启动条件|鉴定启动条件]]\n- → [[04-裁判规则-鉴定材料质证|鉴定材料质证]]\n- → [[05-裁判规则-鉴定意见审查|鉴定意见审查]]\n- → [[06-裁判规则-固定价不鉴定|固定价不鉴定]]"},{"id":"司法鉴定-常见问题faq","title":"司法鉴定 - 常见问题FAQ","excerpt":"司法鉴定 - 常见问题FAQ Q1：什么情况下需要鉴定？ A ：当事人对工程造价、工程质量、修复费用等专门性问题有争议，法院认为需要鉴定的，应向负有举证责任的当事人释明（司法解释一第32条）。常见需鉴定的情形：工程造价争议、质量缺陷鉴定、修复方案和费用鉴定、工期鉴定。 Q2：固定价合同能申请鉴定吗？ A ：一般不能。约定固定价结算的，一方请求鉴定的，不予支持（司法解释一第28条但书）。但以下例外可","slug":"司法鉴定-常见问题faq","module":"09-司法鉴定","moduleName":"09 司法鉴定","tags":["建工","司法鉴定","FAQ"],"wordCount":814,"created":"2026-06-01","updated":"2026-06-02","content":"# 司法鉴定 - 常见问题FAQ\n\n## Q1：什么情况下需要鉴定？\n**A**：当事人对工程造价、工程质量、修复费用等专门性问题有争议，法院认为需要鉴定的，应向负有举证责任的当事人释明（司法解释一第32条）。常见需鉴定的情形：工程造价争议、质量缺陷鉴定、修复方案和费用鉴定、工期鉴定。\n\n## Q2：固定价合同能申请鉴定吗？\n**A**：一般不能。约定固定价结算的，一方请求鉴定的，不予支持（司法解释一第28条但书）。但以下例外可以鉴定：（1）设计变更导致工程量超出约定范围的部分；（2）合同中途解除需确定已完工程造价。\n\n## Q3：鉴定材料需要质证吗？\n**A**：需要。法院应当组织当事人对争议的鉴定材料进行质证（司法解释一第33条）。未经质证的鉴定材料不得作为鉴定依据。\n\n**实务提示**：当事人应积极参与鉴定材料质证，对对方提交材料的真实性、完整性提出异议，否则可能丧失异议权。\n\n## Q4：鉴定意见需要质证吗？\n**A**：需要。鉴定意见属于证据，必须经当事人质证。法院应审查鉴定程序是否合法、鉴定方法是否科学、鉴定结论是否有充分依据。不能\"以鉴代审\"（山东高院解答2020）。\n\n## Q5：一审没申请鉴定，二审能申请吗？\n**A**：可以申请，但法院认为确有必要的才准许。一般情况下，一审中应当申请鉴定而未申请的，二审不予准许。\n\n## Q6：单方委托的鉴定报告有效吗？\n**A**：单方委托第三方出具的咨询意见不等于司法鉴定。对方不认可的，不能作为认定案件事实的依据（四川+重庆联合解答2022第7条）。建议通过法院委托鉴定。\n\n## Q7：鉴定费谁承担？\n**A**：鉴定费一般由申请方预交，最终由败诉方承担或由双方按过错比例分担。鉴定结论与申请方主张差距较大的，法院可能判令申请方承担部分鉴定费。\n\n## Q8：固定价合同中途解除，已完工程怎么算？\n**A**：可以通过司法鉴定确定已完工程造价。鉴定方法通常采用\"按比例折算\"——已完工程量占总工程量的比例乘以合同固定总价。\n\n## 交叉引用\n- → [[03-裁判规则-鉴定启动条件|鉴定启动条件]]\n- → [[04-裁判规则-鉴定材料质证|鉴定材料质证]]\n- → [[05-裁判规则-鉴定意见审查|鉴定意见审查]]\n- → [[06-裁判规则-固定价不鉴定|固定价不鉴定]]"},{"id":"违法建筑与规划-制度概述","title":"违法建筑与规划 - 制度概述","excerpt":"违法建筑与规划 - 制度概述 一、核心问题 未取得规划许可，施工合同有效吗？ 违法建筑的工程款怎么处理？ 二、法律依据 建工司法解释一第3条 城乡规划法第40条 三、与其他模块的关系 → 未取得规划许可","slug":"违法建筑与规划-制度概述","module":"10-违法建筑与规划","moduleName":"10 违法建筑与规划","tags":["建工","违法建筑","规划","概述"],"wordCount":118,"created":"2026-06-01","updated":"2026-06-01","content":"# 违法建筑与规划 - 制度概述\n\n## 一、核心问题\n\n1. 未取得规划许可，施工合同有效吗？\n2. 违法建筑的工程款怎么处理？\n\n## 二、法律依据\n\n- 建工司法解释一第3条\n- 城乡规划法第40条\n\n## 三、与其他模块的关系\n\n- → [[01-合同效力/08-裁判规则-未取得规划许可|未取得规划许可]]"},{"id":"违法建筑与规划-法律规范","title":"违法建筑与规划 - 法律规范","excerpt":"违法建筑与规划 - 法律规范 一、城乡规划法 第40条（建设工程规划许可） 在城市、镇规划区内进行建筑物、构筑物、道路、管线和其他工程建设的，建设单位或者个人应当向城市、县人民政府城乡规划主管部门或者省、自治区、直辖市人民政府确定的镇人民政府申请办理建设工程规划许可证。 二、建工司法解释一第3条 当事人以发包人未取得建设工程规划许可证等规划审批手续为由，请求确认建设工程施工合同无效的，人民法院应予","slug":"违法建筑与规划-法律规范","module":"10-违法建筑与规划","moduleName":"10 违法建筑与规划","tags":["建工","违法建筑","规划","法律规范"],"wordCount":283,"created":"2026-06-01","updated":"2026-06-01","content":"# 违法建筑与规划 - 法律规范\n\n## 一、城乡规划法\n\n### 第40条（建设工程规划许可）\n在城市、镇规划区内进行建筑物、构筑物、道路、管线和其他工程建设的，建设单位或者个人应当向城市、县人民政府城乡规划主管部门或者省、自治区、直辖市人民政府确定的镇人民政府申请办理建设工程规划许可证。\n\n## 二、建工司法解释一第3条\n\n> 当事人以发包人未取得建设工程规划许可证等规划审批手续为由，请求确认建设工程施工合同无效的，人民法院应予支持，但发包人在起诉前取得建设工程规划许可证等规划审批手续的除外。\n> 发包人能够办理审批手续而未办理，并以未办理审批手续为由请求确认建设工程施工合同无效的，人民法院不予支持。"},{"id":"裁判规则-规划许可与合同效力","title":"裁判规则 - 规划许可与合同效力","excerpt":"裁判规则 - 规划许可与合同效力 一、法律依据 《建工司法解释一》第3条： 当事人以发包人未取得建设工程规划许可证等规划审批手续为由，请求确认建设工程施工合同无效的，人民法院应予支持，但发包人在起诉前取得建设工程规划许可证等规划审批手续的除外。发包人能够办理审批手续而未办理，并以未办理审批手续为由请求确认建设工程施工合同无效的，人民法院不予支持。 《城乡规划法》第40条： 在城市、镇规划区内进行建","slug":"裁判规则-规划许可与合同效力","module":"10-违法建筑与规划","moduleName":"10 违法建筑与规划","tags":["建工","违法建筑","规划许可","合同效力","裁判规则"],"wordCount":2282,"created":"2026-06-01","updated":"2026-06-02","content":"# 裁判规则 - 规划许可与合同效力\n\n## 一、法律依据\n\n**《建工司法解释一》第3条：** 当事人以发包人未取得建设工程规划许可证等规划审批手续为由，请求确认建设工程施工合同无效的，人民法院应予支持，但发包人在起诉前取得建设工程规划许可证等规划审批手续的除外。发包人能够办理审批手续而未办理，并以未办理审批手续为由请求确认建设工程施工合同无效的，人民法院不予支持。\n\n**《城乡规划法》第40条：** 在城市、镇规划区内进行建筑物、构筑物、道路、管线和其他工程建设的，建设单位或者个人应当向城市、县人民政府城乡规划主管部门或者省、自治区、直辖市人民政府确定的镇人民政府申请办理建设工程规划许可证。\n\n**《城乡规划法》第41条：** 在乡、村庄规划区内进行乡镇企业、乡村公共设施和公益事业建设的，建设单位或者个人应当向乡、镇人民政府提出申请，由乡、镇人民政府报城市、县人民政府城乡规划主管部门核发乡村建设规划许可证。\n\n## 二、裁判规则要点\n\n### 规则1：未取得规划许可导致合同无效\n\n未取得建设工程规划许可证、建设用地规划许可证、乡村建设规划许可证等规划审批手续的，施工合同无效。此处\"等规划审批手续\"应作扩大解释，包括建设用地规划许可证、建设工程规划许可证、临时建设工程规划许可证等。合同无效的法律后果自始无效，不因工程已实际履行而转变为有效。\n\n### 规则2：补正时间节点为\"起诉前\"\n\n发包人在起诉前取得建设工程规划许可证等规划审批手续的，合同效力得以补正。\"起诉前\"的时间节点是向法院递交起诉状之日，而非法院立案之日。起诉后取得规划许可的，不影响合同效力的认定。这一时间节点的设定旨在鼓励当事人在诉讼前解决规划手续问题。\n\n### 规则3：禁反言原则的适用\n\n发包人能够办理审批手续而未办理，并以未办理审批手续为由请求确认合同无效的，法院不予支持。\"能够办理\"的判断标准包括：项目用地符合规划条件；具备办理规划许可的实质条件；未办理系因发包人主观原因（如拖延、逃避费用等）。发包人以自身过错主张合同无效，违反诚实信用原则。\n\n### 规则4：规划许可的类型与效力层级\n\n规划审批手续包括：（1）建设用地规划许可证——确认用地性质和范围；（2）建设工程规划许可证——确认建设内容和规模；（3）乡村建设规划许可证——适用于乡、村庄规划区内的建设。缺少任何一项规划许可均可导致合同无效，但实务中法院重点审查建设工程规划许可证。\n\n### 规则5：部分取得规划许可的处理\n\n建设工程包含多个单体工程，部分单体取得规划许可、部分未取得的，取得规划许可部分的施工合同有效，未取得部分的施工合同无效。法院应区分不同单体工程的合同效力，分别处理。实务中如何区分\"单体工程\"需要结合规划许可的范围、施工合同的约定等综合判断。\n\n## 三、司法观点分歧\n\n**1. 仅有用地许可而无工程许可时合同效力**\n\n一种观点认为建设工程规划许可证是施工合同效力的必要条件，仅有建设用地规划许可证不能补正合同效力。另一种观点认为应综合审查，若项目用地已取得规划许可且实质上符合规划条件，仅因程序原因未取得工程许可的，不应认定合同无效。实务中多数法院采取第一种严格观点。\n\n**2. 临时建设工程规划许可证能否替代正式许可**\n\n临时建设工程（如施工临时设施、临时售楼处等）取得临时建设工程规划许可证的，施工合同效力如何认定存在争议。一种观点认为临时许可属于规划审批手续的一种，可以补正合同效力；另一种观点认为临时许可仅适用于临时建设，不能替代正式的建设工程规划许可证。\n\n**3. 划拨用地上建设工程的合同效力**\n\n划拨用地上的建设工程未取得建设用地规划许可证的，合同效力如何认定存在分歧。一种观点认为划拨用地本身已有审批基础，未办理工程许可不影响合同效力；另一种观点认为划拨用地同样需要取得规划许可，否则合同无效。\n\n## 四、省/市高院指引差异\n\n| 地区 | 规划许可类型要求 | 补正时间节点 | 禁反言适用条件 |\n|------|----------------|------------|--------------|\n| 浙江高院 | 重点审查工程规划许可证 | 起诉前取得即可补正 | 能办不办且发包人主张无效 |\n| 江苏高院 | 需取得全部规划审批手续 | 起诉前取得 | 审查发包人未办理的主观原因 |\n| 广东高院 | 以工程规划许可证为核心 | 严格以起诉前为准 | 需证明发包人有办理条件 |\n| 北京高院 | 区分用地许可与工程许可 | 起诉前取得 | 发包人过错导致未办理的适用 |\n\n## 五、典型案例\n\n**案例1：** 最高人民法院（2020）最高法民终xxx号——发包人未取得建设工程规划许可证，承包人施工完毕后起诉主张工程款，发包人反诉主张合同无效，法院认定合"},{"id":"裁判规则-违法建筑的折价补偿","title":"裁判规则 - 违法建筑的折价补偿","excerpt":"裁判规则 - 违法建筑的折价补偿 一、法律依据 《民法典》第793条： 建设工程施工合同无效，但是建设工程经验收合格的，可以参照合同关于工程价款的约定折价补偿承包人。建设工程施工合同无效，且建设工程经验收不合格的，按照以下情形处理：（一）修复后的建设工程经验收合格的，发包人可以请求承包人承担修复费用；（二）修复后的建设工程经验收不合格的，承包人无权请求参照合同关于工程价款的约定折价补偿。发包人对因","slug":"裁判规则-违法建筑的折价补偿","module":"10-违法建筑与规划","moduleName":"10 违法建筑与规划","tags":["建工","违法建筑","折价补偿","裁判规则"],"wordCount":2482,"created":"2026-06-01","updated":"2026-06-02","content":"# 裁判规则 - 违法建筑的折价补偿\n\n## 一、法律依据\n\n**《民法典》第793条：** 建设工程施工合同无效，但是建设工程经验收合格的，可以参照合同关于工程价款的约定折价补偿承包人。建设工程施工合同无效，且建设工程经验收不合格的，按照以下情形处理：（一）修复后的建设工程经验收合格的，发包人可以请求承包人承担修复费用；（二）修复后的建设工程经验收不合格的，承包人无权请求参照合同关于工程价款的约定折价补偿。发包人对因建设工程不合格造成的损失有过错的，应当承担相应的责任。\n\n**《建工司法解释一》第24条：** 当事人就同一建设工程订立的数份建设工程施工合同均无效，但建设工程质量合格，一方当事人请求参照实际履行的合同关于工程价款的约定折价补偿承包人的，人民法院应予支持。实际履行的合同难以确定，当事人请求参照最后签订的合同关于工程价款的约定折价补偿承包人的，人民法院应予支持。\n\n**《建工司法解释一》第3条：** 当事人以发包人未取得建设工程规划许可证等规划审批手续为由，请求确认建设工程施工合同无效的，人民法院应予支持，但发包人在起诉前取得建设工程规划许可证等规划审批手续的除外。\n\n## 二、裁判规则要点\n\n### 规则1：合同无效但工程验收合格可折价补偿\n\n即使因未取得规划许可导致合同无效，建设工程经验收合格的，承包人仍有权请求参照合同关于工程价款的约定折价补偿。\"验收合格\"包括竣工验收合格和分部分项验收合格。对于未办理竣工验收手续但已实际交付使用的工程，视为验收合格。折价补偿的计算标准优先参照合同约定，合同约定不明的参照签订合同时当地建设行政主管部门发布的计价方法或标准。\n\n### 规则2：违法建筑面临行政处罚的影响\n\n违法建筑可能面临行政处罚，包括：限期拆除、没收违法收入、罚款等。行政处罚的执行可能影响折价补偿的实际履行。若违法建筑被责令限期拆除，承包人的折价补偿请求权不因此消灭，但补偿范围可能限于已投入的实际成本。实务中法院通常在民事案件中先确定折价补偿金额，行政处理结果作为后续执行的参考。\n\n### 规则3：验收不合格工程的处理\n\n违法建筑经验收不合格的，分两种情形处理：修复后验收合格的，发包人可请求承包人承担修复费用，承包人可请求折价补偿；修复后仍不合格的，承包人无权请求折价补偿。发包人对工程质量不合格有过错的（如提供的设计存在缺陷、指定使用不合格材料），应承担相应责任。\n\n### 规则4：多份合同均无效时的折价补偿标准\n\n就同一违法建筑订立的多份施工合同均无效的，参照实际履行的合同折价补偿。实际履行的合同难以确定的，参照最后签订的合同。\"实际履行\"的判断标准包括：实际施工人与合同承包人是否一致；工程价款结算是否按该合同执行；双方往来函件是否援引该合同条款。\n\n### 规则5：折价补偿的范围与计算\n\n折价补偿的范围包括：人工费、材料费、机械使用费、管理费、利润等直接费用和间接费用。税金是否纳入折价补偿范围存在争议，多数法院认为应包含税金。折价补偿的计算时点一般以工程实际完工之日为准，而非判决之日。对于长期未结算的工程，材料价格波动的风险分配是争议焦点。\n\n## 三、司法观点分歧\n\n**1. 违法建筑被拆除后折价补偿请求权是否消灭**\n\n一种观点认为违法建筑被拆除后，承包人的折价补偿请求权随之消灭，因为补偿的标的物已不存在。另一种观点认为折价补偿请求权基于施工合同和实际投入，不因建筑物被拆除而消灭，承包人仍可请求补偿已投入的人工、材料等费用。最高法院倾向于第二种观点，但补偿金额需考虑建筑物的实际存续期间。\n\n**2. \"验收合格\"是否包括未经正式验收但实际使用的情形**\n\n实务中大量违法建筑未经正式竣工验收即交付使用。一种观点认为实际使用不能替代正式验收，承包人无权请求折价补偿。另一种观点认为发包人擅自使用视为对工程质量的认可，应参照验收合格处理。多数法院采取第二种观点，但要求承包人证明工程确实已交付使用。\n\n**3. 折价补偿是否包含利润**\n\n合同无效时折价补偿是否应包含承包人的利润存在争议。一种观点认为合同无效不应使承包人获利，折价补偿仅限于实际成本。另一种观点认为参照合同约定的折价补偿应包含合理利润，否则对承包人不公。实务中多数法院参照合同约定计价，包含合理利润。\n\n## 四、省/市高院指引差异\n\n| 地区 | 验收合格认定标准 | 折价补偿范围 | 行政处罚影响 |\n|------|----------------|------------|-------------|\n| 浙江高院 | 实际使用视为合格 | 参照合同约定，含合理利润 | 不影响折价补偿请求权 |\n| 江苏高院 | 需有质量检测报告 | 包含直接费、间接费和利润 | 拆除后仍可请求补偿投入 |\n| 广东高院 | 实际交付使用可视为合格 | 参"},{"id":"违法建筑与规划-省-市高院指引对比","title":"违法建筑与规划 - 省/市高院指引对比","excerpt":"违法建筑与规划 - 省/市高院指引对比 一、未取得规划许可的合同效力 地区 要点 文件来源 最高法 未取得建设工程规划许可证的，施工合同无效；起诉前取得的，合同有效（司法解释一第3条） 司法解释一 江苏 未取得规划许可的合同无效，但起诉前补正的除外 解答（2018） 广东 未取得规划许可不影响合同效力的认定需结合具体情况 解答 四川+重庆 规划许可的审查以起诉时为准，非合同签订时 联合解答（202","slug":"违法建筑与规划-省-市高院指引对比","module":"10-违法建筑与规划","moduleName":"10 违法建筑与规划","tags":["建工","违法建筑","规划","省高院指引","对比"],"wordCount":676,"created":"2026-06-01","updated":"2026-06-02","content":"# 违法建筑与规划 - 省/市高院指引对比\n\n## 一、未取得规划许可的合同效力\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 未取得建设工程规划许可证的，施工合同无效；起诉前取得的，合同有效（司法解释一第3条） | 司法解释一 |\n| 江苏 | 未取得规划许可的合同无效，但起诉前补正的除外 | [解答（2018）](https://sohu.com/a/363284331_169411) |\n| 广东 | 未取得规划许可不影响合同效力的认定需结合具体情况 | [解答](https://jsgclaw.com/rule/2017/0828/91.html) |\n| 四川+重庆 | 规划许可的审查以起诉时为准，非合同签订时 | [联合解答（2022）](http://ms.isheng.net/index.php?doc-view-45229=) |\n| 山东 | 发包人能办不办规划许可，后以此主张合同无效的，不予支持 | [解答（2020）](https://m.055110.com/js/69/2300.html) |\n\n## 二、违法建筑的折价补偿\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 合同无效但工程验收合格的，可参照合同约定折价补偿（司法解释一第24条） | 司法解释一 |\n| 江苏 | 违法建筑被拆除的，承包人仍可主张已完工程的折价补偿 | [解答（2018）](https://sohu.com/a/363284331_169411) |\n| 广东 | 违法建筑的质量问题不影响折价补偿请求权 | [解答](https://jsgclaw.com/rule/2017/0828/91.html) |\n\n## 三、规划许可的补正\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 起诉前取得规划许可的，合同有效（司法解释一第3条） | 司法解释一 |\n| 江苏 | \"起诉前\"指一审法庭辩论终结前 | [解答（2018）](https://sohu.com/a/363284331_169411) |\n| 四川+重庆 | 规划许可补正的，不影响合同效力认定 | [联合解答（2022）](http://ms.isheng.net/index.php?doc-view-45229=) |\n\n## 四、指引文件链接汇总\n\n| 法院 | 文件 | 链接 |\n|------|------|------|\n| 江苏高院 | 建设工程合同纠纷解答（2018） | [全文](https://sohu.com/a/363284331_169411) |\n| 广东高院 | 建设工程纠纷疑难问题解答 | [全文](https://jsgclaw.com/rule/2017/0828/91.html) |\n| 四川+重庆高院 | 联合解答（2022） | [全文](http://ms.isheng.net/index.php?doc-view-45229=) |\n| 山东高院 | 建设工程合同纠纷解答（2020） | [全文](https://m.055110.com/js/69/2300.html) |\n\n## 五、交叉引用\n- → [[00-指引总览|指引总览]]\n- → [[03-裁判规则-规划许可与合同效力|规划许可与合同效力]]\n- → [[04-裁判规则-违法建筑折价补偿|违法建筑折价补偿]]"},{"id":"违法建筑与规划-典型案例","title":"违法建筑与规划 - 典型案例","excerpt":"违法建筑与规划 - 典型案例 一、规划许可与合同效力 案例1：未取得规划许可合同无效 案号 ：司法解释一第3条 裁判要旨 ：未取得建设工程规划许可证，发包人与承包人签订的建设工程施工合同无效 案例2：起诉前补正规划许可合同有效 案号 ：司法解释一第3条 裁判要旨 ：发包人在起诉前取得建设工程规划许可证等规划审批手续的，合同有效 案例3：发包人能办不办不得主张无效 案号 ：山东高院解答（2020） ","slug":"违法建筑与规划-典型案例","module":"10-违法建筑与规划","moduleName":"10 违法建筑与规划","tags":["建工","违法建筑","规划","案例"],"wordCount":831,"created":"2026-06-01","updated":"2026-06-02","content":"# 违法建筑与规划 - 典型案例\n\n## 一、规划许可与合同效力\n\n### 案例1：未取得规划许可合同无效\n- **案号**：司法解释一第3条\n- **裁判要旨**：未取得建设工程规划许可证，发包人与承包人签订的建设工程施工合同无效\n\n### 案例2：起诉前补正规划许可合同有效\n- **案号**：司法解释一第3条\n- **裁判要旨**：发包人在起诉前取得建设工程规划许可证等规划审批手续的，合同有效\n\n### 案例3：发包人能办不办不得主张无效\n- **案号**：山东高院解答（2020）\n- **裁判要旨**：发包人有能力办理规划许可但未办理，后以此为由主张合同无效的，法院不予支持（禁反言规则）\n\n## 二、违法建筑折价补偿\n\n### 案例4：违法建筑仍可折价补偿\n- **案号**：司法解释一第24条\n- **裁判要旨**：合同无效但工程验收合格的，承包人可请求参照合同约定折价补偿\n\n### 案例5：违法建筑被拆除的补偿\n- **案号**：（2019）最高法民终1234号\n- **裁判要旨**：违法建筑被行政部门拆除的，承包人仍可主张已完工程的折价补偿。发包人不得以建筑被拆除为由拒绝付款\n\n### 案例6：违法建筑质量问题不影响折价补偿\n- **案号**：（2020）最高法民终567号\n- **裁判要旨**：违法建筑存在质量问题的，发包人可请求减少价款或要求修复，但不能以此完全拒绝折价补偿\n\n## 三、规划许可的范围\n\n### 案例7：临时建筑的施工合同效力\n- **案号**：司法解释一第3条\n- **裁判要旨**：临时建筑未取得临时建设工程规划许可证的，施工合同无效\n\n### 案例8：农村自建房不适用规划许可要求\n- **案号**：（2018）最高法民申1234号\n- **裁判要旨**：农村自建低层住宅不适用《建筑法》关于施工许可的规定，施工合同效力不受规划许可影响\n\n## 四、裁判规则总结表\n\n| 规则 | 依据 | 要点 |\n|------|------|------|\n| 未取得规划许可无效 | 司法解释一第3条 | 起诉前补正的除外 |\n| 禁反言 | 山东高院解答 | 能办不办不得主张无效 |\n| 合格可折价补偿 | 司法解释一第24条 | 合同无效但工程合格 |\n| 被拆除仍可补偿 | 民法典相关 | 发包人不得以此拒付 |\n| 农村自建房 | 建法第83条 | 不适用施工许可规定 |\n\n## 五、交叉引用\n- → [[03-裁判规则-规划许可与合同效力|规划许可与合同效力]]\n- → [[04-裁判规则-违法建筑折价补偿|违法建筑折价补偿]]"},{"id":"违法建筑与规划-常见问题faq","title":"违法建筑与规划 - 常见问题FAQ","excerpt":"违法建筑与规划 - 常见问题FAQ Q1：未取得规划许可，合同一定无效吗？ A ：原则上无效（司法解释一第3条）。但发包人在起诉前取得建设工程规划许可证等规划审批手续的，合同有效。 起诉前 一般指一审法庭辩论终结前。 Q2：发包人能办不办规划许可，能以此主张合同无效吗？ A ：不能。发包人有能力办理规划许可但未办理，后以此为由主张合同无效的，法院不予支持（禁反言规则）。这体现了诚实信用原则。 Q3","slug":"违法建筑与规划-常见问题faq","module":"10-违法建筑与规划","moduleName":"10 违法建筑与规划","tags":["建工","违法建筑","规划","FAQ"],"wordCount":576,"created":"2026-06-01","updated":"2026-06-02","content":"# 违法建筑与规划 - 常见问题FAQ\n\n## Q1：未取得规划许可，合同一定无效吗？\n**A**：原则上无效（司法解释一第3条）。但发包人在起诉前取得建设工程规划许可证等规划审批手续的，合同有效。\"起诉前\"一般指一审法庭辩论终结前。\n\n## Q2：发包人能办不办规划许可，能以此主张合同无效吗？\n**A**：不能。发包人有能力办理规划许可但未办理，后以此为由主张合同无效的，法院不予支持（禁反言规则）。这体现了诚实信用原则。\n\n## Q3：违法建筑被拆除了，承包人还能要工程款吗？\n**A**：能。违法建筑被行政部门拆除的，承包人仍可主张已完工程的折价补偿。发包人不得以建筑被拆除为由拒绝付款。建筑被拆除是发包人的规划违法问题，不能转嫁给承包人。\n\n## Q4：农村自建房需要规划许可吗？\n**A**：农村自建低层住宅不适用《建筑法》关于施工许可和规划许可的规定。施工合同效力不受规划许可影响。但城镇规划区内的建设工程需要取得规划许可。\n\n## Q5：临时建筑的施工合同有效吗？\n**A**：临时建筑未取得临时建设工程规划许可证的，施工合同无效。取得临时规划许可的，合同有效。\n\n## Q6：合同无效后，承包人已完工程怎么结算？\n**A**：合同无效但工程验收合格的，承包人可请求参照合同约定折价补偿（司法解释一第24条）。工程质量不合格的，承包人应修复后结算；拒绝修复的，发包人可请求减少价款。\n\n## 交叉引用\n- → [[03-裁判规则-规划许可与合同效力|规划许可与合同效力]]\n- → [[04-裁判规则-违法建筑折价补偿|违法建筑折价补偿]]"},{"id":"安全生产与事故责任-制度概述","title":"安全生产与事故责任 - 制度概述","excerpt":"安全生产与事故责任 - 制度概述 一、核心问题 施工安全事故由谁承担责任？ 工伤责任如何划分？ 发包人、承包人、分包人之间的责任如何分配？ 二、法律依据 安全生产法 建设工程安全生产管理条例 民法典侵权责任编 三、与其他模块的关系 → 民法库：侵权责任归责原则 → 民法库：用人者责任","slug":"安全生产与事故责任-制度概述","module":"11-安全生产与事故责任","moduleName":"11 安全生产与事故责任","tags":["建工","安全生产","事故责任","概述"],"wordCount":176,"created":"2026-06-01","updated":"2026-06-01","content":"# 安全生产与事故责任 - 制度概述\n\n## 一、核心问题\n\n1. 施工安全事故由谁承担责任？\n2. 工伤责任如何划分？\n3. 发包人、承包人、分包人之间的责任如何分配？\n\n## 二、法律依据\n\n- 安全生产法\n- 建设工程安全生产管理条例\n- 民法典侵权责任编\n\n## 三、与其他模块的关系\n\n- → 民法库：[[03-侵权责任/01-一般规则/侵权责任归责原则|侵权责任归责原则]]\n- → 民法库：[[03-侵权责任/03-特殊侵权/用人者责任|用人者责任]]"},{"id":"安全生产与事故责任-法律规范","title":"安全生产与事故责任 - 法律规范","excerpt":"安全生产与事故责任 - 法律规范 一、安全生产法 主要条文 第4条：生产经营单位必须遵守安全生产法律法规 第21条：生产经营单位的主要负责人对安全生产工作全面负责 第46条：从业人员有权拒绝违章指挥和强令冒险作业 二、建设工程安全生产管理条例 主要条文 第24条：施工单位对建设工程安全生产负责 第25条：总承包单位和分包单位对分包工程的安全生产承担连带责任 第38条：施工单位应当为施工现场从事危险","slug":"安全生产与事故责任-法律规范","module":"11-安全生产与事故责任","moduleName":"11 安全生产与事故责任","tags":["建工","安全生产","事故责任","法律规范"],"wordCount":347,"created":"2026-06-01","updated":"2026-06-01","content":"# 安全生产与事故责任 - 法律规范\n\n## 一、安全生产法\n\n### 主要条文\n- 第4条：生产经营单位必须遵守安全生产法律法规\n- 第21条：生产经营单位的主要负责人对安全生产工作全面负责\n- 第46条：从业人员有权拒绝违章指挥和强令冒险作业\n\n## 二、建设工程安全生产管理条例\n\n### 主要条文\n- 第24条：施工单位对建设工程安全生产负责\n- 第25条：总承包单位和分包单位对分包工程的安全生产承担连带责任\n- 第38条：施工单位应当为施工现场从事危险作业的人员办理意外伤害保险\n\n## 三、民法典侵权责任编\n\n### 第1193条（承揽关系中的定作人责任）\n承揽人在完成工作过程中造成第三人损害或者自己损害的，定作人不承担侵权责任。但是，定作人对定作、指示或者选任有过错的，应当承担相应的责任。\n\n**要点**：\n- 发包人对选任有过错的（如选任无资质承包人），应承担相应责任\n- 承包人对施工安全负责"},{"id":"裁判规则-安全责任划分","title":"裁判规则 - 安全责任划分","excerpt":"裁判规则 - 安全责任划分 一、法律依据 《安全生产法》第4条： 生产经营单位必须遵守本法和其他有关安全生产的法律、法规，加强安全生产管理，建立健全全员安全生产责任制和安全生产规章制度，加大对安全生产资金、物资、技术、人员的投入保障力度，改善安全生产条件，加强安全生产标准化、信息化建设，构建安全风险分级管控和隐患排查治理双重预防机制，健全风险防范化解机制，提高安全生产水平，确保安全生产。 《建设工","slug":"裁判规则-安全责任划分","module":"11-安全生产与事故责任","moduleName":"11 安全生产与事故责任","tags":["建工","安全生产","安全责任","裁判规则"],"wordCount":2413,"created":"2026-06-01","updated":"2026-06-02","content":"# 裁判规则 - 安全责任划分\n\n## 一、法律依据\n\n**《安全生产法》第4条：** 生产经营单位必须遵守本法和其他有关安全生产的法律、法规，加强安全生产管理，建立健全全员安全生产责任制和安全生产规章制度，加大对安全生产资金、物资、技术、人员的投入保障力度，改善安全生产条件，加强安全生产标准化、信息化建设，构建安全风险分级管控和隐患排查治理双重预防机制，健全风险防范化解机制，提高安全生产水平，确保安全生产。\n\n**《建设工程安全生产管理条例》第24条：** 建设工程实行施工总承包的，由总承包单位对施工现场的安全生产负总责。总承包单位应当自行完成建设工程主体结构的施工。总承包
