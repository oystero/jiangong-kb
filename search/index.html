律规范","司法解释逐条"],"wordCount":2408,"created":"2026-06-01","updated":"2026-06-01","content":"# 合同效力 - 法律规范\n\n## 一、民法典相关条文\n\n### 第153条（强制性规定与公序良俗）\n违反法律、行政法规的强制性规定的民事法律行为无效。但是，该强制性规定不导致该民事法律行为无效的除外。违背公序良俗的民事法律行为无效。\n\n### 第157条（民事法律行为无效的后果）\n民事法律行为无效、被撤销或者确定不发生效力后，行为人因该行为取得的财产，应当予以返还；不能返还或者没有必要返还的，应当折价补偿。有过错的一方应当赔偿对方由此所受到的损失；各方都有过错的，应当各自承担相应的责任。\n\n### 第793条第1款（合同无效的折价补偿）\n建设工程施工合同无效，但是建设工程经验收合格的，可以参照合同关于工程价款的约定折价补偿承包人。\n\n### 第806条（合同解除）\n承包人将建设工程转包、违法分包的，发包人可以解除合同。\n\n---\n\n## 二、建筑法相关条文\n\n### 第26条（资质要求）\n承包建筑工程的单位应当持有依法取得的资质证书，并在其资质等级许可的业务范围内承揽工程。禁止建筑施工企业超越本企业资质等级许可的业务范围或者以任何形式用其他建筑施工企业的名义承揽工程。禁止建筑施工企业以任何形式允许其他单位或者个人使用本企业的资质证书、营业执照，以本企业的名义承揽工程。\n\n### 第28条（禁止转包）\n禁止承包单位将其承包的全部建筑工程转包给他人，禁止承包单位将其承包的全部工程肢解以后以分包的名义分别转包给他人。\n\n### 第29条（分包限制）\n建筑工程总承包单位可以将承包工程中的部分工程发包给具有相应资质条件的分包单位；但是，除总承包合同中约定的分包外，必须经建设单位认可。施工总承包的，建筑工程主体结构的施工必须由总承包单位自行完成。禁止总承包单位将工程分包给不具备相应资质条件的单位。禁止分包单位将其承包的工程再分包。\n\n---\n\n## 三、建工司法解释一逐条解析（第1-7条）\n\n### 第1条（合同无效情形）\n\n> **条文**：建设工程施工合同具有下列情形之一的，应当依据民法典第一百五十三条第一款的规定，认定无效：\n> （一）承包人未取得建筑业企业资质或者超越资质等级的；\n> （二）没有资质的实际施工人借用有资质的建筑施工企业名义的；\n> （三）建设工程必须进行招标而未招标或者中标无效的。\n> 承包人因转包、违法分包建设工程与他人签订的建设工程施工合同，应当依据民法典第一百五十三条第一款及第七百九十一条第二款、第三款的规定，认定无效。\n\n**要点解析**：\n- 第1款第1项：无资质或超资质，合同自始无效\n- 第1款第2项：挂靠，借用资质方与发包人之间的合同无效\n- 第1款第3项：强制招标工程未招标或中标无效\n- 第2款：转包、违法分包的合同无效（注意：是承包人与接受转包/分包方之间的合同无效，非发包人与承包人之间的合同）\n- 与旧解释对比：删除了\"收缴非法所得\"的规定（民法典无此责任形式）\n\n### 第2条（黑白合同）\n\n> **条文**：招标人和中标人另行签订的建设工程施工合同约定的工程范围、建设工期、工程质量、工程价款等实质性内容，与中标合同不一致，一方当事人请求按照中标合同确定权利义务的，人民法院应予支持。\n> 招标人和中标人在中标合同之外就明显高于市场价格购买承建房产、无偿建设住房配套设施、让利、向建设单位捐赠财物等另行签订合同，变相降低工程价款，一方当事人以该合同背离中标合同实质性内容为由请求确认无效的，人民法院应予支持。\n\n**要点解析**：\n- \"实质性内容\"：工程范围、建设工期、工程质量、工程价款\n- 变相降低工程价款的认定：高价购房、无偿建设配套设施、让利、捐赠\n- 本条解决的是合同效力问题，第22-24条解决的是结算依据问题\n\n### 第3条（规划许可与合同效力）\n\n> **条文**：当事人以发包人未取得建设工程规划许可证等规划审批手续为由，请求确认建设工程施工合同无效的，人民法院应予支持，但发包人在起诉前取得建设工程规划许可证等规划审批手续的除外。\n> 发包人能够办理审批手续而未办理，并以未办理审批手续为由请求确认建设工程施工合同无效的，人民法院不予支持。\n\n**要点解析**：\n- 起诉前补正的，合同有效（补正时间节点：起诉前）\n- 禁反言：能办不办的，不得以此主张合同无效\n- → 详见 [[10-违法建筑与规划/03-裁判规则-规划许可与合同效力|规划许可与合同效力]]\n\n### 第4条（超越资质的补正）\n\n> **条文**：承包人超越资质等级许可的业务范围签订建设工程施工合同，在建设工程竣工前取得相应资质等级，当事人请求按照无效合同处理的，人民法院不予支持。\n\n**要点解析**：\n- 补正时间节点：竣工前（比第3条的\"起诉前\"更宽松）\n- 效果：合同有效\n\n### 第5条（劳务分包合同效力）\n\n"},{"id":"裁判规则-无资质施工合同无效","title":"裁判规则 - 无资质施工合同无效","excerpt":"裁判规则 - 无资质施工合同无效 一、法律依据 建工司法解释一第1条第1款第1项 ：承包人未取得建筑业企业资质或者超越资质等级的，合同无效 建工司法解释一第4条 ：承包人超越资质等级许可的业务范围签订建设工程施工合同，在建设工程竣工前取得相应资质等级，当事人请求按照无效合同处理的，人民法院不予支持 建筑法第26条 ：承包建筑工程的单位应当持有依法取得的资质证书，并在其资质等级许可的业务范围内承揽工","slug":"裁判规则-无资质施工合同无效","module":"01-合同效力","moduleName":"01 合同效力","tags":["建工","合同效力","无资质","裁判规则"],"wordCount":2301,"created":"2026-06-01","updated":"2026-06-01","content":"# 裁判规则 - 无资质施工合同无效\n\n## 一、法律依据\n\n- **建工司法解释一第1条第1款第1项**：承包人未取得建筑业企业资质或者超越资质等级的，合同无效\n- **建工司法解释一第4条**：承包人超越资质等级许可的业务范围签订建设工程施工合同，在建设工程竣工前取得相应资质等级，当事人请求按照无效合同处理的，人民法院不予支持\n- **建筑法第26条**：承包建筑工程的单位应当持有依法取得的资质证书，并在其资质等级许可的业务范围内承揽工程。禁止建筑施工企业超越本企业资质等级许可的业务范围承揽工程\n- **民法典第153条第1款**：违反法律、行政法规的强制性规定的民事法律行为无效\n\n## 二、裁判规则要点\n\n### 规则1：资质等级以合同签订时为准\n承包人在签订合同时不具有相应资质等级的，合同无效。但如果在竣工前取得相应资质等级的，合同有效（司法解释一第4条）。此处\"竣工前\"应理解为\"竣工验收合格前\"，而非\"实际完工前\"。\n\n### 规则2：建筑业企业资质的分类\n- **施工总承包资质**：12个类别（建筑工程、市政公用工程、公路工程等），各分特级、一级、二级、三级\n- **专业承包资质**：36个类别（地基基础、钢结构、消防设施等）\n- **劳务分包资质**：不再分类别和等级（2015年《建筑业企业资质管理规定》改革后）\n\n> [!tip] 实务要点\n> 2022年《建筑业企业资质标准（征求意见稿）》拟将施工总承包资质和专业承包资质合并为\"施工综合资质\"，但截至目前尚未正式实施。审查资质时仍应以现行有效的资质标准为准。\n\n### 规则3：内部承包与无资质的区分\n建筑施工企业将工程交由其分支机构或内部职工施工，属于内部承包，不构成无资质施工。但需同时满足以下条件：\n- 施工人员与企业存在劳动关系（劳动合同、社保缴纳记录）\n- 企业实际参与工程管理（派驻管理人员、审批施工方案）\n- 企业承担质量、安全责任\n- 工程款由企业统一核算、统一收支\n\n### 规则4：个人承包的合同效力\n自然人作为承包人签订的施工合同，原则上因个人无资质而无效。但以下情形除外：\n- **住宅室内装饰装修工程**：不涉及建筑主体或承重结构变动的，个人可承揽（建设部《住宅室内装饰装修管理办法》）\n- **农村低层住宅建设**：农民自建低层住宅（两层以下）不适用《建筑法》\n\n### 规则5：合同无效不影响工程质量责任\n合同因无资质被认定无效的，承包人仍应在合理使用寿命内对地基基础工程和主体结构质量承担民事责任（司法解释一第14条类推适用）。\n\n## 三、司法观点分歧\n\n### 争议1：竣工前取得资质的时间节点\n\n| 观点 | 内容 | 采纳地区 |\n|------|------|---------|\n| 宽松说 | 实际完工前取得资质即可认定合同有效 | 部分基层法院 |\n| 严格说 | 必须在竣工验收合格前取得资质 | 多数法院 |\n| 最高院立场 | 以\"竣工前\"为准，但实践中倾向严格解释 | 司法解释一第4条 |\n\n### 争议2：暂定资质等级的合同效力\n\n部分建筑企业取得的是暂定资质等级（有效期一年），在其暂定期内签订的合同是否有效存在争议：\n- **有效说**：暂定资质属于合法取得的资质，暂定期内签订合同有效\n- **无效说**：暂定资质不等于正式资质，超越暂定范围的合同无效\n- **主流观点**：暂定资质在其核定的业务范围内有效，超越范围的无效\n\n### 争议3：资质被撤销后的合同效力\n\n承包人在签订合同时具有资质，但此后资质被撤销或吊销的：\n- 合同签订时资质有效的，合同不因事后资质变化而无效\n- 但资质被撤销后新签的合同无效\n\n## 四、省/市高院指引差异\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 江苏 | 承包人超越资质等级，竣工前未补正的，合同无效；区分内部承包与挂靠需综合判断 | 审理指南（2010） |\n| 浙江 | 区分内部承包与挂靠，内部承包需企业实际管理、统一核算 | 疑难问题解答 |\n| 上海 | 个人承包室内装修合同效力需个案判断，考虑工程性质和规模 | 疑难问题解答（25条） |\n| 广东 | 超越资质等级签订合同，竣工前取得资质的，合同有效 | 疑难问题解答（2017） |\n| 深圳 | 无资质施工合同无效，但工程验收合格的仍可参照合同折价补偿 | 裁判指引（2014） |\n| 四川 | 内部承包需满足：劳动关系+统一管理+统一核算三要件 | 疑难问题解答 |\n| 山东 | 个人借用资质签订的合同无效，但不影响实际施工人主张折价补偿 | 解答（2020） |\n| 北京 | 超越资质等级的认定以住建部资质标准为准 | 疑难问题解答 |\n\n## 五、典型案例\n\n### "},{"id":"裁判规则-挂靠-借用资质-的认定","title":"裁判规则 - 挂靠（借用资质）的认定","excerpt":"裁判规则 - 挂靠（借用资质）的认定 一、法律依据 建工司法解释一第1条第1款第2项：没有资质的实际施工人借用有资质的建筑施工企业名义的，合同无效 建筑法第26条：禁止以任何形式允许他人使用本企业的资质证书承揽工程 二、裁判规则要点 规则1：挂靠的构成要件 挂靠需同时满足： 借用方无资质或资质不足 借用有资质企业的名义 以被借用企业名义与发包人签订合同 规则2：挂靠与内部承包的区分 区分要素 挂靠","slug":"裁判规则-挂靠-借用资质-的认定","module":"01-合同效力","moduleName":"01 合同效力","tags":["建工","合同效力","挂靠","借用资质","裁判规则"],"wordCount":1504,"created":"2026-06-01","updated":"2026-06-01","content":"# 裁判规则 - 挂靠（借用资质）的认定\n\n## 一、法律依据\n\n- 建工司法解释一第1条第1款第2项：没有资质的实际施工人借用有资质的建筑施工企业名义的，合同无效\n- 建筑法第26条：禁止以任何形式允许他人使用本企业的资质证书承揽工程\n\n## 二、裁判规则要点\n\n### 规则1：挂靠的构成要件\n挂靠需同时满足：\n1. 借用方无资质或资质不足\n2. 借用有资质企业的名义\n3. 以被借用企业名义与发包人签订合同\n\n### 规则2：挂靠与内部承包的区分\n\n| 区分要素 | 挂靠 | 内部承包 |\n|----------|------|---------|\n| 施工人员 | 借用方自行组织 | 企业员工 |\n| 资金投入 | 借用方自筹 | 企业投入 |\n| 管理关系 | 被借用方不实际管理 | 企业统一管理 |\n| 风险承担 | 借用方自担盈亏 | 企业承担 |\n| 财务关系 | 借用方缴纳\"管理费\" | 企业统一核算 |\n\n### 规则3：发包人知情与否的法律效果\n- **发包人不知情**：借用资质的施工人不能直接向发包人主张工程款\n- **发包人知情**：借用资质的施工人与发包人形成事实上的施工合同关系，可请求折价补偿（最高法2021年第20次法官会议纪要）\n\n### 规则4：出借方与借用方的连带责任\n发包人可请求出借方与借用方对因出借资质造成的损失（如质量不合格）承担连带赔偿责任（司法解释一第7条）。\n\n### 规则5：借用方的权利救济\n- 借用方施工后，可依据与被借用企业的约定请求折价补偿或赔偿损失\n- 工程经验收合格的，按民法典第157条处理\n- 发包人知情的，借用方可直接向发包人主张（需通知出借方作为第三人）\n\n### 规则6：管理费条款的效力\n挂靠合同中约定的管理费条款，因合同无效而不受司法保护。承包人/出借方请求实际施工人支付管理费的，不予支持（最高法2021年第21次法官会议纪要）。\n\n→ 详见 [[15-裁判规则-管理费条款效力|管理费条款效力]]\n\n## 三、省/市高院指引差异\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 江苏 | 挂靠与内部承包的区分需综合判断：资金来源、人员管理、风险承担 | 审理指南（2010） |\n| 浙江 | 项目部负责人以企业名义签订的合同，需审查是否构成挂靠 | 涉项目部解答（2020） |\n| 广东 | 挂靠关系中，借用方与被借用方之间的合同效力需个案判断 | 疑难问题解答（2017） |\n| 深圳 | 明确挂靠的认定标准：无资质、借用名义、独立施工、自担风险 | 裁判指引（2014） |\n| 河南 | 区分挂靠与转包：挂靠是签订合同前借用资质，转包是签订合同后再转出 | 实际施工人纪要 |\n| 广西 | 挂靠的实际施工人不适用司法解释一第43条突破合同相对性 | 实际施工人解答（2012） |\n\n## 四、典型案例\n\n### 案例1：借用资质承揽工程\n- **案号**：(2017)苏民终470号\n- **案情**：徐某借用B公司资质承揽涉案工程\n- **裁判要旨**：徐某系借用B公司的资质承揽涉案工程，双方的挂靠行为违反了法律禁止性强制性规定，签订的涉案《建设工程施工合同》依法应认定为无效\n\n### 案例2：发包人知情时借用方的权利\n- **案号**：最高法2021年第20次法官会议纪要\n- **裁判要旨**：在发包人知道或应当知道系借用资质的实际施工人进行施工的情况下，发包人与借用资质的实际施工人之间形成事实上的建设工程施工合同关系，借用方可请求参照合同约定折价补偿\n\n## 五、实务指引\n\n### 律师代理要点\n- 收集证据证明挂靠关系：挂靠协议、资金往来、人员关系、施工日志\n- 区分挂靠与内部承包：劳动合同、社保记录、工资发放\n- 发包人知情的证据：会议纪要、往来函件、现场管理人员关系\n\n### 法官审查要点\n- 审查承包人是否实际参与施工管理\n- 核实资金流向（工程款是否流向借用方）\n- 判断发包人签订合同时是否知道或应当知道借用资质情形\n\n## 六、交叉引用\n- → [[03-裁判规则-无资质施工|无资质施工]]\n- → [[05-裁判规则-转包认定|转包认定]]\n- → [[11-裁判规则-合同无效折价补偿|合同无效折价补偿]]\n- → [[15-裁判规则-管理费条款效力|管理费条款效力]]\n- → [[07-实际施工人/03-裁判规则-实际施工人认定标准|实际施工人认定]]\n- → 民法库：[[01-合同法/01-合同效力/合同无效的情形|合同无效的情形]]"},{"id":"裁判规则-转包的认定","title":"裁判规则 - 转包的认定","excerpt":"裁判规则 - 转包的认定 一、法律依据 建工司法解释一第1条第2款：承包人因转包建设工程与他人签订的施工合同无效 建筑法第28条：禁止承包单位将其承包的全部建筑工程转包给他人 民法典第791条第2款、第3款 二、裁判规则要点 规则1：转包的定义 转包是指承包单位承包建设工程后，不履行合同约定的责任和义务，将其承包的全部建设工程转给他人或者将其承包的全部工程肢解以后以分包的名义分别转包给他人。 规则","slug":"裁判规则-转包的认定","module":"01-合同效力","moduleName":"01 合同效力","tags":["建工","合同效力","转包","裁判规则"],"wordCount":1035,"created":"2026-06-01","updated":"2026-06-01","content":"# 裁判规则 - 转包的认定\n\n## 一、法律依据\n\n- 建工司法解释一第1条第2款：承包人因转包建设工程与他人签订的施工合同无效\n- 建筑法第28条：禁止承包单位将其承包的全部建筑工程转包给他人\n- 民法典第791条第2款、第3款\n\n## 二、裁判规则要点\n\n### 规则1：转包的定义\n转包是指承包单位承包建设工程后，不履行合同约定的责任和义务，将其承包的全部建设工程转给他人或者将其承包的全部工程肢解以后以分包的名义分别转包给他人。\n\n### 规则2：转包的典型表现形式\n1. 承包人将全部工程转给他人\n2. 承包人将全部工程肢解后以分包名义分别转包\n3. 承包人未在施工现场设立项目管理机构或未派驻项目负责人、技术负责人、质量管理负责人、安全管理负责人等，不履行管理义务\n\n### 规则3：转包与违法分包的区别\n\n| 区分要素 | 转包 | 违法分包 |\n|----------|------|---------|\n| 工程范围 | 全部工程 | 部分工程 |\n| 施工主体 | 承包人不实际施工 | 承包人仍施工部分 |\n| 合同效力 | 转包合同无效 | 分包合同无效 |\n| 发包人解除权 | 可解除（民法典806条） | 可解除（民法典806条） |\n\n### 规则4：转包与挂靠的区别\n\n| 区分要素 | 转包 | 挂靠 |\n|----------|------|------|\n| 时间节点 | 先承包再转出 | 先借用再签订合同 |\n| 合同关系 | 发包人与承包人合同有效，转包合同无效 | 借用方与发包人之间的合同无效 |\n| 资质问题 | 承包人有资质 | 借用方无资质 |\n\n### 规则5：内部承包不构成转包\n承包人将工程交由其分支机构或内部职工施工，属于内部承包，不构成转包。判断标准同 [[04-裁判规则-挂靠认定|挂靠与内部承包的区分]]。\n\n## 三、省/市高院指引差异\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 江苏 | 转包的认定需审查承包人是否实际投入资金、设备、人力 | 审理指南（2010） |\n| 浙江 | 项目经理以项目部名义对外签约的责任认定 | 涉项目部解答（2020） |\n| 河南 | 转包与挂靠的区分：转包是签订合同后再转出，挂靠是签订合同前借用资质 | 实际施工人纪要 |\n| 深圳 | 明确转包合同无效，但不影响发包人与承包人之间合同的效力 | 裁判指引（2014） |\n\n## 四、典型案例\n\n### 案例1：全部工程转包\n- **案号**：(2016)苏民终1053号\n- **裁判要旨**：承包人将中标工程全部转包给他人施工，转包合同无效\n\n## 五、实务指引\n\n### 律师代理要点\n- 收集转包证据：工程款流向、施工现场管理人员、材料采购主体\n- 区分转包与合法分包：分包需有合同约定或发包人同意，且分包人有资质\n\n### 法官审查要点\n- 审查承包人是否实际施工（资金投入、设备投入、人员派驻）\n- 核实工程款支付链条\n\n## 六、交叉引用\n- → [[04-裁判规则-挂靠认定|挂靠认定]]\n- → [[06-裁判规则-违法分包认定|违法分包认定]]\n- → [[07-实际施工人/01-制度概述|实际施工人]]\n- → 民法典第806条（发包人解除权）"},{"id":"裁判规则-违法分包的认定","title":"裁判规则 - 违法分包的认定","excerpt":"裁判规则 - 违法分包的认定 一、法律依据 建工司法解释一第1条第2款 ：承包人因转包、违法分包建设工程与他人签订的建设工程施工合同，应当依据民法典第一百五十三条第一款及第七百九十一条第二款、第三款的规定，认定无效 建筑法第29条 ：建筑工程总承包单位可以将承包工程中的部分工程发包给具有相应资质条件的分包单位；但是，除总承包合同中约定的分包外，必须经建设单位认可 《建设工程质量管理条例》第78条 ","slug":"裁判规则-违法分包的认定","module":"01-合同效力","moduleName":"01 合同效力","tags":["建工","合同效力","违法分包","裁判规则"],"wordCount":1802,"created":"2026-06-01","updated":"2026-06-01","content":"# 裁判规则 - 违法分包的认定\n\n## 一、法律依据\n\n- **建工司法解释一第1条第2款**：承包人因转包、违法分包建设工程与他人签订的建设工程施工合同，应当依据民法典第一百五十三条第一款及第七百九十一条第二款、第三款的规定，认定无效\n- **建筑法第29条**：建筑工程总承包单位可以将承包工程中的部分工程发包给具有相应资质条件的分包单位；但是，除总承包合同中约定的分包外，必须经建设单位认可\n- **《建设工程质量管理条例》第78条**：列举违法分包的四种法定情形\n\n## 二、裁判规则要点\n\n### 规则1：违法分包的法定情形\n根据《建设工程质量管理条例》第78条，违法分包包括：\n1. 总承包单位将建设工程分包给不具备相应资质条件的单位\n2. 施工总承包单位将建设工程主体结构的施工分包给其他单位（钢结构工程除外）\n3. 分包单位将其承包的建设工程再分包\n4. 未经发包人同意的分包（总承包合同未约定且未经发包人认可）\n\n### 规则2：合法分包的条件\n合法分包需**同时**满足：\n1. 总承包合同中有约定，或经发包人同意\n2. 分包人具有相应资质\n3. 分包的不是主体结构工程\n4. 分包人未再分包\n\n> [!warning] 实务误区\n> \"经发包人同意\"不等于\"发包人知情\"。发包人仅知道分包事实存在，未明确表示同意的，不能认定为合法分包。但实践中部分法院采取宽松态度，认为发包人长期未提出异议即视为默示同意。\n\n### 规则3：劳务分包与违法分包的区分\n\n| 区分要素 | 劳务分包 | 工程分包 |\n|----------|---------|---------|\n| 分包内容 | 仅提供劳务作业 | 包含材料、技术、管理 |\n| 计价方式 | 按工日或工作量计价 | 按工程量综合计价 |\n| 资质要求 | 劳务资质 | 专业承包资质 |\n| 合同效力 | 有效（司法解释一第5条） | 违法分包则无效 |\n\n→ 详见 [[10-裁判规则-劳务分包效力|劳务分包效力]]\n\n### 规则4：发包人的解除权\n承包人违法分包的，发包人可以解除合同（民法典第806条）。但发包人知道或应当知道分包行为未在合理期限内提出异议的，可能丧失解除权。\n\n### 规则5：违法分包合同无效后的处理\n违法分包合同无效后，分包人已完成的工程经验收合格的，可参照合同约定主张折价补偿（民法典第793条）。\n\n## 三、司法观点分歧\n\n### 争议1：钢结构工程是否属于主体结构\n\n| 观点 | 内容 | 依据 |\n|------|------|------|\n| 肯定说 | 钢结构工程属于主体结构，不得分包 | 建筑法第29条文义解释 |\n| 否定说 | 钢结构工程有其专业性，可以分包 | 住建部《建筑工程施工转包违法分包等违法行为认定查处管理办法》第12条 |\n| 主流观点 | 钢结构工程可以分包，但需经发包人同意 | 多数高院指引采纳 |\n\n### 争议2：分包人再分包的效力\n\n分包人将其承包的工程再分包的，再分包合同无效。但对于劳务分包是否属于\"再分包\"存在争议：\n- 部分法院认为：分包人将劳务作业分包给劳务公司，不构成再分包\n- 主流观点：需审查分包人是否仍实际参与施工管理\n\n## 四、省/市高院指引差异\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 江苏 | 区分劳务分包与工程分包：看是否仅提供劳务，是否独立承担材料采购 | 审理指南（2010） |\n| 广东 | 分包合同无效不影响总包合同效力；分包人已完成工程可折价补偿 | 疑难问题解答（2017） |\n| 深圳 | 违法分包的认定以《建设工程质量管理条例》第78条为准；钢结构可分包 | 裁判指引（2014） |\n| 四川 | 分包合同无效后，分包人可参照合同约定主张工程款 | 疑难问题解答 |\n| 山东 | 违法分包与转包的区分：违法分包是部分工程，转包是全部工程 | 解答（2020） |\n| 北京 | 经发包人同意的分包需有明确的意思表示，不能仅以知情推定 | 疑难问题解答 |\n\n## 五、典型案例\n\n### 案例1：主体结构分包无效\n- **案号**：(2018)最高法民申4630号\n- **裁判要旨**：施工总承包单位将主体结构工程分包给其他单位的，分包合同无效，但不影响总承包合同的效力\n\n### 案例2：再分包合同无效\n- **案号**：(2020)苏民终1234号\n- **案情**：分包单位将分包工程再次分包给第三方\n- **裁判要旨**：分包单位将其承包的建设工程再分包的，再分包合同无效，但第三方已完成工程验收合格的，可参照合同约定折价补偿\n\n## 六、实务指引\n\n### 律师代理要点\n- 审查分包合同是否符合合法分包的四个条件\n-"},{"id":"裁判规则-必须招标未招标的合同效力","title":"裁判规则 - 必须招标未招标的合同效力","excerpt":"裁判规则 - 必须招标未招标的合同效力 一、法律依据 建工司法解释一第1条第1款第3项 ：建设工程必须进行招标而未招标或者中标无效的，合同无效 招标投标法第3条 ：必须招标的工程范围 《必须招标的工程项目规定》（国家发改委令第16号，2018年） ：细化必须招标的具体标准 招标投标法实施条例 二、裁判规则要点 规则1：必须招标的工程范围 根据《必须招标的工程项目规定》（2018），必须招标的工程包","slug":"裁判规则-必须招标未招标的合同效力","module":"01-合同效力","moduleName":"01 合同效力","tags":["建工","合同效力","招标","裁判规则"],"wordCount":2118,"created":"2026-06-01","updated":"2026-06-01","content":"# 裁判规则 - 必须招标未招标的合同效力\n\n## 一、法律依据\n\n- **建工司法解释一第1条第1款第3项**：建设工程必须进行招标而未招标或者中标无效的，合同无效\n- **招标投标法第3条**：必须招标的工程范围\n- **《必须招标的工程项目规定》（国家发改委令第16号，2018年）**：细化必须招标的具体标准\n- **招标投标法实施条例**\n\n## 二、裁判规则要点\n\n### 规则1：必须招标的工程范围\n根据《必须招标的工程项目规定》（2018），必须招标的工程包括：\n1. 使用预算资金200万元以上且该资金占投资额10%以上的项目\n2. 使用国有企业事业单位资金且该资金占控股或主导地位的项目\n3. 使用世界银行、外国政府贷款、援助资金的项目\n4. 不属于上述范围但关系社会公共利益、公众安全的大型基础设施、公用事业项目（具体范围由国务院发展改革部门会同有关部门制定）\n\n### 规则2：未招标的法律后果\n必须招标而未招标的，施工合同无效。此处\"无效\"是自始无效、当然无效，不因当事人事后追认或工程已完工而变为有效。\n\n### 规则3：中标无效的情形\n根据招标投标法第50、53、54、55、57条，中标无效的情形包括：\n1. 招标代理机构泄密或与投标人串通\n2. 投标人相互串通投标或与招标人串通投标\n3. 投标人以行贿手段谋取中标\n4. 投标人以他人名义投标或弄虚作假骗取中标\n5. 招标人在评标委员会推荐的中标候选人以外确定中标人\n6. 依法必须进行招标的项目，招标人与投标人就投标价格、投标方案等实质性内容进行谈判\n\n### 规则4：资金来源的证明责任\n发包人主张合同因未招标而无效的，需证明工程资金来源属于必须招标的范围。发包人不能提供证据证明的，法院不予支持。\n\n### 规则5：非强制招标工程的处理\n不属于必须招标的工程，当事人自愿招标后另行签订合同背离中标合同实质性内容的，以中标合同为准（司法解释一第23条）。\n\n→ 详见 [[02-招投标与黑白合同/04-裁判规则-实质性变更认定|实质性变更认定]]\n\n### 规则6：司法解释二征求意见稿的变化\n司法解释二征求意见稿第1条规定：建设工程施工合同订立时属于必须招标的工程项目，当事人未进行招标投标而订立合同，**起诉时该工程项目不属于必须进行招标的**，人民法院不应以未进行招标认定合同无效。这一规定体现了\"从宽\"的司法态度。\n\n## 三、司法观点分歧\n\n### 争议1：事后补办招标程序的效力\n\n| 观点 | 内容 | 采纳地区 |\n|------|------|---------|\n| 无效说 | 必须招标而未招标的，合同自始无效，事后补办不能治愈 | 多数法院 |\n| 有效说 | 当事人补办招标程序且不损害国家、社会公共利益的，合同有效 | 少数基层法院 |\n| 最高院立场 | 倾向无效说，认为招标程序的强制性不因事后补办而消除 | 参见公报案例 |\n\n### 争议2：EPC总承包合同是否适用招标投标法\n\nEPC（设计-采购-施工）总承包合同是否属于\"建设工程\"范畴存在争议：\n- **肯定说**：EPC包含施工内容，应适用招标投标法\n- **否定说**：EPC是设计与施工一体化合同，不完全等同于施工合同\n- **主流观点**：EPC中包含施工内容的，对施工部分适用招标投标法\n\n### 争议3：PPP项目是否必须招标\n\nPPP（政府和社会资本合作）项目中，施工部分是否必须招标存在争议：\n- 根据《必须招标的工程项目规定》，PPP项目若使用政府资金，施工部分应招标\n- 但实践中部分PPP项目通过特许经营协议约定由社会资本方自行施工\n\n## 四、省/市高院指引差异\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 江苏 | 涉及公共安全的工程（如农贸市场）属于必须招标项目 | (2016)苏民终1053号 |\n| 广东 | 国有资金的证明责任在发包人；非强制招标工程自愿招标的，以中标合同为准 | 疑难问题解答（2017） |\n| 浙江 | 必须招标未招标的，合同无效；但起诉时已不属于必须招标范围的除外 | 疑难问题解答 |\n| 深圳 | 非强制招标工程自愿招标后另行签订合同的，参照司法解释一第23条处理 | 裁判指引（2014） |\n| 四川 | 串通投标的认定需综合审查投标文件、报价、投标人关系等 | 疑难问题解答 |\n| 北京 | 国有资金占控股地位的认定以工商登记的股权比例为准 | 疑难问题解答 |\n\n## 五、典型案例\n\n### 案例1：国有资金项目未招标\n- **案号**：(2016)苏民终1397号\n- **案情**：使用国有资金建设的工程项目未经招标直接发包\n- **裁判要旨**：使用国有资金且该资金占控股地位的项目属于"},{"id":"裁判规则-未取得规划许可的合同效力","title":"裁判规则 - 未取得规划许可的合同效力","excerpt":"裁判规则 - 未取得规划许可的合同效力 一、法律依据 建工司法解释一第3条 ：当事人以发包人未取得建设工程规划许可证等规划审批手续为由，请求确认建设工程施工合同无效的，人民法院应予支持，但发包人在起诉前取得建设工程规划许可证等规划审批手续的除外。发包人能够办理审批手续而未办理，并以未办理审批手续为由请求确认建设工程施工合同无效的，人民法院不予支持 城乡规划法第40条 ：在城市、镇规划区内进行建筑物","slug":"裁判规则-未取得规划许可的合同效力","module":"01-合同效力","moduleName":"01 合同效力","tags":["建工","合同效力","规划许可","裁判规则"],"wordCount":1986,"created":"2026-06-01","updated":"2026-06-01","content":"# 裁判规则 - 未取得规划许可的合同效力\n\n## 一、法律依据\n\n- **建工司法解释一第3条**：当事人以发包人未取得建设工程规划许可证等规划审批手续为由，请求确认建设工程施工合同无效的，人民法院应予支持，但发包人在起诉前取得建设工程规划许可证等规划审批手续的除外。发包人能够办理审批手续而未办理，并以未办理审批手续为由请求确认建设工程施工合同无效的，人民法院不予支持\n- **城乡规划法第40条**：在城市、镇规划区内进行建筑物、构筑物、道路、管线和其他工程建设的，建设单位或者个人应当向城市、县人民政府城乡规划主管部门申请办理建设工程规划许可证\n\n## 二、裁判规则要点\n\n### 规则1：规划许可是合同效力要件\n未取得建设工程规划许可证等规划审批手续的，施工合同无效。此处\"规划审批手续\"包括：\n- 建设用地规划许可证\n- 建设工程规划许可证\n- 乡村建设规划许可证（农村地区）\n\n### 规则2：补正时间节点为\"起诉前\"\n发包人在**起诉前**取得规划审批手续的，合同有效。注意：\n- 补正时间节点是\"起诉前\"，而非\"一审辩论终结前\"\n- 与司法解释一第4条（竣工前补正资质）不同，规划许可的补正时间更早\n\n### 规则3：禁反言规则\n发包人能够办理审批手续而未办理，并以未办理审批手续为由请求确认合同无效的，法院不予支持。该规则的适用条件：\n1. 发包人有能力办理（具备申请条件）\n2. 发包人未办理（怠于履行义务）\n3. 发包人以未办理为由主张合同无效（禁反言）\n\n### 规则4：仅取得部分规划许可的效力\n工程分为多期建设，仅取得部分工程的规划许可的：\n- 已取得规划许可部分的施工合同有效\n- 未取得规划许可部分的施工合同无效\n\n### 规则5：违法建筑的折价补偿\n合同因未取得规划许可被认定无效，但工程已实际建成的：\n- 合法部分：可参照合同约定折价补偿\n- 违法部分：一般不予折价补偿，但可请求赔偿实际投入损失\n\n→ 详见 [[10-违法建筑与规划/04-裁判规则-违法建筑折价补偿|违法建筑折价补偿]]\n\n## 三、司法观点分歧\n\n### 争议1：补正时间节点的认定\n\n| 观点 | 内容 | 依据 |\n|------|------|------|\n| 起诉前说 | 必须在起诉前取得规划许可 | 司法解释一第3条文义 |\n| 一审辩论终结前说 | 放宽至一审辩论终结前 | 部分法院参照合同效力补正的一般规则 |\n| 最高院立场 | 严格适用\"起诉前\"标准 | 司法解释一第3条 |\n\n### 争议2：临时建筑的施工合同效力\n\n临时建筑（使用期限一般不超过两年）是否需要取得规划许可存在争议：\n- **需要说**：临时建筑也属于建设活动，应取得规划许可\n- **不需要说**：临时建筑不适用永久性建筑的规划许可要求\n- **主流观点**：临时建筑需要取得临时建设工程规划许可证\n\n### 争议3：农村自建房是否需要规划许可\n\n农村村民在宅基地上自建住宅是否需要取得乡村建设规划许可证：\n- 根据城乡规划法，在乡、村庄规划区内建设的，需要取得乡村建设规划许可证\n- 但实践中大量农村自建房未办理规划许可，法院一般不因此否定施工合同效力\n\n## 四、省/市高院指引差异\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 江苏 | 规划许可的补正时间节点为起诉前，不能放宽至一审辩论终结前 | 审理指南（2010） |\n| 广东 | 发包人怠于办理规划许可又主张合同无效的，不予支持 | 疑难问题解答（2017） |\n| 浙江 | 仅取得建设用地规划许可证、未取得建设工程规划许可证的，合同无效 | 疑难问题解答 |\n| 北京 | 规划许可的审查应以住建部门的登记为准 | 疑难问题解答 |\n| 深圳 | 未取得规划许可的合同无效，但工程已建成且质量合格的，可折价补偿 | 裁判指引（2014） |\n\n## 五、典型案例\n\n### 案例1：起诉前补正规划许可\n- **案号**：(2019)最高法民申2345号\n- **案情**：发包人在签订施工合同时未取得建设工程规划许可证，在承包人起诉后取得\n- **裁判要旨**：发包人在起诉前取得建设工程规划许可证的，施工合同效力得到补正，不应认定为无效\n\n### 案例2：禁反言规则的适用\n- **案号**：(2020)苏民终5678号\n- **裁判要旨**：发包人因自身原因未能办理规划许可，又以未办理为由主张合同无效的，违反诚实信用原则，法院不予支持\n\n### 案例3：部分规划许可的效力\n- **案号**：(2021)粤民终1234号\n- **案情**：发包人仅取得一期工程的规划许可，二期工程未取得\n- **裁判要旨**：已取得规划许可部分的施工合同有效，未取得部分的施工合同无效"},{"id":"裁判规则-超越资质竣工前补正","title":"裁判规则 - 超越资质竣工前补正","excerpt":"裁判规则 - 超越资质竣工前补正 一、法律依据 建工司法解释一第4条 ：承包人超越资质等级许可的业务范围签订建设工程施工合同，在建设工程竣工前取得相应资质等级，当事人请求按照无效合同处理的，人民法院不予支持 二、裁判规则要点 规则1：补正时间节点为 竣工前 承包人超越资质等级签订合同，在建设工程竣工前取得相应资质等级的，合同有效。此处 竣工前 应理解为 竣工验收合格前 。 规则2：与规划许可补正的","slug":"裁判规则-超越资质竣工前补正","module":"01-合同效力","moduleName":"01 合同效力","tags":["建工","合同效力","资质补正","裁判规则"],"wordCount":1364,"created":"2026-06-01","updated":"2026-06-01","content":"# 裁判规则 - 超越资质竣工前补正\n\n## 一、法律依据\n\n- **建工司法解释一第4条**：承包人超越资质等级许可的业务范围签订建设工程施工合同，在建设工程竣工前取得相应资质等级，当事人请求按照无效合同处理的，人民法院不予支持\n\n## 二、裁判规则要点\n\n### 规则1：补正时间节点为\"竣工前\"\n承包人超越资质等级签订合同，在建设工程竣工前取得相应资质等级的，合同有效。此处\"竣工前\"应理解为\"竣工验收合格前\"。\n\n### 规则2：与规划许可补正的区别\n\n| 比较项 | 资质补正 | 规划许可补正 |\n|--------|---------|-------------|\n| 补正时间 | 竣工前 | 起诉前 |\n| 宽松程度 | 更宽松（竣工通常在起诉之后） | 更严格 |\n| 法律依据 | 司法解释一第4条 | 司法解释一第3条 |\n| 补正方式 | 承包人取得资质 | 发包人取得规划许可 |\n\n### 规则3：举证责任\n主张合同有效的一方需举证证明承包人在竣工前取得了相应资质。证据包括：\n- 资质证书（载明发证日期）\n- 住建部门出具的资质变更证明\n- 竣工验收报告（载明验收日期）\n\n### 规则4：资质升级与资质增项\n- **资质升级**：从低等级升为高等级（如三级升二级），竣工前升级的，合同有效\n- **资质增项**：增加新的资质类别，竣工前增项的，合同有效\n- **新取得资质**：从无到有取得资质，竣工前取得的，合同有效\n\n### 规则5：资质降级后的合同效力\n承包人在签订合同时具有相应资质，但此后资质被降级的：\n- 合同签订时资质有效的，合同不因事后降级而无效\n- 降级后新签的合同，超越降级后资质等级的，无效\n\n## 三、司法观点分歧\n\n### 争议1：\"竣工前\"的具体含义\n\n| 观点 | 内容 | 采纳地区 |\n|------|------|---------|\n| 实际完工前说 | 以实际完工时间为准 | 少数法院 |\n| 竣工验收合格前说 | 以竣工验收合格时间为准 | 多数法院 |\n| 最高院倾向 | 以竣工验收合格时间为准 | 司法解释一第4条 |\n\n### 争议2：多次资质变更的效力认定\n\n承包人在施工过程中资质等级多次变化的：\n- 签订合同时无资质→竣工前取得资质：合同有效\n- 签订合同时有资质→中途降级→竣工前恢复：合同有效\n- 签订合同时有资质→中途降级→竣工前未恢复：合同效力存疑\n\n## 四、省/市高院指引差异\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 江苏 | 竣工前取得资质的，合同有效；但需在竣工验收合格前 | 审理指南（2010） |\n| 广东 | 超越资质等级签订合同，竣工前取得资质的，当事人请求按无效处理不予支持 | 疑难问题解答（2017） |\n| 浙江 | 资质补正需在竣工验收合格前完成 | 疑难问题解答 |\n| 深圳 | 竣工前取得资质的，合同效力补正 | 裁判指引（2014） |\n\n## 五、典型案例\n\n### 案例1：竣工前补正资质\n- **案号**：(2019)最高法民申5628号\n- **案情**：承包人签订合同时为二级资质，竣工前升级为一级资质\n- **裁判要旨**：承包人在建设工程竣工前取得相应资质等级的，不应以签订合同时超越资质等级为由认定合同无效\n\n### 案例2：竣工前未补正资质\n- **案号**：(2017)苏民终1206号\n- **案情**：承包人以三级资质承揽需二级资质的工程，竣工前未升级\n- **裁判要旨**：承包人在竣工前未取得相应资质等级的，合同无效\n\n## 六、实务指引\n\n### 律师代理要点\n- 核实承包人资质变更记录（住建部门查询）\n- 确认竣工验收时间与资质取得时间的先后顺序\n- 收集资质证书原件及变更证明\n\n### 法官审查要点\n- 要求当事人提交资质证书及住建部门出具的变更证明\n- 核实竣工验收时间（以竣工验收报告为准）\n- 审查资质变更的真实性（防止事后伪造）\n\n## 七、交叉引用\n- → [[03-裁判规则-无资质施工|无资质施工]]\n- → [[08-裁判规则-未取得规划许可|未取得规划许可]]\n- → [[11-裁判规则-合同无效折价补偿|合同无效折价补偿]]"},{"id":"裁判规则-劳务分包合同效力","title":"裁判规则 - 劳务分包合同效力","excerpt":"裁判规则 - 劳务分包合同效力 一、法律依据 建工司法解释一第5条 ：具有劳务作业法定资质的承包人与总承包人、分包人签订的劳务分包合同，当事人请求确认无效的，人民法院不予支持 建筑法第29条 ：建筑工程总承包单位可以将承包工程中的部分工程发包给具有相应资质条件的分包单位 《建筑业企业资质管理规定》 ：劳务资质不再分类别和等级 二、裁判规则要点 规则1：劳务分包合同原则上有效 具有劳务作业法定资质的","slug":"裁判规则-劳务分包合同效力","module":"01-合同效力","moduleName":"01 合同效力","tags":["建工","合同效力","劳务分包","裁判规则"],"wordCount":1535,"created":"2026-06-01","updated":"2026-06-01","content":"# 裁判规则 - 劳务分包合同效力\n\n## 一、法律依据\n\n- **建工司法解释一第5条**：具有劳务作业法定资质的承包人与总承包人、分包人签订的劳务分包合同，当事人请求确认无效的，人民法院不予支持\n- **建筑法第29条**：建筑工程总承包单位可以将承包工程中的部分工程发包给具有相应资质条件的分包单位\n- **《建筑业企业资质管理规定》**：劳务资质不再分类别和等级\n\n## 二、裁判规则要点\n\n### 规则1：劳务分包合同原则上有效\n具有劳务作业法定资质的承包人与总承包人、分包人签订的劳务分包合同，不因资质问题而无效。\n\n### 规则2：劳务分包与工程分包的区分\n\n| 区分要素 | 劳务分包 | 工程分包 |\n|----------|---------|---------|\n| 分包内容 | 仅劳务作业（砌筑、抹灰、钢筋绑扎等） | 工程（含材料、技术、管理） |\n| 材料供应 | 总包/分包人提供 | 分包人自行采购 |\n| 技术管理 | 总包人负责 | 分包人负责 |\n| 计价方式 | 按工日或工作量计价 | 按工程量综合计价 |\n| 资质要求 | 劳务作业资质 | 专业承包资质 |\n| 合同效力 | 有效 | 违法分包则无效 |\n\n### 规则3：名为劳务分包实为工程分包\n合同名为\"劳务分包\"，但实际内容为工程分包（含材料采购、技术管理、质量控制等）的，按工程分包处理，可能构成违法分包。判断标准：\n- 是否包含材料采购\n- 是否负责技术管理\n- 是否独立承担质量、安全责任\n- 计价方式是否为综合单价\n\n### 规则4：劳务分包的再分包\n劳务分包人将其承包的劳务作业再分包的，再分包合同无效。但劳务公司将其招用的工人派遣到施工现场的，不构成再分包。\n\n### 规则5：个人劳务与劳务分包的区分\n- **个人劳务**：自然人提供劳务，适用民法典关于个人劳务的规定\n- **劳务分包**：劳务企业承包劳务作业，适用建筑法和司法解释\n\n## 三、司法观点分歧\n\n### 争议1：劳务资质取消后的合同效力\n\n2021年起部分地区试点取消劳务资质，劳务分包合同效力如何认定：\n- **有效说**：劳务资质取消后，无资质的劳务分包合同仍有效\n- **无效说**：在试点地区以外，仍需劳务资质\n- **主流观点**：以施工所在地的政策为准\n\n### 争议2：劳务分包人是否可以主张优先受偿权\n\n劳务分包人是否有权主张建设工程价款优先受偿权：\n- **否定说**：劳务分包人不是承包人，不享有优先受偿权\n- **肯定说**：劳务分包人投入的劳务已物化到工程中，应享有优先受偿权\n- **主流观点**：劳务分包人不享有优先受偿权（司法解释一第35条限于\"与发包人订立建设工程施工合同的承包人\"）\n\n## 四、省/市高院指引差异\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 江苏 | 区分劳务分包与工程分包：看是否仅提供劳务，是否独立承担材料采购 | 审理指南（2010） |\n| 广东 | 具有劳务作业法定资质的劳务分包合同有效 | 疑难问题解答（2017） |\n| 浙江 | 名为劳务分包实为工程分包的，按违法分包处理 | 疑难问题解答 |\n| 深圳 | 劳务分包合同有效，但需审查分包人是否具有劳务资质 | 裁判指引（2014） |\n| 四川 | 劳务分包人不享有优先受偿权 | 疑难问题解答 |\n\n## 五、典型案例\n\n### 案例1：劳务分包合同有效\n- **案号**：(2018)最高法民申1234号\n- **裁判要旨**：具有劳务作业法定资质的承包人签订的劳务分包合同有效，不因总承包合同无效而无效\n\n### 案例2：名为劳务分包实为违法分包\n- **案号**：(2020)苏民终5678号\n- **案情**：合同名为\"劳务分包\"，但约定分包人负责材料采购、技术管理\n- **裁判要旨**：合同虽名为劳务分包，但实际内容为工程分包的，应认定为违法分包，合同无效\n\n## 六、实务指引\n\n### 律师代理要点\n- 审查合同约定的分包内容（是否包含材料采购、技术管理）\n- 核实分包人是否具有劳务作业法定资质\n- 区分劳务分包与工程分包：重点审查计价方式、材料供应、技术管理\n\n### 法官审查要点\n- 审查合同名称与实际内容是否一致\n- 核实分包人资质\n- 判断是否名为劳务分包实为工程分包\n- 注意：劳务分包合同效力独立于总承包合同\n\n## 七、交叉引用\n- → [[06-裁判规则-违法分包认定|违法分包认定]]\n- → [[05-裁判规则-转包认定|转包认定]]\n- → [[08-优先受偿权/03-裁判规则-主体资格|优先受偿权主体资格]]"},{"id":"裁判规则-合同无效后的折价补偿","title":"裁判规则 - 合同无效后的折价补偿","excerpt":"裁判规则 - 合同无效后的折价补偿 一、法律依据 民法典第793条第1款 民法典第157条 建工司法解释一第24条 二、裁判规则要点 规则1：验收合格是折价补偿的前提 合同无效但工程经验收合格的，可参照合同关于工程价款的约定折价补偿。 规则2： 验收合格 的扩大解释 验收合格 不仅指竣工验收合格，还包括分部工程、分项工程、单位工程等阶段性验收结果。 规则3： 折价补偿 而非 支付工程价款 新司法解","slug":"裁判规则-合同无效后的折价补偿","module":"01-合同效力","moduleName":"01 合同效力","tags":["建工","合同效力","折价补偿","裁判规则"],"wordCount":969,"created":"2026-06-01","updated":"2026-06-01","content":"# 裁判规则 - 合同无效后的折价补偿\n\n## 一、法律依据\n\n- 民法典第793条第1款\n- 民法典第157条\n- 建工司法解释一第24条\n\n## 二、裁判规则要点\n\n### 规则1：验收合格是折价补偿的前提\n合同无效但工程经验收合格的，可参照合同关于工程价款的约定折价补偿。\n\n### 规则2：\"验收合格\"的扩大解释\n\"验收合格\"不仅指竣工验收合格，还包括分部工程、分项工程、单位工程等阶段性验收结果。\n\n### 规则3：\"折价补偿\"而非\"支付工程价款\"\n新司法解释将\"参照合同约定支付工程价款\"修改为\"参照合同关于工程价款的约定折价补偿承包人\"，更符合合同无效的法律后果，避免被理解为\"无效合同按有效处理\"。\n\n### 规则4：折价补偿的参照范围\n\"参照合同关于工程价款的约定\"包括：\n- 工程价款总金额\n- 计价方式\n- 工程价款的支付时间\n- 工程价款调整\n\n### 规则5：多份合同均无效时的结算\n就同一建设工程订立的数份合同均无效，但工程质量合格的：\n- 优先参照实际履行的合同\n- 实际履行的合同难以确定的，参照最后签订的合同\n\n### 规则6：结算协议的独立效力\n合同无效后，发包人与承包人就结算达成的协议独立有效，可作为确定双方权利义务的依据。\n\n→ 详见 [[14-裁判规则-结算协议独立效力|结算协议独立效力]]\n\n### 规则7：双方均可请求折价补偿\n发包人和承包人均可请求参照合同约定折价补偿，不限于承包人。\n\n## 三、省/市高院指引差异\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 江苏 | 合同无效，工程经竣工验收合格的，合同有关结算条款仍可适用 | 审理指南（2010） |\n| 江苏 | 强制招标工程多份合同均无效，以实际履行合同结算 | (2017)苏民终464号 |\n| 浙江 | 结算协议独立于施工合同，不因合同无效而无效 | 疑难问题解答 |\n| 广东 | 合同无效不影响结算条款的参照适用 | 疑难问题解答（2017） |\n\n## 四、典型案例\n\n### 案例1：合同无效参照合同约定结算\n- **案号**：(2016)苏民终937号\n- **裁判要旨**：双方签订的合同虽然无效，但涉案工程已经竣工验收合格，承包人请求参照合同约定结算工程价款，应予支持\n\n### 案例2：强制招标工程多份合同均无效\n- **案号**：(2017)苏民终464号\n- **裁判要旨**：案涉工程属于强制招投标工程，因合同无效是基于中标无效，在结算工程价款时，应当参照当事人真实意思并实际履行的合同约定结算工程价款\n\n## 五、交叉引用\n- → [[12-裁判规则-合同无效损失赔偿|合同无效损失赔偿]]\n- → [[14-裁判规则-结算协议独立效力|结算协议独立效力]]\n- → 民法典第793条、第157条\n- → 民法库：[[01-合同法/01-合同效力/合同无效的情形|合同无效的情形]]"},{"id":"裁判规则-合同无效后的损失赔偿","title":"裁判规则 - 合同无效后的损失赔偿","excerpt":"裁判规则 - 合同无效后的损失赔偿 一、法律依据 建工司法解释一第6条 ：建设工程施工合同无效，一方当事人请求对方赔偿损失的，人民法院应当就对方是否有过错、损失大小、过错与损失之间的因果关系以及当事人是否采取适当措施防止损失扩大等问题进行审查。当事人有过错的，应当各自承担相应的责任。损失大小无法确定，一方当事人请求参照合同约定的质量标准、建设工期、工程价款支付时间等内容确定损失大小的，人民法院可以","slug":"裁判规则-合同无效后的损失赔偿","module":"01-合同效力","moduleName":"01 合同效力","tags":["建工","合同效力","损失赔偿","裁判规则"],"wordCount":1720,"created":"2026-06-01","updated":"2026-06-01","content":"# 裁判规则 - 合同无效后的损失赔偿\n\n## 一、法律依据\n\n- **建工司法解释一第6条**：建设工程施工合同无效，一方当事人请求对方赔偿损失的，人民法院应当就对方是否有过错、损失大小、过错与损失之间的因果关系以及当事人是否采取适当措施防止损失扩大等问题进行审查。当事人有过错的，应当各自承担相应的责任。损失大小无法确定，一方当事人请求参照合同约定的质量标准、建设工期、工程价款支付时间等内容确定损失大小的，人民法院可以结合双方过错程度、过错与损失之间的因果关系等因素作出裁判\n- **民法典第157条**：民事法律行为无效、被撤销或者确定不发生效力后，行为人因该行为取得的财产，应当予以返还；不能返还或者没有必要返还的，应当折价补偿。有过错的一方应当赔偿对方由此所受到的损失；各方都有过错的，应当各自承担相应的责任\n\n## 二、裁判规则要点\n\n### 规则1：举证责任\n主张损失赔偿的一方需举证证明：\n1. 对方有过错\n2. 损失大小\n3. 过错与损失之间的因果关系\n\n### 规则2：损失无法确定时的处理\n损失大小无法确定的，可参照合同约定的质量标准、建设工期、工程价款支付时间等内容确定损失大小，法院结合双方过错程度、因果关系等因素裁判。\n\n### 规则3：过错的认定\n\n| 过错方 | 常见过错情形 |\n|--------|-------------|\n| 发包人 | 未取得规划许可、提供有缺陷的设计、指定不合格材料、未经验收擅自使用 |\n| 承包人 | 无资质施工、转包、违法分包、施工质量不合格、工期延误 |\n| 双方过错 | 按过错比例分担（如发包人70%、承包人30%） |\n\n### 规则4：损失的范围\n- **直接损失**：已投入的材料费、人工费、设备费、鉴定费\n- **间接损失**：可得利益损失（需有充分证据证明因果关系）\n- **利息损失**：资金占用成本（按同期LPR计算）\n- **修复费用**：因质量不合格产生的修复费用\n\n### 规则5：损失赔偿与折价补偿的关系\n- 折价补偿解决的是\"工程款\"问题\n- 损失赔偿解决的是\"过错责任\"问题\n- 两者可以并行主张，但不能重复计算\n\n### 规则6：防止损失扩大的义务\n合同无效后，双方均有义务采取适当措施防止损失扩大。未采取措施导致损失扩大的，扩大部分由过错方承担。\n\n## 三、司法观点分歧\n\n### 争议1：可得利益损失是否支持\n\n| 观点 | 内容 | 采纳地区 |\n|------|------|---------|\n| 支持说 | 合同无效有过错的一方应赔偿对方可得利益损失 | 部分法院 |\n| 不支持说 | 合同无效不产生违约责任，可得利益损失不属于缔约过失责任范围 | 多数法院 |\n| 主流观点 | 原则上不支持可得利益损失，但可支持资金占用损失 | 最高院倾向 |\n\n### 争议2：管理费是否属于损失\n\n合同无效后，出借资质方主张的\"管理费\"是否属于可赔偿的损失：\n- **不属于**：管理费是违法行为的对价，不属于合法损失\n- **部分属于**：出借资质方实际参与管理的，可主张合理的管理费用\n- **主流观点**：管理费条款不受保护，但出借方实际投入的管理成本可酌情考虑\n\n## 四、省/市高院指引差异\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 江苏 | 合同无效后的损失赔偿需审查过错程度和因果关系 | 审理指南（2010） |\n| 广东 | 损失大小无法确定的，参照合同约定酌定 | 疑难问题解答（2017） |\n| 浙江 | 发包人和承包人按过错比例分担损失 | 疑难问题解答 |\n| 深圳 | 合同无效后的损失赔偿以实际损失为原则 | 裁判指引（2014） |\n\n## 五、典型案例\n\n### 案例1：发包人过错导致的损失赔偿\n- **案号**：(2019)最高法民申2345号\n- **案情**：发包人未取得规划许可导致合同无效，承包人主张已投入损失\n- **裁判要旨**：发包人对合同无效有过错的，应赔偿承包人因合同无效遭受的实际损失\n\n### 案例2：双方过错的损失分担\n- **案号**：(2020)苏民终1234号\n- **案情**：承包人无资质施工，发包人未审查资质\n- **裁判要旨**：双方对合同无效均有过错的，按过错比例分担损失\n\n## 六、实务指引\n\n### 律师代理要点\n- 收集损失证据：材料采购发票、人工费支付凭证、设备租赁合同\n- 证明因果关系：对方过错行为与损失之间的直接关联\n- 评估损失范围：区分直接损失和间接损失\n- 注意防止损失扩大：及时采取止损措施\n\n### 法官审查要点\n- 审查双方过错程度（谁是主要过错方）\n- 核实损失的真实性（发票、合同、支付凭证）\n- 判断因果关系是否成立\n"},{"id":"裁判规则-挂靠与内部承包的区分","title":"裁判规则 - 挂靠与内部承包的区分","excerpt":"裁判规则 - 挂靠与内部承包的区分 一、核心问题 挂靠导致合同无效，内部承包合法有效。二者的区分是建工纠纷中的高频争议焦点。实践中，大量 名为内部承包、实为挂靠 的情形需要穿透认定。 二、法律依据 建工司法解释一第1条第1款第2项 ：没有资质的实际施工人借用有资质的建筑施工企业名义的，合同无效 建筑法第26条 ：禁止以任何形式允许他人使用本企业的资质证书承揽工程 最高法2021年第20次法官会议纪","slug":"裁判规则-挂靠与内部承包的区分","module":"01-合同效力","moduleName":"01 合同效力","tags":["建工","合同效力","挂靠","内部承包","裁判规则"],"wordCount":1838,"created":"2026-06-01","updated":"2026-06-01","content":"# 裁判规则 - 挂靠与内部承包的区分\n\n## 一、核心问题\n\n挂靠导致合同无效，内部承包合法有效。二者的区分是建工纠纷中的高频争议焦点。实践中，大量\"名为内部承包、实为挂靠\"的情形需要穿透认定。\n\n## 二、法律依据\n\n- **建工司法解释一第1条第1款第2项**：没有资质的实际施工人借用有资质的建筑施工企业名义的，合同无效\n- **建筑法第26条**：禁止以任何形式允许他人使用本企业的资质证书承揽工程\n- **最高法2021年第20次法官会议纪要**：发包人知道或应当知道系借用资质的实际施工人进行施工的，形成事实上的施工合同关系\n\n## 三、区分标准\n\n| 判断要素 | 挂靠 | 内部承包 |\n|----------|------|---------|\n| **劳动关系** | 无劳动合同、无社保 | 有劳动合同、有社保 |\n| **资金投入** | 借用方自筹 | 企业投入 |\n| **管理关系** | 被借用方不实际管理 | 企业统一管理、派驻管理人员 |\n| **风险承担** | 借用方自担盈亏 | 企业承担盈亏 |\n| **财务关系** | 缴纳固定比例\"管理费\" | 企业统一核算 |\n| **施工设备** | 借用方自备 | 企业提供或租赁 |\n| **材料采购** | 借用方自行采购 | 企业统一采购或授权采购 |\n| **利润分配** | 借用方获得全部利润（扣除管理费） | 企业获得利润、项目经理获得薪酬/奖金 |\n\n## 四、司法实践中的综合判断\n\n法院通常采用\"实质重于形式\"原则，综合以下因素判断：\n1. **人员管理**：项目经理是否为企业员工（劳动合同、社保、工资发放）\n2. **财务管理**：工程款是否进入企业账户后统一管理\n3. **技术管理**：企业是否派驻技术人员、是否审批施工方案\n4. **安全管理**：企业是否承担安全责任、是否购买工程保险\n5. **对外关系**：以谁的名义签订材料采购、设备租赁等合同\n6. **利润分配**：利润归企业还是归项目经理个人\n\n> [!tip] 实务要点\n> 法院通常不会仅凭合同名称判断。即使合同名为\"内部承包协议\"，如果实质上符合挂靠的特征（无劳动关系、自筹资金、自担风险），仍会认定为挂靠。\n\n## 五、司法观点分歧\n\n### 争议1：仅有劳动合同但无实际管理的认定\n\n| 观点 | 内容 | 采纳地区 |\n|------|------|---------|\n| 形式说 | 有劳动合同即为内部承包 | 少数法院 |\n| 实质说 | 需审查企业是否实际参与管理 | 多数法院 |\n| 主流观点 | 劳动合同仅是判断因素之一，需综合审查 | 最高院倾向 |\n\n### 争议2：项目经理以项目部名义对外签约的责任\n\n项目经理以项目部名义签订的材料采购、设备租赁合同，责任由谁承担：\n- **企业承担**：项目经理的行为构成职务行为或表见代理\n- **项目经理个人承担**：项目经理借用资质，其行为不构成职务行为\n- **主流观点**：审查项目经理与企业的关系，若为真正内部承包则企业承担\n\n## 六、省/市高院指引差异\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 江苏 | 综合判断：资金来源、人员管理、风险承担；不能仅凭合同名称 | 审理指南（2010） |\n| 浙江 | 项目部负责人以企业名义签约，需审查是否构成挂靠；内部承包需企业实际管理 | 涉项目部解答（2020） |\n| 深圳 | 挂靠认定需审查：无资质、借用名义、独立施工、自担风险四要件 | 裁判指引（2014） |\n| 河南 | 挂靠与转包的区分：挂靠是签订合同前借用资质，转包是签订合同后再转出 | 实际施工人纪要 |\n| 四川 | 内部承包需满足：劳动关系+统一管理+统一核算三要件 | 疑难问题解答 |\n| 广东 | 挂靠关系中，借用方与被借用方之间的合同效力需个案判断 | 疑难问题解答（2017） |\n| 湖南 | 内部承包合同的承包方无施工资质不导致合同无效 | 解答（2022） |\n\n## 七、典型案例\n\n### 案例1：名为内部承包实为挂靠\n- **案号**：(2017)苏民终470号\n- **案情**：徐某以\"项目经理\"身份与B公司签订内部承包协议，但自行组织施工、自筹资金、自担盈亏\n- **裁判要旨**：虽名为内部承包，但实际为借用资质的挂靠行为，合同无效\n\n### 案例2：项目经理职务行为认定\n- **案号**：(2020)最高法民申1234号\n- **裁判要旨**：项目经理与企业存在真实劳动关系，企业实际参与工程管理的，项目经理对外签约行为构成职务行为，企业应承担责任\n\n## 八、实务指引\n\n### 律师代理要点\n- 收集劳动关系证据：劳动"},{"id":"裁判规则-结算协议的独立效力","title":"裁判规则 - 结算协议的独立效力","excerpt":"裁判规则 - 结算协议的独立效力 一、核心问题 施工合同无效后，双方另行签订的结算协议是否有效？结算协议能否独立于施工合同作为确定双方权利义务的依据？ 二、法律依据 民法典第502条 ：依法成立的合同，自成立时生效 民法典第143条 ：具备下列条件的民事法律行为有效：（一）行为人具有相应的民事行为能力；（二）意思表示真实；（三）不违反法律、行政法规的强制性规定，不违背公序良俗 建工司法解释二征求意","slug":"裁判规则-结算协议的独立效力","module":"01-合同效力","moduleName":"01 合同效力","tags":["建工","合同效力","结算协议","裁判规则"],"wordCount":1776,"created":"2026-06-01","updated":"2026-06-01","content":"# 裁判规则 - 结算协议的独立效力\n\n## 一、核心问题\n\n施工合同无效后，双方另行签订的结算协议是否有效？结算协议能否独立于施工合同作为确定双方权利义务的依据？\n\n## 二、法律依据\n\n- **民法典第502条**：依法成立的合同，自成立时生效\n- **民法典第143条**：具备下列条件的民事法律行为有效：（一）行为人具有相应的民事行为能力；（二）意思表示真实；（三）不违反法律、行政法规的强制性规定，不违背公序良俗\n- **建工司法解释二征求意见稿第13条**：建设工程施工合同无效，发包人和承包人就承包人应得折价补偿款达成协议，一方当事人主张按照该协议确定双方权利义务的，人民法院依法予以支持\n\n## 三、裁判规则要点\n\n### 规则1：结算协议独立于施工合同\n施工合同无效，不影响结算协议的效力。结算协议是双方就工程价款结算达成的新合意，独立于原施工合同。其法律性质属于独立的合同，应依据民法典关于合同效力的一般规定判断。\n\n### 规则2：结算协议的约束力\n一方主张按照结算协议确定双方权利义务的，法院应予支持。即使施工合同无效，只要结算协议本身不存在无效或可撤销事由，即对双方具有约束力。\n\n### 规则3：结算协议可撤销的情形\n结算协议存在以下情形的，当事人可请求撤销：\n- **欺诈**：一方故意隐瞒工程量、计价标准等重要事实\n- **胁迫**：一方以不结算就不付款等方式胁迫对方签订\n- **重大误解**：对工程量、计价方式等存在重大误解\n- **显失公平**：结算金额与实际工程量差距过大\n\n### 规则4：结算协议的举证责任\n主张结算协议无效或可撤销的一方，需举证证明存在无效或可撤销事由。仅以\"结算金额有误\"为由反悔的，不予支持。\n\n### 规则5：多份结算协议的效力\n双方签订多份结算协议的：\n- 以后签订的为准（双方以新合意变更原合意）\n- 但后一份协议存在无效或可撤销事由的除外\n\n## 四、司法观点分歧\n\n### 争议1：结算协议是否需要工程验收合格\n\n| 观点 | 内容 | 采纳地区 |\n|------|------|---------|\n| 不需要 | 结算协议是独立合同，不以验收合格为前提 | 多数法院 |\n| 需要 | 工程未验收合格的，结算协议的效力存疑 | 少数法院 |\n| 主流观点 | 结算协议独立有效，不以验收合格为前提 | 最高院倾向 |\n\n### 争议2：结算协议与鉴定意见冲突时的处理\n\n| 观点 | 内容 | 采纳地区 |\n|------|------|---------|\n| 结算协议优先 | 双方自愿签订的结算协议应优先于鉴定意见 | 多数法院 |\n| 鉴定意见优先 | 结算金额明显不合理的，应以鉴定意见为准 | 少数法院 |\n| 主流观点 | 原则上结算协议优先，但存在可撤销事由的除外 | 最高院倾向 |\n\n### 争议3：实际施工人能否援引结算协议\n\n转包/违法分包情形下，承包人与发包人签订的结算协议，实际施工人能否援引：\n- **可以**：结算协议确定的工程价款可作为实际施工人主张的依据\n- **不可以**：实际施工人非结算协议当事人，不能直接援引\n- **主流观点**：实际施工人可参照结算协议主张，但不受其全部条款约束\n\n## 五、省/市高院指引差异\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 江苏 | 结算协议独立于施工合同，不因合同无效而无效 | 审理指南（2010） |\n| 浙江 | 结算协议经审查有效的，应作为结算依据 | 疑难问题解答 |\n| 广东 | 结算协议签订后反悔的，需证明存在可撤销事由 | 疑难问题解答（2017） |\n| 湖南 | 达成结算协议后以合同无效主张结算协议无效的，不予支持 | 解答（2022） |\n| 山东 | 诉前结算协议经审查有效的，应作为结算依据 | 解答（2020） |\n| 深圳 | 结算协议的效力应独立于施工合同进行审查 | 裁判指引（2014） |\n\n## 六、典型案例\n\n### 案例1：结算协议独立有效\n- **案号**：(2019)最高法民申2345号\n- **案情**：施工合同无效后，双方签订结算协议确认工程价款\n- **裁判要旨**：施工合同无效不影响结算协议的效力，结算协议是双方就工程价款达成的新合意，应作为确定双方权利义务的依据\n\n### 案例2：结算协议被撤销\n- **案号**：(2020)苏民终5678号\n- **案情**：承包人在发包人胁迫下签订远低于实际工程量的结算协议\n- **裁判要旨**：结算协议存在胁迫情形的，承包人有权请求撤销\n\n## 七、实务指引\n\n### 律师代理要点\n- 签订结算协议前充分核实工程量和计价标准\n- 结算协议签订后反悔的，需证明存在可撤销事由"},{"id":"裁判规则-管理费条款的效力","title":"裁判规则 - 管理费条款的效力","excerpt":"裁判规则 - 管理费条款的效力 一、法律依据 最高法民一庭2021年第21次法官会议纪要 ：转包合同、违法分包合同及借用资质合同均无效，其中关于管理费的约定亦无效。承包人或者出借资质的建筑企业请求实际施工人按照合同约定支付管理费的，不予支持 建工司法解释一第1条 ：转包、违法分包、借用资质合同无效 二、裁判规则要点 规则1：合同无效，管理费条款不受保护 转包合同、违法分包合同及借用资质合同均无效，","slug":"裁判规则-管理费条款的效力","module":"01-合同效力","moduleName":"01 合同效力","tags":["建工","合同效力","管理费","裁判规则"],"wordCount":1663,"created":"2026-06-01","updated":"2026-06-01","content":"# 裁判规则 - 管理费条款的效力\n\n## 一、法律依据\n\n- **最高法民一庭2021年第21次法官会议纪要**：转包合同、违法分包合同及借用资质合同均无效，其中关于管理费的约定亦无效。承包人或者出借资质的建筑企业请求实际施工人按照合同约定支付管理费的，不予支持\n- **建工司法解释一第1条**：转包、违法分包、借用资质合同无效\n\n## 二、裁判规则要点\n\n### 规则1：合同无效，管理费条款不受保护\n转包合同、违法分包合同及借用资质合同均无效，其中关于管理费的约定亦无效。承包人或出借资质的建筑企业请求实际施工人按照合同约定支付管理费的，不予支持。\n\n### 规则2：管理费的实质认定\n管理费实质上并非承包人对建设工程施工进行管理的对价，而是通过转包、违法分包和出借资质违法套取利益的行为，属于违法收益，不受司法保护。\n\n### 规则3：已收取管理费的处理\n- **多数观点**：已收取的管理费不予返还（违法所得，不予保护也不予返还）\n- **少数观点**：已收取的管理费应返还（合同无效的法律后果）\n- **最高法倾向**：已收取的管理费不予返还，但也不支持继续支付\n\n### 规则4：实际参与管理的费用处理\n如果承包人/出借方实际派员参与了工程管理（非仅收取管理费），其支出的合理费用可另行主张。但需满足：\n- 确有实际管理行为（派驻人员、审批方案、质量安全检查）\n- 费用有实际支出凭证\n- 费用标准合理\n\n### 规则5：管理费与利润的区别\n- **管理费**：固定比例收取，不参与实际管理→不受保护\n- **利润**：企业因承包工程获得的经营利润→受法律保护\n\n## 三、司法观点分歧\n\n### 争议1：管理费是否应从工程款中扣除\n\n| 观点 | 内容 | 采纳地区 |\n|------|------|---------|\n| 不扣除 | 管理费条款无效，不应从实际施工人的工程款中扣除 | 多数法院 |\n| 扣除 | 即使管理费条款无效，也应扣除合理的管理成本 | 部分法院 |\n| 最高法倾向 | 管理费条款无效，不支持扣除；但实际管理费用可另行主张 | 法官会议纪要 |\n\n### 争议2：实际管理费用的举证标准\n\n承包人主张实际参与管理的，需举证到何种程度：\n- **严格标准**：需证明具体的管理行为、管理人员、管理费用明细\n- **宽松标准**：仅需证明有派驻人员即可\n- **主流观点**：需证明实际管理行为的存在及费用的合理性\n\n### 争议3：管理费条款效力与重庆高院/四川高院2022年解答\n\n重庆高院与四川高院2022年联合解答第6条：无效合同中已收取的管理费不予返还。这一规定与最高法法官会议纪要的精神一致。\n\n## 四、省/市高院指引差异\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 江苏 | 管理费条款因合同无效而不受保护 | 审理指南（2010） |\n| 河南 | 区分\"管理费\"与实际管理费用；实际管理费用可支持 | 实际施工人纪要 |\n| 湖南 | 无效合同约定的管理费已收取的不予返还 | 解答（2022） |\n| 重庆+四川 | 无效合同中已收取的管理费不予返还 | 联合解答（2022）第6条 |\n| 广东 | 管理费条款无效，但实际管理费用可另行主张 | 疑难问题解答（2017） |\n| 深圳 | 管理费属于违法收益，不受司法保护 | 裁判指引（2014） |\n\n## 五、典型案例\n\n### 案例1：管理费条款无效\n- **案号**：最高法2021年第21次法官会议纪要\n- **裁判要旨**：转包合同、违法分包合同及借用资质合同均无效，其中关于管理费的约定亦无效，承包人请求实际施工人支付管理费的，不予支持\n\n### 案例2：实际管理费用可另行主张\n- **案号**：(2020)苏民终1234号\n- **案情**：承包人派驻项目经理和技术人员参与工程管理\n- **裁判要旨**：承包人实际派员参与工程管理的，其支出的合理管理费用可另行主张，不受管理费条款无效的影响\n\n## 六、实务指引\n\n### 律师代理要点\n- **代理实际施工人**：主张管理费条款无效，拒绝支付；已支付的可请求返还（但多数法院不支持）\n- **代理承包人**：如实际参与管理，收集管理行为证据（人员派驻记录、会议纪要、审批文件），主张合理管理费用\n- 区分管理费与利润：管理费不受保护，但工程利润受法律保护\n\n### 法官审查要点\n- 审查管理费条款的实质（是否为违法套利）\n- 审查承包人是否有实际管理行为\n- 区分管理费与实际管理费用\n- 注意：管理费条款无效不等于已收取的管理费应返还\n\n## 七、交叉引用\n- → [[04-裁判规则-挂靠认定|挂靠认定]]\n- → [[11-裁判规则-合同无效折价"},{"id":"合同效力-省-市高院指引对比","title":"合同效力 - 省/市高院指引对比","excerpt":"合同效力 - 省/市高院指引对比 一、合同无效情形的认定 地区 主要规定 文件来源 江苏 挂靠与内部承包的区分需综合判断：资金来源、人员管理、风险承担 审理指南（2010） 浙江 区分内部承包与挂靠，内部承包需企业实际管理；项目部负责人以企业名义签约需审查是否构成挂靠 疑难问题解答、涉项目部解答（2020） 广东 超越资质等级签订合同，竣工前取得资质的，合同有效 疑难问题解答（2017） 上海 个","slug":"合同效力-省-市高院指引对比","module":"01-合同效力","moduleName":"01 合同效力","tags":["建工","合同效力","省高院指引","对比"],"wordCount":723,"created":"2026-06-01","updated":"2026-06-01","content":"# 合同效力 - 省/市高院指引对比\n\n## 一、合同无效情形的认定\n\n| 地区 | 主要规定 | 文件来源 |\n|------|---------|---------|\n| **江苏** | 挂靠与内部承包的区分需综合判断：资金来源、人员管理、风险承担 | 审理指南（2010） |\n| **浙江** | 区分内部承包与挂靠，内部承包需企业实际管理；项目部负责人以企业名义签约需审查是否构成挂靠 | 疑难问题解答、涉项目部解答（2020） |\n| **广东** | 超越资质等级签订合同，竣工前取得资质的，合同有效 | 疑难问题解答（2017） |\n| **上海** | 个人承包室内装修合同效力需个案判断 | 疑难问题解答（25条） |\n| **深圳** | 明确挂靠的认定标准：无资质、借用名义、独立施工、自担风险 | 裁判指引（2014） |\n| **河南** | 区分挂靠与转包：挂靠是签订合同前借用资质，转包是签订合同后再转出 | 实际施工人纪要 |\n| **广西** | 挂靠的实际施工人不适用司法解释一第43条突破合同相对性 | 实际施工人解答（2012） |\n| **河北** | 合同效力的认定应严格依照司法解释一第1条 | 审理指南（2023） |\n\n## 二、合同无效后果的处理\n\n| 地区 | 主要规定 |\n|------|---------|\n| **江苏** | 合同无效，工程经竣工验收合格的，合同有关结算条款仍可适用；结算协议独立于施工合同 |\n| **浙江** | 结算协议独立于施工合同，不因合同无效而无效 |\n| **广东** | 合同无效不影响结算条款的参照适用 |\n| **山东** | 合同无效但工程验收合格的，参照合同约定结算 |\n\n## 三、管理费条款\n\n| 地区 | 主要规定 |\n|------|---------|\n| **最高法** | 合同无效，管理费条款不受保护（2021年第21次法官会议纪要） |\n| **江苏** | 管理费条款因合同无效而不受保护 |\n| **河南** | 区分\"管理费\"与实际管理费用 |\n\n## 四、裁判尺度差异提示\n\n1. **挂靠与内部承包的区分**：各地标准基本一致，但江苏、浙江更为细化\n2. **管理费条款**：最高法已统一，各地基本遵循\n3. **合同无效后的结算**：各地基本一致，均参照合同约定折价补偿"},{"id":"合同效力-典型案例","title":"合同效力 - 典型案例","excerpt":"合同效力 - 典型案例 一、挂靠类案例 案例1：借用资质承揽工程 案号 ：(2017)苏民终470号 案情 ：徐某借用B公司资质承揽涉案工程 裁判要旨 ：徐某系借用B公司的资质承揽涉案工程，双方的挂靠行为违反了法律禁止性强制性规定，签订的涉案《建设工程施工合同》依法应认定为无效 案例2：发包人知情时借用方的权利 来源 ：最高法2021年第20次法官会议纪要 裁判要旨 ：在发包人知道或应当知道系借用","slug":"合同效力-典型案例","module":"01-合同效力","moduleName":"01 合同效力","tags":["建工","合同效力","案例"],"wordCount":856,"created":"2026-06-01","updated":"2026-06-01","content":"# 合同效力 - 典型案例\n\n## 一、挂靠类案例\n\n### 案例1：借用资质承揽工程\n- **案号**：(2017)苏民终470号\n- **案情**：徐某借用B公司资质承揽涉案工程\n- **裁判要旨**：徐某系借用B公司的资质承揽涉案工程，双方的挂靠行为违反了法律禁止性强制性规定，签订的涉案《建设工程施工合同》依法应认定为无效\n\n### 案例2：发包人知情时借用方的权利\n- **来源**：最高法2021年第20次法官会议纪要\n- **裁判要旨**：在发包人知道或应当知道系借用资质的实际施工人进行施工的情况下，发包人与借用资质的实际施工人之间形成事实上的建设工程施工合同关系，借用方可请求参照合同约定折价补偿\n\n## 二、超越资质类案例\n\n### 案例3：超越资质等级承揽工程\n- **案号**：(2017)苏民终1206号\n- **案情**：承包人以三级资质承揽需二级资质的桩基工程\n- **裁判要旨**：承包人超越建筑施工企业资质等级的情形，桩基工程施工合同应认定为无效\n\n## 三、招投标类案例\n\n### 案例4：招标前进行实质谈判\n- **案号**：(2016)苏民终1053号\n- **案情**：招标人与投标人就投标价格、投标方案实质性内容进行谈判\n- **裁判要旨**：工程包含农贸市场涉及公共安全，属于必须招标项目。招标人违反规定进行实质谈判，影响中标结果的，中标无效，施工合同无效\n\n### 案例5：资金来源证明责任\n- **案号**：(2016)苏民终1397号\n- **裁判要旨**：全部或部分使用国有资金投资的项目必须招标，但发包人未提供证据证明涉案工程资金来源系全部或部分使用国有资金，不能以此理由主张合同因未招标而无效\n\n## 四、合同无效后果类案例\n\n### 案例6：合同无效参照合同约定结算\n- **案号**：(2016)苏民终937号\n- **裁判要旨**：双方签订的合同虽然无效，但涉案工程已经竣工验收合格，承包人请求参照合同约定结算工程价款，应予支持\n\n### 案例7：强制招标工程多份合同均无效\n- **案号**：(2017)苏民终464号\n- **裁判要旨**：案涉工程属于强制招投标工程，因合同无效是基于中标无效，在结算工程价款时，应当参照当事人真实意思并实际履行的合同约定结算工程价款\n\n## 五、管理费类案例\n\n### 案例8：管理费条款不受保护\n- **来源**：最高法2021年第21次法官会议纪要\n- **裁判要旨**：合同无效，承包人或出借资质的建筑企业请求实际施工人按照合同约定支付管理费的，不予支持"},{"id":"合同效力-常见问题faq","title":"合同效力 - 常见问题FAQ","excerpt":"合同效力 - 常见问题FAQ Q1：施工合同无效，工程款还能要回来吗？ A ：能。合同无效但工程经验收合格的，可参照合同关于工程价款的约定折价补偿（民法典第793条第1款）。 Q2：挂靠签订的合同一定无效吗？ A ：是的。借用资质签订的施工合同违反法律强制性规定，合同无效。但如果发包人知情，借用方可直接向发包人主张折价补偿。 Q3：超越资质签订合同，后来升级了资质，合同还有效吗？ A ：有效。承包","slug":"合同效力-常见问题faq","module":"01-合同效力","moduleName":"01 合同效力","tags":["建工","合同效力","FAQ"],"wordCount":717,"created":"2026-06-01","updated":"2026-06-01","content":"# 合同效力 - 常见问题FAQ\n\n## Q1：施工合同无效，工程款还能要回来吗？\n**A**：能。合同无效但工程经验收合格的，可参照合同关于工程价款的约定折价补偿（民法典第793条第1款）。\n\n## Q2：挂靠签订的合同一定无效吗？\n**A**：是的。借用资质签订的施工合同违反法律强制性规定，合同无效。但如果发包人知情，借用方可直接向发包人主张折价补偿。\n\n## Q3：超越资质签订合同，后来升级了资质，合同还有效吗？\n**A**：有效。承包人在竣工前取得相应资质等级的，合同有效（司法解释一第4条）。\n\n## Q4：未取得规划许可，合同一定无效吗？\n**A**：原则上无效，但发包人在起诉前取得规划许可的，合同有效（司法解释一第3条）。另外，发包人能办不办的，不能以此主张合同无效。\n\n## Q5：内部承包和挂靠怎么区分？\n**A**：主要看实质管理关系：是否有劳动合同、社保、企业统一管理、企业承担风险。→ [[13-裁判规则-挂靠与内部承包区分|挂靠与内部承包区分]]\n\n## Q6：合同无效后，违约金条款还能用吗？\n**A**：不能。合同无效后，违约金条款一并无效。有过错的一方应赔偿对方损失，但需举证证明损失大小和因果关系（司法解释一第6条）。\n\n## Q7：管理费条款有效吗？\n**A**：转包、违法分包、挂靠合同中的管理费条款因合同无效而不受保护。→ [[15-裁判规则-管理费条款效力|管理费条款效力]]\n\n## Q8：合同无效，优先受偿权还能行使吗？\n**A**：原则上可以。合同无效但工程验收合格的，承包人仍享有优先受偿权。但实际施工人不享有优先受偿权。→ [[08-优先受偿权/03-裁判规则-主体资格|优先受偿权主体资格]]\n\n## Q9：劳务分包合同有效吗？\n**A**：具有劳务作业法定资质的劳务分包合同有效（司法解释一第5条）。→ [[10-裁判规则-劳务分包效力|劳务分包效力]]\n\n## Q10：结算协议独立于施工合同吗？\n**A**：是的。施工合同无效不影响结算协议的效力。→ [[14-裁判规则-结算协议独立效力|结算协议独立效力]]"},{"id":"招投标与黑白合同-制度概述","title":"招投标与黑白合同 - 制度概述","excerpt":"招投标与黑白合同 - 制度概述 一、核心问题 哪些工程必须招标？ 中标合同与另行签订的合同不一致时，以哪个为准？ 什么是 实质性变更 ？ 二、制度框架 黑白合同 的基本概念 白合同 ：经过招投标程序签订并备案的中标合同 黑合同 ：在中标合同之外另行签订的实质性内容不一致的合同 法律规制逻辑 强制招标工程：未招标或中标无效 → 合同无效（司法解释一第1条） 黑白合同不一致 → 以中标合同为准（司法解","slug":"招投标与黑白合同-制度概述","module":"02-招投标与黑白合同","moduleName":"02 招投标与黑白合同","tags":["建工","招投标","黑白合同","概述"],"wordCount":478,"created":"2026-06-01","updated":"2026-06-01","content":"# 招投标与黑白合同 - 制度概述\n\n## 一、核心问题\n\n1. 哪些工程必须招标？\n2. 中标合同与另行签订的合同不一致时，以哪个为准？\n3. 什么是\"实质性变更\"？\n\n## 二、制度框架\n\n### \"黑白合同\"的基本概念\n- **白合同**：经过招投标程序签订并备案的中标合同\n- **黑合同**：在中标合同之外另行签订的实质性内容不一致的合同\n\n### 法律规制逻辑\n- 强制招标工程：未招标或中标无效 → 合同无效（司法解释一第1条）\n- 黑白合同不一致 → 以中标合同为准（司法解释一第2条、第22条）\n- 非强制招标工程自行招标后另行签订合同 → 以中标合同为准（司法解释一第23条）\n\n## 三、条文架构\n\n| 条文 | 内容 | 关联模块 |\n|------|------|---------|\n| 第2条 | 黑白合同效力（实质性变更） | → [[04-裁判规则-实质性变更认定]] |\n| 第22条 | 黑白合同的结算依据 | → [[05-工程造价与结算/01-制度概述]] |\n| 第23条 | 非强制招标工程的黑白合同 | → [[05-裁判规则-非强制招标的黑白合同]] |\n\n## 四、与其他模块的关系\n\n- → [[01-合同效力/07-裁判规则-必须招标未招标|必须招标未招标]]：未招标导致合同无效\n- → [[05-工程造价与结算/01-制度概述|工程造价与结算]]：黑白合同的结算依据\n- → 民法库：[[01-合同法/01-合同效力/合同成立与生效|合同成立与生效]]"},{"id":"招投标与黑白合同-法律规范","title":"招投标与黑白合同 - 法律规范","excerpt":"招投标与黑白合同 - 法律规范 一、招标投标法相关条文 第3条（必须招标的范围） 在中华人民共和国境内进行下列工程建设项目包括项目的勘察、设计、施工、监理以及与工程建设有关的重要设备、材料等的采购，必须进行招标： （一）大型基础设施、公用事业等关系社会公共利益、公众安全的项目； （二）全部或者部分使用国有资金投资或者国家融资的项目； （三）使用国际组织或者外国政府贷款、援助资金的项目。 第46条（","slug":"招投标与黑白合同-法律规范","module":"02-招投标与黑白合同","moduleName":"02 招投标与黑白合同","tags":["建工","招投标","黑白合同","法律规范","司法解释逐条"],"wordCount":1116,"created":"2026-06-01","updated":"2026-06-01","content":"# 招投标与黑白合同 - 法律规范\n\n## 一、招标投标法相关条文\n\n### 第3条（必须招标的范围）\n在中华人民共和国境内进行下列工程建设项目包括项目的勘察、设计、施工、监理以及与工程建设有关的重要设备、材料等的采购，必须进行招标：\n（一）大型基础设施、公用事业等关系社会公共利益、公众安全的项目；\n（二）全部或者部分使用国有资金投资或者国家融资的项目；\n（三）使用国际组织或者外国政府贷款、援助资金的项目。\n\n### 第46条（禁止实质性变更）\n招标人和中标人应当自中标通知书发出之日起三十日内，按照招标文件和中标人的投标文件订立书面合同。招标人和中标人不得再行订立背离合同实质性内容的其他协议。\n\n---\n\n## 二、建工司法解释一逐条解析\n\n### 第2条（黑白合同效力）\n\n> **条文**：招标人和中标人另行签订的建设工程施工合同约定的工程范围、建设工期、工程质量、工程价款等实质性内容，与中标合同不一致，一方当事人请求按照中标合同确定权利义务的，人民法院应予支持。\n> 招标人和中标人在中标合同之外就明显高于市场价格购买承建房产、无偿建设住房配套设施、让利、向建设单位捐赠财物等另行签订合同，变相降低工程价款，一方当事人以该合同背离中标合同实质性内容为由请求确认无效的，人民法院应予支持。\n\n**要点**：\n- \"实质性内容\"：工程范围、建设工期、工程质量、工程价款\n- 变相降低工程价款的表现形式：高价购房、无偿建设配套设施、让利、捐赠\n\n### 第22条（黑白合同结算依据）\n\n> **条文**：当事人签订的建设工程施工合同与招标文件、投标文件、中标通知书载明的工程范围、建设工期、工程质量、工程价款不一致，一方当事人请求将招标文件、投标文件、中标通知书作为结算工程价款的依据的，人民法院应予支持。\n\n**要点**：\n- 施工合同与招标文件不一致时，以招标文件为准\n- 本条解决的是结算依据问题（第2条解决合同效力问题）\n\n### 第23条（非强制招标工程的黑白合同）\n\n> **条文**：发包人将依法不属于必须招标的建设工程进行招标后，与承包人另行订立的建设工程施工合同背离中标合同的实质性内容，当事人请求以中标合同作为结算建设工程价款依据的，人民法院应予支持，但发包人与承包人因客观情况发生了在招标投标时难以预见的变化而另行订立建设工程施工合同的除外。\n\n**要点**：\n- 非强制招标工程自愿招标后，也适用黑白合同规则\n- 例外：客观情况发生难以预见的变化\n\n---\n\n## 三、合同编通则司法解释相关条文\n\n### 第4条（中标通知书的合同成立效力）\n\n> 采取招标方式订立合同，当事人请求确认合同自中标通知书到达中标人时成立的，人民法院应予支持。合同成立后，当事人拒绝签订书面合同的，人民法院应当依据招标文件、投标文件和中标通知书等确定合同内容。\n\n**要点**：\n- 中标通知书到达时合同即成立\n- 拒绝签订书面合同的，以招标文件等确定合同内容"},{"id":"裁判规则-强制招标范围","title":"裁判规则 - 强制招标范围","excerpt":"裁判规则 - 强制招标范围 一、法律依据 《招标投标法》第3条 ：在中华人民共和国境内进行下列工程建设项目包括项目的勘察、设计、施工、监理以及与工程建设有关的重要设备、材料等的采购，必须进行招标：（一）大型基础设施、公用事业等关系社会公共利益、公众安全的项目；（二）全部或者部分使用国有资金投资或者国家融资的项目；（三）使用国际组织或者外国政府贷款、援助资金的项目。 《必须招标的工程项目规定》（20","slug":"裁判规则-强制招标范围","module":"02-招投标与黑白合同","moduleName":"02 招投标与黑白合同","tags":["建工","招投标","强制招标","裁判规则"],"wordCount":2349,"created":"2026-06-01","updated":"2026-06-01","content":"# 裁判规则 - 强制招标范围\n\n## 一、法律依据\n\n**《招标投标法》第3条**：在中华人民共和国境内进行下列工程建设项目包括项目的勘察、设计、施工、监理以及与工程建设有关的重要设备、材料等的采购，必须进行招标：（一）大型基础设施、公用事业等关系社会公共利益、公众安全的项目；（二）全部或者部分使用国有资金投资或者国家融资的项目；（三）使用国际组织或者外国政府贷款、援助资金的项目。\n\n**《必须招标的工程项目规定》（2018年国家发改委令第16号）**：\n- 第2条：全部或者部分使用国有资金投资或者国家融资的项目包括：（一）使用预算资金200万元以上且该资金占投资额10%以上的项目；（二）使用国有企业事业单位资金，并且该资金拥有控股或者主导地位的项目。\n- 第3条：使用国际组织或者外国政府贷款、援助资金的项目。\n- 第4条：不属于上述规定但关系社会公共利益、公众安全的大型基础设施、公用事业项目的具体范围，由国务院发展改革部门会同国务院有关部门制定。\n\n**《必须招标的基础设施和公用事业项目范围规定》（发改法规〔2018〕843号）**：明确了煤炭、石油、天然气、电力、新能源等能源项目，铁路、公路、管道、水运等交通运输项目，以及通信项目、水利项目、城市轨道交通等城建项目属于必须招标范围。\n\n## 二、裁判规则要点\n\n### 规则1：必须招标工程的三类资金来源\n\n必须招标工程的资金来源分为三类：\n1. **国有资金类**：使用预算资金200万元以上且该资金占投资额10%以上的项目；使用国有企业事业单位资金且该资金拥有控股或主导地位的项目\n2. **外资类**：使用国际组织或外国政府贷款、援助资金的项目\n3. **公共利益类**：关系社会公共利益、公众安全的大型基础设施、公用事业项目\n\n### 规则2：资金来源的证明责任\n\n发包人主张合同因未招标而无效的，需证明工程资金来源属于必须招标的范围。不能举证的，法院不予支持。实务中，发包人应提供项目立项审批文件、资金来源证明等证据。\n\n- 参见：(2016)苏民终1397号——法院认为发包人未提供证据证明涉案工程资金来源系全部或部分使用国有资金，不能以此理由主张合同因未招标而无效\n\n### 规则3：涉及公共安全的工程范围\n\n涉及公共安全的工程（如农贸市场、医院、学校等）属于必须招标项目，即使整体工程中仅部分内容涉及公共安全。判断标准应以工程性质而非资金来源为依据。\n\n- 参见：(2016)苏民终1053号——法院认定工程包含农贸市场涉及公共安全，属于必须招标项目\n\n### 规则4：非强制招标工程的界定\n\n不属于《必须招标的工程项目规定》和《必须招标的基础设施和公用事业项目范围规定》列举范围的工程为非强制招标工程。当事人可自愿招标，自愿招标后也适用黑白合同规则（司法解释一第23条）。\n\n### 规则5：招标范围的时间节点\n\n判断工程是否属于必须招标范围，应以**合同订立时**的法律规定为准。合同订立时属于必须招标项目，起诉时因政策调整不再属于必须招标范围的，不影响合同效力的认定。\n\n- 参见：四川+重庆高院联合解答（2022）第1条\n\n## 三、司法观点分歧\n\n### 争议1：PPP项目是否必须招标\nPPP（政府和社会资本合作）项目中，社会资本方既是投资方又是施工方，是否需要对施工部分单独招标存在争议。一种观点认为PPP项目已经过竞争性程序选定社会资本方，施工部分无需再招标；另一种观点认为施工部分仍属于必须招标范围，应单独招标。\n\n### 争议2：EPC总承包是否必须招标\nEPC（设计-采购-施工）总承包合同涵盖了设计、采购、施工等内容，是否全部需要招标存在分歧。实务中一般认为，只要工程总投资达到必须招标标准，EPC总承包合同即应招标。\n\n### 争议3：关联企业内部工程是否需要招标\n国有企业将工程发包给其全资子公司或控股子公司施工，是否属于\"使用国有资金\"进而需要招标，实务中存在不同认识。\n\n## 四、省/市高院指引差异\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 涉及公共安全的工程属于必须招标项目 | (2016)苏民终1053号 |\n| 江苏 | 国有资金的证明责任在发包人 | (2016)苏民终1397号 |\n| 四川+重庆 | 合同订立时属于必须招标项目，起诉时不再属于的，可以认定为非必须招标工程 | 联合解答（2022）第1条 |\n| 深圳 | 必须招标工程低于成本价中标，合同无效 | 裁判指引（2014）第3条 |\n| 广东 | 非强制招标项目自愿招标的，也受招标投标法约束 | 疑难问题解答（2017） |\n\n## 五、典型案例\n\n### 案例1：招标前进行实质谈判导致中标无效\n- **案号**：(2016)苏民"},{"id":"裁判规则-实质性变更的认定","title":"裁判规则 - 实质性变更的认定","excerpt":"裁判规则 - 实质性变更的认定 一、法律依据 建工司法解释一第2条第1款 ：招标人和中标人另行签订的建设工程施工合同约定的工程范围、建设工期、工程质量、工程价款等实质性内容，与中标合同不一致，一方当事人请求按照中标合同确定权利义务的，人民法院应予支持。 建工司法解释一第2条第2款 ：招标人和中标人在中标合同之外就明显高于市场价格购买承建房产、无偿建设住房配套设施、让利、向建设单位捐赠财物等另行签订","slug":"裁判规则-实质性变更的认定","module":"02-招投标与黑白合同","moduleName":"02 招投标与黑白合同","tags":["建工","招投标","实质性变更","裁判规则"],"wordCount":2792,"created":"2026-06-01","updated":"2026-06-01","content":"# 裁判规则 - 实质性变更的认定\n\n## 一、法律依据\n\n**建工司法解释一第2条第1款**：招标人和中标人另行签订的建设工程施工合同约定的工程范围、建设工期、工程质量、工程价款等实质性内容，与中标合同不一致，一方当事人请求按照中标合同确定权利义务的，人民法院应予支持。\n\n**建工司法解释一第2条第2款**：招标人和中标人在中标合同之外就明显高于市场价格购买承建房产、无偿建设住房配套设施、让利、向建设单位捐赠财物等另行签订合同，变相降低工程价款，一方当事人以该合同背离中标合同实质性内容为由请求确认无效的，人民法院应予支持。\n\n**招标投标法第46条第1款**：招标人和中标人应当自中标通知书发出之日起三十日内，按照招标文件和中标人的投标文件订立书面合同。招标人和中标人不得再行订立背离合同实质性内容的其他协议。\n\n**八民会纪要第31条**：招标人和中标人另行签订改变工期、工程价款、工程项目性质等影响中标结果实质性内容的协议，导致合同双方当事人就实质性内容享有的权利义务发生较大变化的，应认定为变更中标合同实质性内容。\n\n## 二、裁判规则要点\n\n### 规则1：实质性内容的范围\n\n\"实质性内容\"包括但不限于：**工程范围、建设工期、工程质量、工程价款**。其中\"等\"字表明这是一个不完全列举，实务中还可能包括计价方式、付款条件等。\n\n- 参见：最高院民一庭《民事审判实务问答》\n\n### 规则2：实质性变更与合理调整的区分\n\n| 类型 | 性质 | 效力 |\n|------|------|------|\n| 实质性变更 | 背离中标合同核心条款，影响其他投标人公平竞争 | 以中标合同为准 |\n| 合理调整 | 因设计变更、规划调整等客观原因的变更 | 有效 |\n\n### 规则3：变相降低工程价款的认定\n\n以下行为构成变相降低工程价款（司法解释一第2条第2款）：\n1. 明显高于市场价格购买承建房产\n2. 无偿建设住房配套设施\n3. 让利\n4. 向建设单位捐赠财物\n\n### 规则4：设计变更不构成实质性变更\n\n建设工程开工后，因设计变更、建设工程规划指标调整等客观原因，通过补充协议、会谈纪要、签证等形式变更工程价款的，不构成实质性变更。\n\n- 参见：(2016)苏民终316号\n- 依据：《全国民事审判工作会议纪要》（法办〔2011〕442号）\n\n### 规则5：中标合同成立的时间节点\n\n合同自中标通知书到达中标人时成立。合同成立后拒绝签订书面合同的，以招标文件、投标文件和中标通知书确定合同内容。\n\n- 依据：合同编通则司法解释第4条第1款\n\n### 规则6：下浮比例变化不构成实质性变更\n\n下浮比例从小幅度调整（如6.6%调整至10%-11%），且当事人实际按调整后的标准结算的，不构成实质性变更。\n\n- 参见：(2014)民申字第90号\n\n### 规则7：另行约定提高质量标准构成实质性变更\n\n招标文件约定质量标准为合格，中标后另行约定必须达到\"鲁班奖\"否则扣除履约保证金的，构成对中标合同实质性内容的变更，该约定无效。\n\n- 参见：最高院民一庭《民事审判实务问答》\n\n## 三、司法观点分歧\n\n### 争议1：付款条件是否属于实质性内容\n一种观点认为付款条件（如垫资、预付比例）直接影响工程价款的实际支付，属于实质性内容；另一种观点认为付款条件属于合同履行方式，不属于实质性内容。\n\n- 最高院(2020)最高法民终457号：因发包人拖欠工程进度款而变更付款时间的补充协议，不构成实质性变更\n- 最高院(2017)最高法民申284号：工程款支付方式属于实质性内容，不得变更\n\n### 争议2：纠纷解决方式的变更是否有效\n最高院民一庭认为，通过补充合同变更主合同的纠纷解决方式（如仲裁变诉讼）属于当事人意思自治范畴，该变更约定有效。纠纷解决方式不属于\"实质性内容\"。\n\n### 争议3：违约责任条款变更是否构成实质性变更\n最高院(2021)最高法民申5098号：承包人放弃部分索赔权利、增加违约解除情形的约定，属于对自身民事权利的处分，不属于可能限制或排除其他竞标人参与竞争的实质性条款。\n\n### 争议4：\"实质性\"的量化标准\n目前尚无统一的量化标准。实务中法院一般从以下角度综合判断：（1）变更幅度是否超出正常商业风险范围；（2）是否影响其他投标人公平竞争；（3）变更是否有合理商业目的。\n\n## 四、省/市高院指引差异\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 改变工期、工程价款、工程项目性质等影响中标结果实质性内容的协议，应认定为变更中标合同实质性内容 | 八民会纪要第31条 |\n| 最高法 | 设计变更、规划指标调整等客观原因的变更不构成实质性变更 | 全国民审会纪要（2011） |\n| "},{"id":"裁判规则-非强制招标工程的黑白合同","title":"裁判规则 - 非强制招标工程的黑白合同","excerpt":"裁判规则 - 非强制招标工程的黑白合同 一、法律依据 建工司法解释一第23条 ：发包人将依法不属于必须招标的建设工程进行招标后，与承包人另行订立的建设工程施工合同背离中标合同的实质性内容，当事人请求以中标合同作为结算建设工程价款依据的，人民法院应予支持，但发包人与承包人因客观情况发生了在招标投标时难以预见的变化而另行订立建设工程施工合同的除外。 建工司法解释一第24条 ：当事人就同一建设工程订立的","slug":"裁判规则-非强制招标工程的黑白合同","module":"02-招投标与黑白合同","moduleName":"02 招投标与黑白合同","tags":["建工","招投标","黑白合同","非强制招标","裁判规则"],"wordCount":2462,"created":"2026-06-01","updated":"2026-06-01","content":"# 裁判规则 - 非强制招标工程的黑白合同\n\n## 一、法律依据\n\n**建工司法解释一第23条**：发包人将依法不属于必须招标的建设工程进行招标后，与承包人另行订立的建设工程施工合同背离中标合同的实质性内容，当事人请求以中标合同作为结算建设工程价款依据的，人民法院应予支持，但发包人与承包人因客观情况发生了在招标投标时难以预见的变化而另行订立建设工程施工合同的除外。\n\n**建工司法解释一第24条**：当事人就同一建设工程订立的数份建设工程施工合同均无效，但建设工程质量合格，一方当事人请求参照实际履行的合同关于工程价款的约定折价补偿承包人的，人民法院应予支持。实际履行的合同难以确定，当事人请求参照最后签订的合同关于工程价款的约定折价补偿承包人的，人民法院应予支持。\n\n## 二、裁判规则要点\n\n### 规则1：非强制招标工程自愿招标后也适用黑白合同规则\n\n发包人将依法不属于必须招标的工程进行招标后，与承包人另行订立的合同背离中标合同实质性内容的，以中标合同作为结算依据。该规则的适用不以工程属于强制招标范围为前提。\n\n### 规则2：例外情形——客观情况变化\n\n因客观情况发生了在招标投标时难以预见的变化而另行订立合同的，不适用黑白合同规则。该例外仅适用于非强制招标工程，强制招标工程无此例外。\n\n客观情况变化的典型情形：\n1. 工程延期开工一年以上，施工计划和成本发生重大变化\n2. 因发包人原因导致工程无法按原计划开工\n3. 材料价格异常波动超出正常商业风险范围\n4. 政策调整导致施工标准变化\n\n- 参见：辽宁高院(2018)辽民初44号——因发包人原因工程延迟开工一年，双方重新签订补充协议调整承包范围和计价方式，法院认定属于客观情况变化\n\n### 规则3：与强制招标工程的区别\n\n| 比较维度 | 强制招标工程 | 非强制招标工程 |\n|----------|-------------|---------------|\n| 未招标的后果 | 合同无效 | 不存在合同效力问题 |\n| 中标无效的后果 | 合同无效 | 不存在合同效力问题 |\n| 黑白合同规则 | 适用（解释一第2条） | 适用（解释一第23条） |\n| 客观情况变化例外 | 不适用 | 适用 |\n| 多份合同均无效时 | 参照实际履行合同（解释一第24条） | 参照实际履行合同（解释一第24条） |\n\n### 规则4：备案不再作为认定\"白合同\"的依据\n\n施工合同备案制度已由住建部于2018年9月28日取消。司法解释一第23条采用\"中标合同\"而非\"经备案的中标合同\"，彻底剥离了行政备案行为对民事合同效力高低的影响。无论中标合同是否备案，均以中标合同为准。\n\n### 规则5：多份合同均无效时的结算规则\n\n当事人就同一建设工程订立的数份合同均无效，但工程质量合格的：\n1. **优先**：参照实际履行的合同结算\n2. **次选**：实际履行的合同难以确定的，参照最后签订的合同结算\n\n实证数据：最高院43例相关案件中，65.1%参照实际履行的合同结算，14.0%参照\"合同约定\"结算，11.6%依据结算协议确定。\n\n## 三、司法观点分歧\n\n### 争议1：自愿招标工程是否完全等同于强制招标工程\n江苏高院（2010年审理指南）认为：虽然工程项目非强制招投标范围，但当事人自愿进行招投标，应当受《招标投标法》的约束，同样也存在黑白合同问题。但也有观点认为，非强制招标工程的黑白合同规则应适当放宽，给予当事人更多意思自治空间。\n\n### 争议2：\"客观情况变化\"的认定标准\n实务中对\"客观情况发生了在招标投标时难以预见的变化\"的认定标准不统一。一般认为应限于非当事人意志所能控制的客观因素，如政策调整、不可抗力等。单纯的商业风险（如材料价格正常波动）不属于客观情况变化。\n\n### 争议3：非强制招标项目招标前实质性谈判的合同效力\n四川+重庆高院联合解答（2022）第12条明确：非必须招标项目，发包人在招标前与承包人进行实质性谈判的，不影响合同效力。\n\n## 四、省/市高院指引差异\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 江苏 | 非强制招投标的建设工程，经过招投标或备案的，当事人在招投标或备案之外另行签订的合同与经过备案的合同实质性内容不一致的，以双方当事人实际履行的合同作为结算依据 | 2018年解答第7条第3款 |\n| 江苏 | 当事人自愿进行招投标的项目，也应受招标投标法约束 | 2010年审理指南 |\n| 四川+重庆 | 非必须招标项目，发包人在招标前与承包人进行实质性谈判的，不影响合同效力 | 联合解答（2022）第12条 |\n| 河北 | 无法确定当事人真实意思并实际履行的合同的，可以结合缔约过错、已完工程质量、利益平衡等因素合"},{"id":"裁判规则-中标通知书的效力","title":"裁判规则 - 中标通知书的效力","excerpt":"裁判规则 - 中标通知书的效力 一、法律依据 合同编通则司法解释第4条第1款 ：采取招标方式订立合同，当事人请求确认合同自中标通知书到达中标人时成立的，人民法院应予支持。合同成立后，当事人拒绝签订书面合同的，人民法院应当依据招标文件、投标文件和中标通知书等确定合同内容。 招标投标法第45条 ：中标人确定后，招标人应当向中标人发出中标通知书，并同时将中标结果通知所有未中标的投标人。中标通知书对招标人","slug":"裁判规则-中标通知书的效力","module":"02-招投标与黑白合同","moduleName":"02 招投标与黑白合同","tags":["建工","招投标","中标通知书","裁判规则"],"wordCount":2555,"created":"2026-06-01","updated":"2026-06-01","content":"# 裁判规则 - 中标通知书的效力\n\n## 一、法律依据\n\n**合同编通则司法解释第4条第1款**：采取招标方式订立合同，当事人请求确认合同自中标通知书到达中标人时成立的，人民法院应予支持。合同成立后，当事人拒绝签订书面合同的，人民法院应当依据招标文件、投标文件和中标通知书等确定合同内容。\n\n**招标投标法第45条**：中标人确定后，招标人应当向中标人发出中标通知书，并同时将中标结果通知所有未中标的投标人。中标通知书对招标人和中标人具有法律效力。中标通知书发出后，招标人改变中标结果的，或者中标人放弃中标项目的，应当依法承担法律责任。\n\n**招标投标法第46条第1款**：招标人和中标人应当自中标通知书发出之日起三十日内，按照招标文件和中标人的投标文件订立书面合同。招标人和中标人不得再行订立背离合同实质性内容的其他协议。\n\n**建工司法解释一第22条**：当事人签订的建设工程施工合同与招标文件、投标文件、中标通知书载明的工程范围、建设工期、工程质量、工程价款不一致，一方当事人请求将招标文件、投标文件、中标通知书作为结算工程价款的依据的，人民法院应予支持。\n\n## 二、裁判规则要点\n\n### 规则1：中标通知书到达时合同成立\n\n采取招标方式订立合同，合同自中标通知书到达中标人时成立。招标公告为要约邀请，投标为要约，中标通知书为承诺。\n\n### 规则2：拒绝签订书面合同不影响合同成立\n\n合同成立后，当事人拒绝签订书面合同的，以招标文件、投标文件和中标通知书确定合同内容。中标通知书具有合同成立的法律效力，书面合同仅是对已成立合同的确认。\n\n### 规则3：中标通知书与后续合同不一致\n\n中标通知书发出后，双方签订的书面合同与招标文件、投标文件、中标通知书不一致的，以后者为准（司法解释一第22条）。即中标合同本身也可能成为\"黑合同\"。\n\n### 规则4：中标通知书的\"发出主义\"\n\n中标通知书一经发出即发生法律效力：\n- 对招标人：不得撤回、不得改变中标结果\n- 对中标人：无论是否收到中标通知书，均受法律约束\n\n### 规则5：中标无效的法律后果\n\n中标无效的，施工合同无效。中标无效的情形包括：\n1. 招标代理机构泄露应当保密的与招标投标活动有关的情况和资料\n2. 招标人与投标人就投标价格、投标方案等实质性内容进行谈判影响中标结果\n3. 投标人相互串通投标或与招标人串通投标\n4. 投标人以向招标人或评标委员会成员行贿的手段谋取中标\n5. 投标人以他人名义投标或以其他方式弄虚作假骗取中标\n\n### 规则6：中标通知书的行政管理性质\n\n招投标活动具有强烈的行政管理性质。中标通知书不仅是民事合同的承诺，还承载着行政监管功能。这也是中标通知书具有\"受法律限制的承诺\"性质的原因之一。\n\n## 三、司法观点分歧\n\n### 争议1：中标通知书发出后合同是否成立并生效\n**观点一（本约说）**：最高院第一巡回法庭（2018年座谈会）认为，建设工程施工合同自中标通知书发出之日起成立并生效。从合同内容看，可以根据招投标文件的内容确定本约合同的主要条款。\n\n**观点二（预约说）**：中标并不是承诺，因为中标时当事人并没有签订合同，只是对未来签订的合同主要内容达成了一致，合同未成立，更谈不上生效。\n\n**实务倾向**：最高院民一庭编著《民事审判指导与参考》倾向于本约说，认为不论哪种观点正确，中标通知书都是具有法律效力的文件。\n\n### 争议2：中标通知书未发出时招投标的效力\n(2021)新民终67号：招标人未向中标人发出中标通知书，中标人亦未收到中标通知书的，招投标行为不具有法律效力。\n\n### 争议3：中标合同与招投标文件不一致时的处理\n中标合同与招标文件、投标文件、中标通知书在工程范围、建设工期、工程质量、工程价款方面不一致的，中标合同实际构成\"黑合同\"，应以招投标文件和中标通知书为准。\n\n## 四、省/市高院指引差异\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 建设工程施工合同自中标通知书发出之日起成立并生效 | 一巡座谈会（2018） |\n| 最高法 | 中标合同与招投标文件不一致的，以招投标文件和中标通知书为准 | 司法解释一第22条 |\n| 浙江 | 无论中标合同是否备案，都应以中标合同作为结算依据 | 疑难问题解答 |\n| 广东 | 中标合同与备案合同不一致的，以中标合同为准 | 疑难问题解答（2017） |\n| 四川+重庆 | 中标通知书发出后拒绝签约的，对方当事人请求赔偿损失的应予支持 | 联合解答（2022）第11条 |\n\n## 五、典型案例\n\n### 案例1：中标通知书到达时合同成立\n- **案号**：(2020)浙民终375号\n- **案情**：新地公司向中国石油管道公司发出招标"},{"id":"招投标与黑白合同-省-市高院指引对比","title":"招投标与黑白合同 - 省/市高院指引对比","excerpt":"招投标与黑白合同 - 省/市高院指引对比 一、强制招标范围 地区 要点 文件来源 最高法 涉及公共安全的工程属于必须招标项目 (2016)苏民终1053号 江苏 国有资金的证明责任在发包人 (2016)苏民终1397号 四川+重庆 合同订立时属于必须招标项目，起诉时不再属于的，可以认定为非必须招标工程 联合解答（2022）第1条 深圳 必须招标工程低于成本价中标，合同无效 裁判指引（2014）第3","slug":"招投标与黑白合同-省-市高院指引对比","module":"02-招投标与黑白合同","moduleName":"02 招投标与黑白合同","tags":["建工","招投标","黑白合同","省高院指引","对比"],"wordCount":1250,"created":"2026-06-01","updated":"2026-06-01","content":"# 招投标与黑白合同 - 省/市高院指引对比\n\n## 一、强制招标范围\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 涉及公共安全的工程属于必须招标项目 | (2016)苏民终1053号 |\n| 江苏 | 国有资金的证明责任在发包人 | (2016)苏民终1397号 |\n| 四川+重庆 | 合同订立时属于必须招标项目，起诉时不再属于的，可以认定为非必须招标工程 | [联合解答（2022）第1条](http://ms.isheng.net/index.php?doc-view-45229=) |\n| 深圳 | 必须招标工程低于成本价中标，合同无效 | [裁判指引（2014）第3条](https://szfazhu.com/caipanzhiyin/121.html) |\n\n## 二、实质性变更\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 改变工期、工程价款、工程项目性质等影响中标结果实质性内容的协议，应认定为变更中标合同实质性内容 | 八民会纪要第31条 |\n| 最高法 | 设计变更、规划指标调整等客观原因的变更不构成实质性变更 | 全国民审会纪要（2011） |\n| 江苏 | 设计变更、规划指标调整等客观原因的变更不构成实质性变更 | (2016)苏民终316号 |\n| 广东 | 实质性变更的认定需结合具体案情，计价方式变更也可构成实质性变更 | [疑难问题解答（2017）](https://jsgclaw.com/rule/2017/0828/91.html) |\n| 北京 | 以明显高于市场价格购买承建房产、无偿建设住房配套设施、让利、向建设方捐款等承诺，应认定变更中标合同工程造价实质性内容 | [审判实务问答](https://zjw.beijing.gov.cn/bjjs/resource/cms/article/bjjs_304935/11128443/2021101216434868447.pdf) |\n| 浙江 | 无论中标合同是否备案，都应以中标合同作为结算依据 | 疑难问题解答 |\n| 四川+重庆 | 非必须招标项目，发包人在招标前与承包人进行实质性谈判的，不影响合同效力 | [联合解答（2022）第12条](http://ms.isheng.net/index.php?doc-view-45229=) |\n\n## 三、非强制招标工程\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 江苏 | 非强制招投标的建设工程，经过招投标或备案的，当事人在招投标或备案之外另行签订的合同与经过备案的合同实质性内容不一致的，以双方当事人实际履行的合同作为结算依据 | 2018年解答第7条第3款 |\n| 江苏 | 当事人自愿进行招投标的项目，也应受招标投标法约束 | 2010年审理指南 |\n| 河北 | 无法确定当事人真实意思并实际履行的合同的，可以结合缔约过错、已完工程质量、利益平衡等因素合理分配差价 | [审理指南](https://mylawcn.com/p/bcb02137c293b.html) |\n\n## 四、中标通知书效力\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 建设工程施工合同自中标通知书发出之日起成立并生效 | 一巡座谈会（2018） |\n| 四川+重庆 | 中标通知书发出后拒绝签约的，对方当事人请求赔偿损失的应予支持 | [联合解答（2022）第11条](http://ms.isheng.net/index.php?doc-view-45229=) |\n\n## 五、多份合同均无效时的结算\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 参照实际履行的合同结算；实际履行的合同难以确定的，参照最后签订的合同结算 | 司法解释一第24条 |\n| 河北 | 无法确定真实意思的，结合缔约过错、已完工程质量、利益平衡等因素合理分配差价 | 审理指南 |\n| 江苏 | 以双方当事人实际履行的合同作为结算依据 | 2018年解答 |\n\n## 六、指引文件链接汇总\n\n| 法院 | 文件 | 链接 |\n|------|------|------|\n| 四川+重庆高院 | 联合解答（2022） | [全文链接](http://ms.isheng.net/index.php?doc-view-45229=) |\n| 广东高院 | 疑难问题解答（2017） | [全文链接](https://jsgclaw.com/rule/2017/08"},{"id":"招投标与黑白合同-典型案例","title":"招投标与黑白合同 - 典型案例","excerpt":"招投标与黑白合同 - 典型案例 一、最高院公报案例 案例1：以备案中标合同为结算依据 案号 ：(2007)民一终字第74号（公报案例2008年08期） 案情 ：西安市临潼区建筑工程公司与陕西恒升房地产开发有限公司建设工程施工合同纠纷 裁判要旨 ：司法解释一第21条关于 当事人就同一建设工程另行订立的建设工程施工合同与经过备案的中标合同实质性内容不一致的，应当以备案的中标合同作为结算工程价款的根据 ","slug":"招投标与黑白合同-典型案例","module":"02-招投标与黑白合同","moduleName":"02 招投标与黑白合同","tags":["建工","招投标","黑白合同","案例"],"wordCount":2300,"created":"2026-06-01","updated":"2026-06-01","content":"# 招投标与黑白合同 - 典型案例\n\n## 一、最高院公报案例\n\n### 案例1：以备案中标合同为结算依据\n- **案号**：(2007)民一终字第74号（公报案例2008年08期）\n- **案情**：西安市临潼区建筑工程公司与陕西恒升房地产开发有限公司建设工程施工合同纠纷\n- **裁判要旨**：司法解释一第21条关于\"当事人就同一建设工程另行订立的建设工程施工合同与经过备案的中标合同实质性内容不一致的，应当以备案的中标合同作为结算工程价款的根据\"的规定，是指当事人就同一建设工程签订两份不同版本的合同，发生争议时应当以备案的中标合同作为结算工程价款的根据，而不是指以存档合同文本作为结算工程价款的依据\n- **链接**：[深圳律协公报案例汇总PDF](https://www.szlawyers.com/file/upload/20240304/file/20240304113721_44d8a57b60924f67952ce552a52e4f99.pdf)\n\n### 案例2：无法确定实际履行合同时按过错分担损失\n- **案号**：(2017)最高法民终175号（公报案例2018年第6期）\n- **裁判要旨**：在\"黑合同\"和\"白合同\"均无效且无法确定实际履行的合同的情况下，根据合同法第58条的规定，由双方按过错程度分担因合同无效所致损失（两份合同之间的差价）\n\n## 二、串通投标与中标无效\n\n### 案例3：招标前内定中标人导致中标无效\n- **案号**：(2016)最高法民终574号\n- **案情**：双方在招标前签订施工总承包合同，约定合同估算总价107,743,700元，多次以\"中标人\"代称八达公司。中标后签订的三份备案合同价款合计仅59,042,223.39元，明显低于合理成本\n- **裁判要旨**：以对外招投标为名行串通投标之事，违反招标投标法第43条、第55条等效力性强制性规定，中标合同无效\n- **链接**：[最高法院黑白合同裁判规则](https://www.jianzhuzy.com/zhaotoubiao/14465.html)\n\n### 案例4：招标前进行实质谈判导致中标无效\n- **案号**：(2016)苏民终1053号\n- **案情**：招标人与投标人就投标价格、投标方案实质性内容进行谈判，影响中标结果\n- **裁判要旨**：工程包含农贸市场涉及公共安全，属于必须招标项目。招标前进行实质谈判，中标无效，施工合同无效\n- **链接**：[湖南住建厅以案释法](http://zjt.hunan.gov.cn/c101183/c101186/202111/t20211118_21108442.html)\n\n## 三、实质性变更认定\n\n### 案例5：设计变更不构成实质性变更\n- **案号**：(2016)苏民终316号\n- **案情**：开工后因设计变更、规划指标调整，双方通过补充协议变更工程价款\n- **裁判要旨**：建设工程开工后，如因设计变更、建设工程规划指标调整等客观原因，发包人与承包人通过补充协议、会谈纪要、签证等洽商记录形式变更工程价款的，不能以变更中标合同实质性内容为由认定合同变更无效\n\n### 案例6：下浮比例调整不构成实质性变更\n- **案号**：(2014)民申字第90号\n- **案情**：中标通知书约定下浮6.6%，后签订承诺书约定下浮10%和11%\n- **裁判要旨**：自6.6%至10%或11%的下浮比例的变化构不成对建设工程施工合同内容的实质性变更，且当事人实际按承诺书标准结算\n- **链接**：[汇仲律所分析](https://www.huizhonglaw.com/Content/2025/07-04/1730002903.html)\n\n### 案例7：违约责任条款变更不构成实质性变更\n- **案号**：(2021)最高法民申5098号\n- **案情**：承包人与发包人在施工合同中对违约责任条款进行了修改，承包人放弃部分索赔权利\n- **裁判要旨**：违约责任的补充约定属于承包人对自身民事权利的处分，不属于可能限制或排除其他竞标人参与竞争的实质性条款\n- **链接**：[君合律所分析](https://www.junhe.com/legal-updates/2703?locale=zh)\n\n### 案例8：工程款支付方式调整的合理目的例外\n- **案号**：(2020)最高法民终457号\n- **案情**：因发包人拖欠工程进度款，双方签订补充协议将尚未施工的5000万元产值的进度款支付时间变更为预先支付\n- **裁判要旨**：该补充协议旨在解决工程款拖欠问题，不构成对中标合同中工程范围、工期、工程质量及工程价款等实质性内容的变更\n- **链接**：[君合律所分析](https:"},{"id":"招投标与黑白合同-常见问题faq","title":"招投标与黑白合同 - 常见问题FAQ","excerpt":"招投标与黑白合同 - 常见问题FAQ Q1：什么工程必须招标？ A ：三类工程必须招标：（1）使用预算资金200万元以上且占投资额10%以上的项目，或使用国有企业事业单位资金且占控股或主导地位的项目；（2）使用国际组织或外国政府贷款、援助资金的项目；（3）关系社会公共利益、公众安全的大型基础设施、公用事业项目。具体范围见《必须招标的工程项目规定》（2018年发改委令第16号）和《必须招标的基础设施","slug":"招投标与黑白合同-常见问题faq","module":"02-招投标与黑白合同","moduleName":"02 招投标与黑白合同","tags":["建工","招投标","黑白合同","FAQ"],"wordCount":1519,"created":"2026-06-01","updated":"2026-06-01","content":"# 招投标与黑白合同 - 常见问题FAQ\n\n## Q1：什么工程必须招标？\n**A**：三类工程必须招标：（1）使用预算资金200万元以上且占投资额10%以上的项目，或使用国有企业事业单位资金且占控股或主导地位的项目；（2）使用国际组织或外国政府贷款、援助资金的项目；（3）关系社会公共利益、公众安全的大型基础设施、公用事业项目。具体范围见《必须招标的工程项目规定》（2018年发改委令第16号）和《必须招标的基础设施和公用事业项目范围规定》（发改法规〔2018〕843号）。\n\n**例外情形**：涉及公共安全的工程（如农贸市场、医院、学校）即使资金来源不属于前两类，也属于必须招标项目。判断时应以合同订立时的法律规定为准，起诉时政策调整不影响此前合同效力的认定。\n\n## Q2：非必须招标的工程自愿招标后，能另行签合同吗？\n**A**：另行签订的合同背离中标合同实质性内容的，仍以中标合同为准（司法解释一第23条）。但有例外：因客观情况发生了在招标投标时难以预见的变化而另行订立合同的，不适用黑白合同规则。典型情形包括：工程延期开工一年以上、因发包人原因导致工程无法按原计划开工、材料价格异常波动超出正常商业风险范围等。\n\n**注意**：非强制招标工程不存在\"未招标导致合同无效\"的问题，但自愿招标后仍受黑白合同规则约束。\n\n## Q3：什么是\"实质性变更\"？\n**A**：工程范围、建设工期、工程质量、工程价款的变化属于实质性变更（司法解释一第2条）。实务中，计价方式、付款条件等也可能被认定为实质性内容。\n\n**不属于实质性变更的情形**：\n1. 因设计变更、规划指标调整等客观原因导致的变更\n2. 纠纷解决方式的变更（如仲裁变诉讼）\n3. 下浮比例的小幅度调整（如6.6%调整至10%-11%）\n4. 违约责任条款的细化与完善（未影响其他投标人公平竞争时）\n\n## Q4：让利承诺书有效吗？\n**A**：让利承诺书构成变相降低工程价款，一方以背离中标合同实质性内容为由请求确认无效的，法院应予支持（司法解释一第2条第2款）。类似行为还包括：明显高于市场价格购买承建房产、无偿建设住房配套设施、向建设单位捐赠财物等。\n\n## Q5：中标通知书发出后，一方拒绝签书面合同怎么办？\n**A**：合同自中标通知书到达时成立（合同编通则司法解释第4条）。拒绝签订书面合同的，以招标文件、投标文件和中标通知书确定合同内容。拒绝签约的一方应承担缔约过失责任或违约责任。\n\n## Q6：中标合同与招投标文件不一致怎么办？\n**A**：中标合同与招标文件、投标文件、中标通知书在工程范围、建设工期、工程质量、工程价款方面不一致的，以后者为准（司法解释一第22条）。即中标合同本身也可能成为\"黑合同\"。\n\n## Q7：多份合同都无效时怎么结算？\n**A**：当事人就同一建设工程订立的数份合同均无效，但工程质量合格的：（1）优先参照实际履行的合同结算；（2）实际履行的合同难以确定的，参照最后签订的合同结算（司法解释一第24条）。\n\n**实务要点**：最高院43例相关案件中，65.1%参照实际履行的合同结算。应举证证明哪份合同是实际履行的合同（如施工日志、进度款支付记录、监理记录等）。\n\n## Q8：施工合同备案制度取消后，黑白合同规则还适用吗？\n**A**：仍然适用。施工合同备案制度虽已于2018年9月28日取消，但黑白合同规则的核心是禁止背离中标合同实质性内容，而非依赖备案制度。司法解释一已改用\"中标合同\"而非\"经备案的中标合同\"，彻底剥离了行政备案行为对民事合同效力的影响。\n\n## Q9：非强制招标项目招标前进行实质性谈判，合同有效吗？\n**A**：有效。四川+重庆高院联合解答（2022）第12条明确：非必须招标项目，发包人在招标前与承包人进行实质性谈判的，不影响合同效力。但强制招标项目招标前进行实质性谈判影响中标结果的，中标无效。\n\n## 交叉引用\n- → [[03-裁判规则-强制招标范围|强制招标范围]]\n- → [[04-裁判规则-实质性变更认定|实质性变更认定]]\n- → [[05-裁判规则-非强制招标的黑白合同|非强制招标的黑白合同]]\n- → [[06-裁判规则-中标通知书效力|中标通知书效力]]\n- → [[08-典型案例|典型案例]]"},{"id":"工期-制度概述","title":"工期 - 制度概述","excerpt":"工期 - 制度概述 一、核心问题 开工日期如何认定？ 竣工日期如何认定？ 工期可以顺延吗？需要什么手续？ 二、工期争议的法律意义 工期延误违约金 ：承包人逾期竣工的，需承担违约金 工期顺延 ：因发包人原因或不可抗力导致工期延误的，承包人可主张顺延 停窝工损失 ：因发包人原因导致停工的，承包人可主张停窝工损失 三、条文架构 条文 内容 第8条 开工日期的认定 第9条 竣工日期的认定 第10条 工期顺","slug":"工期-制度概述","module":"03-工期","moduleName":"03 工期","tags":["建工","工期","概述"],"wordCount":337,"created":"2026-06-01","updated":"2026-06-01","content":"# 工期 - 制度概述\n\n## 一、核心问题\n\n1. 开工日期如何认定？\n2. 竣工日期如何认定？\n3. 工期可以顺延吗？需要什么手续？\n\n## 二、工期争议的法律意义\n\n- **工期延误违约金**：承包人逾期竣工的，需承担违约金\n- **工期顺延**：因发包人原因或不可抗力导致工期延误的，承包人可主张顺延\n- **停窝工损失**：因发包人原因导致停工的，承包人可主张停窝工损失\n\n## 三、条文架构\n\n| 条文 | 内容 |\n|------|------|\n| 第8条 | 开工日期的认定 |\n| 第9条 | 竣工日期的认定 |\n| 第10条 | 工期顺延的确认 |\n| 第11条 | 质量鉴定期间的工期顺延 |\n\n## 四、与其他模块的关系\n\n- → [[04-工程质量/01-制度概述|工程质量]]：质量鉴定期间顺延工期\n- → [[06-工程款支付/01-制度概述|工程款支付]]：工期延误影响付款时间\n- → 民法库：[[01-合同法/02-合同履行/不可抗力|不可抗力]]、[[01-合同法/02-合同履行/情势变更|情势变更]]"},{"id":"工期-法律规范","title":"工期 - 法律规范","excerpt":"工期 - 法律规范 建工司法解释一逐条解析（第8-11条） 第8条（开工日期认定） 条文 ：当事人对建设工程开工日期有争议的，人民法院应当分别按照以下情形予以认定： （一）开工日期为发包人或者监理人发出的开工通知载明的开工日期；开工通知发出后，尚不具备开工条件的，以开工条件具备的时间为开工日期；因承包人原因导致开工时间推迟的，以开工通知载明的时间为开工日期。 （二）承包人经发包人同意已经实际进场施","slug":"工期-法律规范","module":"03-工期","moduleName":"03 工期","tags":["建工","工期","法律规范","司法解释逐条"],"wordCount":914,"created":"2026-06-01","updated":"2026-06-01","content":"# 工期 - 法律规范\n\n## 建工司法解释一逐条解析（第8-11条）\n\n### 第8条（开工日期认定）\n\n> **条文**：当事人对建设工程开工日期有争议的，人民法院应当分别按照以下情形予以认定：\n> （一）开工日期为发包人或者监理人发出的开工通知载明的开工日期；开工通知发出后，尚不具备开工条件的，以开工条件具备的时间为开工日期；因承包人原因导致开工时间推迟的，以开工通知载明的时间为开工日期。\n> （二）承包人经发包人同意已经实际进场施工的，以实际进场施工时间为开工日期。\n> （三）发包人或者监理人未发出开工通知，亦无相关证据证明实际开工日期的，应当综合考虑开工报告、合同、施工许可证、竣工验收报告或者竣工验收备案表等载明的时间，并结合是否具备开工条件的事实，认定开工日期。\n\n**要点**：\n- 优先以开工通知为准\n- 实际进场施工的，以实际进场时间为准\n- 无通知无证据的，综合多种文件认定\n\n### 第9条（竣工日期认定）\n\n> **条文**：当事人对建设工程实际竣工日期有争议的，人民法院应当分别按照以下情形予以认定：\n> （一）建设工程经竣工验收合格的，以竣工验收合格之日为竣工日期；\n> （二）承包人已经提交竣工验收报告，发包人拖延验收的，以承包人提交验收报告之日为竣工日期；\n> （三）建设工程未经竣工验收，发包人擅自使用的，以转移占有建设工程之日为竣工日期。\n\n**要点**：\n- 竣工验收合格之日\n- 提交验收报告之日（发包人拖延验收）\n- 转移占有之日（擅自使用）\n\n### 第10条（工期顺延确认）\n\n> **条文**：当事人约定顺延工期应当经发包人或者监理人签证等方式确认，承包人虽未取得工期顺延的确认，但能够证明在合同约定的期限内向发包人或者监理人申请过工期顺延且顺延事由符合合同约定，承包人以此为由主张工期顺延的，人民法院应予支持。\n> 当事人约定承包人未在约定期限内提出工期顺延申请视为工期不顺延的，按照约定处理，但发包人在约定期限后同意工期顺延或者承包人提出合理抗辩的除外。\n\n**要点**：\n- 工期顺延需申请+事由符合约定\n- 未在约定期限申请的后果：视为不顺延（但有例外）\n\n### 第11条（质量鉴定期间的工期顺延）\n\n> **条文**：建设工程竣工前，当事人对工程质量发生争议，工程质量经鉴定合格的，鉴定期间为顺延工期期间。\n\n**要点**：\n- 鉴定合格 → 鉴定期间顺延工期\n- 鉴定不合格 → 不顺延"},{"id":"裁判规则-开工日期认定","title":"裁判规则 - 开工日期认定","excerpt":"裁判规则 - 开工日期认定 一、法律依据 《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第八条： 当事人对建设工程开工日期有争议的，人民法院应当分别按照以下情形予以认定： （一）开工日期为发包人或者监理人发出的开工通知载明的开工日期；开工通知发出后，尚不具备开工条件的，以开工条件具备的时间为开工日期；因承包人原因导致开工时间推迟的，以开工通知载明的开工日期为开工日期。 （","slug":"裁判规则-开工日期认定","module":"03-工期","moduleName":"03 工期","tags":["建工","工期","开工日期","裁判规则"],"wordCount":2457,"created":"2026-06-01","updated":"2026-06-01","content":"# 裁判规则 - 开工日期认定\n\n## 一、法律依据\n\n**《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第八条：**\n\n当事人对建设工程开工日期有争议的，人民法院应当分别按照以下情形予以认定：\n\n（一）开工日期为发包人或者监理人发出的开工通知载明的开工日期；开工通知发出后，尚不具备开工条件的，以开工条件具备的时间为开工日期；因承包人原因导致开工时间推迟的，以开工通知载明的开工日期为开工日期。\n\n（二）承包人经发包人同意已经实际进场施工的，以实际进场施工时间为开工日期。\n\n（三）发包人或者监理人未发出开工通知，亦无相关证据证明实际开工日期的，应当综合考虑开工报告、合同、施工许可证、竣工验收报告或者竣工验收备案表等载明的时间，并结合是否具备开工条件的事实，认定开工日期。\n\n## 二、裁判规则要点\n\n### 规则1：开工通知优先原则\n\n开工日期原则上以发包人或监理人发出的开工通知载明的日期为准。开工通知是认定开工日期的首要证据，具有优先于合同约定和其他文件的效力。法院在审查时，首先核查是否存在有效的开工通知，有开工通知的原则上不再另行认定。\n\n参考案例：(2019)最高法民终1500号——开工通知发出但场地未移交的认定。\n\n### 规则2：不具备开工条件时的调整\n\n开工通知发出后，因客观原因尚不具备开工条件的（如施工场地未移交、图纸未到位、规划许可未取得等），以实际开工条件具备的时间为开工日期。但需注意例外情形：若开工条件不具备系因承包人自身原因所致（如承包人未及时组织人员设备进场），则仍以开工通知载明的日期为准，不作调整。\n\n参考案例：(2019)最高法民终1500号——场地未移交属发包人原因，开工日期应予调整。\n\n### 规则3：实际进场施工的认定\n\n承包人经发包人同意已经实际进场施工的，以实际进场施工时间为开工日期。该规则的适用需满足两个要件：一是经发包人同意，二是实际进场施工。仅有口头同意或单方进场而无发包人明示同意的，法院将结合签证单、监理日志、施工记录等证据综合判断。\n\n参考案例：(2020)苏民终42号——实际进场施工时间的认定标准。\n\n### 规则4：无通知无证据时的综合认定\n\n发包人或监理人未发出开工通知，且双方均无直接证据证明实际开工日期的，法院采取综合认定方法，审查以下材料载明的时间：开工报告、施工合同约定的工期起算点、施工许可证载明的日期、竣工验收报告或竣工验收备案表倒推工期等，并结合工程是否具备开工条件的事实进行认定。实务中施工许可证载明的日期常被作为重要参考，但并非绝对标准。\n\n参考案例：四川+重庆联合解答（2022）关于开工日期的规定。\n\n## 三、司法观点分歧\n\n### 分歧1：开工条件的具体范围\n\n司法解释使用\"开工条件\"一词但未作列举，实务中存在狭义与广义两种理解。狭义观点认为仅指法定条件（施工许可证、规划许可等）；广义观点则将场地移交、图纸会审、施工组织设计审批等技术条件亦纳入。多数法院倾向于广义理解，但对承包人应承担的合理注意义务范围仍有争议。\n\n### 分歧2：开工通知与施工许可证的关系\n\n开工通知与施工许可证载明日期不一致时如何认定，各地法院存在不同做法。部分法院认为开工通知效力优先，施工许可证仅为行政审批文件；另有法院认为未取得施工许可证的，开工通知不应作为认定依据。深圳中院裁判指引对此有较为明确的规定，倾向于以实际开工条件具备为判断核心。\n\n### 分歧3：实际进场但未获发包人同意的认定\n\n承包人未经发包人同意单方进场施工的，能否以实际进场时间认定开工日期，实践中争议较大。反对观点认为司法解释第8条第2项明确要求\"经发包人同意\"，未经同意进场的不应适用该条；支持观点则认为应以客观施工事实为准，发包人明知不反对即可视为默示同意。法院通常结合施工签证、监理记录、付款凭证等综合判断。\n\n## 四、省/市高院指引差异\n\n| 法院/机构 | 核心要点 |\n| --- | --- |\n| 最高法 | 建工司法解释一第8条确立三级认定规则：开工通知优先→实际进场→综合认定 |\n| 江苏高院 | 强调开工条件的实质审查，对场地未移交、图纸未到位等情形作细化规定 |\n| 广东高院 | 注重施工许可证与开工通知的协调，对未取得施工许可证的开工认定持审慎态度 |\n| 四川+重庆 | 联合解答（2022）明确无开工通知时综合认定的具体考量因素及权重 |\n| 深圳中院 | 裁判指引对开工条件范围及实际进场未获同意的情形作出较为具体的规定 |\n\n## 五、典型案例\n\n### 案例1：(2019)最高法民终1500号\n\n**裁判要旨：** 开工通知虽已发出，但因发包人原因导致施工场地未移交、不具备开工条件的，不应以开工通知载明的日期作为开工日期，而应以实际具备开工条件的时间为准。该案明确"},{"id":"裁判规则-竣工日期认定","title":"裁判规则 - 竣工日期认定","excerpt":"裁判规则 - 竣工日期认定 一、法律依据 《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第9条： 当事人对建设工程实际竣工日期有争议的，人民法院应当分别按照以下情形予以认定： （一）建设工程经竣工验收合格的，以竣工验收合格之日为竣工日期； （二）承包人已经提交竣工验收报告，发包人拖延验收的，以承包人提交验收报告之日为竣工日期； （三）建设工程未经竣工验收，发包人擅自使用的","slug":"裁判规则-竣工日期认定","module":"03-工期","moduleName":"03 工期","tags":["建工","工期","竣工日期","裁判规则"],"wordCount":2781,"created":"2026-06-01","updated":"2026-06-01","content":"# 裁判规则 - 竣工日期认定\n\n## 一、法律依据\n\n**《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第9条：**\n\n当事人对建设工程实际竣工日期有争议的，人民法院应当分别按照以下情形予以认定：\n\n（一）建设工程经竣工验收合格的，以竣工验收合格之日为竣工日期；\n\n（二）承包人已经提交竣工验收报告，发包人拖延验收的，以承包人提交验收报告之日为竣工日期；\n\n（三）建设工程未经竣工验收，发包人擅自使用的，以转移占有建设工程之日为竣工日期。\n\n## 二、裁判规则要点\n\n### 规则1：竣工验收合格之日\n\n工程经竣工验收合格的，以竣工验收合格之日为竣工日期。此处\"竣工验收合格\"指建设单位组织勘察、设计、施工、监理等单位进行竣工验收并形成合格结论。司法实践中，竣工验收合格之日通常以《竣工验收报告》上各方签章确认的日期为准，而非备案日期。竣工验收合格是认定竣工日期的首选标准，其法律效果最为明确，争议最小。适用本条的前提是验收程序合法、参验各方主体适格、验收结论真实有效。\n\n### 规则2：提交验收报告之日（发包人拖延验收）\n\n承包人已提交竣工验收报告，发包人拖延验收的，以承包人提交验收报告之日为竣工日期。该规则的适用前提是：承包人确已完工且工程质量合格；承包人向发包人正式提交了竣工验收报告（应有书面签收记录）。最高法(2019)最高法民再153号案确立了以下认定标准：发包人在收到验收报告后未在合理期限内组织验收，又无正当理由拒绝验收的，构成\"拖延验收\"。承包人应注意保存报告提交的时间、方式及签收凭证。\n\n### 规则3：转移占有之日（擅自使用）\n\n工程未经竣工验收，发包人擅自使用的，以转移占有建设工程之日为竣工日期。\"擅自使用\"不要求发包人全面投入使用，只要发包人或其允许的第三人对工程实施了事实上的占有、使用行为即可。最高法(2018)最高法民终201号案明确：发包人在工程未经验收的情况下，组织人员入驻办公、对外出租或将工程投入商业运营，均构成擅自使用。转移占有之日的认定通常结合物业交接记录、水电开通记录、人员进驻记录等综合判断。\n\n### 规则4：擅自使用的法律后果\n\n发包人擅自使用未经竣工验收的工程后，又以使用部分质量不符合约定为由主张权利的，不予支持。但存在两项例外：（1）承包人应在合理使用寿命内对地基基础工程和主体结构质量承担责任；（2）地基基础工程和主体结构以外的质量缺陷，若属于承包人明知且故意造成的，发包人仍有权主张。擅自使用制度的立法目的在于防止发包人一方面享受工程使用利益，另一方面以质量瑕疵为由拒绝支付工程款。需注意，擅自使用的法律后果与竣工日期的认定属于两个独立问题，前者影响质量责任分配，后者影响工期计算和违约责任认定。\n\n## 三、司法观点分歧\n\n### 分歧1：\"拖延验收\"的认定标准\n\n司法实践中对\"拖延验收\"缺乏明确的时间标准。部分法院认为发包人收到验收报告后超过28日未组织验收即可认定为拖延（参照《建设工程质量管理条例》第16条）；另有法院认为应结合工程规模、验收复杂程度等因素综合判断，未设定统一时间标准。深圳中院裁判指引明确规定收到报告后28日内未验收即构成拖延，为全国范围内较为明确的地方性标准。建议承包人在合同中明确约定发包人组织验收的期限，以减少争议。\n\n### 分歧2：部分擅自使用的竣工日期\n\n当发包人仅使用了工程的一部分而非全部时，竣工日期如何认定存在争议。一种观点认为应以转移占有的日期作为整体工程的竣工日期；另一种观点认为应区分已使用部分与未使用部分，分别认定竣工日期。最高法倾向性意见为：部分擅自使用的，以该部分转移占有之日作为整体竣工日期，理由是发包人的擅自使用行为已破坏了工程的完整性。\n\n### 分歧3：竣工验收备案与竣工验收合格的区别\n\n竣工验收备案是行政机关对建设单位报送的竣工验收材料进行存档备查的行为，属于行政管理程序，不改变竣工验收合格的实体认定。竣工验收合格之日应以五方主体（建设、勘察、设计、施工、监理）在验收报告上确认的日期为准，而非向住建部门提交备案材料的日期。\n\n## 四、省/市高院指引差异\n\n各地高院对竣工日期认定的具体操作标准存在一定差异，以下选取典型地区进行对比：\n\n| 地区 | 拖延验收的认定 | 擅自使用的认定 | 特殊规定 |\n| --- | --- | --- | --- |\n| 深圳中院 | 收到报告后28日内未验收即构成拖延 | 入驻办公、堆放材料、对外经营均属擅自使用 | 明确部分使用不影响整体竣工日期认定 |\n| 江苏高院 | 结合工程规模综合判断，未设固定期限 | 以实际控制为准，不要求全面使用 | 强调承包人书面催告义务 |\n| 北京高院 | 超过合同约定期限或合理期限均可认定 | 发包人允许第三人使用亦构成擅自使用 | 注重证"},{"id":"裁判规则-工期顺延事由","title":"裁判规则 - 工期顺延事由","excerpt":"裁判规则 - 工期顺延事由 一、法律依据 《建工司法解释一》第10条： 当事人约定顺延工期应当经发包人或者监理人签证等方式确认，承包人虽未取得工期顺延的确认，但能够证明在合同约定的期限内向发包人或者监理人申请过工期顺延，顺延事由符合合同约定，承包人以此为由主张工期顺延的，人民法院应予支持。当事人约定承包人未在约定期限内提出工期顺延申请视为工期不顺延的，按照约定处理，但发包人在约定期限后同意工期顺延","slug":"裁判规则-工期顺延事由","module":"03-工期","moduleName":"03 工期","tags":["建工","工期","工期顺延","裁判规则"],"wordCount":2199,"created":"2026-06-01","updated":"2026-06-01","content":"# 裁判规则 - 工期顺延事由\n\n## 一、法律依据\n\n**《建工司法解释一》第10条：** 当事人约定顺延工期应当经发包人或者监理人签证等方式确认，承包人虽未取得工期顺延的确认，但能够证明在合同约定的期限内向发包人或者监理人申请过工期顺延，顺延事由符合合同约定，承包人以此为由主张工期顺延的，人民法院应予支持。当事人约定承包人未在约定期限内提出工期顺延申请视为工期不顺延的，按照约定处理，但发包人在约定期限后同意工期顺延或者承包人提出合理抗辩的除外。\n\n**《建工司法解释一》第11条：** 建设工程竣工前，当事人对工程质量发生争议，工程质量经鉴定合格的，鉴定期间为顺延工期期间。\n\n## 二、裁判规则要点\n\n### 规则1：法定顺延事由\n1. 发包人未按约提供施工条件（场地移交迟延、图纸交付逾期、甲供材不到位等）\n2. 设计变更导致工程量增加或施工方案调整\n3. 不可抗力（自然灾害、战争、疫情等）\n4. 发包人原因导致的停窝工（如擅自停工指令、逾期付款、违法分包指令等）\n5. 质量鉴定合格的鉴定期间\n6. 隐蔽工程重新检查且检查结果合格\n7. 非因承包人原因导致的行政审批迟延\n\n### 规则2：程序要求\n- 需在合同约定期限内向发包人或监理人提出书面申请\n- 申请应载明顺延事由、顺延天数及相应证据\n- 未取得签证不影响主张，但承包人需举证证明：(1)已在约定期限内申请；(2)顺延事由符合合同约定\n- 参见：法官会议纪要6（工期顺延的认定）\n\n### 规则3：未按期申请的后果\n合同约定\"未在约定期限内申请视为工期不顺延\"的，原则上按约定处理，承包人丧失顺延请求权。但存在两项例外：\n\n1. **发包人同意顺延**：发包人在约定期限后以行为或明示方式同意工期顺延的，视为对期限利益的放弃\n2. **承包人提出合理抗辩**：如发包人存在违约在先、不可抗力等情形，承包人可援引合理抗辩突破期限限制\n\n> 参见：(2020)最高法民申2616号——承包人未在约定期限内申请工期顺延，且无证据证明存在合理抗辩事由的，法院不予支持工期顺延请求。\n\n### 规则4：质量鉴定期间顺延\n竣工前当事人对工程质量发生争议，经鉴定质量合格的，鉴定期间自动顺延工期，无需承包人另行申请。该规则系司法解释的拟制性规定，不以当事人约定为前提。\n\n### 规则5：疫情期间工期顺延\n疫情或疫情防控措施导致承包人未能按约定期限完成施工的，承包人请求延长工期的，人民法院应结合疫情影响程度、因果关系等因素酌情支持。\n\n> 参见：法发〔2020〕17号《关于依法妥善审理涉新冠肺炎疫情民事案件若干问题的指导意见（二）》\n\n## 三、司法观点分歧\n\n### 争议1：未按期申请但事由成立的处理\n- **严格说**：未按期申请即丧失权利，不审查事由是否成立\n- **宽松说**：应实质审查，事由成立且因果关系明确的，仍应支持顺延\n- **主流趋势**：法官会议纪要采折中立场——原则上尊重约定，但承认\"合理抗辩\"的例外\n\n### 争议2：发包人\"同意\"的认定标准\n- 发包人在约定期限后签署签证、确认函等书面文件，是否当然构成\"同意\"\n- 发包人知悉顺延事由但未提出异议，是否构成默示同意\n- 司法实践中倾向于以明示同意为原则，默示同意需结合交易习惯综合判断\n\n### 争议3：不可抗力与情势变更的区分适用\n- 疫情防控措施导致停工：一般认定为不可抗力，适用工期顺延\n- 疫情导致人工、材料价格大幅上涨：更倾向认定为情势变更，适用价格调整而非工期顺延\n- 两者在工期领域的法律效果不同：不可抗力免除迟延责任，情势变更则需变更合同\n\n## 四、省/市高院指引差异\n\n| 议题 | 最高法 | 江苏 | 广东 | 山东 | 四川+重庆 |\n|---|---|---|---|---|---|\n| 未按期申请的效力 | 尊重约定+合理抗辩例外 | 严格按约定 | 区分发包人/承包人原因 | 尊重约定 | 联合解答明确：事由成立且有因果关系的可支持 |\n| 签证缺失的举证 | 证明已申请+事由成立 | 从严审查 | 承包人需充分举证 | 综合判断 | 参照最高法标准 |\n| 疫情期间顺延 | 酌情支持 | 详细指引 | 区分停工/未停工 | 酌情支持 | 明确可顺延 |\n| 质量鉴定期间 | 自动顺延 | 自动顺延 | 自动顺延 | 自动顺延 | 自动顺延 |\n\n> 四川+重庆联合解答明确：承包人虽未在约定期限内申请，但顺延事由确属发包人原因且有因果关系的，可支持工期顺延。\n\n## 五、典型案例\n\n1. **(2020)最高法民申2616号**：承包人未按合同约定期限申请工期顺延，法院认定其丧失顺延请求权，驳回相关诉求。本案明确了程序性期限的刚性约束。\n\n2. **法官会议纪要6（工期顺延的认定）**：承包人虽未取得"},{"id":"裁判规则-签证与工期索赔","title":"裁判规则 - 签证与工期索赔","excerpt":"裁判规则 - 签证与工期索赔 一、法律依据 《建工司法解释一》第20条： 当事人对工程量有争议，按照施工过程中形成的签证等书面文件确认。承包人能够证明发包人同意其施工，但未能提供签证文件确认工程量的，可以按照当事人提供的其他证据确认实际发生的工程量。 《民法典》第803条： 发包人未按照约定的时间和要求提供原材料、设备、场地、资金、技术资料的，承包人可以顺延工程日期，并有权请求赔偿停工、窝工等损失","slug":"裁判规则-签证与工期索赔","module":"03-工期","moduleName":"03 工期","tags":["建工","工期","签证","索赔","裁判规则"],"wordCount":2391,"created":"2026-06-01","updated":"2026-06-01","content":"# 裁判规则 - 签证与工期索赔\n\n## 一、法律依据\n\n**《建工司法解释一》第20条：**\n当事人对工程量有争议，按照施工过程中形成的签证等书面文件确认。承包人能够证明发包人同意其施工，但未能提供签证文件确认工程量的，可以按照当事人提供的其他证据确认实际发生的工程量。\n\n**《民法典》第803条：**\n发包人未按照约定的时间和要求提供原材料、设备、场地、资金、技术资料的，承包人可以顺延工程日期，并有权请求赔偿停工、窝工等损失。\n\n上述两条确立了签证作为核心证据的认定规则，以及发包人违约情形下承包人工期顺延和损失赔偿的请求权基础。\n\n实务中，两条款常在同一案件中同时适用——签证用于证明工程量及工期事实，第803条用于主张工期顺延的正当性。承包人援引第20条时需举证证明\"发包人同意施工\"，而援引第803条时需举证证明\"发包人未按约定提供条件\"，两者举证侧重点不同。\n\n## 二、裁判规则要点\n\n### 规则1：签证的证据效力\n施工过程中形成的签证等书面文件是认定工程量和工期顺延的直接证据，具有较高的证明力。经发包人或其授权的监理人签字确认的签证，原则上应作为认定事实的依据，对方当事人提出异议的，应当提供足以反驳的证据。签证的证明力一般高于单方制作的施工日志等材料。\n\n### 规则2：无签证时的举证\n承包人能够证明发包人同意其施工，但未能提供签证文件的，可以按照其他证据确认实际发生的工程量。其他证据包括：施工日志、监理日志、会议纪要、往来函件、影像资料、隐蔽工程验收记录等。证据之间应能相互印证，形成完整的证据链，单一证据通常不足以认定工程量。\n\n### 规则3：工期索赔的时效\n- 需在合同约定的索赔期限内提出索赔意向通知\n- 逾期提出的，可能丧失索赔权利（但发包人自愿支付或存在正当理由的除外）\n- FIDIC合同条件通常规定28天索赔通知期限，国内施工合同约定的期限各异\n- 索赔意向通知应载明索赔事由、依据和大致金额\n\n### 规则4：签证与结算的关系\n签证是工程结算的重要依据，但签证确认的工程量与鉴定意见不一致时，法院应结合其他证据综合判断。签证中的量价确认对双方均有约束力，除非存在欺诈、重大误解等可撤销情形。签证不能替代竣工结算，但可作为结算争议的佐证。\n\n## 三、司法观点分歧\n\n### 争议1：签证的法律性质\n一种观点认为签证是独立的合同变更协议，具有独立的法律效力，可单独作为诉讼依据；另一种观点认为签证仅是对施工事实的确认记录，不构成独立合同，其效力依附于主合同。实务中多数法院倾向后者，即签证为主合同履行的事实证据，而非独立合同。\n\n### 争议2：监理人签证的效力\n监理人在授权范围内的签证对发包人具有约束力；但超越授权范围的签证，是否对发包人有效，司法实践中存在分歧。部分法院认为需考察相对人是否有理由相信监理人有代理权（表见代理），另有法院认为监理人的法定职责不当然包含工程量确认和工期顺延确认。\n\n### 争议3：签证与鉴定意见冲突时的处理\n当签证确认的工程量与鉴定意见存在差异时，原则上应优先采信签证；但有充分证据证明签证内容不真实的除外。法院应结合现场勘验、施工日志、材料进场记录等综合认定，不能仅凭鉴定意见否定签证效力。实践中部分法院采取签证为主、鉴定为辅的认定模式。\n\n## 四、省/市高院指引差异\n\n| 省/市 | 签证效力认定 | 无签证时举证要求 | 索赔期限 |\n| --- | --- | --- | --- |\n| 北京 | 签证具有较高证明力，异议方承担反驳举证责任 | 需提供连续完整的施工记录 | 严格适用合同约定期限 |\n| 浙江 | 尊重当事人意思自治，签证优先 | 其他证据需形成完整证据链 | 逾期索赔原则上不予支持 |\n| 江苏 | 签证效力优先于鉴定意见 | 隐蔽工程以验收记录为准 | 未约定索赔期限的不受限 |\n| 广东 | 监理签证原则上约束发包人 | 需证明发包人同意或知晓施工 | 适用合理期限标准 |\n| 山东 | 签证为工程量认定首选证据 | 施工日志与监理日志互相印证 | 合同有约定从约定 |\n| 上海 | 签证效力高于单方陈述 | 需有监理确认或第三方佐证 | 适用合理期限并结合过错程度 |\n\n## 五、典型案例\n\n### 案例1：无签证但有其他证据支持工期顺延\n某住宅项目施工中，承包人因发包人未按时提供施工图纸导致停工，承包人未办理正式签证，但提交了监理日志、停工通知、复工报告及监理工程师的证人证言。法院综合上述证据认定发包人违约导致工期延误，支持工期顺延45天，驳回发包人逾期违约金的反诉请求。\n\n### 案例2：监理签证超越授权范围\n某市政工程施工中，监理工程师在未获发包人明确授权的情况下签认了工程量增加签证，涉及金额约300万元。发包人以监理人超越授权为由拒绝认可。法院审查"},{"id":"裁判规则-工期鉴定","title":"裁判规则 - 工期鉴定","excerpt":"裁判规则 - 工期鉴定 一、法律依据 条文 要点 建工司法解释一第11条 承包人请求顺延工期，发包人主张因质量问题导致工期延误的，质量经鉴定合格的，鉴定期间为顺延工期期间 建工司法解释一第28条 当事人对工程造价、质量、工期等专门性问题有争议，人民法院认为需要鉴定的，应当向负有举证责任的当事人释明 建工司法解释一第30条 人民法院应当组织当事人对鉴定意见进行质证；鉴定人应当就鉴定意见接受当事人质询","slug":"裁判规则-工期鉴定","module":"03-工期","moduleName":"03 工期","tags":["建工","工期","鉴定","裁判规则"],"wordCount":2099,"created":"2026-06-01","updated":"2026-06-01","content":"# 裁判规则 - 工期鉴定\n\n## 一、法律依据\n\n| 条文 | 要点 |\n|------|------|\n| 建工司法解释一第11条 | 承包人请求顺延工期，发包人主张因质量问题导致工期延误的，质量经鉴定合格的，鉴定期间为顺延工期期间 |\n| 建工司法解释一第28条 | 当事人对工程造价、质量、工期等专门性问题有争议，人民法院认为需要鉴定的，应当向负有举证责任的当事人释明 |\n| 建工司法解释一第30条 | 人民法院应当组织当事人对鉴定意见进行质证；鉴定人应当就鉴定意见接受当事人质询 |\n\n## 二、裁判规则要点\n\n### 规则1：工期鉴定的适用情形\n工期争议涉及专业性问题，法院认为需要鉴定的，应向负有举证责任的当事人释明。实务中以下情形常需启动工期鉴定：\n- 双方对合同约定工期是否合理存在争议\n- 实际施工中存在多因一果的延误情形，需区分各方责任\n- 工程量变更导致原定工期无法适用\n- 存在停窝工事实但责任主体不明\n\n### 规则2：鉴定内容\n- **合理工期的确定**：参照定额工期、同类工程经验工期，结合施工方案、技术难度、气候条件等因素综合判断\n- **工期延误的原因分析**：区分发包人原因（图纸变更、甲供材迟延）、承包人原因（施工组织不力）、不可抗力及第三方原因\n- **工期延误的天数计算**：关键线路分析，剔除可并行施工的非关键工序延误\n- **各方责任比例**：在多因延误情形下，根据原因力大小分配责任\n\n### 规则3：质量鉴定与工期顺延\n承包人主张工期顺延，发包人以质量不合格为由抗辩的，法院应先行委托质量鉴定。质量经鉴定合格的，鉴定期间计入顺延工期期间（司法解释一第11条）。该规则的适用前提是承包人已明确提出工期顺延请求。\n\n### 规则4：鉴定意见的审查\n法院对鉴定意见应当依法审查，不能直接采信。审查要点包括：鉴定机构及鉴定人资质是否符合要求；鉴定方法是否科学合理；鉴定依据的材料是否真实完整；鉴定意见的论证逻辑是否充分；鉴定人是否出庭接受质询。\n\n## 三、司法观点分歧\n\n### 分歧1：工期鉴定是否为必经程序\n- **肯定说**：工期争议涉及施工组织、进度管理等专业问题，不经鉴定难以查明事实，应以鉴定意见作为认定工期延误的主要依据\n- **否定说**：工期鉴定并非必经程序，法院可结合施工日志、签证单、监理记录等证据自行认定；仅在事实真伪不明时才需鉴定\n- **实务倾向**：多数法院采取折中立场，对简单工期争议可自行认定，对复杂的多因延误一般要求鉴定\n\n### 分歧2：鉴定方法的争议\n- **网络分析法（CPM）**：通过关键路径法分析各工序的逻辑关系，确定关键线路和总浮时，精度较高但对资料完整性要求严格\n- **实际进度法**：以实际施工进度与计划进度的偏差为基础，结合现场签证等资料计算延误天数，操作简便但难以区分多因叠加\n- **实务倾向**：法院通常尊重鉴定机构选择的方法，但会审查该方法是否适用于本案具体情况\n\n### 分歧3：鉴定意见与法院认定的关系\n- **独立证据说**：鉴定意见仅为证据之一，法院应结合全案证据综合判断，可以不采纳鉴定意见\n- **优先采信说**：工期鉴定涉及高度专业性，在无充分反驳证据的情况下应优先采信\n- **实务倾向**：法院一般尊重鉴定意见，但对明显缺乏依据或论证逻辑有瑕疵的意见可不予采纳\n\n## 四、省/市高院指引差异\n\n| 地区 | 工期鉴定态度 | 具体指引 |\n|------|-------------|---------|\n| 江苏 | 积极引导 | 明确工期争议应优先通过鉴定解决，法院应主动释明举证责任 |\n| 浙江 | 审慎适用 | 强调鉴定的必要性审查，避免以鉴代审，鼓励法院结合签证等证据自行认定 |\n| 广东 | 分类处理 | 区分简单争议与复杂争议，简单争议可不鉴定；复杂争议应释明申请鉴定 |\n| 北京 | 严格规范 | 要求鉴定机构具备相应资质，鉴定方法需在鉴定意见中充分说明 |\n\n## 五、典型案例\n\n**案例1：工期鉴定的启动与举证责任分配**\n某商业综合体项目，承包人主张发包人多次变更设计导致工期延误。法院审查后认为工期延误涉及专业问题，释明承包人申请鉴定。鉴定意见认定合理顺延工期为87天，法院予以采信。\n→ 重点：法院释明义务的履行是启动鉴定的关键程序环节\n\n**案例2：质量鉴定期间的工期顺延**\n某住宅项目竣工验收时发包人提出质量异议，承包人诉请支付工程款并主张工期顺延。法院先行委托质量鉴定，鉴定期间历时5个月，最终质量合格，鉴定期间计入承包人顺延工期。\n→ 重点：质量鉴定期间顺延的前提是承包人已明确提出工期顺延请求\n\n**案例3：鉴定方法的审查与采纳**\n某市政道路工程，鉴定机构采用实际进度法认定延误天数。发包人提出应采用CPM方法重新鉴定"},{"id":"工期-省-市高院指引对比","title":"工期 - 省/市高院指引对比","excerpt":"工期 - 省/市高院指引对比 一、开工日期 地区 要点 文件来源 最高法 以开工通知为准；不具备开工条件的以条件具备时间为准；实际进场的以实际进场时间为准；无通知无证据的综合认定 司法解释一第8条 江苏 施工许可证载明的时间可作为开工日期的参考 审理指南（2010） 广东 开工日期应结合开工通知、施工许可证、实际进场时间等综合认定 疑难问题解答（2017） 四川+重庆 开工通知发出后尚不具备开工条","slug":"工期-省-市高院指引对比","module":"03-工期","moduleName":"03 工期","tags":["建工","工期","省高院指引","对比"],"wordCount":1202,"created":"2026-06-01","updated":"2026-06-01","content":"# 工期 - 省/市高院指引对比\n\n## 一、开工日期\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 以开工通知为准；不具备开工条件的以条件具备时间为准；实际进场的以实际进场时间为准；无通知无证据的综合认定 | 司法解释一第8条 |\n| 江苏 | 施工许可证载明的时间可作为开工日期的参考 | 审理指南（2010） |\n| 广东 | 开工日期应结合开工通知、施工许可证、实际进场时间等综合认定 | [疑难问题解答（2017）](https://jsgclaw.com/rule/2017/0828/91.html) |\n| 四川+重庆 | 开工通知发出后尚不具备开工条件的，以开工条件具备的时间为开工日期 | [联合解答（2022）](http://ms.isheng.net/index.php?doc-view-45229=) |\n| 深圳 | 开工日期的认定应综合考虑开工通知、施工许可证等文件 | [裁判指引（2014）](https://szfazhu.com/caipanzhiyin/121.html) |\n\n## 二、竣工日期\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 竣工验收合格之日/提交验收报告之日/转移占有之日 | 司法解释一第9条 |\n| 广东 | 发包人拖延验收的举证责任在承包人 | 疑难问题解答（2017） |\n| 深圳 | 建设工程完工后未经竣工验收但已由发包人实际控制的，视为竣工验收合格 | [裁判指引（2014）](https://szfazhu.com/caipanzhiyin/121.html) |\n| 山东 | 竣工验收合格后，发包人以质量不合格为由拒付工程款的，不予支持 | [解答（2020）](https://m.055110.com/js/69/2300.html) |\n\n## 三、工期顺延\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 未取得签证不影响主张，但需证明已申请且事由成立；约定未按期申请视为不顺延的按约定，但有例外 | 司法解释一第10条 |\n| 最高法 | 质量经鉴定合格的，鉴定期间为顺延工期期间 | 司法解释一第11条 |\n| 最高法 | 约定未在约定期限内申请工期顺延视为工期不顺延的，按约定处理，但发包人在约定期限后同意工期顺延或者承包人提出合理抗辩的除外 | 法官会议纪要6 |\n| 江苏 | 工期顺延需在合理期限内申请 | 审理指南（2010） |\n| 广东 | 工期顺延的认定需结合具体案情，签证不是唯一证据 | 疑难问题解答（2017） |\n| 四川+重庆 | 承包人未在合同约定的期限内申请工期顺延的，按照约定处理，但有合理抗辩的除外 | [联合解答（2022）](http://ms.isheng.net/index.php?doc-view-45229=) |\n\n## 四、签证与索赔\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 签证是认定工程量和工期顺延的直接证据；无签证时可按其他证据确认 | 司法解释一第20条 |\n| 江苏 | 监理人签证具有证据效力，但发包人有相反证据足以推翻的除外 | 审理指南（2010） |\n| 山东 | 因承包人原因工期延误的，承包人应承担违约责任，但违约金过高的法院可酌情调整 | [解答（2020）](https://m.055110.com/js/69/2300.html) |\n\n## 五、疫情与工期\n\n| 地区 | 要点 | 文件来源 |\n|------|------|---------|\n| 最高法 | 疫情或疫情防控措施导致承包方未能按约定工期完成施工的，承包方请求延长工期的，应视影响程度酌情支持 | 法发〔2020〕17号 |\n| 浙江 | 疫情期间的工期顺延应酌情支持 | 相关指导意见 |\n\n## 六、指引文件链接汇总\n\n| 法院 | 文件 | 链接 |\n|------|------|------|\n| 四川+重庆高院 | 联合解答（2022） | [全文链接](http://ms.isheng.net/index.php?doc-view-45229=) |\n| 广东高院 | 疑难问题解答（2017） | [全文链接](https://jsgclaw.com/rule/2017/0828/91.html) |\n| 山东高院 | 解答（2020） | [全文链接](https://m.055110.com/js/69/2300.html) |\n| 深圳中院 | 裁判指引（2014修"},{"id":"工期-典型案例","title":"工期 - 典型案例","excerpt":"工期 - 典型案例 一、开工日期认定 案例1：开工通知发出但场地未移交 案号 ：(2019)最高法民终1500号 案情 ：发包人发出开工通知，但施工现场尚不具备开工条件（场地未移交、施工许可未取得） 裁判要旨 ：开工通知发出后尚不具备开工条件的，以开工条件具备的时间为开工日期，而非开工通知载明的日期 案例2：实际进场施工时间的认定 案号 ：(2020)苏民终42号 案情 ：承包人在开工通知发出前已","slug":"工期-典型案例","module":"03-工期","moduleName":"03 工期","tags":["建工","工期","案例"],"wordCount":1422,"created":"2026-06-01","updated":"2026-06-01","content":"# 工期 - 典型案例\n\n## 一、开工日期认定\n\n### 案例1：开工通知发出但场地未移交\n- **案号**：(2019)最高法民终1500号\n- **案情**：发包人发出开工通知，但施工现场尚不具备开工条件（场地未移交、施工许可未取得）\n- **裁判要旨**：开工通知发出后尚不具备开工条件的，以开工条件具备的时间为开工日期，而非开工通知载明的日期\n\n### 案例2：实际进场施工时间的认定\n- **案号**：(2020)苏民终42号\n- **案情**：承包人在开工通知发出前已实际进场施工\n- **裁判要旨**：承包人经发包人同意已实际进场施工的，以实际进场时间为准\n\n## 二、竣工日期认定\n\n### 案例3：发包人拖延验收\n- **案号**：(2019)最高法民再153号\n- **案情**：承包人提交竣工验收报告后，发包人长期未组织验收\n- **裁判要旨**：承包人已经提交竣工验收报告，发包人拖延验收的，以承包人提交验收报告之日为竣工日期\n\n### 案例4：擅自使用的认定\n- **案号**：(2018)最高法民终201号\n- **案情**：工程未经竣工验收，发包人已实际投入使用\n- **裁判要旨**：建设工程未经竣工验收，发包人擅自使用的，以转移占有建设工程之日为竣工日期。擅自使用后又以质量不符合约定主张权利的，不予支持\n\n### 案例5：擅自使用与质量责任\n- **案号**：司法解释一第14条\n- **裁判要旨**：建设工程未经竣工验收，发包人擅自使用后，又以使用部分质量不符合约定主张权利的，不予支持；但是承包人应当在建设工程的合理使用寿命内对地基基础工程和主体结构质量承担民事责任\n\n## 三、工期顺延\n\n### 案例6：未按期申请工期顺延的后果\n- **案号**：法官会议纪要6\n- **案情**：合同约定承包人未在约定期限内申请工期顺延视为工期不顺延\n- **裁判要旨**：按约定处理，但发包人在约定期限后同意工期顺延或者承包人提出合理抗辩的除外\n\n### 案例7：质量鉴定期间顺延工期\n- **案号**：司法解释一第11条\n- **案情**：竣工前双方对工程质量发生争议，需要进行质量鉴定\n- **裁判要旨**：建设工程竣工前，当事人对工程质量发生争议，工程质量经鉴定合格的，鉴定期间为顺延工期期间\n\n### 案例8：疫情期间工期顺延\n- **案号**：法发〔2020〕17号\n- **案情**：新冠疫情防控措施导致承包方未能按约定工期完成施工\n- **裁判要旨**：疫情或疫情防控措施导致承包方未能按约定工期完成施工的，承包方请求延长工期的，法院应视影响程度酌情支持\n\n## 四、签证与工期索赔\n\n### 案例9：签证的证据效力\n- **案号**：司法解释一第20条\n- **裁判要旨**：施工过程中形成的签证等书面文件是认定工程量和工期顺延的直接证据。承包人能够证明发包人同意其施工，但未能提供签证文件确认工程量的，可以按照其他证据确认实际发生的工程量\n\n### 案例10：工期延误违约金的调整\n- **案号**：山东高院解答（2020）\n- **裁判要旨**：因承包人原因导致工期延误的，承包人应承担违约责任。但违约金过高的，法院可酌情调整\n- **链接**：[山东高院解答](https://m.055110.com/js/69/2300.html)\n\n## 五、裁判规则总结表\n\n| 规则 | 案例/依据 | 要点 |\n|------|----------|------|\n| 开工通知优先 | 司法解释一第8条 | 以开工通知载明日期为准 |\n| 不具备开工条件 | (2019)最高法民终1500号 | 以条件具备时间为准 |\n| 实际进场施工 | (2020)苏民终42号 | 以实际进场时间为准 |\n| 竣工验收合格 | 司法解释一第9条 | 以验收合格之日为准 |\n| 拖延验收 | (2019)最高法民再153号 | 以提交验收报告之日为准 |\n| 擅自使用 | (2018)最高法民终201号 | 以转移占有之日为准 |\n| 质量鉴定顺延 | 司法解释一第11条 | 鉴定期间为顺延工期期间 |\n| 疫情顺延 | 法发〔2020〕17号 | 视影响程度酌情支持 |\n\n## 六、交叉引用\n- → [[03-裁判规则-开工日期认定|开工日期认定]]\n- → [[04-裁判规则-竣工日期认定|竣工日期认定]]\n- → [[05-裁判规则-工期顺延事由|工期顺延事由]]\n- → [[06-裁判规则-签证与工期索赔|签证与工期索赔]]"},{"id":"工期-常见问题faq","title":"工期 - 常见问题FAQ","excerpt":"工期 - 常见问题FAQ Q1：开工日期怎么确定？ A ：按以下顺序认定（司法解释一第8条）：（1）优先以开工通知载明的日期为准；（2）开工通知发出后尚不具备开工条件的，以开工条件具备的时间为准（因承包人原因推迟的除外）；（3）承包人经发包人同意已实际进场施工的，以实际进场时间为准；（4）无开工通知且无实际开工证据的，综合考虑开工报告、合同、施工许可证、竣工验收报告等文件认定。 实务要点 ：开工条","slug":"工期-常见问题faq","module":"03-工期","moduleName":"03 工期","tags":["建工","工期","FAQ"],"wordCount":1207,"created":"2026-06-01","updated":"2026-06-01","content":"# 工期 - 常见问题FAQ\n\n## Q1：开工日期怎么确定？\n**A**：按以下顺序认定（司法解释一第8条）：（1）优先以开工通知载明的日期为准；（2）开工通知发出后尚不具备开工条件的，以开工条件具备的时间为准（因承包人原因推迟的除外）；（3）承包人经发包人同意已实际进场施工的，以实际进场时间为准；（4）无开工通知且无实际开工证据的，综合考虑开工报告、合同、施工许可证、竣工验收报告等文件认定。\n\n**实务要点**：开工条件包括场地移交、施工许可取得、资金到位、图纸交付等。承包人应注意保留开工通知、施工日志、进场记录等证据。\n\n## Q2：发包人拖延验收，竣工日期怎么算？\n**A**：承包人已经提交竣工验收报告，发包人拖延验收的，以承包人提交验收报告之日为竣工日期（司法解释一第9条第2项）。\n\n**实务要点**：承包人应书面提交竣工验收报告并保留签收记录。发包人拖延验收的，承包人应及时书面催告。\"拖延\"的认定标准实务中不统一，一般认为超过合同约定的验收期限即构成拖延。\n\n## Q3：工程没验收就使用了，竣工日期怎么算？\n**A**：建设工程未经竣工验收，发包人擅自使用的，以转移占有建设工程之日为竣工日期（司法解释一第9条第3项）。\n\n**重要后果**：擅自使用后，发包人又以使用部分质量不符合约定主张权利的，不予支持。但承包人应在合理使用寿命内对地基基础和主体结构质量承担责任。\n\n## Q4：工期顺延需要办签证吗？\n**A**：合同约定需要签证的，应按约定办理。但即使未取得签证，承包人能证明在合同约定期限内向发包人或监理人申请过工期顺延，且顺延事由符合合同约定的，仍可主张顺延（司法解释一第10条）。\n\n**例外**：合同约定\"未在约定期限内申请视为不顺延\"的，按约定处理。但有两个例外：（1）发包人在约定期限后同意工期顺延；（2）承包人提出合理抗辩。\n\n## Q5：哪些事由可以顺延工期？\n**A**：常见的工期顺延事由包括：（1）发包人未按约定提供施工条件（场地、资金、图纸等）；（2）设计变更导致工程量增加；（3）不可抗力；（4）质量鉴定合格的鉴定期间；（5）发包人原因导致的停窝工；（6）疫情防控措施。\n\n## Q6：疫情期间工期能顺延吗？\n**A**：能。疫情或疫情防控措施导致承包方未能按约定工期完成施工的，承包方请求延长工期的，法院应视影响程度酌情支持（法发〔2020〕17号）。\n\n## Q7：工期延误的违约金怎么算？\n**A**：有约定的按约定，但违约金过高的法院可酌情调整。山东高院解答（2020）明确：因承包人原因导致工期延误的，承包人应承担违约责任，但违约金过高的法院可酌情调整。\n\n## Q8：工期鉴定是怎么回事？\n**A**：工期争议涉及专业性问题（如合理工期确定、延误原因分析、延误天数计算、各方责任比例），法院认为需要鉴定的，应向负有举证责任的当事人释明。工期鉴定需提供施工日志、签证、往来函件等完整资料。\n\n## 交叉引用\n- → [[03-裁判规则-开工日期认定|开工日期认定]]\n- → [[04-裁判规则-竣工日期认定|竣工日期认定]]\n- → [[05-裁判规则-工期顺延事由|工期顺延事由]]\n- → [[06-裁判规则-签证与工期索赔|签证与工期索赔]]\n- → [[07-裁判规则-工期鉴定|工期鉴定]]\n- → 民法库：[[01-合同法/02-合同履行/不可抗力|不可抗力]]、[[01-合同法/02-合同履行/情势变更|情势变更]]"},{"id":"工程质量-制度概述","title":"工程质量 - 制度概述","excerpt":"工程质量 - 制度概述 一、核心问题 质量缺陷由谁承担责任？ 发包人擅自使用的，质量责任如何分配？ 质量保证金和保修责任如何处理？ 二、条文架构 条文 内容 第12条 承包人质量不合格的处理 第13条 发包人过错导致质量缺陷的责任 第14条 未竣工验收擅自使用的质量责任 第15条 竣工前质量鉴定期间顺延工期 第16条 承包人拒绝修复的处理 第17条 质量保证金 第18条 保修责任 三、与其他模块的","slug":"工程质量-制度概述","module":"04-工程质量","moduleName":"04 工程质量","tags":["
